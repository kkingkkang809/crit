s":null,"tab":"main","html":"\n    KPC는 끊어져 줄만 남은 다리를 붙잡은 채 매달려 간신히 버티나 싶더니… \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어, 어, 어...!? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 줄마저 눈앞에서 뚝, 하고 끊깁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 끝을 모를 높이를 지나, 그 아래로 맥 없이 떨어집니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    폐부에서부터 강한 압력이 치솟고, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이내 거센 기침 소리와 함께 당신은 핏덩어리를 토해냅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그와 동시에 탐사자는 눈을 뜹니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    모든 것이 얼어붙을 듯한 겨울날의 추위 속, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    회색 하늘 위로 어지럽게 흩날리는 눈송이들. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    떨어지며 부딪쳤는지 머리에서 끊임없이 피가 흐르고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    끔찍한 비린내에 머리가 아픕니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    불쾌한 기분에 팔이나 다리를 움직여본다면, 여기저기 끈적하게 말라붙은 피를 발견할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    사방으로 흩어진 머리카락은 물에 젖어 축축합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    몸에 꼭 맞는 군복이 지독하게 무겁습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    생명줄처럼 쥐고 있던 총은 저 멀리 날아간 지 오래입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    시간이 얼마나 흘렀죠? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신의 옆에는 KPC가 피를 흘리며 누워 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아, 머리야... (고개를 설렁설렁 흔들고 일어나 옆에 누워있는 샬롯 내려다본다. 가만히... 가만히... 눈 뜰 때까지...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯은... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    눈을 뜨지 않습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이상하다, 추락 했을 때도 인공호흡 같은 게 필요하던가? (상체 낮추어 간을 가질 수 있겠네요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    눈밭에 두었다가 파묻히는 것보다야 훨씬 낫겠지. (흠, 하고 샬롯을 주워들어 안았다. 아무렇게나 팽개쳐져 있던 총기도 대충 어깨에 매고 통나무 집으로 향한다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ문을 열고 들어가면 내부는 의외로 그럴싸합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [방]과 [간이 주방], [거실]이 있어서, 하나하나 확인해볼 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어디... (눕혀놓을만한 곳이 없나, 방문을 먼저 발끝으로 톡, 밀어 열어본다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가구라곤 거의 찾아보기 힘든 삭막한 방입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    사람이 살았던 흔적은 있지만, 그것도 꽤 오래 전인 것 같네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [간이 침대]와 [등산용 가방]을 하나 발견합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (눈 가느다랗게 뜨고 간이 침대 위 살핀다. ...지저분한 거 아니야?) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    간이 침대 위에는 곰팡이 핀 모포 하나와 누렇게 변색된 베개가 가지런히 놓여 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    보자... 상태가. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 그래도나름... 꼬질꼬질햄 (choice 그래도나름... 꼬질꼬질햄) ＞ 그래도나름...\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    나? 름 괜찮은 것 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC를 눕힐 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (영 찝찝...하긴 하지만 일단은 눕혀줍니다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    일어나겠지? (가만... 보다가 뺨 언저리 콕. 찔러본다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (일어나기 전에 뭐라도 먹일 건 없나 봐야겠다 싶어 그 근처에 있는 등산용 가방 집어든다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯에게서 뭔가 이상한 소리가 난 것 같긴 합니다만, 신경쓰지 않아도 되겠습니다... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    등산용 가방을 열면, 오래된 비스킷과 캠핑용 가스 버너를 확인할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    밑바닥에는 구겨진 영수증이 몇 장 깔려 있습니다.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...먹어도 되는거 맞아? (비스킷 유통기한 찾아 이리저리 돌려보고는 대충 던져놓는다. 버너는 손에 쥐고 간이 주방으로 향한다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가스 버너 하나 없는 조촐한 주방입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    벽장에서 캔으로 된 레토르트 토마토 스프와 물 몇 개를 발견합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    또한, 물을 끓일 수 있는 냄비 역시 찾을 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    접었다 폈다 할 수 있는 식탁까지 있어, 불이 있다면 배를 채울 수 있을 것 같습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    침대는 엉망인데 또 먹을 건 있군. (눈썹 까딱, 올린다. 테이블에 버너를 얹어놓고, 대강 냄비를 헹궈내고 올려놓는다. 깨어나면 먹여야지.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어디... (대충 놓인 레토르트 캔 내려놓고 거실로 나간다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    소파와 벽난로가 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    실내로 들어왔어도 여전히 뼈가 시릴 정도의 추위가 도사리고 있으므로, 불을 피우는 쪽이 좋을 것 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 무엇이든 타당한 사유와 방법이 있다면 자유롭게 판정에 시도할 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    불을 피울만한 도구가 있나? (버너도 있기는 하니 토치 정도는 있지 않을까 싶긴 한데, 중얼이며 주위 둘러본다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>행운</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">78</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    토치가 다 뭔가요...? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    라이터도 안 보입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...진짜 없다고? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (믿기가 어렵다... 잠깐, 버너는 제대로 켜지나?)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    켜봅시다. 손놀림 혹은 행운 판정? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>행운</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">98</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (틱, 틱, 돌아가는 소리는 나는데...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아 어떡하지 안쓰럽습니다... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러면 누워있는 샬롯의 행운으로 판정해보자 \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>[ 행운 ]</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">50</span>/<span class=\"inlinerollresult\">25</span>/<span class=\"inlinerollresult\">10</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">16</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-hard\"><b>어려운 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    추웠나 봅니다... 다행히도 불이 틱, 틱, 하다가 겨우 켜집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    불을 피우니 추위가 한결 가시는 기분입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 쉬다 보면 잠시 후, KPC가 수척한 표정으로 모포를 덮고 나옵니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 추워서깸 때가돼서일어남 (choice 추워서깸 때가돼서일어남) ＞ 추워서깸\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    추, 추워어어... (모포 덮고 오들오들 떨며 나옵니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    일어났어? (버너에 바짝 붙어서 몸 녹이고 있는 안쓰러운 크리쳐가 되다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    왜, 왜 그러고 있어요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...토치나 라이터가 없어서. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 그래도 살고 싶어서 가까이 다가갑니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    자, 자, 장작 같은 거 없, 없을까요오... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>[ 관찰력 ]</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">65</span>/<span class=\"inlinerollresult\">32</span>/<span class=\"inlinerollresult\">13</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">24</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-hard\"><b>어려운 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (뭐, 하여튼 나뭇가지 대충 줏어다가 불 붙여서 벽난로에 불 피웁니다. 그래도 좀 추워잉... 됩니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 다, 당신도 이 쪽으로 와요! (손 꼬옥...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나 지금 좀 끈적한데. (추락하면서 떨어진 피는 닦아내지 못한 터라 끈적거렸다. 슬금슬금 이끌려 가서는 등 뒤에서 어깨 감싸안는다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 꺅!!! 그래도이런상황에선... (choice 꺅!!! 그래도이런상황에선...) ＞ 꺅!!!\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ! (그럼 불씨 피우다가, 등 뒤에서 느껴지는 온기에 깜짝 놀라 몸이 굳습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 저, 저기, 당신 너무 가깝게 붙어 있잖아요...?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이렇게 안 붙어있으면 얼어죽을 걸... 아까도 그대로 얼음 되는 줄 알았어. (떨어질 생각 전혀 없다는 듯, 오히려 팔에 힘 준다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그, 그, 그러니까아... (당황한 것이 눈에 띄게 보입니다. 시선이 이리저리 방황하고, 또 괜히 귀 끝이 홧홧해졌다가...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...이, 이번만이에요... (한숨 한 번 폭, 쉬고는 꼼질꼼질... 몸에 힘 풀고 머리 톡 기댑니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래, 나란히 얼어죽는 것보다는 조금 참는 게 낫지? (뻣뻣하게 굳어있던 몸이 풀어지는 것을 알아채고는 작게 키득거린다. 품에 기대어있는 네 뺨 언저리 검지로 콕콕 누른다.) 떨어지면서 다친 곳은 없어? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (으으음, 앓는 소리가 납니다. 이상하다, 이거 어디선가 느껴본 것 같은데...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 기억날까 ㄴㄴ (choice 기억날까 ㄴㄴ) ＞ ㄴㄴ\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (모르겠네. 괜히 찜찜한 기분만 느끼면서 입 삐죽입니다.) 으음. 그냥저냥... 승급전에 당장 무리가 갈 정도는 아니에요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신은요? (하고, 힐끗 시선이 위로 올라갑니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나야 멀쩡하지. (콕콕, 건드리던 손 떼어내고 낮게 침음한다. 그 높이에서 떨어졌는데도 무사한 게 다행인 상황, 아마 그 장면을 목격한 이들은 죽었으리라 생각할지도 모르겠단 생각이 들었다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    앞으로는 어떻게 할지는... 뭣 좀 먹으면서 생각하자. (새끼라도 품은 펭귄마냥, 끌어안은 채로 뒤뚱뒤뚱 걸어가 간이 부엌에 놓아두었던 버너 앞으로 갔다. 이쯤이면 물도 팔팔 끓고 있을 거고...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (휴우, 안도의 한숨을 짧게 쉬었습니다.) 당신은 크리쳐니까, 크게 문제가 되진 않겠지만... 그래도 혹시 많이 다치진 않았을까 싶었어요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (엇, 저희 이렇게 가, 가야만 하는 걸까요?! 그러면 달랑 안긴 채로 거의 운반되는 이동입니다... 뒤뚱뒤뚱 가다 보면 저도 모르게 조금 웃었을지도.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    여, 여기 먹을 게 있던가요? (앗. 그러고 보니 우리 보급품. 그제서야 생각이 닿습니다. 뭔가 종이 꾸러미 손에 쥔 채로 저 혼자 머리 쥐고서 끙끙 앓습니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    레토르트 스프 같은 건 있더라고. (캔 이리저리 살펴보다가 대충 캔 따고... 끓는 물에 풀었다.) 손에 들린 건 뭐야?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 이거요. (그제야 정신 차리곤 조금 늦게 반응합니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    으음, 그러니까... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이 집의 주인에 대해서 알아낼 수 있을 만한 실마리, 라고나 할까요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...버려진 집이 아니었어? (적당히... 스프가 먹기 좋게 끓었다고 생각되었을 때 달칵, 버너를 껐다. 그제서야 껴안고 있던 팔 풀어주고 의자 하나 끌어당겨 꺼내준다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (앗. 드디어 풀려났당.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (좋아하는 것 같다?)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 티났다 ㅎㅎ아냥 (choice 티났다 ㅎㅎ아냥) ＞ ㅎㅎ아냥\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흠, 큼, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (입꼬리 씰룩거리는 거 주먹쥔 손으로 가립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    일단, 여기는 시시포스 산이잖아요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    안전구역 인근이긴 하지만, 바깥이죠. 이 말은 곧 안전지대의 시민들은 접근 불가인 군사 지역이라는 뜻이고, 여기에 집이 이렇게... 있으려면, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    적어도 연구든, 군사 훈련이든 목적이 있었겠죠. (하며, 식기들 찾으러 총총 갑니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    읽어볼래요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... (수상한데? 하는 표정으로 가만히 바라보다가 뒤 따라서 간다.) 응, 읽어볼래.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이런 설산 외곽에서 군사 훈련은 너무 가혹하다 싶은데... 그건 아니길 바라... (평범한 인간이면 두세번 정도 죽는 거 아냐?)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    핸드아웃 : 델타의 연구 일기 를 획득합니다. \n  "},{"y":"say","sp":"시시포스산의 상급 크리쳐, 통칭 델타의 연구 일기","ts":null,"tab":"info","html":"\n    크리쳐 사태 발발 이후, 현재까지 다양한 능력을 가진 상급 크리쳐가 발견되었다. 하지만 그 모든 문서를 조사해보아도 델타만큼 위험한 크리쳐는 없었다. 델타를 포획하기 위해 AOC에서는 여러 번 토벌대를 보냈지만, 그 시도는 매번 실패로 돌아갔다. 이에, 정부는 공격적인 대응을 시도하는 대신 소수의 정예 연구 인원에 경호를 붙여 시시포스산에 파견했다. 나는 이 연구의 총 책임자인 만큼, 델타의 서식지에 가장 가까운 곳에서 경호를 한 명 대동한 채 단독 연구를 진행하기로 했다.<br><br>그 뒤로는 그가 조사한 델타의 연구 결과가 상세하게 적혀 있습니다. 요약하자면 다음과 같습니다.<br><br>델타. 지능이 있을 뿐만 아니라, 다른 크리쳐의 4~5배나 되는 거대한 체구의 생체형 크리쳐. 어떤 이유에서인지 모스 부호를 알고 있어, 인간과 의사소통을 한 기록이 있다. 그 기록을 살펴보면, ‘건드리지 마' 라거나, ‘죽여버리겠어' 등, 공격적인 신호가 대부분이다. 델타와 조우 후의 생존률은 10% 이하. 그에게 공격적인 태도를 취하지 않아 살아남은 전례가 있다.<br><br>그렇다면, 적대적인 대처를 하지만 않으면 약간이나마 교류가 가능하지 않을까? 이를 시도하기 위해, 델타가 자주 발견되는 지역에서 그를 기다리기로 결심했다. 목숨을 건 시도지만, 성공하면 상급 크리쳐 연구에 큰 기여를 하게 될지도 모른다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    놀랍게도, 그 뒤로는 그가 델타에게 모스 부호로 대화를 시도하다 어느 정도 라포 형성에 성공한 기록이 남아있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 크리쳐와 인간인데도요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만, 연구 일기는 1년 전에 뚝 끊겨 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    크리쳐랑 대화를 시도해서 대체 뭘 하고 싶었던 거지? (이해가 되지 않는다는 듯, 연구 일지를 가만히 들여다보던 것을 내려놓았다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 당신이 다 읽는 것을 기다리고 있다가...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    자요. (하고, 스푼 넘겨줍니다. 그러곤 그 사이 제가 생각했던 것들 종알종알 얘기하기 시작합니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    AOC 내에서 크리쳐에 대한 연구가 얼마나 집착적으로, 그러니까... 활발하게, 라고 해도 되겠네요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그렇게 연구되고 있는지는 아마, 당신도 얼추 생각은 하고 계실 거라고 봐요. (하고, 바라봅니다. 최초의 군용 크리쳐인 당신을요.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    흠. (스프를 뜬 수저는 입에 문 채로 발을 까딱거린다. 마찬가지로 고개를 돌려 눈을 맞춘다.) 델타와는 실패한 것 같다만, 크리쳐와 대화하고 있는 기분은 어때? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그럼... 시선이 마주하다가.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (결국 먼저 시선 돌립니다. 뭐지, 기분이 이상하네요...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    응? 어떻냐니까. (손 뻗어 옆구리 슬슬 간질인다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 간지럼탄다 안탄다 (choice 간지럼탄다 안탄다) ＞ 안탄다\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 저, 저, 가, 간지럼은 안 타거든요!!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    무, 무슨 그런 새삼스러운 걸 다 물어봐요... 다, 당신은 그냥 당신이지 뭘. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    하ㅡ하여튼, 보통 이런 연구는 아주 큰 불상사가 일어나지 않는 이상 중지되긴 힘들어요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    요컨대, 연구자가 사고에 휩쓸렸다던가... 아니면 크리쳐의 손에 주, 죽었다던가. 정도의 사고가 아니고서야 말이에요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...델타,라는 개체는 애초에 인간에 대한 경계도 높았고, 굉장히... 호전적인 것 같던데. (테이블에 내려놓은 종이를 톡톡 손가락으로 건드렸다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이런 연구를 더 이어가는 건 힘들지? 위험하기도 위험하고... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나처럼 목숨이 여러개가 아닌 이상은 자살행위나 마찬가지지. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    한참 대화를 나누고 있으면, 탐사자와 KPC의 손목에서 신호가 반짝거립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    본부의 알림입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    벌써 승급전의 절반이 지났다는 건조한 공지와 함께 중간 순위가 공개됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    1위는 콘라드입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 다음은 굉장히 생소한 이름이 이어지는데, 아마도 콘라드의 파트너인 것 같습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어, 엇... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람의 이름을 찾아 한참 내리면, 거의 맨 아래에서 찾을 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    본격적인 크리쳐 사냥은 한 번도 하지 못 했으니, 나란히 최하위권입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 후로 짧게 적막이 감돕니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC야 좌천되면 그만이지만, 탐사자는 쓸모 없다고 상부에 찍히면 어떻게 되는 걸까요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    AOC 소속 연구소의 최대 걸작. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    인권이라곤 조금도 존재하지 않는 전투 병기 크리쳐, 그게 탐사자입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    적어도 좋은 꼴이 되지는 못 하겠죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다시 연구실로 돌아가게 될지도 모릅니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (듀... 한 표정입니다. 뭐라 말이 안 나오는 걸까...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이거... 다른 대원들이 단체로 마음 먹고 방해한 건 상부에 보고 해도 참작 해주지는 않으려나? (눈썹을 까딱, 올리며 중얼거린다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (순간 떠오르는 단어는 폐기 처분, 정도였다. 잠시 뜸을 들이다가 널 바라보며 고개를 살짝 기울인다.) 파트너 교체가 필요한가? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ㅡ뭐, 아, 아무래도... 규정 상 문제가 없던, 그런 행동이었으니까요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (아무래도, 이 정도도 극복 못 했냐니 뭐니 정도의 이야기만 나오고 말 걸요... 따위의 말을 하다가, 눈 동그랗게 뜨고 말 멈춥니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    파ㅡ파트너 교체요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러곤 생각이 닿습니다. 당신의 처분, 뭐 그런 것 쯤 고려해 보다가 화들짝 놀라 고개 젓습니다.) 저, 저는 지금...! 세, 세피르랑 파트너인 게 더 좋, 좋은데요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래? (입꼬리가 슬그머니 올라간다. 몸을 살짝 기울여 얼굴 사이의 간격 좁히고는 가만히 눈을 마주했다.) 역시 내가 좋은 거지?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ! (가까이 다가온 당신 얼굴에 깜짝 놀라서는 고개가 뒤로 살짝 빠집니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...이, 이런 건 안 좋아요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (서운하다는 듯이 곧바로 눈썹 쳐진다. 어쩌면 울상 짓는 네 표정을 따라하는 것 같기도?)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    조금 전까지만 해도 내가 좋다더니. (투덜거리며 몸을 다시 물렸다. 까딱, 의자 등받이에 완전히 기대고 덜컹인다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (보이는 표정에 눈썹이 살짝 쳐졌다가, 어쩐지 의심 조금 섞인 표정이 됩니다. 그야, 저런 표정은 늘 제가 짓던 표정이었으니까요...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...그, 그러니까, 파ㅡ파트너로서 좋다는 거잖아요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (입 삐죽입니다. 시선이 당신의 모습 담습니다. 완전히 뒤로 물러난 모습 보고 나면... 이번에는 절대 안 속겠다, 이런 다짐 한 표정 됩니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    지ㅡ지금부터 열심히 하면, 잘 하면 순위권에 들 수 있을지도 모르니까요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러니까, 해석하자면 움직일 만한 기운이 있는지 체크하는 겁니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    몸 다 녹았으면, 나갈까? 이전 실적 1위가 꼴등이 되면 체면이 말이 아닐 테니까. (쭉, 기지개를 켜고는 의자에서 일어난다. 움직일 만한 기운은 충분히 있었다. 당연하게도...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC는 다시 총과 짐을 챙겨 나갈 채비를 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이곳은 새하얀 설산, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC는 당신을 향해 총을 겨누며 말합니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어깨끈을 연결한 총 걸메지고는, 당신 바라봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    같이 싸워요, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신은 제 파트너니까. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    마지막에는 한 마디 덧붙입니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그리고... 뭐, 뭔가 멋있게 말하긴 했지만, 아마 지금부터 총을 제대로 쥐셔야 할 것 같아요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    안전장치는 풀려 있죠? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (푸핫, 하고 웃음 터트린다. 조금 전까지만 해도 울상이었다가, 삐죽거렸다가... 다양한 표정을 짓더니 이제는 진지한 얼굴로 함께 싸우자 하는 것이 제법...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래, 1위 탈환하게 해줄게. 애초에, 그 자리는 우리 아니고서야 차지 할 인재가 "\n    어라, 어떻게 여기까지...? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC는 매달린 채 사색으로 대꾸합... 하나? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 한다 안한다 (choice 한다 안한다) ＞ 안한다\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    안 합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    우리 없는 동안 크리쳐 많이 잡긴 했나?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    대, 대답할 여유도 있고... (어쩐지 안색이 안 좋습니다. 그야...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... 머, 멀미 나... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC는 결국 잡고 있던 꼬리를 놓치고 바닥을 뒹굽니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뭐, 좀 멋없는 파트너가 떨어지긴 했지만... 델타가 다른 대원들에게 정신 팔린 지금이 기회겠네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어떤 공격 판정이든 가능합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (멋없는 파트너는 뒤로 하고~ 치사한 대원들도 뒤로 하고~) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>근접전(도검)</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">90</span>/<span class=\"inlinerollresult\">45</span>/<span class=\"inlinerollresult\">18</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">92</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아... 나도 멀미...  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    우욱... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아... 헬기 안 탄지 오래됐단 말이야... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    머리가 좀 어지러운 것도 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    운 좋게도 때마침 느슨해진 틈으로 탐사자 또한 미끄러집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    물론, 좀 멋 없게요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (눈밭에 푹, 파묻히듯이 떨어졌다가 고개 내민다. 신경질적으로 머리에 묻은 눈뭉치들을 털어낸다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아까 샬롯도 이 근처에 떨어졌던 것 같은데... (새하얀 파트너가 새하얀 군복을 입어서 보호색이 됐다... 어딨지?)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 어푸푸... 나름최인이라멀쩡 (choice 어푸푸... 나름최인이라멀쩡) ＞ 어푸푸...\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (ㅋㅋ) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (새하얀 파트너, 새하얀 눈더미에 파묻혀 있습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어, 어지러워... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    여기있네. (샬롯의 팔 아래로 손 집어넣어 쑤욱... 무 뽑듯이 들어올린다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (쑤우욱 뽑힙니다. 주 우 우 욱) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    고, 고마워요... 저, 눈에 파묻혀서 죽는 줄 알았어요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (정신없이 헛소리 조금 합니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    때 아닌 파트너 구출작전을 펼치고 있으면, 탐사자를 놓친 델타가 포효합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뱀 같이 긴 몸을 뒤로 한 번 젖히더니, 끈적끈적한 살덩이를 다시 어딘가로 향해 길게 뻗습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    표적이 된 콘라드는 찰나의 순간 창백하게 얼어붙은 채, 그쪽을 쳐다봅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러나, 그의 뒤에서 후드를 뒤집어 쓴 사람이 콘라드를 밀치고 대신 잡힙니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그를 포획한 델타는 재빠르게 몸을 돌려 빠져나갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아마 둥지로 향하는 것 같습니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    오데트!!! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    저러면 보통... ...잡아먹히나? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드가 소리 지릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아마도 콘라드의 파트너였던 것 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다른 대원들이 따라가려는 콘라드를 만류하지만, 콘라드는 미친 사람처럼 그들을 떨치고 달려가려고 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC는 조금 진정, ...했나? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 아직정신이어지럽다 멀쩡해졌어용 (choice 아직정신이어지럽다 멀쩡해졌어용) ＞ 아직정신이어지럽다\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (모르겠고 일단 파트너에게 기대 있습니다. 아니, 거의 널려 있다고 봐야겠군요...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    대, 대충... 설명이라도 좀 해 드려야 할까요... (총은 또 어디 갔담... 한숨이 늘어만 갑니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    정신을 하나도 못 차리네... (앞머리 살살 걷어내고는 이마에 손바닥 짚는다. 눈에 파묻혀 있던 탓에 추워서 그러는 건지, 아니면 반대로 그 찰나에 감기라도 걸린 건지.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (이마에 손바닥 닿으면, 그야 눈밭에 묻혔던 수준이니 조금 체온이 낮긴 합니다. 그러나 그것보다는 당신 손가락도 차갑다고 느꼈던 걸까요... 힘주어 눈 감고 약간 앓는 소리 내다가 뒤늦게 눈 뜹니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...정, 정신을 못 차리긴 누가 못 차렸다구 그래요. (입 삐죽...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아니야? (가만히... 눈 들여다보다가 고개 돌린다. 아니면 말구, 라며 어깨 으쓱이고서는 아마 세상을 잃은 듯한 표정 하고 있을 콘라드를 바라본다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 이미둘다알뇌니까넘어가자 설명해줘 (choice 이미둘다알뇌니까넘어가자 설명해줘) ＞ 이미둘다알뇌니까넘어가자\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ~델타로 추정되는 상급 크리쳐에 대한 자초지종 설명~ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러면 제자리에 주저앉은 콘라드가 연신 고개를 흔듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어딘가 얼이 빠져나간 표정입니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아니, 델타… 가, 아니야. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드가 먼저 다른 대원들 앞에 무릎 꿇습니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    부탁이에요, 다함께 오데트를 구해주세요. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    제발, 부탁드립니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아무도 없다면 혼자라도 가겠습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    대부분의 대원들이 안타깝게 됐지만 그건 좀…. 이라는 표정을 지으며 한 두 걸음 뒤로 물러섭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그냥 상급 크리쳐를 잡는 것도 힘든데, 거처의 상급 크리쳐는 얼마나 대하기 까다로울까요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    더군다나 방금 전의 습격으로 부상을 입은 사람들도 굉장히 많습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (빼꼼...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜... 도와주자고 하게? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그, 그으... (시선 이리저리 굴리다가) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 아까 콘라드 대신 잡혀갔던 쪽이 걱정이 되어서요...? (어색하게 웃습니다. 헤...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...아하, 콘라드의 파트너? (하기야 그 애는 별달리 말을 얹거나 견제를 한 것도 아니니 악감정은 없었다. 잠시 뜸을 들인다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래, 그럼 도와주기로 하지. 샬롯의 전 파트너이기도 하니까. (예전에는 상위권을 나란히 차지했다고 하니 전력적으로도 그를 잃지 않도록 하는 편이 이득이었다. 네 어깨에 두 손을 턱, 얹고는 살살 민다.) 콘라드 신~ \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    앗, 어, 왜 제가 앞인 건가요?! (미는대로 걸음 옮겨가며 가긴 하는데, 으잉? 하며 당황합니다. 그래도 싫다고 하지도 않으시고, 그런 점은 참 어른이시긴 한데... 그런 감상따위 3초만에 깨지는 겁니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드는 꽤 절박하게 다른 이들에게 도움을 구하던 모양입니다. 물론, 잘 되지는 않은 것 같지만요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    샬롯의 얼굴을 봐서 도와주기로 마음은 먹긴 했는데. 어디... 도와줄까? (네 머리 위에 슬쩍 턱을 괴고는 콘라드를 가만 바라본다. 직접 도와달라고 하기 전까지는 움직이지 않을 생각이다.)  \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    정말, 정말 염치없는 짓이라는 걸 알지만... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    네, 제발요. 제발 도와주세요, 제 파트너를 구해야 합니다... (숫제 주저앉은 채입니다. 목소리에서는 절박함이 묻어나옵니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    네 파트너는 잘못이 없어서 도와주기로 한 거야. 구출하고 나면 고맙다고 먼저 해야할 거다~ (주저앉아 있는 콘라드의 이마에 가볍게 딱콩, 하고는 허리를 편다.) 일어나, 조금이라도 빨리 움직여야 살아있을 확률이 높아지니까. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리하여 콘라드의 파트너를 구하기 위한 임시 조가 만들어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    발걸음을 옮기며 KPC가 묻습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어쩐지 목소리에 부루퉁함이 묻어나옵니다.) 그런데요, 신. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저희한테 무슨 악감정 있었어요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    워, 원래 재수는 좀 없었어도 이럴 만큼 못된 사람은 아니었잖아요... (삐죽...) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드는 한참동안 대답하지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    무언가 말하려다 말고, 말하려다 말기를 반복한 끝에 그는 입을 뗍니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    우리가 지금 쫓는 크리쳐는 델타가 아닙니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그건 아마 최근에 새로 생긴 상급 크리쳐일 거예요. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    델타는, (한번 숨 들이쉬더니) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    ... ...제 파트너입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이어지는 말은 굉장히 충격적인 내용이었습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    핸드아웃 : 콘라드와 델타의 이야기를 듣습니다. \n  "},{"y":"say","sp":"콘라드와 델타","ts":null,"tab":"info","html":"\n    콘라드는 델타 전담 연구원의 경호원으로 발탁되어 델타 연구에 동행하게 되었습니다. 그리고 연구원이 상급 크리쳐 델타와 라포 형성을 시도할 때 자연스럽게 곁에 있었습니다. 콘라드는 상급 크리쳐의 연구 자체에 못마땅했으며, 이런 벽지로 보내진 것 자체가 좌천이라고 생각했습니다.<br><br>하지만, 델타와의 만남은 많은 것을 바꾸었습니다. 처음에는 델타가 당장 연구원을 공격하지 못하게 막는 게 전부였지만, 모스 부호를 주고 받게 된 날 이후로부터 많은 게 변했습니다. 연구원과 경호원, 그리고 실험체는 세 사람만의 공간에서 교류를 나누며 남들은 생각할 수 없을 정도로 깊은 유대를 쌓았습니다.<br><br>그러나, 팀의 다른 대원이 델타를 오인 사격한 사건을 계기로 델타는 폭주했습니다. 연구원은 그 폭주에 휘말려 돌이킬 수 없을 정도로 심각한 상처를 입습니다. 폭주가 가라앉은 이후, 델타는 연구원 옆에서 떠나지 못하고 울고 있었습니다. 뒤늦게 도착한 콘라드는 연구원의 유언을 듣습니다.<br><br>델타에게 자신의 가방에 있는 특별 연구 시약을 사용해 인간형으로 만들 것, 그리고 책임질 것. 그 말을 남긴 연구원은 그 자리에서 사망합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    전 파트너라서 취향도 비슷한 모양이지? (델타, 그러니까 크리쳐를 파트너로 두었다는 말에 샬롯의 귓가에 속닥거린다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 움찔 꺅!! (choice 움찔 꺅!!) ＞ 꺅!!\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    꺅!! (그러니까, 너무 가까이서 훅 들린 목소리에 저도 모르게 비명을 지르고 말았습니다. 어쩐지 억울한 것 같은 시선으로 당신 바라봅니다...) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    (좋은 분위기에 잠시 설명 좀 하마) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    델타, 아니… 오데트는 인간이 된 상급 크리쳐입니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    상부에는 델타가 도망친데다, 총책임자가 사망해 연구가 무산되었다고 알리고 팀을 데리고 긴급 귀환했습니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    오데트는 인간이 되었지만, AOC의 전례 없는 특별한 연구 대상이 되었습니다. 심한 실험을 당하진 않았지만, 폭주를 억제하기 위해 매주 주사를 맞는데다 어딘가에 가기 위해서는 반드시 허가를 받아야 합니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    하다못해 저와 오데트가 이 구역을 대표하는 최강의 자리를 차지한다면, 조금이나마 자유를 얻을 수 있지 않을까 싶어서… 정말 죄송합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러니까... 탐사자와 비슷하면서도 다른 처지의 사람이었네요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그럼 제대로 실력으로 입증을 해야지, 남을 위험하게 만들면서까지 견제 하면 어떡하나. (못마땅하다는 듯이 콘라드를 바라본다. 사정은 딱하지만, 자신의 상황도 별반 다르지 않았기에 큰 동정심까지는 들지 않았다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (앗, 뭔가 심하게 말하거나 너무 말랑하게 대하면 옆에서 조금씩 추임새 넣으려고 했는데. 어쩐지 어른같습니다... 물론 제 쪽이 인간이고 당신 쪽은 크리쳐지만요.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그으렇죠오. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 당신 마음도 알긴 알겠지만...! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저희는 진짜 죽을 뻔 했거든요... (흠, 죽을 뻔한 건가? 생각해보니 눈 뜬 뒤로 당신 상태를 체크를 못 했던 것 같은데... 뭔가 의구심 담긴 눈으로 바라봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (바라보는 시선에 응? 하고 고개 기울이며 눈 맞춘다. 대체 뭘 걱정하는 거지, 인간이 아닌 것을 알고 있으면서도... 하지만 말은 맞춰야하겠으므로...) ...그으랬지.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    운 좋게 추위를 피할 수 있는 장소를 찾지 못했다면 아마 저 아래에서 얼어 죽었을지도 모르지. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    네에, 그랬죠. (하며 바라보다가, 뜻이 전달이 안 됐나... 하곤 혼자 작게 한숨 내쉬고 맙니다. 아아, 크리쳐 관리 담당 인간이란...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    뭐어, 그럼... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    음, 크리쳐 개체로서의 '델타'와 저희가 쫒는 크리쳐는 결국 다른 거겠네요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...뭐, 뭐라고 부를까요? (세피르 빠안...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    델타...가 아니니까... ...감마? (정말 대충.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    진짜 깔끔하고 매뉴얼적이다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (ㅇ.ㅇ) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    불만 있나? (네 뺨 언저리 검지로 쿡...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...당신은, 가끔 정말 어른같은 면모가 있, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (쿡 당하고) 없어졌어요 방금. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그게 보통 있다 없다 하는 거였어? (황당하단 표정으로 반문한다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흥, 당신은 탈부착식 어른스러움인가 보죠. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (삐쭉...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그럼 내 파트너는... 탈부착 할 어른스러움도 없다? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    몰라, 흥. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어, 또 삐졌다.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    말 걸지 마요! (콩콩콩... 먼저 걸어갑니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":  저 크리쳐들은 어떤 방식으로 처리하나요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    산을 째로 날려버릴 생각...을 해야하는 수준 아닌가? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    지금, 지금 이대로 방치하게 되면 근처에 거주하시는 분들께도 피해가 분명 갈 텐데... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 산은 안전지대에 멀지 않은 곳에 위치해있기 때문에, 안전지대에서 재정비해 반격한다면 안전지대 사람들 일부가 공격당할 것입니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    산을 통채로 날려버릴 생각을 해야 한다는 데에는 나도 동의해. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    저 숫자를 일일히 잡다간 AOC에 있는 헬기들이 죄다 동날지도 몰라... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    뭐, 폭탄? 그런 거라도 있어야 하나? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    와. 진짜 한 번도 써본 적 없어. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    우리의 탐사자, 대망의 지능 판정 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>지능</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">60</span>/<span class=\"inlinerollresult\">30</span>/<span class=\"inlinerollresult\">12</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">66</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...본부에서 이런 거 지원 안 해주나? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    성공이든, 실패든, 한 가지 사실을 깨닫습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    있잖아요, 그런 거? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    목 아래로 전해지는 차가운 감각. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    최강의 크리쳐, 당신을 위한 전용 맞춤 대 크리쳐 말살용 폭탄. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    폭탄은 크리쳐 용으로는 효율 안 나오잖아... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    완전히 비주류라고. 특수 임무용 아니면 없을 걸. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...아. (일부러 목까지 올라오는 옷들을 고집하는 이유가 있었지, 참. 쓸 일이 있으리라고는 생각한 적이 없어서 여즉 쓸모를 잊고 있었다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    샬롯, 우리 지급 받은 거 있지 않았던가? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    에, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    항상 최전방에 있으니까. 그, 왜... 위험한 상황에 쓰라고 지급 받은 거 있잖아? 그치? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아니, 그, 그러니까, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...하, 하지만 그건, 지금같은 상황에서 사용하기에는 부적절해요...! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (시선 이리저리 굴리다가 조금 인상쓰고 소근소근...) 터지기 10초 전까지, 당신 피부에 닿아 있어야 작동하는 거란 말이에요...! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    맞습니다. 리모콘으로 해제해서 던지는 방법도 있겠지만, 이 폭탄은 폭파 10초 전까지 탐사자의 피부에 닿아 있어야 작동합니다.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그렇다고... 못 쓸 것도 없지? (머리를 맞대고 같이 속닥거린다. 아마 다른 둘에게는 굉장히 수상해 보일지도 모르겠다...)  \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    저기, 한창 너희 말하는 도중에 미안한데. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그런 폭탄이 있는 거면 그냥 던져버리면 되지 않아? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그러니까. (ㅇ.ㅇ) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    저 크리쳐 무리 안에 있다가 10초만에 빠져나와야 한다? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그렇다는데? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","htm :"main","html":"\n    헬기는 AOC 사옥을 향해 힘차게 날아갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    며칠 뒤, 두 사람은 단상에 서있습니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    \"세피르 해킷, 샬롯 바이런.\" \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    \"두 사람은 9구역을 대표하는 최강의 인류로, AOC의 위상을 크게 드높였기 때문에 특진을 겸해 6박 7일의 휴가를 수여한다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    또다시 최강의 인류라는 명예로운 이름이 어울리지 않는 대상에게 돌아갑니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    승급전은 엉망으로 끝났지만, 여차저차 마지막에 대량으로 잡은 크리쳐가 카운트에 들어간 모양입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자와 KPC는 승급전에서조차 안전지대를 구한 영웅이 되었습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    등을 돌리면 이쪽을 보며 박수를 치는 대원들의 눈에는 전에 없던 존경심이 반짝입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “안전지대로 크리쳐가 넘어가지 않도록 몸을 던져서 막았대.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “대단해, 어쩌면 저렇게 용맹할까.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 옆에는 어떤 표정을 지어야 할지 모르겠다는 듯, 딴청부리는 콘라드와 오데트가 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러자면 제복에 어울리지 않는 훈장을 단 KPC가 탐사자의 옆구리를 팔꿈치로 푹 찌릅니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...마, 마지막 거, 저희 반씩 카운트 하는 거에요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러니까, 저희는 동점인 거라구요. (내기 떠올리곤, 없던 일인 척 무마해봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    뭐, 그런 걸로 해~ (애초에 크게 의미가 있던 내기도 아니고, 어깨 으쓱이더니 다시 정면 바라본다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (뭐, 제가 이기면 자꾸 다가오지 않기로 했었지만... 잘못 계산하면 분명 제 쪽이 져 버리고 마니까요... 그런 건 쏘옥 뺴먹고 큼큼.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (이겼다고 해도 과연 계속 안 다가갔을까? 그건 모르는 일입니다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여러분들의 생각들과는 별개로, 마지막으로 카메라맨이 등장해 두 사람의 모습을 찍습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자, 치즈~ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    END. 클리셰 SF 세계관의 크리쳐도 버디물을 하고 싶어! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자, KPC. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    별 탈 없이 생환합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    에필로그로 이어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    장소는 병원입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    말로 하지 않아서 몰랐는데, 승급전에서 추락했을 때 KPC는 제법 큰 부상을 입은 모양입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 KPC의 상태를 확인하기 위해 병문안을 왔습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문을 열면, 병원 침대에 앉은 KPC는 붕대를 풀고 있습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그래도 이제 반깁스로 넘어가나요... (뭐, 대충 이런 이야기나 의사랑 하고 있었습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러다 당신 보고...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 말랑... 캬옹캬옹 (choice 말랑... 캬옹캬옹) ＞ 캬옹캬옹\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (입 삐죽.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜 그렇게 입술을 내밀고 있어? (토라진 것 같은 얼굴 가만히 들여다본다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흥, 몰라요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이제야 얼굴 보러 오고. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아, 그러니까... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    빨리 보고 싶었는데 내가 너무 늦게 왔다?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    몰라요. 됐어요. 바보!!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (팽~ 뒤돌아 침대에 누워버립니다.)     <button id="pwbtn" class="iconbtn" title="게시 비밀번호 등록"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3"/></svg></button>
  </div>
  <main id="log"></main>
<script>
/* crit-ccf-proto-builder: 가져온 CCF 로그를 프로토타입 뷰어 구조로 주입 */
(function () {
  var qid = (window.__CRIT_ID || new URLSearchParams(location.search).get('id'));
  var data = window.CRIT_LOG_DATA || null;
  if (!data) { try { data = JSON.parse(localStorage.getItem('crit-log-data:' + qid)); } catch (e) {} }
  window.CRIT_IMPORT_DATA = data;
  var PALETTE = ['#B26A9E','#5B8DB8','#5BA8A0','#7BA05B','#C98A5B','#8A7BC9','#c15b74','#5bb0c9'];
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  if (!data || !Array.isArray(data.blocks)) {
    document.getElementById('log').innerHTML =
      '<div style="text-align:center;color:var(--dim);padding:60px 0">로그 데이터를 찾을 수 없어요. 로그 보관함에서 다시 가져와 주세요.</div>';
    window.CRIT_CHARMETA = {};
    return;
  }
  /* 캐릭터 메타 */
  var meta = {};
  if (data.charMeta && typeof data.charMeta === 'object') {
    Object.keys(data.charMeta).forEach(function (k) {
      var m0 = data.charMeta[k] || {};
      /* mine/npc를 안 옮겨 담아서, serialize()가 분명히 저장했는데도 다시 열 때마다
         "내 캐릭터"/NPC 체크가 항상 풀린 것처럼 보였다 */
      meta[k] = { display: m0.display || k, color: m0.color || null, avatar: m0.avatar || null, plain: !!m0.plain, mine: !!m0.mine, npc: !!m0.npc, hideAvatar: !!m0.hideAvatar };
    });
  }
  var order = [];
  data.blocks.forEach(function (b) {
    if (!b.sp) return;
    if (!meta[b.sp]) meta[b.sp] = { display: b.sp, color: b.color || null, avatar: b.av || null };
    if (order.indexOf(b.sp) === -1) order.push(b.sp);
    if (!meta[b.sp].avatar && b.av) meta[b.sp].avatar = b.av;
    if (!meta[b.sp].color && b.color) meta[b.sp].color = b.color;
  });
  Object.keys(meta).forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); });
  var pi = 0;
  order.forEach(function (k) { if (!meta[k].color) meta[k].color = PALETTE[pi++ % PALETTE.length]; });
  window.CRIT_CHARMETA = meta;
  /* info 탭에서만 등장한 이름은 핸드아웃 명의일 뿐 캐릭터가 아님 → 리스트/선택 목록에서 제외 */
  var nonInfo = {};
  data.blocks.forEach(function (b) { if (b.sp && (b.tab || 'main') !== 'info') nonInfo[b.sp] = 1; });
  var infoOnly = {};
  order.forEach(function (k) { if (!nonInfo[k]) infoOnly[k] = 1; });
  window.CRIT_INFO_ONLY = infoOnly;

  /* 세션 히어로 - 게시본은 window.CRIT_LOG_SESS로 구워져 들어온다(publisher.html이 게시
     시점에 crit-log-sess:<id>를 읽어서 넣어줌). 방문자 브라우저는 앱의 localStorage에
     접근할 수 없어서(다른 오리진) 그 값이 없으면 세션 정보가 영원히 빈 채로 보였다
     (실제로 겪은 버그) - 있으면 그걸 쓰고, 없으면(앱 안에서 직접 보는 경우) 기존대로
     localStorage에서 읽는다 */
  var sess = {};
  if (window.CRIT_LOG_SESS) sess = window.CRIT_LOG_SESS;
  else { try { sess = JSON.parse(localStorage.getItem('crit-log-sess:' + (qid || 'tpl'))) || {}; } catch (e) {} }
  var sTitle = sess.title || data.title || '로그';
  var sPlayers = sess.players || data.players || [];
  document.body.dataset.session = JSON.stringify({
    title: sTitle, writer: sess.writer || '', gm: sess.gm || '', players: sPlayers,
    party: sess.party || data.party || '', overview: sess.overview || ''
  });
  var tEl = document.getElementById('s-title');
  if (tEl && tEl.childNodes.length) tEl.childNodes[0].textContent = sTitle + ' ';
  var wEl = document.getElementById('s-writer');
  if (wEl) wEl.textContent = sess.writer || '';
  var plEl = document.getElementById('s-players');
  if (plEl) plEl.innerHTML = sPlayers.map(function (p) { return '<span class="pbadge">' + esc(p) + '</span>'; }).join('');
  var ovEl = document.getElementById('s-overview');
  if (ovEl) ovEl.textContent = sess.overview || '';
  document.title = 'Crit — ' + sTitle;

  /* 캐시된(하드코딩) 페이지면 DOM 재조립 생략 */
  var BAKED = !!(window.CRIT_BAKED && document.querySelector('#log .msg'));
  /* 로그 DOM: 프로토타입 마크업 (info 탭 → 핸드아웃 카드, 같은 화자 연속 → cont, main 외 탭 → subtab) */
  var htmlOut = [];
  var prevKey = null;
  var tabCnt = {}, charCnt = {};
  data.blocks.forEach(function (b, i) {
    var tab = b.tab || 'main';
    tabCnt[tab] = (tabCnt[tab] || 0) + 1;
    if (b.sp) charCnt[b.sp] = (charCnt[b.sp] || 0) + 1;
    if (tab === 'info') {
      prevKey = null;
      var hn = b.sp || '✦ 정보';
      var hc = (meta[b.sp] && meta[b.sp].color) || '#03a9f4';
      if(!BAKED)htmlOut.push('<div class="msg handout" data-tab="info" data-type="handout" data-char="' + esc(b.sp || '') + '" id="imp-' + i + '">' +
        '<div class="hcard"><div class="hname" style="color:' + esc(hc) + '">' + esc(hn) + '</div>' +
        '<div class="mcontent">' + (b.html || '') + '</div></div></div>');
      return;
    }
    if (b.y === 'desc' || !b.sp) {
      prevKey = null;
      if(!BAKED)htmlOut.push('<div class="msg desc" data-tab="' + esc(tab) + '" data-type="desc" data-char="" id="imp-' + i + '">' +
        '<div class="mbody"><div class="mcontent">' + (b.html || '') + '</div></div></div>');
      return;
    }
    var m = meta[b.sp] || { color: '#9a95a0', avatar: null };
    /* 연속 발언 판정은 화자만 비교한다 - 탭까지 같이 비교하면(예전 방식) 탭 라벨 표기가
       메시지마다 미묘하게 달라지는 코코포리아 로그에서 같은 화자인데도 안 이어지는 경우가 많았다.
       다른 뷰어(viewer.html/log_viewer.html/freelog.html)도 전부 화자만으로 판정한다 */
    var cont = b.sp === prevKey;
    prevKey = b.sp;
    /* 지문출력 선택은 빌드 시점에 바로 반영 - 나중에 바뀌며 깜빡이지 않게 */
    var asDesc = Array.isArray(data.descChars) && data.descChars.indexOf(b.sp) !== -1;
    var cls = 'msg general' + (cont ? ' cont' : '') + (tab !== 'main' ? ' subtab' : '') + (asDesc ? ' as-desc' : '');
    /* "이 블록만" 아바타 수정은 예전엔 화면(DOM)에만 반영되고 serialize()가 저장을
       안 해서, 새로고침하면 조용히 사라졌다(실제로 겪은 버그) - b.avOv로 블록별로
       저장한다: 문자열이면 그 이미지로 덮어쓰고, 프로퍼티는 있는데 값이 없으면(null)
       "이 블록만 없애기"로 색 원만 강제, 프로퍼티 자체가 없으면 평소처럼 캐릭터 기본값 */
    var hasOv = Object.prototype.hasOwnProperty.call(b, 'avOv');
    var av = hasOv
      ? (b.avOv
          ? '<img src="' + esc(b.avOv) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
          : '<b style="background:' + esc(m.color) + '"></b>')
      : (m.hideAvatar ? '' : (m.avatar
          ? '<img src="' + esc(m.avatar) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
          : '<b style="background:' + esc(m.color) + '"></b>'));
    /* avOv가 있는 블록은 렌더 시점엔 이미지를 맞게 보여주면서도 data-avatar-override를
       안 붙여서, 새로고침 직후 아무 DOM 변화(MutationObserver)에도 serialize()가 이
       블록을 "오버라이드 없음"으로 다시 저장해버려 조용히 유실됐다(실제 겪은 버그:
       "저장은 됐는데 다시 들어가면 리스트 자체가 초기화된다") */
    var ovAttr = hasOv ? ' data-avatar-override="1"' : '';
    if(!BAKED)htmlOut.push('<div class="' + cls + '" data-tab="' + esc(tab) + '" data-type="general" data-char="' + esc(b.sp) + '"' + ovAttr + ' id="imp-' + i + '">' +
      '<div class="avatar">' + av + '</div>' +
      '<div class="mbody"><div class="mhead"><span class="by" style="color:' + esc(m.color) + '">' + esc(b.sp) + '</span>' +
      (tab !== 'main' ? '<span class="ctab">' + esc(tab) + '</span>' : '') +
      (b.ts ? '<span class="tstamp">' + esc(b.ts) + '</span>' : '') + '</div>' +
      '<div class="mcontent">' + (b.html || '') + '</div></div></div>');
  });
  /* 블록 단위 점진 렌더링: 첫 400블록만 즉시 그려 바로 조작 가능, 나머지는 비동기로 이어붙임 */
  (function () {
    var lgEl = document.getElementById('log');
    var CHUNK = 400;
    if (htmlOut.length <= CHUNK) { lgEl.innerHTML = htmlOut.join('\n'); return; }
    window.CRIT_BUILDING = true;
    lgEl.innerHTML = htmlOut.slice(0, CHUNK).join('\n');
    var __pos = CHUNK;
    (function step() {
      if (__pos >= htmlOut.length) {
        window.CRIT_BUILDING = false;
        document.dispatchEvent(new Event('crit-log-built'));
        return;
      }
      var tp = document.createElement('template');
      tp.innerHTML = htmlOut.slice(__pos, __pos + CHUNK).join('\n');
      lgEl.appendChild(tp.content);
      __pos += CHUNK;
      setTimeout(step, 0);
    })();
  })();

  /* 통계 */
  var st = document.querySelector('.stats');
  var tabs = Object.keys(tabCnt);
  /* 지문출력/사담으로 지정된 캐릭터는 개별 칩 대신 "지문"/"사담" 통합 칩 하나로 합쳐서 보여준다 -
     체크박스가 항상 살아있는 통합 칩 하나로만 존재해야 다른 캐릭터를 솔로/토글할 때 이 캐릭터
     로그가 전체에서 같이 사라지는 버그(개별 칩이 아예 안 보이던 예전 방식의 잔재)가 안 생긴다 */
  var descSet = {}, chatSet = {};
  (Array.isArray(data.descChars) ? data.descChars : []).forEach(function (k) { descSet[k] = 1; });
  (Array.isArray(data.chatChars) ? data.chatChars : []).forEach(function (k) { if (!descSet[k]) chatSet[k] = 1; });
  var listOrder = order.filter(function (k) { return !infoOnly[k] && !descSet[k] && !chatSet[k]; });
  window.__critOrder = order;
  window.__critCharCnt = charCnt;
  if (st) st.innerHTML = '<span>전체 <b>' + data.blocks.length + '</b>블록</span>' +
    '<span>탭 <b>' + tabs.length + '</b>개</span><span>캐릭터 <b>' + listOrder.length + '</b>명</span>';

  /* 저장된 탭/캐릭터 꺼짐 상태를 렌더 시점부터 반영 - 체크박스가 항상 켜진 채로 그려졌다가
     나중에 복원 스크립트가 꺼주는 방식이면 그 사이 깜빡임이 생긴다 */
  var savedTabOff = [], savedCharOff = [];
  try { var _tso = JSON.parse(localStorage.getItem('crit-tab-state:' + qid)); if (_tso && Array.isArray(_tso.off)) savedTabOff = _tso.off; } catch (eTso) {}
  try { var _cso = JSON.parse(localStorage.getItem('crit-char-state:' + qid)); if (_cso && Array.isArray(_cso.off)) savedCharOff = _cso.off; } catch (eCso) {}

  /* 탭바 (other/사담/잡담 계열은 기본 해제 - 기획서 5.5, 저장된 값이 있으면 그걸 우선) */
  var tb = document.querySelector('.tabbar');
  if (tb) {
    tb.innerHTML = tabs.map(function (t) {
      var on = savedTabOff.length ? savedTabOff.indexOf(t) === -1 : !/^(other|사담|잡담)$/i.test(t);
      return '<label class="tab-chip"><input type="checkbox"' + (on ? ' checked' : '') + ' data-tab="' + esc(t) + '">' +
        '<span class="tab-name">' + esc(t) + '</span><span class="chip-count">' + tabCnt[t] + '</span>' +
        '<span class="tab-x" title="이 탭 데이터 완전 삭제">×</span></label>';
    }).join('\n');
  }

  /* 캐릭터바 */
  var PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  function mergedChip(dc, label, keys) {
    if (!keys.length) return '';
    var cnt = keys.reduce(function (s, k) { return s + (charCnt[k] || 0); }, 0);
    var on = savedCharOff.indexOf(dc) === -1;
    return '<label class="char-chip merged" data-chip="' + dc + '">' +
      '<input type="checkbox"' + (on ? ' checked' : '') + ' data-char="' + dc + '">' +
      '<span class="chip-name">' + label + '</span>' +
      '<span class="chip-count">' + cnt + '</span></label>';
  }
  var cb = document.getElementById('charbar');
  if (cb) {
    cb.innerHTML = mergedChip('__desc__', '지문', Object.keys(descSet)) + mergedChip('__chat__', '사담', Object.keys(chatSet)) +
      listOrder.map(function (k) {
      var m2 = meta[k];
      var avh = m2.avatar
        ? '<img src="' + esc(m2.avatar) + '" onerror="this.replaceWith(avFallback(&quot;' + esc(m2.color) + '&quot;))">'
        : '<b style="background:' + esc(m2.color) + '"></b>';
      var charOn = savedCharOff.indexOf(k) === -1;
      return '<label class="char-chip" data-chip="' + esc(k) + '" style="--cc:' + esc(m2.color) + '">' +
        '<input type="checkbox"' + (charOn ? ' checked' : '') + ' data-char="' + esc(k) + '">' +
        '<span class="chip-avatar">' + avh + '</span>' +
        '<span class="chip-name" style="color:' + esc(m2.color) + '">' + esc(m2.display || k) + '</span>' +
        '<span class="chip-count">' + (charCnt[k] || 0) + '</span>' +
        '<span class="chip-edit" title="캐릭터 편집" data-edit="' + esc(k) + '">' + PEN + '</span></label>';
    }).join('\n');
  }
})();
</script>
</div>
<input type="file" id="filepick" accept="image/*" style="display:none">
<script>
const charMeta = window.CRIT_CHARMETA || {};
const READER = false;

/* ── 세션 정보 ── */
let sessionInfo = JSON.parse(document.body.dataset.session || '{}');
function renderSession() {
  const t = document.getElementById('s-title');
  if (t) t.childNodes[0].textContent = (sessionInfo.title || '세션 로그') + ' ';
  const w = document.getElementById('s-writer');
  if (w) w.textContent = sessionInfo.writer ? ('w. ' + sessionInfo.writer) : '';
  const pl = document.getElementById('s-players');
  if (pl) {
    const badges = [];
    if (sessionInfo.gm) {
      const g = document.createElement('span'); g.className = 'pbadge pbadge-gm'; g.textContent = 'GM ' + sessionInfo.gm;
      badges.push(g.outerHTML);
    }
    if ((sessionInfo.players || []).length) {
      const s = document.createElement('span'); s.className = 'pbadge'; s.textContent = 'PL ' + sessionInfo.players.join(',');
      badges.push(s.outerHTML);
    }
    pl.innerHTML = badges.join('');
  }
  const ovv = document.getElementById('s-overview');
  if (ovv) ovv.textContent = sessionInfo.overview || '';
  document.title = (sessionInfo.title || '세션 로그');
}
const sessbtn = document.getElementById('sessbtn');
if (sessbtn) sessbtn.addEventListener('click', () => {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal wide"><h3>세션 정보</h3>
    <div class="mrow"><span style="flex:none;width:88px">제목 <b style="color:var(--accent)">*</b></span><input type="text" id="si-title" value="${(sessionInfo.title||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">시나리오 라이터</span><input type="text" id="si-writer" value="${(sessionInfo.writer||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">GM</span><input type="text" id="si-gm" placeholder="진행자 이름" value="${(sessionInfo.gm||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">PL</span><input type="text" id="si-players" placeholder="쉼표로 구분" value="${((sessionInfo.players||[]).join(', ')).replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">파티명</span><input type="text" id="si-party" placeholder="여럿일 때 표기 (선택)" value="${(sessionInfo.party||'').replace(/"/g,'&quot;')}"></div>
    <div style="font-size:13px;margin:2px 0 6px">시나리오 개요</div>
    <textarea id="si-overview" style="min-height:110px" spellcheck="false">${sessionInfo.overview||''}</textarea>
    <div class="hint">입력한 정보는 게시본 상단에 표시됩니다. 비워두면 해당 항목은 표시되지 않아요.</div>
    <div class="mbtns"><button id="sc">취소</button><button class="primary" id="so">적용</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#sc').addEventListener('click', () => ov.remove());
  ov.querySelector('#so').addEventListener('click', () => {
    sessionInfo = {
      title: ov.querySelector('#si-title').value.trim(),
      writer: ov.querySelector('#si-writer').value.trim(),
      gm: ov.querySelector('#si-gm').value.trim(),
      players: ov.querySelector('#si-players').value.split(',').map(s => s.trim()).filter(Boolean),
      party: ov.querySelector('#si-party').value.trim(),
      overview: ov.querySelector('#si-overview').value.trim(),
    };
    document.body.dataset.session = JSON.stringify(sessionInfo);
    renderSession();
    /* 자관 미연동 로그의 사이드바 뱃지(플레이어/파티명)가 이걸 읽는데, 가져온 로그는 이 저장
       자체가 아예 빠져있어서 세션 정보를 아무리 채워도 사이드바엔 절대 안 떴다 */
    try {
      var qidSess = window.__CRIT_ID || new URLSearchParams(location.search).get('id');
      if (qidSess) localStorage.setItem('crit-sess:ccf_viewer.html?id=' + qidSess, JSON.stringify({ players: sessionInfo.players, party: sessionInfo.party }));
    } catch (eSess) {}
    /* crit-log-sess:<id>(다시 열 때 읽는 진짜 저장소)는 이제껏 #s-players DOM이 실제로
       바뀔 때만 걸리는 MutationObserver에만 의존했다 - 개요/제목/라이터만 고치고 플레이어
       목록은 그대로 두면(특히 비어 있으면) 감시망이 아예 안 걸려서 저장 자체가 안 됐다
       (실제로 겪은 버그 - "개요 고치고 게시했는데 반영이 안 됨"). 저장 버튼을 누른 시점에
       직접, 확실하게 저장한다 */
    try {
      var qidSess2 = window.__CRIT_ID || new URLSearchParams(location.search).get('id');
      localStorage.setItem('crit-log-sess:' + (qidSess2 || 'tpl'), JSON.stringify(sessionInfo));
    } catch (eSess2) {}

const tabBoxes = document.querySelectorAll('.tab-chip input');

/* 캐릭터바는 지문/사담 지정이 바뀔 때 통째로 다시 그려지므로(renderCharBar), 칩 input을
   한 번만 querySelectorAll로 캐싱해두면 재생성된 새 input을 못 찾는다 - 매번 새로 조회한다 */
function charBoxes() { return document.querySelectorAll('.char-chip input[data-char]'); }
const q = document.getElementById('q');
function apply() {
  const tabs = tabBoxes.length ? new Set([...tabBoxes].filter(c=>c.checked).map(c=>c.dataset.tab)) : null;
  const boxes = charBoxes();
  const chars = boxes.length ? new Set([...boxes].filter(c=>c.checked).map(c=>c.dataset.char)) : null;
  const term = q.value.trim().toLowerCase();
  /* 지문/사담으로 지정된 캐릭터는 개별 체크박스가 없으므로, 그 캐릭터 메시지는 통합 칩
     (__desc__/__chat__)의 체크 상태로 판정한다 */
  const dSet = window.__critDescChars, cSet = window.__critChatChars;
  document.querySelectorAll('#log .msg').forEach(m => {
    /* 게시본(필터 UI 없음)에서는 본편(main/info)만 표시 */
    let ok = !m.dataset.tab || (tabs ? tabs.has(m.dataset.tab)
      : (m.dataset.tab === 'main' || m.dataset.tab === 'info'));
    if (ok && m.dataset.char && chars && m.dataset.type !== 'handout') {
      const mc = m.dataset.char;
      const effChar = (dSet && dSet.has(mc)) ? '__desc__' : ((cSet && cSet.has(mc)) ? '__chat__' : mc);
      ok = chars.has(effChar);
    }
    if (ok && term) ok = m.textContent.toLowerCase().includes(term);
    m.classList.toggle('hide', !ok);
  });
}

/* 업로드한 이미지를 base64로 localStorage에 그대로 박아두면 용량 제한에 걸리므로,
   디스크에 파일로 저장하고 crit-image://<id> 참조만 돌려받는다 (Electron API 없는
   브라우저 미리보기에서는 그냥 base64를 그대로 씀) */
async function toImageRef(dataUrl) {

}

/* 이 캐릭터의 "이 블록만" 아바타 수정에 예전에 썼던 이미지들(중복 제거) - 매번 새로
   업로드하지 않고 골라 쓸 수 있게(실제 요청: "이미 등록한 이미지로 또 하고 싶을 수도
   있잖아") data.blocks에 저장된 avOv를 훑는다 (avOv:null인 "이 블록만 없애기"는 제외) */
function collectRecentAvatars(key) {
  var seen = {}; var out = [];
  (window.CRIT_IMPORT_DATA && window.CRIT_IMPORT_DATA.blocks || []).forEach(function (b) {
    if (b.sp === key && b.avOv && !seen[b.avOv]) { seen[b.avOv] = true; out.push(b.avOv); }
  });
  return out;
}
/* "이 블록만" 오버라이드를 지우고 캐릭터 기본값(공용 아바타/색/숨김)으로 되돌린다 */
function revertBlockAvatar(m) {

  var meta = charMeta[m.dataset.char] || {};
  if (meta.hideAvatar) blankAvatar(m);

/* esc()는 다른 <script> 블록(IIFE) 안에 갇혀 있어 여기서는 안 보인다 - 이걸 놓쳐서
   재사용 썸네일이 하나라도 있는 상태로 이 모달을 열 때마다 "esc is not defined"가
   터져 모달 자체가 안 열렸다(실제 겪은 버그: "수정을 하고나면 다른 블록들을 수정할
   수가 없어" - 사실은 그 캐릭터의 모든 블록에서 똑같이 막히고 있었다) */
function escAttr(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
/* ── 업로드 모달 (onDelete 전달 시 삭제 버튼 표시, recentImgs 전달 시 재사용 썸네일
   표시, onRevert 전달 시 썸네일 맨 앞에 "원래대로" 버튼 표시) ── */
function openUploadModal(title, cb, onDelete, recentImgs, onRevert) {
  /* crit-crop-wrap: 아바타는 1:1로 잘라서 등록. 자른 결과(base64)를 디스크로 옮긴 뒤
     참조를 실제 콜백에 넘긴다 */
  var _cb = cb;
  var _cbRef = function (d) { toImageRef(d).then(_cb); };
  cb = function (d) { if (window.critCrop) critCrop(d, 1, _cbRef); else _cbRef(d); };
  const ov = document.createElement('div'); ov.className = 'overlay';
  /* 재사용 썸네일은 이미 한 번 크롭·저장까지 끝난 이미지라 다시 크롭 모달을 띄우지
     않고 바로 적용한다 */
  var hasRecent = recentImgs && recentImgs.length;
  var recentHtml = '';
  if (hasRecent || onRevert) {
    recentHtml = '<div class="hint" style="margin:0 0 6px">이 캐릭터에 예전에 쓴 이미지</div>' +
      '<div id="ua-recent" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
      (onRevert ? '<div class="ua-revert" title="이 블록만 지정한 아바타 없애고 원래대로" style="width:42px;height:42px;' +
        'border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;' +
        'border:2px dashed var(--line);color:var(--dim);font-size:10px;line-height:1.2;text-align:center">원래대로</div>' : '') +
      (hasRecent ? recentImgs.map(function (src, i) {
        return '<div class="ua-recent-item" data-i="' + i + '" title="이 이미지 쓰기" style="width:42px;height:42px;' +
          'border-radius:50%;background-size:cover;background-position:center;cursor:pointer;' +
          'border:2px solid var(--line);background-image:url(' + escAttr(src) + ')"></div>';
      }).join('') : '') + '</div>';
  }
  ov.innerHTML = `<div class="modal"><h3>${title}</h3>
    ${recentHtml}
    <div class="dropzone" id="dz">이미지를 여기로 드래그하거나<br>클릭해서 선택하세요</div>
    <div class="mbtns">${onDelete ? '<button class="danger" id="ud">아바타 삭제</button>' : ''}<button id="uc">취소</button></div></div>`;
  document.body.appendChild(ov);
  const dz = ov.querySelector('#dz');
  const done = d => { ov.remove(); cb(d); };
  if (onRevert) {
    ov.querySelector('.ua-revert').addEventListener('click', function (e) {
      e.stopPropagation();
      ov.remove();
      onRevert();
    });
  }
  if (hasRecent) {
    ov.querySelectorAll('.ua-recent-item').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        ov.remove();
        _cbRef(recentImgs[parseInt(el.dataset.i, 10)]);
      });
    });
  }
  dz.addEventListener('click', () => pickImage(done));
  ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0]; if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(f);
  });
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#uc').addEventListener('click', () => ov.remove());
  if (onDelete) ov.querySelector('#ud').addEventListener('click', () => {
    ov.remove();
    confirmModal('아바타를 삭제하고 단색 인장으로 되돌릴까요?', '삭제', onDelete);
  });
}

      /* 핸드아웃은 .mhead .by가 아니라 .hcard .hname을 쓰는데, 여긴 그걸 안 건드려서
         핸드아웃 명의는 캐릭터 편집을 해도 색이 그대로였다(실제 겪은 버그: "핸드아웃처리
         하면 캐릭터리스트에서 사라지니까 글씨색같은걸 못바꾸는 문제") - 같은 이름의
         핸드아웃도 전부 같이 바뀌어야 한다는 요청대로, data-char가 같으면 다 반영한다 */
      const hn = m.querySelector('.hcard .hname');
      if (hn) { hn.textContent = meta.display; hn.style.color = meta.color; }
      if (!m.dataset.avatarOverride) paintAvatar(m);
    });
    /* 색/내 캐릭터/NPC 변경은 classList·style 속성 변화라 자동저장(MutationObserver)이 못 잡는다 -
       명시적으로 저장을 불러줘야 한다 */
    if (typeof serialize === 'function') serialize();
    ov.remove();
  });
}
/* 칩이 다시 그려져도 항상 동작하도록 문서 위임 + 캡처 (라벨의 체크박스 토글보다 먼저 가로챔) */

/* 동명 캐릭터 로그 합치기 */
function mergeChars(srcKey, dstKey) {
  const dst = charMeta[dstKey];
  document.querySelectorAll(`.msg[data-char="${CSS.escape(srcKey)}"]`).forEach(m => {
    m.dataset.char = dstKey;
    const by = m.querySelector('.mhead .by');
    if (by) { by.textContent = dst.display; by.style.color = dst.color; }
    const hn = m.querySelector('.hname');
    if (hn) { hn.textContent = dst.display; hn.style.color = dst.color; }
    if (m.querySelector('.avatar') && !m.dataset.avatarOverride) {
      dst.avatar ? setAvatar(m, dst.avatar) : sealAvatar(m, dst.color);
    }
  });
  const srcChip = document.querySelector(`.char-chip[data-chip="${CSS.escape(srcKey)}"]`);
  const dstChip = document.querySelector(`.char-chip[data-chip="${CSS.escape(dstKey)}"]`);
  if (dstChip) {
    const cnt = dstChip.querySelector('.chip-count');
    const add = srcChip ? (parseInt(srcChip.querySelector('.chip-count').textContent) || 0) : 0;
    cnt.textContent = (parseInt(cnt.textContent) || 0) + add;
  }
  if (srcChip) srcChip.remove();
  delete charMeta[srcKey];
  descChars.delete(srcKey); chatChars.delete(srcKey);
  document.body.dataset.chatchars = JSON.stringify([...chatChars]);
  applyDescChars();
  apply();
}

      nb.innerHTML = `<div class="avatar">${avatar}</div><div class="mbody">

document.addEventListener('contextmenu', e => {
  if (READER) return;
  const m = e.target.closest('.msg');
  if (!m) return;
  e.preventDefault(); closeMenu();
  menu = document.createElement('div'); menu.className = 'ctxmenu';
  const items = [];
  if (m.dataset.type === 'general') {
    items.push(['아바타 수정 (이 블록만)', () => openUploadModal('아바타 수정 (이 블록만)',
      d => { setAvatar(m, d); m.dataset.avatarOverride = '1'; },
      () => { sealAvatar(m, (charMeta[m.dataset.char] || {}).color || '#999'); m.dataset.avatarOverride = '1'; },
      collectRecentAvatars(m.dataset.char),
      m.dataset.avatarOverride ? () => revertBlockAvatar(m) : null)]);
    items.push(['핸드아웃 처리', () => {
      const name = m.dataset.char || '';
      /* 한 사람이 연속으로 쓴 블록을 이어붙이는데, 중간에 다른 사람의 사담이나
         other·사담·잡담 탭 블록이 하나 끼어있으면 거기서 바로 끊겨서 뒤쪽 블록이
         핸드아웃에 안 딸려왔다(실제 요청: "사담이 중간에 들어가도 핸드아웃은
         연속처리가 되어야해, 사담은 핸드아웃처리에 영향을 주면안돼") - 사담 블록만
         묶음에 넣지도, 거기서 멈추지도 않고 건너뛰고 계속 같은 화자를 찾는다.
         지문(desc 블록·지문출력 캐릭터)은 제외 대상이 아니다(실제 요청: "지문까지
         빼면 안돼 사담은 빼야해도") - 지문이나 진짜 다른 사람의 일반 대사, 이미
         만들어진 핸드아웃 카드를 만나면 그때 멈춘다 */
      const isSkippable = (el) => {
        if (!el || !el.classList || !el.classList.contains('msg')) return false;
        if (el.dataset.type !== 'general') return false;
        if (el.dataset.char === name) return false; // 본인 대사는 skip 대상이 아니라 그대로 묶임
        return chatChars.has(el.dataset.char) || /^(other|사담|잡담)$/i.test(el.dataset.tab || '');
      };
      const group = [m];
      let p = m.previousElementSibling;
      while (p && p.classList && p.classList.contains('msg')) {
        if (p.dataset.type === 'general' && p.dataset.char === name) { group.unshift(p); p = p.previousElementSibling; }
        else if (isSkippable(p)) { p = p.previousElementSibling; }
        else break;
      }
      let n = m.nextElementSibling;
      while (n && n.classList && n.classList.contains('msg')) {
        if (n.dataset.type === 'general' && n.dataset.char === name) { group.push(n); n = n.nextElementSibling; }
        else if (isSkippable(n)) { n = n.nextElementSibling; }
        else break;
      }
      const color = (charMeta[name] || {}).color || '#03a9f4';
      /* 해제 시 원래 블록 경계/탭/id를 정확히 되살리기 위해 <br> 조인과 별개로 원본을 구조화 저장 */
      const origBlocks = group.map(g => { const c = g.querySelector('.mcontent'); return { id: g.id || '', tab: g.dataset.tab || 'main', html: c ? c.innerHTML : '' }; });
      const contents = origBlocks.map(b => b.html).join('<br>');
      const div = document.createElement('div');
      div.className = 'msg handout';
      div.dataset.tab = 'info'; div.dataset.type = 'handout'; div.dataset.char = name;
      div.dataset.origBlocks = JSON.stringify(origBlocks);
      if (group[0].id) div.id = group[0].id;
      div.innerHTML = '<div class="hcard"><div class="hname" style="color:' + color + '">' + (window.__esc3 ? __esc3(name || '✦ 정보') : (name || '✦ 정보')) + '</div><div class="mcontent">' + contents + '</div></div>';
      group[0].parentNode.insertBefore(div, group[0]);
      group.forEach(g => g.remove());
      /* 탭 칩(.tab-chip)은 페이지 로드 시점에 그때까지 있던 탭만 그려져서, 이 로그에
         핸드아웃이 하나도 없다가 지금 처음 만들면 info 칩이 없다 - 필터 로직(apply)은
         "칩이 있으면 그 체크된 것만" 방식이라, 칩 자체가 없는 탭은 항상 안 보이게
         걸러졌다(실제 겪은 버그: "info 탭을 아예 안 썼으면 로그가 사라진다") */
      var tbEl = document.querySelector('.tabbar');
      if (tbEl && !tbEl.querySelector('.tab-chip input[data-tab="info"]')) {
        var infoChip = document.createElement('label');
        infoChip.className = 'tab-chip';
        infoChip.innerHTML = '<input type="checkbox" checked data-tab="info">' +
          '<span class="tab-name">info</span><span class="chip-count">1</span>' +
          '<span class="tab-x" title="이 탭 데이터 완전 삭제">×</span>';
        tbEl.appendChild(infoChip);
      }
      /* 캐릭터바는 로드 시점에만 계산돼서, 이 캐릭터의 남은 블록이 전부 핸드아웃이 돼도
         목록에서 안 사라졌다(실제 겪은 버그: "핸드아웃처리해도 캐릭터리스트에서
         안사라지는데") - 새로고침 없이 즉시 다시 계산한다 */
      if (typeof syncCharsAfterEdit === 'function') syncCharsAfterEdit();
      else if (typeof apply === 'function') apply();
      if (window.__critStaticSave) window.__critStaticSave();
    }]);
  } else if (m.dataset.type === 'handout') {
    /* 핸드아웃 명의는 캐릭터리스트에서 빠지는 게 정상이라(정보 전용 취급) 편집 칩의
       연필 아이콘으로는 색을 못 바꿨다(실제 요청: "핸드아웃은 우클릭으로 글씨색변경을
       할수있게해줘 hex값 입력창과 컬러피커 둘다") - 기존 캐릭터 편집 모달을 그대로
       재사용해 이미 있는 hex+컬러피커를 그대로 쓴다 */
    items.push(['캐릭터 편집 (글씨색 등)', () => {
      const name = m.dataset.char || '';
      if (!charMeta[name]) charMeta[name] = { display: name, color: '#03a9f4', avatar: null };
      if (!charMeta[name].color) charMeta[name].color = '#03a9f4';
      openCharModal(name);
    }]);
    items.push(['핸드아웃 해제', () => {
      const name = m.dataset.char || '';

      if (m.dataset.origBlocks) {
        try { blocks = JSON.parse(m.dataset.origBlocks); } catch (e) { blocks = null; }

        const hc = m.querySelector('.hcard .mcontent');

        blocks = html.split(/<br\s*\/?>/i).map((p, i) => ({ id: (i === 0 && m.id) ? m.id : '', tab: fallbackTab, html: p }));
      }
      const frag = document.createDocumentFragment();
      blocks.forEach(b => {
        const tab = b.tab || 'main';
        const avatar = meta && meta.avatar ? `<img src="${meta.avatar}">` : `<b style="background:${meta ? meta.color : '#999'}"></b>`;
        const ctab = tab !== 'main' ? `<span class="ctab">${tab}</span>` : '';
        const nb = document.createElement('div');
        nb.className = 'msg general';
        nb.dataset.type = 'general';
        nb.dataset.char = name;
        nb.dataset.tab = tab;
        if (tab !== 'main' && tab !== 'info') nb.classList.add('subtab');
        if (b.id) nb.id = b.id;
        nb.innerHTML = `<div class="avatar">${avatar}</div><div class="mbody">
          <div class="mhead"><span class="by" style="color:${meta ? meta.color : '#999'}">${meta ? meta.display : name}</span>${ctab}</div>
          <div class="mcontent">${b.html}</div></div>`;
        frag.appendChild(nb);
      });
      m.parentNode.insertBefore(frag, m);
      m.remove();
      /* 캐릭터바는 로드 시점에만 계산돼서, 이 핸드아웃이 유일한 흔적이었던 캐릭터가
         되살아나도 목록에 바로 안 나타났다(실제 겪은 버그: "핸드아웃 해제시
         캐릭터리스트로 바로 돌아오는게 안되고있어") - 새로고침(깜빡임) 없이 즉시
         다시 계산한다 */
      if (typeof syncCharsAfterEdit === 'function') syncCharsAfterEdit();
      else if (typeof serialize === 'function') serialize();
      if (window.__critStaticSave) window.__critStaticSave();
    }]);
  }
  items.push(['내용 수정', () => {
    const c = m.querySelector('.mcontent');
    c.contentEditable = true; c.focus();
    c.addEventListener('blur', () => { if (!document.body.classList.contains('editing')) c.contentEditable = false; }, { once: true });
  }]);
  items.push(['태그 수정 (고급)', () => openTagModal(m)]);

  for (const it of items) {

    if (cls) b.classList.add(cls);

/* ── 지문출력 캐릭터 / 사담 캐릭터 ── */
let descChars = new Set(
  [...document.querySelectorAll('#log .msg.as-desc')].map(m => m.dataset.char).filter(Boolean));
let chatChars = new Set(JSON.parse(document.body.dataset.chatchars || '[]'));

function critEsc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function refreshChipVisibility() {
  /* 지문출력/사담으로 지정된 캐릭터는 개별 칩이 아니라 "지문"/"사담" 통합 칩 하나로 합쳐서 보여준다.
     지정이 바뀔 때마다 캐릭터바를 통째로 다시 그리고, 재생성 전의 체크 상태는 최대한 그대로
     유지한다 - 그래야 다른 캐릭터를 토글해둔 상태가 지문/사담 지정을 바꿀 때마다 초기화되지 않는다 */
  const cb = document.getElementById('charbar');
  if (!cb) return;
  const meta = window.CRIT_CHARMETA || {};
  const infoOnly = window.CRIT_INFO_ONLY || {};
  const order = window.__critOrder || [];
  const charCnt = window.__critCharCnt || {};
  const prevState = {};
  cb.querySelectorAll('input[data-char]').forEach(c => { prevState[c.dataset.char] = c.checked; });
  const PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  function mergedChip(dc, label, keys) {
    if (!keys.length) return '';
    const cnt = keys.reduce((s, k) => s + (charCnt[k] || 0), 0);
    const on = (dc in prevState) ? prevState[dc] : true;
    return '<label class="char-chip merged" data-chip="' + dc + '">' +
      '<input type="checkbox"' + (on ? ' checked' : '') + ' data-char="' + dc + '">' +
      '<span class="chip-name">' + label + '</span>' +
      '<span class="chip-count">' + cnt + '</span></label>';
  }
  const listOrder = order.filter(k => !infoOnly[k] && !descChars.has(k) && !chatChars.has(k));
  cb.innerHTML = mergedChip('__desc__', '지문', [...descChars]) + mergedChip('__chat__', '사담', [...chatChars].filter(k => !descChars.has(k))) +
    listOrder.map(k => {
      const m2 = meta[k] || { color: '#9a95a0' };
      const avh = m2.avatar
        ? '<img src="' + critEsc(m2.avatar) + '" onerror="this.replaceWith(avFallback(&quot;' + critEsc(m2.color) + '&quot;))">'
        : '<b style="background:' + critEsc(m2.color) + '"></b>';
      const on = (k in prevState) ? prevState[k] : true;
      return '<label class="char-chip" data-chip="' + critEsc(k) + '" style="--cc:' + critEsc(m2.color) + '">' +
        '<input type="checkbox"' + (on ? ' checked' : '') + ' data-char="' + critEsc(k) + '">' +
        '<span class="chip-avatar">' + avh + '</span>' +
        '<span class="chip-name" style="color:' + critEsc(m2.color) + '">' + critEsc(m2.display || k) + '</span>' +
        '<span class="chip-count">' + (charCnt[k] || 0) + '</span>' +
        '<span class="chip-edit" title="캐릭터 편집" data-edit="' + critEsc(k) + '">' + PEN + '</span></label>';
    }).join('\n');
  if (typeof apply === 'function') apply();
  if (typeof updateExpandBtn === 'function') updateExpandBtn();
}
/* 핸드아웃 처리/해제·탭 완전 삭제처럼 캐릭터의 "info 탭에만 있는지" 여부가 바뀌는
   편집 뒤에 새로고침 없이 캐릭터바를 즉시 맞게 다시 그린다. refreshChipVisibility()는
   window.__critOrder/__critCharCnt/CRIT_INFO_ONLY 같은 로드 시점 스냅샷을 읽기만
   하므로, 그 스냅샷 자체를 지금 DOM 기준으로 다시 계산해 채워 넣은 뒤에 불러야 한다.
   처음엔 window.CRIT_IMPORT_DATA.blocks(=serialize가 구운 결과)를 기준으로 다시
   계산했는데, serialize()는 "crit-ccf-proto-persist" IIFE 안에 갇힌 지역 함수라
   여기서 typeof로 찔러봐도 항상 undefined라 실제로는 아무것도 안 굽고 있었다 -
   그래서 방금 한 편집이 아니라 그 전에 MutationObserver 디바운스(500ms)로 이미
   구워져 있던 "한 틱 전" 상태를 읽어서, 지금 막 한 조작은 다음 조작 때야 반영되는
   것처럼 보였다(실제 겪은 버그: "한틱씩 느리게 반영되는 버그"). data.blocks를
   거치지 않고 지금 이 순간의 실제 DOM(#log .msg[data-char])을 직접 훑는다 */
function syncCharsAfterEdit() {
  var order = [], charCnt = {}, nonInfo = {};
  document.querySelectorAll('#log .msg[data-char]').forEach(function (m) {
    var k = m.dataset.char;
    if (!k) return;
    if (!charMeta[k]) charMeta[k] = { display: k, color: null, avatar: null };
    if (order.indexOf(k) === -1) order.push(k);
    charCnt[k] = (charCnt[k] || 0) + 1;
    if (m.dataset.tab !== 'info') nonInfo[k] = 1;
  });
  var infoOnly = {};
  order.forEach(function (k) { if (!nonInfo[k]) infoOnly[k] = 1; });
  window.CRIT_INFO_ONLY = infoOnly;
  window.__critOrder = order;
  window.__critCharCnt = charCnt;
  refreshChipVisibility();
}
function applyDescChars() {
  document.querySelectorAll('#log .msg.general').forEach(m => {
    m.classList.toggle('as-desc', descChars.has(m.dataset.char));
  });

}
