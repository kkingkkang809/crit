<!DOCTYPE html>
<html lang="ko" style="--accent:#B26A9E"><head><!-- crit-preview-early: 리더 모드를 첫 페인트 전에 적용해 수정 UI가 깜빡이지 않게 --><script>try{if((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview")))document.documentElement.classList.add("crit-preview")}catch(e){}</script><style>html.crit-preview .stats,html.crit-preview .bartitle,html.crit-preview .tabbar,html.crit-preview .charbar,html.crit-preview #pwbtn,html.crit-preview .chip-edit,html.crit-preview .allbtn,html.crit-preview #sessbtn,html.crit-preview #editbtn,html.crit-preview #savebtn,html.crit-preview #descbtn,html.crit-preview #chatbtn,html.crit-preview #msgrbtn{display:none!important}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[0625] CREA GRRR! -0-</title>
<style>
  :root {
    --accent:#B26A9E;
    --rt1:#6b5a8e; --rt2:#8e5a7d;
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  /* 테마 연동 커스텀 스크롤바 */
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent) 62%, var(--line)); }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  header.hero { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:14px; }
  /* 블로그에 붙여넣으면 블로그 테마 자체의 h1/본문 CSS가 우리 값보다 우선순위가 높아서
     타이틀·개요 글씨가 훨씬 커 보였다(실제 피드백) - !important로 블로그 CSS에 안 밀리게 고정 */
  .hero h1 { margin:0 0 4px; font-size:17px !important; letter-spacing:-.5px; }
  .hero .sub { color:var(--dim); font-size:13px !important; }
  /* 세션 정보 */
  .t-writer { display:inline-flex; align-items:center; vertical-align:middle; color:var(--dim);
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:600; margin-left:6px; }
  .s-players { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pbadge { background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:600; }
  .pbadge-gm { background:color-mix(in srgb, var(--accent) 26%, var(--panel2));
    border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .s-overview { color:var(--desc); font-size:12.5px !important; line-height:1.7; margin:0 0 4px;
    border-left:3px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    padding-left:12px; white-space:pre-line; }
  #s-writer:empty, #s-subtitle:empty, .s-overview:empty, .s-players:empty { display:none; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--dim); }
  .stats b { color:var(--text); font-weight:600; }
  .bartitle { font-size:11.5px; color:var(--dim); margin:14px 0 8px; font-weight:600;
    display:flex; align-items:center; gap:7px; }
  .allbtn { font-size:10.5px; padding:1px 9px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; font-family:inherit; line-height:1.5; }
  .allbtn:hover { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .charbar, .tabbar { display:flex; gap:8px; flex-wrap:wrap; }
  .tab-chip { display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:3px 10px; cursor:pointer; user-select:none; font-size:12.5px;
    position:relative; padding-right:20px; }
  .tab-chip:has(input:not(:checked)) { opacity:.35; }
  .tab-chip input { display:none; }
  /* crit-tab-x: 탭 칩 우측의 작은 삭제 아이콘 - head 쪽 기본 스타일에 같이 둬야 한다.
     body 안쪽 저 아래에 따로 있으면, 이 문서가 워낙 커서 브라우저가 그 지점까지 파싱하기 전엔
     패딩/숨김이 적용 안 된 상태로 먼저 그려졌다가 뒤늦게 적용되며 탭 정렬이 움찔거렸다. */
  .tab-chip .tab-x { position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; border-radius: 50%; display: none; align-items: center; justify-content: center;
    color: var(--dim); cursor: pointer; }
  .tab-chip:hover .tab-x { display: flex; }
  .tab-chip .tab-x:hover { color: #e08b8b; background: color-mix(in srgb, #e08b8b 18%, transparent); }
  .tab-name { font-weight:600; }
  .charbar.collapsed { max-height:104px; overflow:hidden; }
  .charbar { align-content:flex-start; }
  .expandbtn { display:none; width:100%; margin-top:6px; padding:2px 0; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; color:var(--dim); cursor:pointer;
    align-items:center; justify-content:center; }
  .expandbtn:hover { color:var(--text); border-color:var(--accent); }
  .expandbtn.open svg { transform:rotate(180deg); }
  .char-chip { display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:3px 8px 3px 4px; cursor:pointer; user-select:none; transition:.15s;
    border-color: color-mix(in srgb, var(--cc) 45%, var(--line)); }
  .char-chip:has(input:not(:checked)) { opacity:.35; }
  .char-chip input { display:none; }
  .avatar img, .avatar b { width:30px; height:30px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-avatar { display:flex; align-items:center; }
  .chip-avatar img, .chip-avatar b { width:22px; height:22px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-name { font-size:13px; font-weight:600; line-height:1; }
  .chip-count { font-size:11px; color:var(--dim); line-height:1; }
  /* 지문/사담 통합 칩: 아바타가 없어 기본 padding(왼쪽 4px)이 그대로면 글자가 테두리에 붙어보인다 */
  .char-chip.merged { border-style:dashed; padding:3px 10px; }
  .char-chip.merged .chip-name { color:var(--accent); }
  .chip-edit { display:flex; align-items:center; justify-content:center; color:var(--dim); padding:3px; border-radius:6px; }
  .chip-edit svg { width:14px; height:14px; }
  .chip-edit:hover { color:var(--text); background:var(--line); }
  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .toolbar input[type=search] { flex:1; min-width:120px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .spanel hr { border:none; border-top:1px solid var(--line); margin:10px 0; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }

  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:hover, input[type=radio]:hover {
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  .mrow button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .mrow button:hover { background:color-mix(in srgb, var(--accent) 26%, var(--panel2)); }

  .msg { display:flex; gap:10px; padding:7px 10px; border-radius:10px; }
  .msg + .msg { margin-top:2px; }
  .msg .avatar { flex:0 0 30px; padding-top:2px; }
  .msg .mbody { flex:1; min-width:0; }
  .mhead { display:flex; align-items:baseline; gap:8px; }
  .mhead .by { font-weight:700; font-size:13.5px; }
  .mhead .ctab { font-size:10.5px; color:var(--dim); opacity:.7; }
  .mcontent { font-size:14.5px; overflow-wrap:break-word; }
  .mcontent img { max-width:100%; border-radius:8px; }
  .msg.desc { justify-content:center; text-align:center; color:var(--desc); font-style:italic; padding:10px 34px; }
  .msg.desc .mcontent { font-size:14px; }
  .msg.general { background:var(--panel); border:1px solid transparent; }
  .msg.general:hover { border-color:var(--line); }
  /* 메신저 스타일: 대사 블록을 메신저 말풍선처럼 - 상대는 왼쪽, 내 캐릭터는 오른쪽으로
     쏠린 좁은 블록(74%)으로 줄이고, 내 캐릭터는 이름·시각까지 오른쪽 정렬 (판정 표 블록 제외) */
  body.msgr .msg.general:not(.roll) { max-width:74%; margin-right:auto; }
  body.msgr .msg.general.mine:not(.roll) { flex-direction:row-reverse; margin-right:0; margin-left:auto; }
  body.msgr .msg.general.mine:not(.roll) .mbody { text-align:right; }
  body.msgr .msg.general.mine:not(.roll) .mhead { justify-content:flex-end; }
  /* 연속 대사: 이름 한 번만, 블록 연결 */
  .msg.general.cont { margin-top:0; border-top-left-radius:0; border-top-right-radius:0; padding-top:0; }
  .msg.general:has(+ .msg.general.cont) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .msg.general.cont .mhead { display:none; }
  .msg.general.cont .avatar img, .msg.general.cont .avatar b { display:none; }
  .msg.general.roll { background:color-mix(in srgb, var(--accent) 9%, var(--panel));
    border-left:3px solid color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .msg.general.roll .mcontent { font-family:Consolas,"D2Coding",monospace; font-size:13px; }
  /* CC 판정 → Roll20 coc-1 스타일 표 */
  .msg.general.roll.cc .mcontent { font-family:inherit; font-size:14.5px; }
  .inlinerollresult { background:color-mix(in srgb, var(--accent) 24%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); border-radius:4px;
    padding:0 5px; font-weight:700; font-size:13px; }
  /* 아바타 열(30px+간격 10px)만큼 중심 보정 → 페이지 가운데와 열 일치 */
  .msg.general .ccroll { transform:translateX(-20px); }
  .ccroll { border-collapse:collapse; margin:6px auto; min-width:230px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .ccroll caption { background:linear-gradient(135deg, var(--rt1), var(--rt2)); color:#fff;
    font-weight:700; font-size:13px; padding:5px 10px; caption-side:top; border-radius:8px 8px 0 0; }
  .ccroll td { padding:4px 10px; font-size:13px; border-top:1px solid var(--line); }
  .sheet-template_label { color:var(--dim); }
  .ccroll .resrow { background:#bebebe; }
  .ccroll .resrow .sheet-template_label { color:#4a4a4a; }
  .ccroll .rr { font-size:13px; }
  .ccroll .rr-extreme, .ccroll .rr-crit { background:#cfe3cd; color:#3f6b42; }
  .ccroll .rr-hard { background:#2e7d32; color:#fff; }
  .ccroll .rr-normal { background:#1b5e20; color:#fff; }
  .ccroll .rr-fail { background:#a84848; color:#fff; }
  .ccroll .rr-fumble { background:#6e2323; color:#fff; }
  .ccroll .rr-etc { background:#8a8a8a; color:#fff; }

  /* 지문출력 캐릭터: 해당 캐릭터의 발화를 Roll20 서술처럼 가운데 지문으로 표시 */
  .msg.general.as-desc:not(.roll) { background:transparent; border-color:transparent;
    justify-content:center; text-align:center; font-style:italic; padding:10px 34px; }
  .msg.general.as-desc:not(.roll) .avatar, .msg.general.as-desc:not(.roll) .mhead { display:none; }
  .msg.general.as-desc:not(.roll) .mcontent { color:var(--desc); font-size:14px; }
  /* info 탭: 핸드아웃 카드 */
  .msg.handout { justify-content:center; padding:14px 34px; }
  .hcard { background:var(--panel); border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:14px; padding:18px 24px; max-width:560px; width:100%; text-align:center;
    box-shadow:0 4px 18px color-mix(in srgb, var(--accent) 12%, transparent); }
  .hcard .hname { font-size:16px; font-weight:700; margin-bottom:10px; padding-bottom:10px;
    border-bottom:1px solid var(--line); }
  .hcard .mcontent { font-size:14px; line-height:1.75; }

  /* main/info 외 탭(사담·귓속말 등)은 흐리게 — 메인 진행과 구분 */
  .msg.subtab { opacity:.55; }
  .msg.subtab:hover { opacity:1; }
  .dclist { max-height:300px; overflow:auto; display:flex; flex-direction:column; gap:7px; margin:4px 0 2px; }
  .dclist label { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; }
  .dclist .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  footer { margin-top:28px; color:var(--dim); font-size:12px; text-align:center; }
  .editing .mcontent, .mcontent[contenteditable="true"] { outline:1px dashed #C98A5B55; border-radius:6px; }
  .editing #log .msg .avatar { cursor:pointer; }
  .editing #log .msg .avatar:hover img, .editing #log .msg .avatar:hover b { outline:2px solid var(--accent); }
  .hide { display:none !important; }
  .ctxmenu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; min-width:170px; box-shadow:0 10px 30px #000a; }
  .ctxmenu button { display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:13px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; }
  .ctxmenu button:hover { background:color-mix(in srgb, var(--accent) 22%, var(--panel2)); }
  .ctxmenu button.danger { color:#e08a8a; }
  .ctxmenu .sep { border-top:1px solid var(--line); margin:4px 6px; }
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:300px; max-height:82vh; overflow-y:auto; }
  .modal.wide { width:min(92vw, 560px); }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal textarea { width:100%; min-height:190px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; line-height:1.5;
    font-family:Consolas,"D2Coding",monospace; resize:vertical; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:30px 12px;
    text-align:center; color:var(--dim); font-size:13px; cursor:pointer; transition:.15s; }
  .dropzone.over { border-color:var(--accent); color:var(--text);
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow.opts { justify-content:flex-start; gap:22px; }
  .mrow label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .iconbtn.on { color:var(--accent); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .pwwrap { position:relative; }
  .pwwrap input { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:7px 36px 7px 10px; font-size:13px; font-family:inherit; }
  .eyebtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--dim); cursor:pointer; padding:4px; display:flex; }
  .eyebtn:hover { color:var(--text); }
  .mrow input[type=text] { flex:1; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; }
  .mrow input[type=color] { width:36px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }

p":"-","ts":null,"tab":"main","html":"\n    이미 끝나버린 이야기의 다음이 궁금해지는 이유는 뭘까. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    종장의 다음 장을 넘기는 손길에 후회는 없다면. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 탐사자는 강한 충격과 함께 눈을 뜹니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오른쪽 다리의 강렬한 통증이 뇌를 뒤흔듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아니, 아픈 건 둘째치고, 귀가 찢어질 듯한 소리와 진동에 잠이 완전히 달아났습니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자세히 보니 허벅지에 총알이 스쳐 피가 흐르고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지혈하고 내버려두면 알아서 회복되겠지만 일단 일시적으로 HP -1D4 후 진행합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다이스 굴려주세요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    1d4 (1D4) ＞ 3\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    HP 3 감소. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 체력 : 16 → 13 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이어서 이성 판정 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>이성</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">35</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-hard\"><b>어려운 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이성 판정 성공 시, 빠르게 진정하고 상황을 정리합니다. 어디서 날아온 총알이지? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 마침... 며칠 연속으로 외곽에 몰려드는 크리쳐를 사냥하고 수면 부족에 시달리던 참입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    식사할 시간도 없어 먹은 음식이라고는 초코바 몇 개와 뒤집어쓴 크리쳐의 체액 뿐입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    노동법이 뭔가요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아무래도 크리쳐 군인의 권리는 보호 받기 힘든 편이죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이러한 피로와 총의 상태, 그리고 상처를 보니 아무래도 불침번을 서는 도중 잠든 모양입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그것도 안전 장치가 해제된 총에 몸을 기댄 채로.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    몇 초 지나지 않아, 기대고 앉은 텐트가 몇 번 꾸물거리더니 지퍼가 열리는 소리와 함께 낯익은 머리가 튀어나옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잠이 덜 깬 KPC가 목만 쑥 내놓고 이쪽을 봅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    머쓱한 상황에 눈과 눈이 마주친 채 잠깐의 정적. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    부스스한 머리 아래 덮인 자다 깬 얼굴은... 보자. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 어디설명해봐라 이거꿈인가 아이졸려 (choice 어디설명해봐라 이거꿈인가 아이졸려) ＞ 아이졸려\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여전히 잠이 덜 깬 것 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ...이러는 동안에도 하얀 눈밭 위로 붉은 웅덩이가 지고 있습니다.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... (변명할 거리가 없다. 하필이면 새하얀 눈밭에 퍼지고 있는 붉은 빛이니 급히 눈으로 덮어 가린대도 금세 녹아 번지기만 할 것이었다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    잠은 잘 잤나? (잠이 덜 깬 티가 나는 얼굴로 손을 뻗어 뺨 언저리를 툭, 건드렸다. 허벅지가 얼얼하지만 최대한 아무렇지 않은 척을 하면서...) 죽은 듯이 자길래 확인하려고 이벤트 좀 해봤어. (당연히 거짓말이다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (마침, 차례에 맞춰 잠을 잘 수 있는 시간이 보장된 때였습니다. 마음 놓고 자서 그런지 여즉 잠에서 깨지 못한 게 티가 나는 얼굴이군요... 시끄러운 총성에 눈은 떴어도 아직은 따뜻한 텐트 안이 좋은 듯.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... (눈 깜빡, 깜빡, 하면서 주변 둘러봅니다. 뺨에 닿은 손가락에 앓는 소리 한 번 내기도 잠시...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...저기, 세피르 씨? 제가 자, 잘못 보는 게 아니라면, 그러니까... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    스스로 다리를 쏘신 것 같은, (이 쯤까지 말하고 잠이 깼습니다. 눈 동그랗게 뜨고 이게 무슨 상황이지? 하는 경악에 물든 얼굴.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아...~ 피를 너무 많이 흘려서 속이 메스꺼워... (그러지 않아도 추운 바람을 쐬고 있었으니 차가운 피부가 위태로운 상황을 극대화 시켰다. 물론 연기고, 거짓말이었지만... 자연스럽게 텐트 쪽으로 바짝 붙어 안으로 고개만 슥 밀어넣는다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (동그랗게 눈만 뜬 채로, 어어, 어어어, 하며 당신 다가오는 것 봅니다. 그 탓일까요, 반응이 한 박자 정도 늦어져 버렸습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    가, 가, 갑자기 그렇게 다가오면 노, 놀라거든요...?! (소심하게 입 삐죽이다가, 텐트의 입구를 마저 엽니다. 들어오라는 손짓도 함께입니다.) 사, 상태 봐 드릴게요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (뻣뻣해진 몸을 끌고 안으로 기어들어간다. 상반신만 겨우 안에 밀어넣은 채로 널 바라본다. 극심한 출혈도 아니라 상태가 위중한 것은 아니었으나, 잠에서 깨어난지 얼마 되지 않아 당혹스러워 하는 파트너를 놀리고 싶었다.) 선생님... 제 상태는 심각한가요.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 속아주자 안속아!! (choice 속아주자 안속아!!) ＞ 속아주자\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (ㅋㅋ) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (헉, 지금 혼자 들어오지도 못 할 만큼 아프신 걸까...?) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그, 그, 그러게 누가 크리쳐용 살상탄 같은 걸 자, 자기한테 쏘냐구요...!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어쩐지 눈썹이 아래로 쳐져서는, 당신 잡고 끙... 텐트 안으로 집어넣어 주겠답시고 용 썼습니다.) 빠, 빨리 들어와요... 밖에 춥잖아요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    응~ 밖에 그대로 있다가 눈으로 만든 조각상 같은 거라도 되는 줄 알았어. (들어오라는 말이 입술에서 흘러나오자 기다렸다는 듯이 텐트 안으로 쏙, 다리까지 집어넣었다. 비좁은 공간이기는 하지만 두 사람이 있기 힘든 정도는 아니었다. 추위로 굳어져 있던 몸이 녹아, 이완되기 시작하니 되려 통증이 살아나는 것 같았다.) 쓰읍... ...  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (당신이 텐트 속으로 들어오면, 입구를 닫습니다. 그러곤 잠깐 바닥 더듬거리다가... 찾았다! 구급 상자 가지고 당신에게로 다가가네요.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    히익, (눈이 잠깐 동그래졌다가,) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 등때림 울상 (choice 등때림 울상) ＞ 울상\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (울상.......) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 정말 당신, 바보에요?! (괜히 속상합니다. 입 삐죽이다 소리 지르곤 소독약부터 찾습니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이게 다 제대로 안 재워준 탓이야... 졸지만 않았어도... (눈 반즈음 감은 채로 꿍얼거리며 되도 않는 변명을 늘어놓는다. 소독약을 찾고 있느라 부스럭거리는 소리를 들으며 잠깐... ...어떤 작은 동물을 떠올렸다...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (아휴. 뭐 그런 한숨 소리가 난 것도 같았습니다. 소독약을 찾아서는 거즈에 묻혀서 우선은 닦아내고...) 과, 과, 관통상 수준이잖아요!! (당신이 크리쳐가 아니었으면 정말 꼼짝없이 죽었다구요. 하는 목소리가 뒤따릅니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하여튼, 당신의 아픔은 신경도 쓰지 않고 (소독약의 따끔함은 좀 버틸 만 한가요?) 이어지는 응급처치 속에서 잠시 듣기 판정입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>듣기</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">84</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    으아악... (괜히 아픈 척 하겠답시고 엄살 부리며 신음하는 탓에 텐트 밖에서 들려오는 소리는 듣지 못했다...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇다면... 텐트 안에서 들려오는 소리는 잘 들었겠군요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    비치되어 있던 작은 노트북에서 띠롱, 하고 알림음이 울립니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 들었다 붕대찾느라바빴다 (choice 들었다 붕대찾느라바빴다) ＞ 붕대찾느라바빴다\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그래요. 응급처치가 먼저죠. 지혈에 여념이 없습니다. . .) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    확인해 줄 때까지 노트북이 띠롱거립니다... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    띠롱 또롱 띠로롱 띠로리롱. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    샬롯, 샬롯. (텐트 바닥에 꼼짝없이 누운 채로 네 팔을 가볍게 툭툭 건드렸다.) 노트북에 뭐... 왔나본데. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (손 뻗으면 닿을 거리여도 파트너 빤히 보기만 한다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    네, 네헷?! (붕대 꽉!! 당겨 묶어버립니다. 이것으로 대강의 처치는 완료, 이제 느긋하게 구급상자를 정리하면 됐겠습니다만...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (움찔!!!)(이거 일부러 그런 거 아냐? 같은 눈으로 가만히 바라보다가 천천히 몸 일으켜 앉는다...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이, 이 시간에요...? (갸웃, 고개 한 번 기우뚱하곤 노트북 뻗어와서 같이 볼 수 있을 법한 위치에 둡니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 사실조금일부러 단단한게좋죠ㅎㅎ (choice 사실조금일부러 단단한게좋죠ㅎㅎ) ＞ 사실조금일부러\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (우쭐!) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    보, 보면... 아. 상부에서 온 공문 같아요. (아무렇지 않은 척 공문 확인해봅니다. 물론 같이 보는 거죠.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    의아한 기분으로 화면을 보면 ‘승급전'이라는 세 글자와 눈이 마주칩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    핸드아웃 : 승급전 을 획득합니다. \n  "},{"y":"say","sp":"승급전","ts":null,"tab":"info","html":"\n    AOC에서 주기적으로 대원들의 능력치를 파악하고 점검하기 위해 주최하는 실전형 모의 전투. 모의 전투라고는 하지만 장소는 매번 바뀌며, 실제로 2인 1조로 크리쳐를 사냥하며 실적을 증명해야 하는 시험입니다. 매번 그 순위가 공개되며, 낮은 성적을 내면 전투 능력이 부족한 것으로 판단되어 퇴출될 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자 역시 익히 들어 알고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그도 그럴 게, 승급전은 KPC가 입사 직후, 일반 대원에서 단박에 최강의 인류라는 명예로운 호칭을 얻고 이 구역의 대표로 임명된 계기니까요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이렇듯 말단조차 이 모의 전투에서 능력을 증명하면 크게 인정받을 수 있을 정도로 권위 있는 시험입니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (공문 읽어보고...) 저어, 저희도 참가 대상이라서, 보내 주신 것 같아요? (크리쳐 파트너가 있는데, 형평성은 괜찮은 걸까 이거? 싶긴 합니다만.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이러면 당연히 가장 높은 곳을 노려야지, 이번에도. (옆으로 몸을 기울인 탓에 팔이 닿은 채로 화면을 들여다본다. 오만한 소리이기는 하나, 근거는 있는 자신감이었다. 평범한 인간 두 사람으로 이루어진 조보다는 훨씬 유리한 점이 많았으니까.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    앗, (이번에도, 라는 말에 눈 동그랗게 뜨고 쳐다봅니다.) 음, ...헤헤. (그렇죠, 이번에도 당연히 1위 해야죠. 조금 기분이 말랑하게 풀어진 것 같습니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저기, 세피르. 다친 다리는 좀 어때요? 움직일 수 있어요? (그게 큰 걱정인 듯...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아, 다리? (응급처치도 했으니 문제가 될 것은 하나도 없었다. 어쩌면 이미 아물었을 수도 있겠다.) ...음, 붕대가 조금 조이는 것 같기도 하고. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...워, 원래 지혈은 그 정도로는 조여야 되거든요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (치. 입술 삐죽입니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 쯤 해서... 관찰 판정 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>관찰력</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">47</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하필, 공문의 가장 마지막 부분이 눈에 들어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 소집일을 확인할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    …놀랍게도 소집은 오늘 오전 7시까지입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 현재 시각은 오전 5시 55분입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    텐트와 짐을 아무리 빨리 정리해도 5분, \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...?...?? (순간 잘못 본 줄 알고 눈을 가느다랗게 떴다. 눈을 비비고 다시 본다...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여기서부터 숙소까지 전속력으로 뛰어가야 시간 내로 도착할까 말까. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    심지어 소집에 응하지 않으면 탈영으로 간주해 무거운 처벌이 내려옵니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... (골치야, 하며 눈이 녹아 젖은 머리카락을 쓸어넘긴다. 부스럭대며 짐을 하나씩 챙기기 시작했다...) 샬롯, 이거 7시까지 도착 못하면 우리 탈영병 돼... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 같이봤다 못봤다 (choice 같이봤다 못봤다) ＞ 못봤다\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (실화야?) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    에, 무슨? (아직 소집 시간 따위 모르는 순수한 1년차. 일단 하라니 같이 짐은 정리합니다만, 영문도 모른 채로 눈이나 끔뻑입니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    …어쩐지 허벅지 상처가 쓰라려옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 도착한 시각은 소집 시간으로부터... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    1D10 분 전입니다. (1D10) ＞ 7\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 아슬아슬했다아... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    도착 직후, 탐사자의 건강 판정입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>건강</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">99</span>/<span class=\"inlinerollresult\">49</span>/<span class=\"inlinerollresult\">19</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">63</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    돌아오는 길에 총상이 완벽히 회복되고 잃었던 체력도 돌아옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    체력 전부 회복합니다. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 체력 : 13 → 16 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (걱정할 필요 없었잖아 역시) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    (걱정했던 KPC의 마음을 고려하라 고려하라) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 구역의 모든 대원들이 소집된 듯, 본부 내에는 제복을 입은 사람들이 곳곳에 보입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 들어선 순간 이목이 집중되는 건 분명 기분 탓은 아니겠죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    구역을 대표해 최전방에서 활동하는 것도 일종의 명예나 영광처럼 여겨지는 것 같으니까요.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그럼 조금쯤 풀려버린 머리 다시 정리해 틀어올립니다. 시선만 힐끔 올라 바라봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    업무 강도 높은 것까지도 명예의 무게로 쳐야 하나... (불만스런 중얼거림 작게 내뱉는다...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    뭐어, 명예란 그런 거니까요... 높은 자리에 있을 수록 일은 더 많아지는 게 맞는 거니까아. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (말끔하게 머리를 정리하고 나면, 산뜻한 표정으로 세피르 올려다봅니다.) 세피르, 잠깐만 기다리고 있을래요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이번 활동 보고를 올려야 해서... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아, 그래. 여기서 기다리고 있을 테니까 다녀와. (상태가 좋지 않은 것도 아니고, 걱정할 것 없다며 손 가볍게 흔들었다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (굳이 사고 치지 말라거나, 기물 파손은 참아달라거나 그런 말은 안 해도 되겠지? 싶습니다. 가볍게 고개만 한 번 꾸벅이고는 총총 소장실으로 향합니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 탐사자는 휴게실 자판기 앞에 덩그러니 남겨집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    의자가 넉넉하게 비어있어, 적당한 자리에 앉아 목이라도 축이며 기다릴 수 있을 것 같습니다...만. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    음료수라도 하나 뽑아 마실까요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    choice 돈있음ㅎㅎ 돈없음ㅜㅜ (choice 돈있음ㅎㅎ 돈없음ㅜㅜ) ＞ 돈있음ㅎㅎ\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오, 월급 받는 크리쳐인가 봅니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (크리쳐여도 돈 안 주고 일 시키면 고소감이야) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (땡그랑, 땡그랑, 동전 몇 개 밀어넣고 이온음료를 꾹.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러면 행운 판정해봅시다. (왜?) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>행운</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">40</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이온음료 멀쩡하게 나옵니당. . . \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하여튼... 음료를 마시거나, 쉬거나, 행동을 취하면 복도 너머에서 한 무리의 대원들이 걸어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    절도 있는 발걸음 소리는 익숙하지만, 전혀 처음 보는 얼굴입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    애초에 크리쳐 출신에 정식 입사 시험을 거치지 않아서 동기가 없는 탐사자가 아는 대원이 그리 많지는 않겠지만요.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가장 키가 큰 대원 하나가 이쪽을 보더니 성큼성큼 다가옵니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아! 실물로 뵙는 건 처음이네요. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    반갑습니다, 세피르 씨? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    오...~ 안녕하십니까. (당연하게도 누군지 모른다. 흘긋, 그의 외관을 천천히 훑어보다가...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    낯선 얼굴의 대원은 싹싹하게 웃으면서 말을 걸어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    심리학 판정이 가능합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>심리학</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">40</span>/<span class=\"inlinerollresult\">20</span>/<span class=\"inlinerollresult\">8</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">52</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (음, 자주 볼 사람 아닌 것 같고... 관심 없어서 파악 못 했다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뭐냐, 이 파란 놈은? 흥미 없습니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    제 이름은 콘라드입니다! 하하, 이것 참~ 우리 구역을 대표하는 인원이라 그런지 얼굴 한 번 보기가 이렇게 힘드네요! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    일을 두 분이 워낙 잘 해 주셔서 최전방까지 나갈 일은 잘 없는데요~ 그래도 크리쳐 몇몇은 잡아봤습니다! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아! 혹시 음료 더 필요 없으세요? 혼자만 드시고 있길래. 파트너 것도 필요하실 텐데요~ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그는 탐사자에게 음료를 한 캔 사주며 호의를 표합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    뭐, 그렇죠. 최전방에서 알아서 잘 끊어내주니 다른 분들은 그렇게까지 많은 수를 상대할 일은 거의 없겠지. (일단 호의에는 고개 가벼이 까딱이며 캔을 받아든다.)  \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    하하, 덕분이라고나 할까요? 뭐. 그래도 옛날에 샬롯이랑 파트너일 때까지는 나름 저도 지금보다는 현역이었습니다? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    샬롯이랑은 어떻게 손발이 좀 맞는 것 같으세요? 걔가 은근 덤벙대는 구석이 있어서~ (하하 웃습니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    오, 그러니까... 지금은 나한테 밀려서 파트너 뺏겼다는 소리인가? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    덤벙대는 구석이 없다고는 말 못하겠습니다만~ 손발은 잘 맞는 편입니다. 파트너라는 건 어차피 상호보완적인 관계 아닙니까~  \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    하하! 아, 이것 참 직설적이시네~ 뭐, 그렇게 말할 수도 있겠네요! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    뭐, 샬롯 걔 실력이야 파트너로 다닌 세월이 있으니 안다지만. 얼마나 놀랐는 줄 아세요? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    저번 승급전 때 걔 파트너로 같이 1위를 한 건 저였는데. 갑자기 처음 보는 대원이 구역 대표가 됐다고 해서 얼마나 놀랐는데요! (아, 의심한단 건 아니에요? 하고 포항항 또 웃습니다.) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    뭐, 이런 걸~... 낙하산? 이라고 하던가요? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아니, 아니아니, 전 잘 모르겠지만 말이죠! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그런 소문이 요즘 대원들 사이에서 돌고 있거든요! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    서얼마. 정말은 아니겠지만요? (하하!) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그, 뭐라더라... 낙하산이라고는 해도 실력이 뒤떨어지는 건 아니니 뒷말이 도는 건 전부... 그거 아닌가? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    열등감? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    서얼마, 낙하산으로 꽂힌 사람 실력 하나 못 꺾어서 구역 대표 자리도 못 차지 했다고 뒤에서 궁시렁 대는 사람들이 그렇게 많습니까? (그의 말투를 흉내내며 비아냥거린다...) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아이, 것 참~ 너무 딱딱하게 말하신다! (키득키득 웃습니다.) 그냥 웃자고! 웃자고 전해 드리는 얘기죠 뭐. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    뭐, 어쨌든 당신의 출신이니, 능력이니 하는 걸 아는 사람이 없는 건 사실이지만요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짜증나지만 그가 말하는 내용은 어느 정도 사실입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    실제로, 탐사자가 크리쳐 군인이라는 사실은 AOC내에서도 극소수만이 알고 있는 군사기밀이므로…. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만, 듣다보면 슬금슬금 속에서 짜증이 밀려올지도 모르겠습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    인간놈이 뭐라는 거냐… 이 몸은 크리쳐라고… \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    까진 아니더라도, 새벽까지 크리쳐를 잡고 왔는데 이런 소리를 듣고 싶진 않을 테니까요. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    우와. 그런데 그 초커는 뭔가요? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    AOC 규정 상 악세서리 종류는 징계 사유일 텐데~ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드는 탐사자의 목걸이형 폭탄을 보며 관심을 표합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    알아서 뭐할건데, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이게 리모콘으로 폭파시킬 수 있는 단두대라는 사실을……. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아, 이거요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    충분한 힘이 있으면 악세서리를 착용해도 징계 안 받을 수 있는 방법이 다 있는 겁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    적당히 탐사자의 간을 보며 살살 놀리던 콘라드는 손목 시계형 모니터를 힐끔 확인하곤 상쾌한 표정으로 웃습니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아, 윗분들께 사랑받는다는 건 어떤 기분이려나~ 궁금하기도 해라. (포항항항 웃곤 제 손목 툭툭 가리킵니다.) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    이번 승급전 대상이라 오신 거죠? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    방금 좌표 전송됐네요. 그럼, 조금 있다가 봅시다! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 말을 들은 탐사자 역시 손목을 확인할 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    뭔가 좀... 재수 없네... (꿍얼거리며 손목의 모니터 내려다본다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    모니터가 반짝이며 몇 가지 텍스트를 흘려 보내고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    텍스트는 타야 하는 헬기와 도착 장소로, 탐사자 역시 아는 곳입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    핸드아웃 : 시시포스 산을 공개합니다. \n  "},{"y":"say","sp":"시시포스 산","ts":null,"tab":"info","html":"\n    안전 구역 밖의 인근 산으로, 눈보라가 치면 조난 당하기 딱 좋습니다. 직접 올라간 적은 없지만, 밀려오는 크리쳐를 박멸하느라 근처에 간 경험은 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    크리쳐 퇴치는 군대가 동원되는 것보다 적은 인원의 최정예 부대가 투입되는 게 좋다는 건 모두가 아는 공공연한 사실이지만, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이런 지역은 지대가 넓고 험준해 크리쳐도 분산되어 있기 때문에 괜찮을 것입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다만, 평소보다 훨씬 위험하겠죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드가 사라지고 얼마 지나지 않아 보고를 끝낸 KPC가 돌아옵니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다-다녀왔습니다아. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왔어? (손목 톡톡, 가리키며 들어올린다.) 이번 승급전 무대는 시시포스 산이라더라, 봤어? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 네에. (그러면 표정 다시 평소의 조금은 맹해 보이는 얼굴 되어서 고개 끄덕입니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    승급전 인원들을 싣고 헬기가 뜬다나 봐요. 저희는 마지막 순번이라던데요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (준비 다 되셨나? 당신 주변 한 바퀴 빙그르르 돌아봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    뭐... 마지막으로 타면 내리는 건 제일 먼저겠네. (자신을 중심으로 한 바퀴 도는 움직임으로 눈으로 흘깃...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    샬롯도 준비 다 됐으면 갈까. 긴장되거나 그러는 건 아니지? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 저는 그래도 나름 경험자거든요... (눈 가늘게 뜨곤 바라봅니다. 흥, 하는 소리가 잠깐 들리긴 합니다만 이내 픽 웃습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저도 준비 다 됐어요. (헬기는 대기 중이래요. 하며 두 걸음 쯤 총총 먼저 갔다가 뒤돌아봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    경험자다, 이거지? 그럼 이전에는 누구랑 파트너로 들어갔나? (뒤따라가서 정수리를 가볍게 톡톡 건드린다. 이미 그 상대가 콘라드라는 건 알지만 일부러 묻는다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (톡톡, 손가락 머리에 닿으면 괜히 투덜거리는 것 같은 소리가 났습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이전에야 뭐, 그 때 파트너였던 분하고 같이 다녔죠. (그 때도 세피르 씨 같은... 아니다. 다른 느낌이었나...? 그런 혼잣말이나 합니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그때도 샬롯은 여전히 덤벙거렸고? (보폭 맞추어 헬기가 대기 중인 곳을 향해 걷는다. '세피르 씨 같은'이라는 말이 들려오자 눈썹을 까딱 들어올린다. 내가? 그 사람이랑?)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    더, 덤벙거렸다뇨...!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 좀기죽음... 투덜투덜 (choice 좀기죽음... 투덜투덜) ＞ 좀기죽음...\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...아, 아직 그렇게 보여요...? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (기 죽었습니다... 머리카락이나 손가락으로 꼬다가, 후드 조금 끌어올려 코 끝까지 푹 파묻어 버립니다. 분명히 입이 또 삐죽 튀어나왔을 겁니다...) 저, 그. 그렇게까지 맹하진 않거든요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    삐졌어? (옷 안으로 점점 파고들어 얼굴을 가리는 것을 보고는 허리를 숙여 눈을 맞추려 했다. 기웃거리던 것을 그만두나 싶더니 네 머리 위에 턱 얹은 채로 작게 소리 내어 웃는다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    뭐, 지금은 제법 든든하지. 오늘도 자다 깨서 내 상처 치료 해주고... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    삐졌긴요, (꺅! 머리 위로 당신이 툭, 닿으면 그만 소리를 내고 말았습니다.) 이, 이, 이렇게 막 접촉하시고 그러면 아, 안 된다고 그랬잖아요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 다, 당신 지금 저 놀리는 거죠?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아니, 놀리는 거 아니고... 이 정도면 파트너를 귀여워하는 수준 아닌가?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 반응이 뭐... 사그러들지도 않고, 가면 갈수록 목소리가 더 커집니다.) 귀, 귀, 귀여워해요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...마, 말 걸지 마세요...! (휙, 먼저 성큼성큼 가 버립니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어어, 파트너를 막 유기하네. 다른 사람한테 가버린다? (물론 안 되는 일이다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 가세욧 ㅜㅜ?! (choice 가세욧 ㅜㅜ?!) ＞ 가세욧\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    가, 가, 가 보시던가요?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    좋아보이는 AOC 소속 사람 하나 있으면 소개 시켜줘. 파트너 바꿔달라고 하게~ \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (울상...) 몰라요!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흥... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    소장님한테 찾아가서 저, 파트너 못 하겠다고 말씀드릴 거에요. (진짜로는 안 그럴 겁니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어, 그렇게 파트너 못 하겠다고 하고 전남친한테 돌아가려고?  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (콘라드 이야기다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    전남친이요?! (깜짝! 놀랐습니다. 아니, 사실 느낌표 두 개여야 할 정도네요. 있어본 적도 없는 남자친구라니!!) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 저 그런 관계였던 사람 없어요!! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어라, 이상하다.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아까 자판기 앞에서... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아, 맞아, 이것도 너 주라고 그랬었지. (품 안에 넣어놨던 캔 음료 꺼내서 이제서야 건네준다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    무슨, 무슨 이상한 말을 듣고 온 거에요?! (으아앙... 울상이 되어서는 이 억울한 마음 풀 방법이 없어 당신 팔이나 약하게 툭팍팍 때립니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러다가 음료수 받는데...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 팥사과사이다 포카리스웨트 코코아 (choice 팥사과사이다 포카리스웨트 코코아) ＞ 코코아\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (와중에 좋아하는 거라 또 심란해집니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    대체 누굴 만나고 온 건데요오... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    말 했잖아? 샬롯의 전남자친구라고~ (맞았던 자리 손바닥으로 감싸 문지른다...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어떤 파란, 아니, 청록? 하여튼 마스크 쓰고 흉터가 있는 남자. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러니까, 남자친구 같은 거 없었다니까요...! (손 위로도 톡톡 때립니다. 억울함의 표출인 겁니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    파란데다, 흉터가 있는 남자? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...콘라드 신? (고개 갸웃, 그러곤 아, 그러면 코코아를 준 게 이해가 되긴 합니다. 뭘 좋아하는지 정도는 아니까... 아니, 그런데!!) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    콘라드가 그래요?! 자기가 제 전 남자친구라고?! (진짜 억울해보입니다!!) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어~ 그러던데? (전남자친구라는 말은 한 마디도 안 했지만 그렇게까지 신경 쓰고 세세한 걸 기억하고 있는 거라면 대충 그런 관계겠거니 어림짐작 했다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 이제 뭐... 아주 울상이 되어 가지고는 고개 젓습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저희 완전 비즈니스였거든요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흥. 혼자 뒀더니 이상한 헛소문이나 듣고, 막 날조도 하고. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    몰라요. 미워요. 옆에서 따라오지 마세요. (하고, 척척 먼저 걸어가버립니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그럼 뒤에서 따라가는 건 된다는 소리지? (토라진 뒷모습 바라보며 한 걸음 떨어져서 졸졸 쫓아간다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (아니, 애초에 그쪽에서 이상한 오해 할만하게 이야기를 했단 말이야.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (생각하다보니까 이쪽도 조금 꽁해짐) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...말이나 못 하면!! (어쩐지 군화 굽 소리에 조금 더 감정이 실립니다. 콩, 콩, 바닥을 밟는 소리가 조금 더 격해진 것도 같습니다...) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어떻든 간에 승급전은 닥쳐옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 헬기에 몸을 실으면 두 사람을 태운 기체는 저 너머의 산맥을 향해 힘차게 날아오릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    헬기 안에서 장비를 점검하던 KPC가... 음. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 말한다 흥... (choice 말한다 흥...) ＞ 말한다\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    네. 내내 투덜거리던 KPC가 입을 삐죽이며 말합니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...아까 소장실에서 보고하는 겸 한 번, 당신 휴가 건을 여쭤봤었는데요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    반가운 소식인데. (멍하니 헬기의 창밖 바라보다가 네 쪽으로 고개 돌린다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 당신 쪽 보지는 않은 채로 입만 삐죽거리고 있습니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이번 승급전의 파트너는 저랑 당신이니까, 둘 중 하나가 1위를 차지하면 고려해보시겠다더라고요. (흥. 저는 이런 거라도 한 번 따내보려고 힘내고 있었는데... 뭐 그런 종류의 토라짐입니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그런 조건이면 뭘 걱정하는 거야? (되려 코웃음 쳤다. 설령 산에서 굴러떨어지는 한이 있어도 이쪽은 멀쩡히 그 경사-혹은 절벽-을 기어올라올 수 있을텐데.) 나란히 1위, 2위 차지하는 결말은 당연하잖아. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (아무래도, 이 쪽은 그런 건 좀... 지금은-ㅋㅋ-인간이니까요.) 버, 벌써 그렇게 확신을... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...그, 그런 생각은 다른 대원 분들의 사기에 썩 좋진 않아요...! (우리 정말 1위, 할 수 있을까? 하며 그제야 힐긋 봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 1위당연히한다 지짜? (choice 1위당연히한다 지짜?) ＞ 1위당연히한다\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (맞네요, 제 파트너는 사실 크리쳐긴 하죠... 새삼 깨닫고는 멋쩍게 제 뺨 긁적입니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    다른 대원들의 사기가 떨어지면 오히려 좋은 것 아닌가? (귓가에 바짝 다가가 속닥거린다. 헬기에 탑승한 인원이 적은 것은 아니라 가까이에 있으면 다른 대원들도 듣기는 했겠지만.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러니까, 그렇게 되면 크리쳐를 잡는다는 목표에 다들 미치지 못하게 되는 거, (삐죽삐죽, 투덜거리며 종알대다가 어느샌가 가까워진 거리 자각합니다. 순간 말 멈추고 눈 동그랗게 뜬 채로 올려다보게 되는 겁니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... 그, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러니까, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (손 하나 들어올려서, 당신 턱 꾸우욱 눌러 밀어버립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    너, 너, 너무 가까이 다가오지 말라고 했죠?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (의외로 밀어내는 손길에 오, 하고 작은 감탄사 내뱉었다. 입꼬리가 슬그머니 올라가고 밀어내던 손바닥에 턱을 얹었다.) 파트너면서 이 정도 거리도 허용이 안 되나? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (손바닥 위로 고개 올라오면 또 깜짝 놀랍니다. 입 동그랗게 벌리고는 뻐끔뻐끔 하다가...) ... ...그, 그, 그러니까 보통 파트너래도 이, 이 정도 거리까지 안 오시거든요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (손이 물러납니다. 동그랗게 말아쥐고는 어쩐지 억울하다는-그러니까, 팔자 눈썹같은 제스쳐-표정으로 쳐다봅니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이, 이, 이렇게 자꾸 접촉하지 마요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜, 싫어서? (그럴리가, 같은 표정이나 하고 빠안히 바라본다. 이번에는 조금 전보다 한 뼘 정도의 거리를 더 벌려주었다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이상하다... 보통 물리적인 거리가 가까워지면 사이도 돈독해진다고 하던데. (듣던 것과는 다르다며 어깨를 으쓱였다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    대, 대체 무슨 말을 들은 거에요?! (입 삐죽... 삐죽... 하며 어쩐지 토라진 기색 감추지 못합니다.) 보통은 말이죠, 물리적인 거리가 가까워질 수 있는 사이가 먼저 된 다음에 가까워진다구요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (가만가만 당신 바라보다가, 손가락 하나만 착 들어올립니다.) 화, 확실히 정해야겠어요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이번 승급전에서 제가 세피르 씨보다 더 많이 크리쳐를 잡으면, 이, 이렇게 막 고개부터 다가오지 않기로 해요!! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    흠... (영 내키지 않는 듯 곧바로 대답하지 않고 숨만 길게 내뱉는다. 눈썹이 삐딱하게 한 짝만 올라갔다. 얼굴 먼저 들이미는 게 그렇게 싫을 일인가? 입장을 바꾸어서 생각을 해봐도 아무렇지 않을 것 같은데 말이다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    choice 그래 싫어 (choice 그래 싫어) ＞ 싫어\n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    싫은데. (제법 얄미운 톤이다. 고개는 순순히 뒤로 물려주지만 언제 또 다가갈지 모르게 까딱거리며 여지는 남겼다.) 그 결과 보다는 둘 중 하나가 1위를 차지하는 게 더 중요한 거잖아.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    제대로 휴가 받은 다음에 내키면 들어줄게. 내키면. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어라, 이런 반응은 예상하지 못했는데...? 아아, 세상을 좀 덜 산 순수한 생각이었나 봅니다. 눈까지 동그랗게 뜨고 어라? 하며 잠시 고개 갸웃거리다가 정신 차립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... ...수, 순 자기 맘대로야. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (괜히 얄미워서일까요. 자꾸 몸이 슬금슬금 뒤로 빠지더니만, 이제 숫제 좌석 제일 끝까지 몸 구겨서 딱 붙어버립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흥. 몰라요, 미워요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...마, 말 걸지 마요!! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이렇게 나오시겠다... (게슴츠레 뜬 눈으로 가만히 응시한다. 몇 초 정도 그렇게 보다가 어쩐 일로 고개까지 반대로 돌려주었다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래~ 우리 파트너님께서 먼저 말 걸 때까지 나는 가만히 있지. (제 자리에서 팔짱까지 끼니 꽤나 거만해보이는 자세가 됐다...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 힐끔...콕 아냐나는끝까지지조를지킬거얌 (choice 힐끔...콕 아냐나는끝까지지조를지킬거얌) ＞ 아냐나는끝까지지조를지킬거얌\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그, 그러셔도 신경 아, 안 쓰이거든요! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (힐끗... 잠깐 시선 돌려 한 번 바라봅니다. 그러다가도 입 삐죽이곤 고개 창문 쪽으로 휙, 돌려버립니다. 안전장치가 잘 걸려 있는 총 괜히 한 번 더 점검합니다...) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ...약간의 소란과 함께 헬기는 하늘을 가르고 나아갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    얼마 지나지 않아 헬기가 도착합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하늘은 흐릿한 회색으로, 금방이라도 눈이 내릴 것 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    한기를 품은 바람이 뼈까지 스며듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    발이 푹푹 빠질 정도로 쌓인 눈을 밟고 집합 지점까지 도달하면, 이번 승급전의 규칙이 공개됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    핸드아웃 : 승급전 규칙 을 공개합니다. \n  "},{"y":"say","sp":"승급전 규칙","ts":null,"tab":"info","html":"\n    1 - 크리쳐를 많이 사살한 순서로 순위가 매겨진다. 사살의 증거로 크리쳐의 일부를 가져온다. <br>2 - 조난이나 큰 부상을 입어 승급전을 지속할 수 없는 경우 구조는 가능하지만, 차후 승급전의 재개는 불가능하며 구조 즉시 최종 성적으로 산출된다.<br>3 - 시험 시간이 절반 지난 경우, 중간 보고 차원으로 전체 순위가 공개된다.<br>4 - 대원에게 대 크리쳐 살상탄을 사용할 경우, 그 즉시 실격 처리된다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    사상자가 나오지 않도록 각별히 주의한 듯, 헬퍼들이 대원들에게 GPS를 달아줍니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 헬퍼? 샬롯? (choice 헬퍼? 샬롯?) ＞ 샬롯?\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯이 달아줍니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어깨 끈에다가 GPS 잘 달아줍니다. 여전히 꽁하려나?) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 꽁~ 우리슬슬화해하장... (choice 꽁~ 우리슬슬화해하장...) ＞ 우리슬슬화해하장...\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (눈치... 보는 듯...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    자, 잘 달려 있는지 확인해 보세요. (순하게 눈 뜨곤 멀뚱멀뚱 봅니다.) 제 건 이미 달았어요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    파트너가 달아줬는데 어련히 잘 달려있겠지. (툭, 가볍게 손가락으로 건드려보기만 하고 군복 곳곳에 달린 하네스나 마저 점검한다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    다른 것보다는... (설산의 풍경 한 번, 제 파트너 한 번 본다.) 파트너 잃어버리지 않게 조심해야겠는데. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (흥. 습관적으로 삐죽거리려다가, 고개 한 번 도리도리 젓고는 튀어나오려는 입술 손가락으로 괜히 막아봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ㅡ네에? (그 탓인지 반응이 조금 늦었습니다. 고개를 갸웃, 기울입니다.) 저, 저요? 저를 왜 잃, 잃어버리신다고. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아. (그러고, 그제야 이해한 듯 제 옷 한 번 내려다봅니다. 아, 또 삐죽거리고 말았습니다...) 저는 당신이 어디 있든 잘 찾는데. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    대화와 함께 주변을 둘러보면, 허공에는 소형 카메라를 장착한 드론이 수십 대가 날아다니고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문득, 콘라드와 눈이 마주칩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그는 아까처럼 태평한 표정으로 이쪽을 보더니, 이내 가까이 다가옵니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어, 샬롯 남자친구.  \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    방송이라도 하려나? 하하, 농담이에요. 진짜 방송이라도 나간다고 하면 우리 인기도 많아질, \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    어머머. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    choice 긁힘 꺄르르 (choice 긁힘 꺄르르) ＞ 긁힘\n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    제가, 샬롯 남자친구요?! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    어우. 그건 좀. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음? 우리 파트너가 뭐가 어때서? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    저는 덜렁대는 성격은 취향이 아니라서요~ (포항항 웃습니다.) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    뭐, 그렇다고 샬롯을 싫어하는 것도 아니긴 해요? 샬롯은 정~말로 실력자니까요. 네, 네. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 저ㅡ \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아... 그래? 그럼 차였었나? (물끄럼...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ㅡ저도 당신같은 남자친구는 싫거든요?! (어쩐지 억울...해집니다. 괜히 세피르 ㅜㅜ? 때립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (더 때립니다. 툭팍팍 툭팍팍) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (악의는 없다는 듯 그저 멀뚱히 두 사람 번갈아 보며 맞아줍니다...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신은 정말이지, 자꾸 그렇게 남자친구니 뭐니 할 거에요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (씨이. 어쩐지 조금 얼굴에 열이 오른 것도 같습니다... 그야 샬롯,) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (연애라고는 꿈도 꿔본 적 없는, 그야말로 워커홀릭... 아, 워커홀릭도 아닌데요. 하여튼 간에 확실한 건 남녀관계에 면역이 없는 사람인 겁니다.) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    (여전히 포항항항 웃습니다...) 이렇게 보니까 두 분, 사이 참 좋아 보이시네요~ \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    사이야 그쪽이랑 파트너 일 때보다는 좋은 게 당연하지~ (어쩌면, 이라는 말 작게 덧붙였다. 잔뜩 토라진 샬롯의 어깨에 손을 얹고 슬슬 끌어와 제 앞에 서게 했다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음, 샬롯 얼굴이 조금 빨개졌나? (허리 숙이고는 고개 틀어 옆모습 본다.) 눈밭에서 아주 조금 더 찾기 쉬워졌겠는데. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 좋은사이 몰라미워콘라드가나아요 (choice 좋은사이 몰라미워콘라드가나아요) ＞ 좋은사이\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (뭐... 당신 말에 반박하지 않았습니다. 입 삐죽, 삐죽삐죽... 하면서 이끄는 대로 살살 몇 걸음 옮기긴 합니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    뭐, 뭐ㅡ 당신, 일부러 이렇게 놀린 거에요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (억울합니다!! 주먹 쥐고 세피르 때립니다...) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    (이열~ 하는 눈으로 둘 봅니다.) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    뭐, 이 좋은 그림을 망치긴 싫으니 슬슬 퇴장해 볼까요~... \n  "},{"y":"say","sp":"콘라드 신",  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그는 제복 후드를 깊숙하게 눌러쓴 채, 당신과 눈이 마주치면 슬쩍 시선을 돌립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    얼핏 굉장히 선명하게 빛나는 눈을 본 것 같은데, 그 사람은 당신과 눈이 마주치자, 화들짝 놀라며 후드 모자를 눌러 씁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잘못 본 걸까요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    정신이 팔린 사이에 허공에서 탄이 터지는 소리가 들립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이것으로 시작입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    동선이 꼬이지 않도록 한 팀씩 진입이 시작됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 마지막 진입팀입니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (먼저 들어가는 다른 대원들의 모습 바라보다가...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이제 슬슬 저희도 진입할 차례 같은데요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (하고, 그제야 시선 올라서 힐긋 당신 바라봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    핸디캡 같은 건가, 마지막 진입인 건? (바라보는 시선 느끼고 고개 살짝 숙인다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그야ㅡ저, 저는 저번 승급전의 1등이었으니까요. (이 말을 하면서는 어쩐지 우쭐해 보이는 모습입니다. 입꼬리가 티 나지 않게 씰룩입니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그럼 이번에는 내가 그 1등 탈환하는 걸 목표로 가보실까. (네 어깨에 양 손 얹고 천천히 앞으로 밀며 나아간다.) 출발~ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC와 탐사자는 앞선 팀과의 거리를 줄이기 위해, 산길을 따라 달려갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    새하얗게 눈이 내려앉은 검은 가지들이 행로를 막아서, 드러난 살갗을 할퀴고 베어냅니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아얏. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (따가워! 인상 살짝 찌푸립니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짧게 한숨을 내쉰 KPC가 총 옆에 달린 전환 레버를 당겨 근거리 모드로 전환합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 타임 리밋 시리즈의 무기 데이터를 공개합니다. \n  "},{"y":"say","sp":"대 크리쳐 살상용 무기 (근거리 개량)","ts":null,"tab":"info","html":"\n    타임 리밋 시리즈에서는 근접 전투에서 새로운 무기를 사용합니다. 근접(도검)에 라이플/산탄총 기능치와 같은 숫자 만큼 입력해주세요. 탐사자와 KPC 둘다 무기에 익숙해질 때까지 훈련 받았다는 설정입니다. (대미지: 1D8+피해 보너스)<br><br>작동 방식은 간단합니다. 기존에 사용하던 총 옆면에 달린 작은 스위치 레버를 누르면 총구의 길이가 줄어들고 수납된 검이 튀어나옵니다. 검날은 일격에 크리쳐의 핵을 부술 수 있도록 특수한 금속을 사용해 제련되었습니다. 펌블이 발생할 경우, 이 검은 부러집니다.<br><br>살상탄 역시 발사할 수 있지만, 사정거리는 기존 모드에 비해 압도적으로 짧습니다. 요약하자면 검과 탄환 모두 사용할 수 있는 근접전용 무기입니다. 안전 거리를 확보할 수 없을 때 사용하는 편이 좋습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (물끄럼... 뒷모습 바라보다가 작게 중얼거린다.) 조그마하니까 가지에 안 부딪힐 줄 알았는데. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자 역시 가지를 쳐낸다면 근거리 모드로 전환합시다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    시야를 방해하는 나무를 쳐낼 수 있습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>[ 듣기 ]</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">75</span>/<span class=\"inlinerollresult\">37</span>/<span class=\"inlinerollresult\">15</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">87</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (하?! 못 들었습니다. . .) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (ㅋㅋ 바보) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (삐죽삐죽삐죽. . .) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    시시포스 산이라더니, 험난하긴 하네~ (흠흠, 아무말도 하지 않은 척 하며 뒤에서도 잔가지 슬쩍 쳐내줍니다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그때, 깔끔해진 시야 너머로 서너 체의 금속형 크리쳐가 로켓 모양으로 딱딱한 몸체를 재조립하고 빠르게 돌진해옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    PL들에게는 새로운 무기를 시험할 좋은 상대네요. 탐사자, KPC 도검 판정. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>[ 근접전 (도검) ]</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">75</span>/<span class=\"inlinerollresult\">37</span>/<span class=\"inlinerollresult\">15</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">62</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>근접전(도검)</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">90</span>/<span class=\"inlinerollresult\">45</span>/<span class=\"inlinerollresult\">18</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">75</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    강철처럼 단단하던 금속형 크리쳐의 껍데기가 단숨에 4등분으로 조각납니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    드러난 핵 역시 깔끔하게 4등분으로 절단된 상태입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    누가 해치운 것으로 할까요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그럼, 당연히 이 쪽은 메타적으로 판정치가 더 낮았으니까-ㅋㅋ-핵 주워봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (힐끔.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (힐끔.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...왜 그렇게 봐? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...나, 나눠 가질래요? (혼자 네 개 전부 가져가기에는 좀, 양심이 아팠나 봅니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음? 왜, 샬롯이 다 가져도 괜찮은데. (고개 살짝 기울인다. 바닥에 굴러다니는 크리쳐의 잔해만 발끝으로 툭 치면서.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 조금양심찔려 듀... (choice 조금양심찔려 듀...) ＞ 조금양심찔려\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...다, 다음 번에 같이 잡으면, 그럼 그 때는 제가 양보해 드릴게요! (어쩐지 양심이 콕콕 찔리는지... 입 다물고 움찔거리다가 톡 내뱉고는 핵 챙깁니다. 그러곤 몇 걸음 먼저 성큼.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    빠, 빨리 가요! 다음 크리쳐도 잡아야 당신도 챙길 것 아녜요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래그래~ 급하게 가다가 넘어지지나 마시지. 추워서 나뭇가지들도 억센데 부딪히지도 말고. (마치 어린 애 보듯이 말 얹으며 뒤에서 느적느적 따라간다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    중간부터 길이 끊깁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 절벽을 올라서야 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    절벽 코스의 경우, 경로가 짧기 때문에 어느 정도 올라갈 때까지 시간이 단축된다는 장점이 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    단점은 떨어지면 살짝 아프다는 것. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    벽면의 바위는 눈이 쌓여 단단하고 차가운데다 미끄럽기까지 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    높이를 생각하면, 아무리 봐도 떨어졌을 때 살짝 아픈 정도로 끝나지 않을 것 같습니다...만. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    떨어지지만 않으면 그만 아닌가요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 쫄앗당 할수있어 (choice 쫄앗당 할수있어) ＞ 할수있어\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어쩐지 기운찬 모습인 것 같습니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (그 모습을 보며 기특하다고 생각하는 중입니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (아니, 이전에 1등이라고 했으니 이 정도는 당연히 하나?) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (응응, 아따시 나름 최강의 인류-현재로는 진짜 인간 순도 100%인-니까.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    혹시 이런 일이 생길까봐, 장비들도 챙겨왔죠... (짐들 뒤적이다 로프와 갈고리들 꺼냅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    세피르 씨도 챙겨오셨죠? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    choice 당연하지 아니 (choice 당연하지 아니) ＞ 아니\n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ... (주머니들에 한 번씩 손 집어넣어보더니 가만히 샬롯 응시한다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나는 좀 아파도 상관 없어서. (일부러 챙기지 않았다는 듯이 고개 슬쩍 돌린다. 챙긴다고 꺼내놓은 기억은 있는데, 그대로 두고 온 모양이다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그럼  :  0  표정으로 바라봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (고개 도리도리 젓습니다. 로프 들고 한 쪽 끝은 제 허리에 꽉 묶고, 한 쪽은 당신 허리에 꽉 묶어줍니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 꽉 좀헐렁~ (choice 꽉 좀헐렁~) ＞ 꽉\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (꽉 꽉 꽉.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    흡. (조금 조이는 것 같은데? 숨 짧게 들이킨다...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    안전 제일이니까요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어디 계시는 바보 (주변에 사람 없는 거 확인하고) 크리쳐가 장비 챙기는 것도 잊으신 바람에요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러고 여유분 갈고리도 내밉니다. 짠!) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지금부터 탐사자와 KPC는 제복 허리춤에 묶여 있던 로프와 갈고리를 사용해 절벽을 타고 올라갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 동시에 오르기 판정을 시도합니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>[ 오르기 ]</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">20</span>/<span class=\"inlinerollresult\">10</span>/<span class=\"inlinerollresult\">4</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">56</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>오르기</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">40</span>/<span class=\"inlinerollresult\">20</span>/<span class=\"inlinerollresult\">8</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">55</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    꺄, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    꺗!!!! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    둘 모두... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    발을 살짝 헛디딥니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잠시 추스른 이후 여러분들은 다시 위를 향해 절벽을 오르기 시작합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그야 우리 최강의 인류니까... 이 정도로 꺾일리가 없잖아요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다시 페이스를 찾고 나면 본격적인 암벽 등반 시간입니다. (레져X 생존O) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 로프에 의지해 절벽을 오르고 있으면, 녹슬대로 녹슨 금속을 꺾는 듯한 소음이 들려옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    울음소리입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    소리가 나는 방향으로 고개를 돌리자, 비행 중인 생체형 크리쳐 한 무리가 진액을 흘리며 이쪽으로 돌진하는 광경이 눈에 들어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 가장 앞에 선 무리의 대장은 아가리를 벌리고 끔찍한 비명을 질러댑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    시작부터 쉽지 않네요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어, 어어, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    여, 여기서 잘못 시간을 끌었다간 저희, 분명 둘 다 떨어지겠죠...?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    저것도 잡으면 점수이니 좋은 거 아닌가? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    물론 잡으면 좋긴 한데에. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    좋으면 잡으면 되겠네. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    자자, 크리쳐를 파트너로 둔 인간이잖아. 저것도 똑같은 크리쳐인데... 뭐, 무섭진 않을 거잖아? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아니이, 그치만요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    여기서 떨어지게 되면... (시선 살짝 아래로 내려봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    음. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    확실히 저는 하나 있는 목숨 없어질 것 같으니까요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    정상까지 올라간 후에 제압하는 건... (하고 바라봅니다. 아니, 추락하거나 하면 대신 받쳐줄 것도 아니면서... 투덜투덜.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어엉, 그래. 인간은 죽겠지만... (제가 있는데 뭐가 문제냐는 듯이 고개를 기울였다. 어차피 여기서 동시에 떨어진다면 샬롯보다는 먼저 바닥에 도달할 가능성이 높다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 제 파트너 크리쳐가 무슨 생각을 하는지 알 턱이 없는 인간입니다. 불안한 눈빛으로 바라봅니다...) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    제압을 먼저 시도하고자 한다면 라/산 또는 도검 판정! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    도검 판정의 경우 어려운 성공 이상을 요구합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>사격(라/산)</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">90</span>/<span class=\"inlinerollresult\">45</span>/<span class=\"inlinerollresult\">18</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">44</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-hard\"><b>어려운 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    해냈습니다. 이게 상급 크리쳐라 이건가요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    살상탄이 정확하게 크리쳐에게 명중합니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어라... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (됐당. 눈 깜빡이다가 조금 얼 빠진 소리 냅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...크리쳐의 사고방식이란. 제가 따라가기 어려운 걸요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...흠, 목숨이 하나라 그런가.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어쨌든 이걸로 동점이겠네. (처치는 했으니까 막연히...) 마저 올라가자, 어서.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    보통은 목숨이 하나니까요... (흥. 하고 흘겨봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    네에. (그러곤 열심히 절벽 올라가봅니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 생체형 크리쳐들에게 로프를 전부 쥐어 뜯기기 전에 절벽 꼭대기에 도달해냈습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아니, 그 전에 생체형 크리쳐를 먼저 쥐어 뜯은 거죠... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뒤따라오던 KPC가 이쪽을 향해 손을 뻗습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (먼저 올라와 눈을 털어내려던 중, 위로 뻗어진 손을 발견했다.) 평소에는 조금만 가까워져도 뭐라고 하더니. (궁시렁거리며 샬롯의 손을 단단히 붙잡아 위로 끌어올려준다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그럼 끙, 앓는 소리 내면서 뻗어진 손 잡습니다.) 그, 그러니까... 바닥이 조금, 거리가 애매했던 것 뿐이거든요...! (부끄러운지 샐쭉하게 입 튀어나와서 삐죽입니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    소, 손 까지는 괜찮아요. (이 말을 나중에 후회하게 되려나.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    오... 그래? 조금 더 빨리 말 해주지 그랬어. (나중일 것도 없다. 그대로 끌어올려주느라 잡았던 손 놓을 생각이 없다는 듯, 꼼지락거리더니 깍지 끼워 잡았다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    잃어버릴 걱정 안 해도 되고 좋네, 가자. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어, (그럼 손 놓으려다가, 그대로 깍지 껴 잡혀져버린 손 얼빠진 눈으로 바라봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 아니, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    지금은 굳이 손 아, 안 잡아도 되지 않아요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (연신 뭐라뭐라 하고는 있는데, 그렇지만 이동은 해야 하니까... 손 잡힌 채로 같이 이동합니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 이제, 산길 코스로 진입합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    경사는 가파르긴 해도 오르기 힘들 만큼 험준하지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    바닥에 쌓인 눈은 군화로 밟을 때마다 푹푹 꺼집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    나무가 촘촘한 저지대보단 고지대쪽이 싸우기도 편하고 상대할 수가 많을 테니, 이대로 크리쳐를 발견할 때까지 올라갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    최대한 안전한 코스만 골라서 걸은 끝에, 두 사람은 딜레마와 마주합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    바로 20m 정도의 흔들 다리. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    나무는 곳곳이 썩어 지나가기에 영 꺼림칙한 상태입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만 이걸 지나지 않으면 길이 없습니다. 선택지가 없네요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    혹시 이런 거 건너갈 때도... 다리 끊어지는 상상하고 그래? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 한다 안한다 (choice 한다 안한다) ＞ 한다\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...사, 상상 안 하려고 했는데 당신 때문에 지금 최악의 시나리오 세 개 쯤 상상해버렸잖아요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (얼굴 좀 하얗게 질려서는 머뭇거립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    머, 먼저 가요... \n  "},{"y"
