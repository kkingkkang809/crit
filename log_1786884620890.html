<!DOCTYPE html>
<html lang="ko" style="--accent:#B26A9E"><head><!-- crit-preview-early: 리더 모드를 첫 페인트 전에 적용해 수정 UI가 깜빡이지 않게 --><script>try{if((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview")))document.documentElement.classList.add("crit-preview")}catch(e){}</script><style>html.crit-preview .stats,html.crit-preview .bartitle,html.crit-preview .tabbar,html.crit-preview .charbar,html.crit-preview #pwbtn,html.crit-preview .chip-edit,html.crit-preview .allbtn,html.crit-preview #sessbtn,html.crit-preview #editbtn,html.crit-preview #savebtn,html.crit-preview #descbtn,html.crit-preview #chatbtn,html.crit-preview #msgrbtn{display:none!important}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[0806] CREA GRRR! RESTART</title>
<style>
  :root {
    --accent:#B26A9E;
    --rt1:#6b5a8e; --rt2:#8e5a7d;
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  /* 테마 연동 커스텀 스크롤바 */
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent) 62%, var(--line)); }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  header.hero { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:14px; }
  /* 블로그에 붙여넣으면 블로그 테마 자체의 h1/본문 CSS가 우리 값보다 우선순위가 높아서
     타이틀·개요 글씨가 훨씬 커 보였다(실제 피드백) - !important로 블로그 CSS에 안 밀리게 고정 */
  .hero h1 { margin:0 0 4px; font-size:17px !important; letter-spacing:-.5px; }
  .hero .sub { color:var(--dim); font-size:13px !important; }
  /* 세션 정보 */
  .t-writer { display:inline-flex; align-items:center; vertical-align:middle; color:var(--dim);
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:600; margin-left:6px; }
  .s-players { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pbadge { background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:600; }
  .pbadge-gm { background:color-mix(in srgb, var(--accent) 26%, var(--panel2));
    border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .s-overview { color:var(--desc); font-size:12.5px !important; line-height:1.7; margin:0 0 4px;
    border-left:3px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    padding-left:12px; white-space:pre-line; }
  #s-writer:empty, #s-subtitle:empty, .s-overview:empty, .s-players:empty { display:none; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--dim); }
  .stats b { color:var(--text); font-weight:600; }
  .bartitle { font-size:11.5px; color:var(--dim); margin:14px 0 8px; font-weight:600;
    display:flex; align-items:center; gap:7px; }
  .allbtn { font-size:10.5px; padding:1px 9px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; font-family:inherit; line-height:1.5; }
  .allbtn:hover { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .charbar, .tabbar { display:flex; gap:8px; flex-wrap:wrap; }
  .tab-chip { display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:3px 10px; cursor:pointer; user-select:none; font-size:12.5px;
    position:relative; padding-right:20px; }
  .tab-chip:has(input:not(:checked)) { opacity:.35; }
  .tab-chip input { display:none; }
  /* crit-tab-x: 탭 칩 우측의 작은 삭제 아이콘 - head 쪽 기본 스타일에 같이 둬야 한다.
     body 안쪽 저 아래에 따로 있으면, 이 문서가 워낙 커서 브라우저가 그 지점까지 파싱하기 전엔
     패딩/숨김이 적용 안 된 상태로 먼저 그려졌다가 뒤늦게 적용되며 탭 정렬이 움찔거렸다. */
  .tab-chip .tab-x { position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; border-radius: 50%; display: none; align-items: center; justify-content: center;
    color: var(--dim); cursor: pointer; }
  .tab-chip:hover .tab-x { display: flex; }
  .tab-chip .tab-x:hover { color: #e08b8b; background: color-mix(in srgb, #e08b8b 18%, transparent); }
  .tab-name { font-weight:600; }
  .charbar.collapsed { max-height:104px; overflow:hidden; }
  .charbar { align-content:flex-start; }
  .expandbtn { display:none; width:100%; margin-top:6px; padding:2px 0; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; color:var(--dim); cursor:pointer;
    align-items:center; justify-content:center; }
  .expandbtn:hover { color:var(--text); border-color:var(--accent); }
  .expandbtn.open svg { transform:rotate(180deg); }
  .char-chip { display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:3px 8px 3px 4px; cursor:pointer; user-select:none; transition:.15s;
    border-color: color-mix(in srgb, var(--cc) 45%, var(--line)); }
  .char-chip:has(input:not(:checked)) { opacity:.35; }
  .char-chip input { display:none; }
  .avatar img, .avatar b { width:30px; height:30px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-avatar { display:flex; align-items:center; }
  .chip-avatar img, .chip-avatar b { width:22px; height:22px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-name { font-size:13px; font-weight:600; line-height:1; }
  .chip-count { font-size:11px; color:var(--dim); line-height:1; }
  /* 지문/사담 통합 칩: 아바타가 없어 기본 padding(왼쪽 4px)이 그대로면 글자가 테두리에 붙어보인다 */
  .char-chip.merged { border-style:dashed; padding:3px 10px; }
  .char-chip.merged .chip-name { color:var(--accent); }
  .chip-edit { display:flex; align-items:center; justify-content:center; color:var(--dim); padding:3px; border-radius:6px; }
  .chip-edit svg { width:14px; height:14px; }
  .chip-edit:hover { color:var(--text); background:var(--line); }
  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .toolbar input[type=search] { flex:1; min-width:120px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .spanel hr { border:none; border-top:1px solid var(--line); margin:10px 0; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }

  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:hover, input[type=radio]:hover {
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  .mrow button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .mrow button:hover { background:color-mix(in srgb, var(--accent) 26%, var(--panel2)); }

  .msg { display:flex; gap:10px; padding:7px 10px; border-radius:10px; }
  .msg + .msg { margin-top:2px; }
  .msg .avatar { flex:0 0 30px; padding-top:2px; }
  .msg .mbody { flex:1; min-width:0; }
  .mhead { display:flex; align-items:baseline; gap:8px; }
  .mhead .by { font-weight:700; font-size:13.5px; }
  .mhead .ctab { font-size:10.5px; color:var(--dim); opacity:.7; }
  .mcontent { font-size:14.5px; overflow-wrap:break-word; }
  .mcontent img { max-width:100%; border-radius:8px; }
  .msg.desc { justify-content:center; text-align:center; color:var(--desc); font-style:italic; padding:10px 34px; }
  .msg.desc .mcontent { font-size:14px; }
  .msg.general { background:var(--panel); border:1px solid transparent; }
  .msg.general:hover { border-color:var(--line); }
  /* 메신저 스타일: 대사 블록을 메신저 말풍선처럼 - 상대는 왼쪽, 내 캐릭터는 오른쪽으로
     쏠린 좁은 블록(74%)으로 줄이고, 내 캐릭터는 이름·시각까지 오른쪽 정렬 (판정 표 블록 제외) */
  body.msgr .msg.general:not(.roll) { max-width:74%; margin-right:auto; }
  body.msgr .msg.general.mine:not(.roll) { flex-direction:row-reverse; margin-right:0; margin-left:auto; }
  body.msgr .msg.general.mine:not(.roll) .mbody { text-align:right; }
  body.msgr .msg.general.mine:not(.roll) .mhead { justify-content:flex-end; }
  /* 연속 대사: 이름 한 번만, 블록 연결 */
  .msg.general.cont { margin-top:0; border-top-left-radius:0; border-top-right-radius:0; padding-top:0; }
  .msg.general:has(+ .msg.general.cont) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .msg.general.cont .mhead { display:none; }
  .msg.general.cont .avatar img, .msg.general.cont .avatar b { display:none; }
  .msg.general.roll { background:color-mix(in srgb, var(--accent) 9%, var(--panel));
    border-left:3px solid color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .msg.general.roll .mcontent { font-family:Consolas,"D2Coding",monospace; font-size:13px; }
  /* CC 판정 → Roll20 coc-1 스타일 표 */
  .msg.general.roll.cc .mcontent { font-family:inherit; font-size:14.5px; }
  .inlinerollresult { background:color-mix(in srgb, var(--accent) 24%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); border-radius:4px;
    padding:0 5px; font-weight:700; font-size:13px; }
  /* 아바타 열(30px+간격 10px)만큼 중심 보정 → 페이지 가운데와 열 일치 */
  .msg.general .ccroll { transform:translateX(-20px); }
  .ccroll { border-collapse:collapse; margin:6px auto; min-width:230px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .ccroll caption { background:linear-gradient(135deg, var(--rt1), var(--rt2)); color:#fff;
    font-weight:700; font-size:13px; padding:5px 10px; caption-side:top; border-radius:8px 8px 0 0; }
  .ccroll td { padding:4px 10px; font-size:13px; border-top:1px solid var(--line); }
  .sheet-template_label { color:var(--dim); }
  .ccroll .resrow { background:#bebebe; }
  .ccroll .resrow .sheet-template_label { color:#4a4a4a; }
  .ccroll .rr { font-size:13px; }
  .ccroll .rr-extreme, .ccroll .rr-crit { background:#cfe3cd; color:#3f6b42; }
  .ccroll .rr-hard { background:#2e7d32; color:#fff; }
  .ccroll .rr-normal { background:#1b5e20; color:#fff; }
  .ccroll .rr-fail { background:#a84848; color:#fff; }
  .ccroll .rr-fumble { background:#6e2323; color:#fff; }
  .ccroll .rr-etc { background:#8a8a8a; color:#fff; }

  /* 지문출력 캐릭터: 해당 캐릭터의 발화를 Roll20 서술처럼 가운데 지문으로 표시 */
  .msg.general.as-desc:not(.roll) { background:transparent; border-color:transparent;
    justify-content:center; text-align:center; font-style:italic; padding:10px 34px; }
  .msg.general.as-desc:not(.roll) .avatar, .msg.general.as-desc:not(.roll) .mhead { display:none; }
  .msg.general.as-desc:not(.roll) .mcontent { color:var(--desc); font-size:14px; }
  /* info 탭: 핸드아웃 카드 */
  .msg.handout { justify-content:center; padding:14px 34px; }
  .hcard { background:var(--panel); border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:14px; padding:18px 24px; max-width:560px; width:100%; text-align:center;
    box-shadow:0 4px 18px color-mix(in srgb, var(--accent) 12%, transparent); }
  .hcard .hname { font-size:16px; font-weight:700; margin-bottom:10px; padding-bottom:10px;
    border-bottom:1px solid var(--line); }
  .hcard .mcontent { font-size:14px; line-height:1.75; }

  /* main/info 외 탭(사담·귓속말 등)은 흐리게 — 메인 진행과 구분 */
  .msg.subtab { opacity:.55; }
  .msg.subtab:hover { opacity:1; }
  .dclist { max-height:300px; overflow:auto; display:flex; flex-direction:column; gap:7px; margin:4px 0 2px; }
  .dclist label { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; }
  .dclist .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  footer { margin-top:28px; color:var(--dim); font-size:12px; text-align:center; }
  .editing .mcontent, .mcontent[contenteditable="true"] { outline:1px dashed #C98A5B55; border-radius:6px; }
  .editing #log .msg .avatar { cursor:pointer; }
  .editing #log .msg .avatar:hover img, .editing #log .msg .avatar:hover b { outline:2px solid var(--accent); }
  .hide { display:none !important; }
  .ctxmenu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; min-width:170px; box-shadow:0 10px 30px #000a; }
  .ctxmenu button { display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:13px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; }
  .ctxmenu button:hover { background:color-mix(in srgb, var(--accent) 22%, var(--panel2)); }
  .ctxmenu button.danger { color:#e08a8a; }
  .ctxmenu .sep { border-top:1px solid var(--line); margin:4px 6px; }
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:300px; max-height:82vh; overflow-y:auto; }
  .modal.wide { width:min(92vw, 560px); }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal textarea { width:100%; min-height:190px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; line-height:1.5;
    font-family:Consolas,"D2Coding",monospace; resize:vertical; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:30px 12px;
    text-align:center; color:var(--dim); font-size:13px; cursor:pointer; transition:.15s; }
  .dropzone.over { border-color:var(--accent); color:var(--text);
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow.opts { justify-content:flex-start; gap:22px; }
  .mrow label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .iconbtn.on { color:var(--accent); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .pwwrap { position:relative; }
  .pwwrap input { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:7px 36px 7px 10px; font-size:13px; font-family:inherit; }
  .eyebtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--dim); cursor:pointer; padding:4px; display:flex; }
  .eyebtn:hover { color:var(--text); }
  .mrow input[type=text] { flex:1; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; }
  .mrow input[type=color] { width:36px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }

<body class="light" data-session='{}'><script>window.CRIT_LOG_DATA = {"title":"[0806] CREA GRRR! RESTART","source":"ccf","blocks":[{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    0. Hero가 종료됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 진짜 시나리오가 시작됩니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ╭╼|═══════════════|╾╮<br><br>2025/08/06<br><br>클리셰 SF 세계관의 크리쳐는<br>그어그어하고 울지 않는다<br>RESTART<br><br>CoC 7th 팬시나리오<br><br>W. 청서<br><br>KPC 샬롯 바이런 PC 세피르 해킷<br><br>╰╼|═══════════════|╾╯ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가끔은 생각해, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이런 나도 누군가를 구하는 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    영웅이 될 수 있었을까. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    호흡을 도와주는 산소 마스크, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    목구멍까지 차오르는 쓰디쓴 액체, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    전신에 엉겨 붙은 전선, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    양손을 구속하는 쇳덩이, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    터질듯 빨리 뛰는 심장. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    덜컹, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    실험관이 열리고, 탐사자는 액체와 함께 앞으로 쏟아지며 바닥을 구릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    갑작스럽게 들이차는 산소에 폐가 아려와 숨 쉬기가 힘들고, 억지로 뜯겨져 나가는 전선이 따갑습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    바닥에 주저앉아 한참이나 헐떡인 끝에, 주변의 풍경이 눈에 들어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이곳은 실험관이나 연구 자료로 가득한 어딘가의 실험실입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    푸르스름한 빛이 실내에 고여 주기적으로 깜빡거립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어두운 종이로 뒤가 덧대인 유리창에 당신의 모습이 비칩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자 역시 환자나 입을 법한 옷을 입고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    창백한 인상입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 당신의 앞에는 아주 어린 아이가 서있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아이는 죽은 듯이 누워있는 안드로이드 옆을 지키고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아이는 안드로이드의 눈을 감겨주곤 이쪽으로 다가옵니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    아, 당신. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    이제 정신이 들어? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아이의 얼굴은 굉장히 낯익습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    채도가 낮고 밝은 머리, 그리고 푸른색 눈. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자세히 살펴보면, 오데트(델타)와 굉장히 닮았다는 사실을 깨닫습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다른 점이 있다면, 외형이 한참 어려보인다는 부분이겠죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 얼굴을 본 순간, 탐사자는 아주 예전의 일을 떠올립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트와 콘라드, 승급전, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 KPC. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러고 보니 KPC는 어디에 있죠…? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...뭐야? (얼마만에 단어를 발음하는 건지 모를, 갈라지는 목소리가 튀어나왔다. 콜록거리며 몇 번 가다듬고 소리를 내고 나서야 조금 제 목소리 같아졌다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그러니까... (제 관자놀이를 꾹, 짓누르며 한참을 침음한 뒤에서야...) 델타,는 맞는 거지? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    당신이 그 이름을 아직 기억할 줄은 몰랐네... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    맞아, 델타. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    (가볍게 눈짓하고) 구하러 왔어. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나를? (누가 누구를?...와 같은 말이었다. 한참이나 작아진-어려진- 델타를 위아래로 훑어봤다.)  \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    여기부터 설명이 필요한 거야? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    좋아, 그래. 설명하기 전에 당신이 어디까지 기억하는지부터 물어봐야겠다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    AOC에 의해 소환된 악신과 싸우다 당신이 죽었던 건 기억이 나? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    으흠, 그건 당연히 기억하지. (고개 끄덕거린다. 화려하게 전사했던 기억이니까?)  \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    좋아... 그럼 거기부터. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    당신이 악신과 싸우다 죽은 후, 남은 사람들은 신 정부를 수립했었어. 물론 안전지대에서 테러가 일어나긴 했지만. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    테러를 전후해서 나는 잡혀가서 능력을 추출당했어. 그래서 지금은 이 꼴이지. 생명력도 잃고, 체구도 작아지고. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    내가 잡혀간 곳은 어떤 사이비 단체였는데... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그런데, 거기서 네가 어딘가 산 채로 포획돼 있다는 정보를 들었지 뭐야. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그래서, 널 구하려고 탈출한 거야. (하고, 뒤편에 있던 어떠한 실험관 가리킵니다.) \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    여기까지는 이해했어? 그 사이 무슨 일이 있었는지도 조금 말해줘야 할 것 같긴 한데... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음~ 그래, 거기까지는 대충 이해 됐어. (고개를 까딱, 위아래로 흔들고는 주위를 흘긴다. 실험관에 갇히게 된 과정은 기억이 나지 않지만...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    지금 꿈이랑 현실 경계가 조금 흐린 것 같아서 말이지... 뭐, 됐고... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그 사이에 무슨 일이 있었는지도 대충 설명 해줄래? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    너무 오래 자고 있었던 것 아냐? (하고, 잠깐 당신을 바라보다가...) \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    좋아... 그럼, 간단하게 설명해 줄게. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    크리쳐 사태가 종식된 지는 얼마 지나지 않았어. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    하지만 크리쳐에 대한 건 지금 중요한 문제가 아냐... 악신은 퇴치당했음에도, 여전히 진행되고 있는 원인 불명의 멸망이 당장 우리가 직면한 과제지. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    나는 실험실에만 갇혀 있어서 정확히는 알 수 없지만, 우릴 납치한 사이비 종교는 무언가 알고 있을지도 몰라. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트는 잠시 숨을 고릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    상당히 피곤해 보이는 인상입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 사이 당신은 실험실 내부를 조사할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [연구 자료], [좌측 실험관], [우측 실험관], [특별 보관실]을 확인할 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    하나만 납치한 것도 아니고 '우리'를 납치하다니... 크리쳐를 납치할 생각을 한 것도, 실행에 옮긴 것도. 배짱 하나는 칭찬 해줘야겠는데. (픽, 바람 새는 듯한 웃음 흘리며 연구 자료로 추정되는 종이 먼저 집어든다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    연구 자료에는 탐사자를 집중적으로 연구한 결과가 나와있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    키, 체중, 이름, 신변에 관한 모든 정보 뿐만이 아니라 세포 단위로 당신을 분석했습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    물론 대부분이 ‘불명’으로 나와있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가볍게 훑어 보는 도중 형광펜으로 강조된 문장을 발견합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ‘▒▒전의 신체 구조 데이터와 99% 이상 일치하지 않음' \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...뭐라고 쓴 거야? (제 정보를 세세하게 적어놓은 것만 해도 소름이 돋는데, 그 기준이 세포 단위라니 몸의 솜털이 쭈뼛 서는 것 같았다. 형광펜으로 강조된 문장을 한참을 째려본다...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (봐도 모르겠군... 심드렁한 표정으로 대충 바닥에 던져놓고는 좌측에 자리한 실험관 먼저 살핀다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    좌측 실험관에는 금속형 크리쳐가 보관되어 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    파편 별로 조각난 크리쳐, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    통째로 포획되어 가사 상태에 빠진 크리쳐, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    의식이 있는 크리쳐……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 중 하나가 안구로 추정되는 부분을 데로록 굴려 이쪽으로 시선을 둡니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ...어쩐지 형용할 수 없는 기분이 듭니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    알아보기라도 하는 것마냥... (작게 중얼거리다가 고개를 돌렸다. 이번에는 우측에 있는 실험관으로.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    우측 실험관에는 생체형 크리쳐가 보관되어 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잘려나간 크리쳐의 일부부터, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    포획되어 가사 상태에 빠진 크리쳐, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    의식이 있는 크리쳐……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 정체를 아는 당신으로서는 인체 실험으로 밖에 느껴지지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    마찬가지로 형용할 수 없는 기분이 듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 실험관을 전부 살펴본 뒤, 당신은 도합 몇십 체의 크리쳐가 이곳에 갇혀있다는 사실을 알게 됩니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    뭐... 크리쳐로 키메라 같은 걸 만들고 싶기라도 했던 건가? (불쾌한 감각이 스멀스멀, 바닥에서부터 기어오르는 것 같았다. 표정을 살짝 구겼다가 휘휘, 고개를 젓고는 특별 보관실로 몸을 돌린다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    특별 보관실은 엄중한 소독 절차를 거친 뒤에 들어갈 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    실 평수는 굉장히 좁습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    크리쳐와 관련된 물건과 증거품이 보관되고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    관찰 판정 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>관찰력</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">60</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    깨끗하게 복원된 제복과 무기를 발견합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    환자복은 활동하기 불편하니, 갈아입을 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    미리 준비라도 해둔 건가? (반가운 물품들이기는 하지만 어째 떨떠름하다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (그래도 환자복을 입고 있을 수는 없는 노릇이지... 생각하며 주섬주섬 환복한다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    무기 또한 무리 없이 작동합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자의 무기 소지에 대 크리쳐 살상용 무기가 추가됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 때입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    전부 돌아보고 나오면, 탐사자는 오데트가 창백한 안색으로 바닥에 쓰러져있는 장면을 목격합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (손에 익은 무기를 만지작거리며 나오자마자 발견한 건 안드로이드 근처에 똑같이 쓰러져 있는 오데트의 모습이었다. 당혹스러운 것을 숨기지 못하고 다가가, 얼굴을 살핀다.) 여기까지 오다가 다치기라도 했어? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    상태를 확인하면, 오데트가 기침하며 말합니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    ㅡ실험 후유증 때문이야, 괜찮아. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    방금 통신기를 찾았어. 예전에 사용하던 AOC 전파에 잡히도록 연락을 넣어뒀으니 운 좋으면 지원이 올 거야... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그러니까, 나는 여기에 두고 가도 돼. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    눈 뜨자마자 운에 맡겨야 하는 상황이 바로 생기는 건가? (눈썹 까딱... 움직인다. 신경이 쓰여 이대로 두고 가기에는 조금 걸리기는 하지만...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    AOC에 연락... 제대로 닿았겠지. (완전히 운에 맡기기 보다는 그래도 믿음 한 번 실어주는 것이 낫겠다 싶어 덧붙인 말이다. 마지막으로 제 옷 매무새 같은 것들 점검한다.) 그럼, 먼저 간다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    (씰룩, 가볍게 입꼬리 들어올리고) \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    지금 AOC로 가면 그 사람을 만날 수 있을 거야. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    당신, 조심해, ...... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 말을 끝으로, 오데트는 기절해버립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자세히 보니 입술에 각질이 일어나 있고, 야윈 팔다리 곳곳에 멍자국이 있으며, 영양 상태가 굉장히 나쁩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여기까지 어떻게 왔는지 전혀 알 수 없네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트가 무슨 말을 하려고 했는지 결국 이해하지 못했지만, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 시기에 AOC라고 하면……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자가 죽은 이후의 KPC가, 안대를 착용한 채 전광판에 나오던 모습 밖에 떠오르지 않습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이번에는 샬롯일지, 샤를일지. (오데트를 뒤로 하고 나와 숨 한 번 크게 들이킨다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자가 X제약 회사 밖으로 나오면, 바깥의 풍경은 예전에 본 미래와 확연히 다릅니다.<br> \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    푸른 빛을 발하는 중앙관리체제가 떠있고, 안드로이드로 추정되는 사람들이 돌아 다니긴 하지만, 공통점은 그것 뿐입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    군데군데 폐허가 된 건물, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    길거리에 앉아서 하늘을 올려다 보는 사람들, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    천공에 거대하게 드리운 행성의 그림자, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    파손된 도보. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    차가 다니지 않는 도로를 따라 걷다 보면, 전광판에서는 아나운서가 불안한 표정으로 입을 열어 말하고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “크리쳐 사태가 종식되었음에도 새롭게 나타난 인류를 향한 위협에 안전 지대의 대부분이 공포에 떨고 있습니다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    낯선 행성의 방문에 관해 길거리에서 사람들에게 인터뷰하는 모습까지 보입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “너무 무서워요.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “외계인의 침공?”  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “지금이 우리에게 영웅이 필요한 시점입니다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    척봐도 수상해 보이는 사람들이 하얀 로브를 입고 정면을 똑바로 응시하며 입을 뗍니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “하지만 두려워 마세요, 영웅은 곧 돌아옵니다.\" \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    \"우리는 구원받을 것입니다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문득 탐사자의 등에 소름이 돋습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    듣기 판정 따위 필요없는 확실한 목소리입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    정신을 잃기 전, 테러가 일어난 안전지대에서 눈을 떴을 때 탐사자를 공격한 사람과 목소리가 완전히 똑같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ...AOC라고 해서 그렇게 깨끗한 상태는 아닙니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    입구를 지키던 세큐리티까지 전부 도망쳤는지, 건물은 텅 비어 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어디로든 가볼 수 있지만, 소장의 방을 제외하고는 전력도 돌지 않는데다가 쥐가 들끓어 다니기 좋은 곳은 아닙니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    한 마디로 정의하자면, 폐건물입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    회귀라는 사실이 지금도 크게 실감나진 않지만, 어떻게 봐도 탐사자가 겪었던 일과는 확연히 다릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    원래대로라면 KPC가 안전지대를 크게 부흥시켜서, 탐사자가 올 때까지 평온하게 안전지대를 수호해야 하지 않나요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지금 상태로는 당장 멸망해도 이상하지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    AOC 역시 망한지 오래고요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    소장실로 향할 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...어떤 게 꿈이지? (제 기억과는 다른 광경에 괴리감을 느낀다. 눈동자는 이리저리 움직이며 폐건물이나 다름이 없는 내부를 훑었다. 소장실로 걸음을 딛을 때마다 묵직한 군홧발 소리만이 울릴 뿐, 인기척이 느껴지지는 않았다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    엘리베이터도 운행하지 않으므로 최고층까지 걸어서 올라가야 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    소름 끼치는 물소리, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 문을 열 때마다 귀를 자극하는 녹슨 소리를 이기고 최고층으로 향합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    섬뜩한 기분과 함께 복도를 지납니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    낯선 기시감이 스쳐 지나가고, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    소장실의 문을 열면……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    누군가가 거대한 전면창을 등지고 서있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    전신에 딱 달라붙는 롱 코트, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    깔끔하게 고정한 안대, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    꼿꼿하게 선 자세, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하나로 올려 묶은 새파란 머리. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    새파란 머리? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    이ㅡ게 누구야. 실종되셨던 AOC의 전 영웅 아냐? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    백발이 아니라? (조용히 생각으로 그치려던 말이 소리가 되어 튀어나왔다.)  \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    아, 정말이지. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    무슨 개소리를 하는 거야? 이게 어딜 봐서 흰 머리로 보여? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 안대를 착용한 리리 라클렛과 마주합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짙게 다크써클이 내려온 눈가, 초췌해질 대로 초췌해져 움푹 패인 양뺨이 씰룩거리며 반항적인 미소를 지어냅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    간단하게 대화를 나눌 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    현재 AOC의 관리자는 리리 라클렛입니다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    백발, 백발... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    아. 당신, 당신네 파트너라도 찾아? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    백발인가, 하고 착각이라도 하기엔 너무 선명한 푸른색이긴 하네. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    좋은 꿈 한 번 꾸고 일어났더니 파트너가 어디를 갔는지 안 보여서 말이야. 찾고 있는데... 행방 알아? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    좋은 꿈을 꿨다고? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    아, 더럽게 부럽네... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    (하. 씰룩이며 웃던 입꼬리가 축, 내려가더니...) \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    리리가 그런 것까지 어떻게 알아요? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    AOC 대원들 대부분 다 뒈져버렸고, 그 사이에 당신네 파트너가 있는지 없는지 찾아서 기억해 줄 만큼 우리 안 친했던 것 같은데? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그랬나? 우리 나름 친했잖아, 너무 오랜만에 만나서 다 잊어버리기라도 했나? (협력 했던 기억은 남아있다. 리리, 라는 이름을 가진 사람 옆에 있던 분홍색 머리... 코튼의 이름도 기억하고.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    코튼 캔디도, 행방을 모르나?  \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ㅡ그 이름 부르지 말아줄래요? (손가락 들어올리고, 조용히 하란 듯 당신 바라본다.) \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    아, 일부러 생각하지 않고 있었는데. 그 멍청한 사람. (후우. 짧게 한숨 내쉬고) 쌍방 간에 그런, 아파 보이는 건 그만 건드리자... 응? 아파 뒈지겠다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    (의자는 거들떠도 안 보고, 테이블 위에 건들거리듯 걸터앉았다가) \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    뭐, 지금 대부분 다 뒈졌어요. 그놈의 사고 때 소장도 죽어, 대원들도 대부분 뒈져, 아, 그래. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    당신도 팩. 죽어버렸지? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    우리 언니도 죽어버렸고. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그랬지, 응, 멋지게 퇴장 하고... 그대로 내려가면 될 줄 알았더니. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    누가 억지로 또 무대 위에 끌어올려놔서, 파트너가 필요 하단 말이야. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    이런. 어쩐다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    그 무대랍시고 있는 여기, 이미 다 부서져버린지 오래인데. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    통제도 안 돼, 치안도 엉망이야... (아, 내 탓 하려 하진 말아요. 어쩔 수 없는 일도 있기 마련이니까.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    전부 들으면 이성 판정 1/1d3, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 대화 도중에 위기감을 느낍니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이후 심리학 판정이 가능합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    1d3 (1D3) ＞ 3\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 이성 : 70 → 67 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>심리학</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">40</span>/<span class=\"inlinerollresult\">20</span>/<span class=\"inlinerollresult\">8</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">63</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이어서 관찰력 판정입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>관찰력</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">45</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문득 리리의 옆으로 시선이 옮겨갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아무렇게나 밀려난 소장용 테이블, 그 위에는 서류가 놓여 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 서류에 찍힌 문양은 당신이 연구소에서 본 것과 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n 려 수류탄에서 거리를 두고 바닥을 구르지만, 수류탄이 폭발하며 전면창이 깨집니다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    그 편이 짜릿하잖아. 그치? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    잘 가, (하고, 손 휘적) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    굉음과 함께 큰 여파가 발생합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    AOC 건물 창문 밖으로 튕겨져 나온 탐사자의 뒷목을 타고 식은 땀이 흐릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잊고 있었나요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    소장실은 최고층입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 AOC는 지상 37층까지 있는 빌딩이었죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    교육 판정입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>교육</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">60</span>/<span class=\"inlinerollresult\">30</span>/<span class=\"inlinerollresult\">12</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">71</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    무언가 실마리를 찾을 수 있을 것 같은 타이밍이지만, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    살던 집 근처의 37층짜리 아파트가 125m 가량이었다는 쓸모없고 무서운 정보만 깨우칩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 아무 장비도 없이 125m를 그대로 추락합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    거꾸로 된 세계가 빠르게 스쳐지나고, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    눈을 질끈 감은 그때……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    쨍그랑!!! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    누군가가 당신을 잡아 채 옆건물 창문을 깨고 그대로 난입합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    사방으로 창문 파편이 파티클처럼 날립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    팽팽하게 한계까지 당겨진 로프가 탄력 있는 소리와 함께 풀리고, 누운 당신의 위로 엎어진 사람이 크게 어깨를 들썩입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    익숙한 색깔의 머리카락이 이리저리 흩어지더니, 숨을 들이쉬며 몸을 일으킵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지나치게 가까운 거리에 코와 코가 가볍게 맞닿습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    세피르 해킷, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯 바이런과 재회합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"info","html":"\n    https://jukebox.today/kkang0809 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짧은 침묵, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ‘생전'의 KPC와 만나는 게 얼마만인지 모르겠습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그건 그러니까, 당신이 AOC 옥상에서 손 하나만 붙잡고 매달려 유언을 남기던 순간이었나요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    감회에 젖을 시간도 없이, KPC는... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 멱살 엉!!! 씨익씨익 (choice 멱살 엉!!! 씨익씨익) ＞ 엉!!!\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어라... 울고 있는 것 같습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (당신과 시선이 맞닿으면, 억울하다는 것도 같고, 또는 화가 난 것도 같이 잔뜩 일그러진 표정을 지은 채로...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...왜, (목소리가 볼품없이 떨리다 결국 삑사리가 나고 맙니다.) 왜ㅡ왜, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    왜 살아있다고, (퍽, 주먹쥔 손으로 당신의 어깨를 한 번.) 말이라도 해 줬으면...!! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어이쿠, 내 마지막 기억이 맞으면... 아까 그 상황에서 코만 닿는 게 아니었을 텐데. (어깨를 퍽, 때리는 탓에 이쪽도 목소리가 한 번 흔들린다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나도 내가 살아있는 걸 알게 된지 몇 시간... 아니, 몇 분 안 됐거든. (미안해, 하고 작게 속삭인 다음에는 네 어깨 그대로 감싸 안아 꾹, 껴안는다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (주먹쥔 손이 두어 번쯤 더 당신을 향했다가, 자신을 껴안는 손길이 느껴지면 하던 양 멈추고 입술만 꾹 깨무는 것입니다. 잇새로 끅, 흑, 하는 울음 섞인 숨소리가 자취를 감추려 하다가...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...제가, 제가 얼마나 놀랐는지 알, 알아요?! (당신은 도대체 왜 거기에 있었던 거냐고요, 하마터면 저는 당신을 또, 하는 말소리가 두서없이 흘러나옵니다. 그러고, 결국에는 당신 어깨에 눈가 묻어버리고는 소리내 울어버리는 것입니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 정말 바보에요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    응, 응, 그랬어~ (아이를 다루기라도 하는 듯한 목소리로 대꾸해준다. 떨어지고 있던 것을 붙잡아 당긴 것치고는 얼굴을 확인하자마자 울음을 터트리는 것까지... 기억 속의 '샬롯 바이런'이라 내심 안심 되었다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    뭐어, 내게 바보라고 하기에는 너도 만만치 않지... (천천히 등을 토닥이기도, 쓸어주기도 하면서 혼잣말인 양 말한다. 다 들으라고 한 소리지만.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    뭐, 뭐, 뭐라는 거야, 정말!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (훌쩍이거나, 또는 흡 하고 숨 참는 소리가 들리거나. 하여튼 당신의 옷-전혀 동의같은 거 받지 않았지만-한 켠이 축축하게 젖어들어갈 무렵 해서야 겨우 그런 볼멘소리를 낼 수 있었습니다. 얼굴을 쭉 당신 어깨에 묻고 있었으니, 어깨가 좀 따끈할지도...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (씨이. 입술이 또 습관마냥 톡, 튀어나옵니다. 몰라요, 당신 잘못이에요 이건. 같은 말을 어물어물 중얼이며 조금 더 그대로 있다 슬그머니 눈만 살짝 당신이 보이게 빼끔.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    간만에 재회해서 하는 말이 추궁이나 타박밖에 없는데... (흠, 하고 짧게 숨 내뱉는다. 시선이 마주치자 입꼬리 올려 웃는다.) 보고 싶었다고 솔직하게 말하지 그래. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아니면 먼저 말 해달라고 일부러 울고, 얼굴 숨기고... 그러는 건가? 추측이 맞으면 기꺼이 해주고? (콕콕, 다독이던 손이 슬그머니 올라와 네 뒤통수 가볍게 건드렸다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...! (그러자면, 화끈 뺨이 달아오르는 겁니다. 안 그래도 군데군데 붉었던 얼굴이 발갛게 되기까지는 얼마 걸리지 않았습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...당신, 진짜 못되게 구는 거 알아요!? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 다 알면서 꼭, 그렇게 말로 하는 못된 습관 좀 고쳐요! (아, 이번에는 확실히 억울하단 표정입니다. 눈썹이 조금 내려간 채로 구겨진 미간을 하곤 입을 삐죽.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이게 못되게 구는 건가? (전~혀 모르겠다는 듯이 드물게 눈 순하게 뜨고 마주했다. 그대로 고개 한 번 까딱인다.) 말로 하지 않으면 추측할 수밖에 없잖아. 난 확실한 게 좋더라. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그러니까 이건 내 나름의 애정표현이라고 생각해.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...당신, 그런, 그런 점까지 정말 못 된거라고요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    애정 표현은 무슨, (입 삐죽이다가, 오히려 저는 저답지 않게 사나워 보이게 눈을 치켜뜨고 당신을 바라봤습니다. 하지만 결국 말하게 되는 것은...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...보, 보고 싶었어요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    됐어요? (아주 틀린 말이 아니었기 때문일까요. 그렇게 말하고선 고개 팩 돌려버렸습니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    응, 어쩔 수 없이 해주는 느낌이 없지는 않은데... 그래도 말은 해줬으니 넘어가는 걸로 할까. (사납게 보이려 치켜떴던 눈도 잠시, 결국에는 보고 싶었다고 말하는 목소리에 저도 모르게 소리 내어 웃었다. 큭, 하고 짧은 웃음이 터져나온 다음에는 흘긋... 눈치 살핀 다음 헛기침 했다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나도 보고 싶었어, 샬롯.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (웃는 소리가 들리면 또 눈썹이 아래로 축 처지려 들었으나, 무어라 따질 새도 없이 뒤이은 말에 입만 삐죽일 뿐이었습니다.) 몰라요. 정말, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신이 그렇게... (이쯤 해서 표정이 조금 안 좋아졌습니다. 짧게 한숨쉬고) 병원에서도 당신 시체가 없어졌다질 않나. 그렇게 당신이 죽은 뒤에 내가 얼마나 마음고생한 줄 알아요? (에잇. 부러 콩 소리나게 당신을 한 번 더 툭 때렸습니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    최강의 크리쳐를 파트너로 두었으면 시체가 사라진다던가, 다른 사람들이 파트너 삼으려고 탐을 낸다던가... 그런 건 감수 해야지, 어쩌겠어? (으레 있는 일이라는 듯이 덤덤하다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    마음 고생도 하고, 다시 찾으려고 또 고생도 하셨나? (쿡, 검지만 세워서는 네 뺨 언저리 가볍게 눌렀다 뗀다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...흥, 당신, 너무 오래 전 일이라고 기억 못 하는 거에요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 분명 인간이었잖아요. (제 쪽이 크리쳐구요. 꿈이라도 꿨어요? 하며 눈 깜빡입니다. 잇, 그러면서도 뺨 쿡 눌리면 투덜이기나...) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자가 KPC를 달래든지, 기어코 한 방 때리든지, 아무튼 진정하고 나면... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC와의 마지막을 들을 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잿빛 하늘, 아자토스의 일부가 강림하는 순간. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    천둥과 번개가 안전지대에 내리꽂히고 곳곳에 크리쳐가 아닌 괴물돌이 날뛰며 민간인을 죽이고 찢어 삼키던 그때입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자와 KPC는 그들을 제압하고 민간인을 구출하며 어마어마한 수적 열세에서 간신히 버티고 있었습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그때, 뒤에서부터 날아온 뾰족한 삼지창이 탐사자의 배를 뚫습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    심해인의 웃음소리가 머릿속에 어지럽게 돌아다닙니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC가 황급히 당신의 어깨를 붙잡지만, ‘인간'의 몸인 당신은 속수무책으로 쓰러지고 맙니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    입을 달싹일 때마다 핏줄기가 입에서 흘러나오고, KPC는 당신을 등에 업은 채 자리를 벗어납니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    안 돼, 안 돼요, 제발... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    제 목소리 들리죠? 네? 정신 좀 차려 봐요, 제발요... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아스라이 멀어지는 목소리를 마지막으로, 당신은 KPC의 등에서 정신을 잃었습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만 KPC는 한참이나 당신의 시체를 업고 의사와 병원을 찾아다녔습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    고개를 든 탐사자, 문득 깨닫습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC가 들려주는 과거는 당신이 알던 이야기와 궤가 다릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 정신력 판정합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>정신</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">74</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 이야기, 어디선가 들어 본 적 있는 이야기입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어렴풋이 당신은 ‘리리 라클렛, 코튼 캔디의 이야기와 샬롯 바이런, 세피르 해킷의 이야기가 바뀌었음’을 깨닫습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    한 가지 다른 점이 있다면 KPC는 당신의 안드로이드를 곁에 두지 않았다는 것, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 이 이야기대로라면……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 정말로 죽었어야 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    조금도 생존의 여지도 없이. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그런데 어째서 테러가 발생한 순간으로 타임리프할 수 있었을까요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아무튼, 마저 재회의 시간을 나눕시다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ... (이상하다? 마지막으로 기억하던 것과는 부분부분 반전이라도 된 듯한 파편들에 고개를 갸우뚱 거렸다.) ...그랬던가? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 설마 기억에 이상이라도...?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 안 그래도 당신, 마지막으로 추적했던 장소가 그 이상한 사이비들 소속 연구소였단 말이죠, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... 역시 무슨 이상한 실험이라도 당한 거 아니에요 당신?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아~ 거기 지하에 갇혀있기는 했지.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    실험... 실험... 음, 나라고 안 당했으리라는 보장은 없긴 해.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 웄... 우아아앙... 분노!! (choice 웄... 우아아앙... 분노!!) ＞ 우아아앙...\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 다, 당신은 그런 이야기를 왜 그렇게 태연하게 해요오... (엉...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    결과적으로는 그들 덕분에 사지 멀쩡하게 돌아올 수 있었던 걸지도 모르니까? ...또 울어? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...참, 그러고 보니 델타... 오데트가 찾아왔었는데. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이, 이이. 안, 안 울어요!!! (괜히 주먹쥐어서 제 눈가 벅벅 문지릅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    오데트는 저희 측에서 지금 데려왔어요. 안 그래도, 예전에 쓰던 무전기가 갑자기 연결되어서... (거기가 마침 공교롭게도 당신이 있을 곳으로 추측된 장소긴 했지만요... 하고, 킁. 짧게 콧소리 냅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러니까, 곧 보실 수 있을 거에요. (당연히... 세피르가 자신을 따라 올 거라는 것을 전제하고 하는 말입니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    오... 그래? (안 따라갈 것처럼 반응한다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    갔을 때 환대 받지는 못할 것 같은데, 뭐랄까... 예감이 그래. (조금 전에 리리와도 한바탕 언쟁 벌이고 왔으니까...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그럼 전혀 예상하지 못했단 듯이 눈을 동그랗게 뜹니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    가, 같이 안 갈 거에요...? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아니, 환대 못 받을 리가 없잖아요, 무, 무슨 그런 이상한 예감을 믿고 그래요?! (조금 조급해집니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    같이... 흠... (고개까지 살짝 숙인 채 고민에 빠진 시늉을 한다. 길게 침음하며 흘긋, 눈치를 살폈다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    같이 갔으면 좋겠어? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 충격!!! 듀아아아 울먹슨 (choice 충격!!! 듀아아아 울먹슨) ＞ 듀아아아\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그으, 그야, 그야 당연하잖아요...!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 다, 당신 그러면 제가 당신 파트너인데도 이렇게 혼자 다니게 둘 거에요?! (뭐, 곧 이 발언이 거짓말인 걸 들키게-자의는 아니니 괜찮지 않을까요-되겠지만...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그동안 자의는 아니어도 방치 했으니 이번에도 방치하지는 말라는 거야? (눈 게슴츠레 뜨고 바라본다. 잠시 고민하는 둥, 마는 둥... 그리고는 못 이기는 척 고개를 끄덕여준다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    같이 가는 걸로 하지, 파트너 얼굴을 봐서. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 그제야 표정이 사르르... 풀립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ㅡ흠, 흠. 네에, 좋아요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이번에는 방치 안 하는 거로. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러곤 기분이 좋은지... 살그머니 손 내미네요.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    응, 방치 안 하는 거로. (네 말 따라 중얼거리며 내밀어진 손... 슬그머니 깍지 끼워 잡았다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    갈까?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    까, 깍지까지 끼라곤 안 했는데요! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그래도 그렇게만 말하고 굳이 풀진 않습니다... 흠흠. 뭐, 좋은 게 좋은거지.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    네에. 같이 가죠! (그러곤 샐룩 웃어버립니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    괜히 싫은 척하긴. (항의와는 달리 풀어지지 않은 손 내려다본다. 이어서 '방금 뭐라고 했어요?' 같은 되물음이 돌아오기 전에 어디로 향하는지도 모르면서 앞장 서기 시작했다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어디로 가야되나? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이동하는 길은 그립고도 무척 익숙합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여전히 어수선한 길거리 곳곳에는 그리운 가게나 건물을 발견할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    거대한 행성이 나타나고, 지구 멸망이니 뭐니 세상이 어수선해도 변하지 않는 것은 분명히 있네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    낯익은 연립 빌라 안으로 들어와서 4층, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가장 안에 있는 룸의 문을 열면 벽을 억지로 허물어 두 집을 합친 듯한 공간이 나옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    일반 대원으로 보이는 사람 열 명 남짓, 콘라드, 그리고 침대 위에 누운 오데트가 있습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저희 왔어요... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC가 탐사자를 데리고 그 안으로 들어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드가 탐사자를 보고 가볍게 눈짓합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    옛 동료를 만나니 감회가 새롭네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    동...료? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뭐 하여튼! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    비록 좋은 사이는 아니었을지라도요. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    어서 오세요. (시선 피함...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    별로 안 반기는 것 같은데, 샬롯. 어떻게 된 거야? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    에, 네?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그, 그야... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 우리그렇게사이좋진않았으니까요 오데트봐봐 몰라쟤이상해요!! (choice 우리그렇게사이좋진않았으니까요 오데트봐봐 몰라쟤이상해요!!) ＞ 몰라쟤이상해요!!\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 저도 모르겠는데요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그래도 저는 세피르를 반기니까 된 거 아닐까... 요오. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그러니까... 여기서 나는 친구가 샬롯밖에 없는 외톨이다? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그으, 그렇게 말하면 어떡해요...! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    좋게 봐요, 좋게! (톡) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    좋게... 좋게... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그럼 샬롯에게 편애 받고 있다? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    (가만 듣다 보니 뭔가 말하려다 분위기 좋아보여서 ㅋㅋ 저기 뭔가 정리해 둔 거나 가지러 갑니다 ㅋㅋ) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 정말이지!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    편애받고 있다뇨!! (툭팍팍) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 맞긴해 무슨그런단어를 (choice 맞긴해 무슨그런단어를) ＞ 무슨그런단어를\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    단어가 너무 과하잖아욧 (툭팍팍) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아야, 아야. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    죽다 살아난 사람을 대하는 건데, 좀 편애 해도 괜찮잖아? 아니야? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 그렇긴해 캬옹캬옹 (choice 그렇긴해 캬옹캬옹) ＞ 그렇긴해\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...그, 그런가? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아니, 당신이 자꾸 그렇게 말하니까 넘어가려고 하잖아요! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (톡 때립니다;) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    저기 있지, 혹시 연애는 다 했을까? (그떄 때마침 기웃거리는 파란머리.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음, 아직 덜 했다고 하면 시간 더 주나? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    올. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    choice 준다 안준다 (choice 준다 안준다) ＞ 준다\n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    즐거운 연애 시간 되시길... (슬슬슬슬슬) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    방해꾼 쫓아냈어. 어때? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아, 아니!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    쟤를 쫓아내면 어떡해요?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    안돼? 쟤한테도 볼일이 남아있어?  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나 없는 동안 재밌게 논 거 아니고? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 당신은 무슨 말을 그렇게... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 솔직!! 모르쇠 (choice 솔직!! 모르쇠) ＞ 모르쇠\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신이 계속 옆에 있었으면 되잖아요. (삐죽... 하곤. 콘라드가 들고 있던 자료나 홀랑 제가 가져와 읽어봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... (마지막 말에 할 말 잃고 큼, 하며 의미 없는 기침 소리 낸다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이번에는 어디 안 갈 거야. (확신은 못 하지만... 말만큼은.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...흥. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    말이라도 그렇게 해 주니까 좋네요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러곤 황급히 손 휘젓곤 다른 화제로 넘겨 버립니다.) ㅡ하여튼, 하여튼! 콘라드가 정리해 준 거나 같이 봐요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    네, 네, 그러지요~ (하고는 고개 숙여 손에 들려있는 종이 내려다본다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    대강 정리하자면 요컨대 이런 내용입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지금 다가오고 있는 행성과 안전지대 전체에 퍼져 있는 사이비 종교에 대한 분석이 주욱 이어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 문단의 끝자락에는 이런 표시가 되어 있습니다. '단체 사이의 연관성 : 높음. 행성을 부르는 의식을 했든, 또는 어떤 기술을 사용했든지 간에. 명확한 원인 확인 필요.' \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그러니까, 이번 임무는 이거겠어요. (다 보셨죠? 하고 슬금...) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    멸망의 진상 규명과 대처 방안 모색을 위해, 해당 종교 교단에 잠입 수사 임무를 드리겠습니다. 와아. (박수 짝짝짝...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    돌아오자마자 너무 큰 임무를 맡게 되지 않았어?  \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    앗, 원래는 쟤한테만 주려던 임무인데. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그럼 겸사겸사 세피르 씨도? (땡잡은 표정) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이거 거절하면 화 낼 건가? (샬롯 봄) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 제가열심이하께요...뺑이친딘 쪼끔요... 힝외로워 (choice 제가열심이하께요...뺑이친딘 쪼끔요... 힝외로워) ＞ 제가열심이하께요...뺑이친딘\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저 혼자 가도 괜찮아요... 응, 열심히 해 볼게요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (말은 그렇게 했는데 영 아쉽... 섭섭... 한 것이 표정에 그대로.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    농담이야, 당연히 같이 가야지.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    방치 안 하기로 약속 하고 왔잖아? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (흠, 흠. 그럼 얼굴 표정 관리한답시고 주먹쥐어 입가에 댑니다. 입 가리고 흠흠, 기침한 뒤) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    뭐어, 그렇게 말해 주실 거라고도 생각했어요...! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    행성은 한층 더 가까워진 것 같다는 착각이 듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아니, 착각이 아닐지도 모릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어쩌면 인류의 마지막이 될지도 모를 전쟁이 다가오고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    전면전이 될 지도 모른다는 콘라드의 말을 끝으로, 여러분들은 잠시간의 휴식을 즐깁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이른 새벽이 되면 샬롯이 당신을 깨웁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이미 준비는 다 되어 있는 것 같군요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저어, 지금쯤 일어나셔야 잠입 시간에 맞출 수 있으니까요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (흔들...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음... (깨긴 했지만... 두 눈 꼭 감고 뒤척이기만 한다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 눈치챘다 아님... (choice 눈치챘다 아님...) ＞ 아님...\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (ㅋㅋ) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (왜 안 \n    탐사자는 전해 받은 지도를 통해 [역사자료실], [수행실], [신전], [간부실], [교주실]에 갈 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    '아마' 정확할 걸요? (찜찜...한 기분으로 지도 훑어본다...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    여기부터 차례대로 둘러볼까. (콕, 하고 역사 자료실 가리킨다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그럼 옆에서 같이 위치 확인하고) ...자, 자기가 책임 지기 싫어서 그러는 걸 거에요... 아마? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러니까, 역사자료실부터인 거죠? (고개 한 번 끄덕입니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    출발~ (텁, 샬롯 양 어깨에 손 얹어놓고 살살 밀며 걸음 옮긴다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ역사자료실 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    크리쳐 사건 발발 이후, 등장한 모든 상급 크리쳐와 일반 크리쳐, 그리고 대부분의 크리쳐 사건에 관해 차곡차곡 정리되어 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    크리쳐를 향한 광적인 열의와 연구는 AOC 못지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    대부분 탐사자와 KPC 역시 숙지하고 있는 지식입니다만, 탐사자가 아는 과거와 ‘특별히’ 달라진 부분이 있지 않나요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어떤 날을 기점으로. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    선언 혹은 지능 판정이 가능합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>지능</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">60</span>/<span class=\"inlinerollresult\">30</span>/<span class=\"inlinerollresult\">12</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">72</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>행운</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">72</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어디 보자... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    왜 여기만 이렇게 두껍지...? (하고, 책 한 권 꺼내듭니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 샬롯의 손에 들려나온 것은 아자토스의 찌꺼기 강림 사건과 안전지대 테러 사건입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    해당 건을 조사한다고 선언할 경우, 핸드아웃이 지급됩니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어디... (뒤편에 서서 샬롯 머리 위에 편안~하게 턱 얹는다. 꽤 두꺼운 책의 페이지를 하나씩 넘겨보기 시작한다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 이번에야말로캬옹 쀼... (choice 이번에야말로캬옹 쀼...) ＞ 이번에야말로캬옹\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저기, 제 머리를 거치대처럼 쓰지 말아 주실래요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (이이이... 이이이... 입 삐죽입니다. 들고 있던 자료 잘 보이게 팔락팔락 하고는 있었습니다만, 이건 별개의 문제죠!) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    첫 장의 내용을 통해 [핸드아웃 : 아자토스의 찌꺼기 강림] 을 습득합니다. \n  "},{"y":"say","sp":"아자토스의 찌꺼기 강림","ts":null,"tab":"info","html":"\n    지금으로부터 4년 전이라고 적혀 있습니다. 어떻게 알아냈는지, AOC의 연구가 외계신을 소환하는 초석이 되었다는 것부터 진행 과정과 결과까지 상세하게 적혀 있습니다. 기록에 의하면, 코튼 캔디와 리리 라클렛은 헬기를 타고 바로 옥상으로 직행했으며, 거기에는 발을 저는 늙은 연구원 하나가 동승했다고 합니다.<br><br>이후로는 탐사자도 아주 잘 아는 전개가 이어집니다. ‘그들은 한껏 저항했으나 외계신에게 이기지 못했고, 코튼 캔디가 희생하였으며, 리리 라클렛은 홀로 남았다.’<br><br>그 사건에 휘말려 ‘사망’한 AOC 대원들에 관해서도 기록되었습니다. 정면을 보고 있는 탐사자의 증명사진 역시 그 페이지에 끼어있습니다. 기묘하게도, 붉은 글씨로 탐사자의 사진 위로 ‘특이점의 영웅'이라고 적혀있습니다.<br><br>마지막에는 천문학 관측이라는 단어와 함께 휘갈겨 쓴 문장이 눈에 띄네요. ‘계측할 수 없는 거리의 우주 너머에서 지구까지 보낸 신호 확인' ‘외계의 크리쳐?' 라는 말이 있습니다. 아니, 외계에 무언가 있다면 그건 크리쳐가 아니라 외계인 아닐까요……. 말을 맙시다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...외계인도 크리쳐라고 보는 건가? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    외계인이요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (외계인이 어떻게 크리쳐가 된다는 거지? 눈 깜빡입니다. 그러다가 또 바락!!) 아이, 정말이지! 떨어져서 읽자니까요! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (다음 장으로 넘겨요? 하고 입 삐죽.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜에, 이 편이 보기 더 편하단 말이야. (꾸욱, 꾸욱, 괜히 몸 앞으로 수그려서 누른다.) 다음 장으로 넘겨줘~ \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (자, 자꾸 누르지 말라니까아아... 목소리가 조금씩 같이 눌리는 것 같은 건 기분 탓일까요. 꾹꾹 눌리면서도 다음 장 넘겨봅니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [핸드아웃 : 안전지대 테러] 를 습득합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [핸드아웃 : 안전지대 테러] 의 경우에는 오컬트, 혹은 교육(어려움) 판정 성공 시 추가 정보를 지급합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>교육</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">60</span>/<span class=\"inlinerollresult\">30</span>/<span class=\"inlinerollresult\">12</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">91</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"안전지대 테러 (1)","ts":null,"tab":"info","html":"\n    이 파일에는 화재 재료의 조달, 경로 장악, 신 정부 사람들과 대다수의 AOC 대원들이 자리를 비우는 날을 비롯해 그날의 상세한 계획이 적혀 있습니다. 옆으로 한 장 넘기면, 안전 지대 전체를 상공에 찍은 듯한 지도에 화재의 시작 지점을 표기했습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    안전지대 테러... 라면... (잠시 말을 멈춘다. 뜨거운 열기와 함께 신체 일부가 관통 당하고, 쓰러졌던 기억은 희미하게 있었다. 그리고 무전기 너머에서 들려오던 절박한 목소리의 주인은...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그런 생각에 잠기면, 떠오르는 것은... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    추가 정보를 지급합니다. \n  "},{"y":"say","sp":"안전지대 테러 (2)","ts":null,"tab":"info","html":"\n    전체적으로 둥근 모양입니다. 오컬트, 혹은 교육(어려움) 판정 성공 시 가벼운 기시감과 함께 이것이 어떤 마법진이나 주문 같다는 생각을 합니다. 오컬트 어려움 이상의 성공 시 ‘소환진'이라는 사실까지 알게됩니다.<br><br>얼마나 많은 사람이 죽었는지는 기록되어 있지 않지만, 잊으려 해도 잊혀지지 않는 풍경입니다. 일렁이는 불꽃, 곳곳에서 난무하는 비명소리, 그리고 누구든 제발 대답해달라고 빌던 KPC의 목소리까지. 그건 탐사자의 정신을 잃기 직전, 마지막 기억이기도 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    읽고 있자면, KPC는 파일에 붙어있는 탐사자의 증명사진을 떼어냅니다.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그건 왜 떼어내? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    갖고 싶어서? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 여기두기시러서 장난... (choice 여기두기시러서 장난...) ＞ 장난...\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...그, 그냥요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    아니, 아니. 여기다 당신 얼굴 사진 남겨 두면 좀, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...몰라요!! (이런 걸 왜 물어봐요?! 하고 톡 밀어냅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    갖고 싶으면 갖고 싶다고 말을 하지~ 따로 줄 수 있었는데. (괜히 한마디 더 거들어 놀리고는 작게 웃는다. 밀어낸 탓에 멀어졌던 거리 도로 좁히고는 들어올 때와 같이 어깨 붙잡는다.) 다음은 수행실이다~ \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...저, 정말이지, 그런 거 아니거든요?! (결국 얼굴이 발갛게 달아오릅니다. 잡, 잡지 마요! 라고 빽 소리지르지만 결국 이끄는 대로 발걸음 옮깁니다...) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ수행실 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    신도들이 기도를 올리고 정신을 갈고 닦는 방이라고 대외적으로는 소개되는 것 같습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    의외로, 문을 열면 친숙한 느낌의 휴게실 같은 분위기입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    현재 미사중이므로 사람들은 없습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    벽면에 사진들이 빼곡하게 걸려 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자나 KPC가 입은 것과 비슷한 옷을 입고, 다양한 신도들과 가족처럼 다정한 표정으로 웃으며 찍은 사진들입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이런 온기 어린 시선과 얼굴로 안전지대에 테러를 일으킨 종교라 생각하니, 어쩐지 소름이 끼칩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자, 정신력 판정 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>정신</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">80</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ...관찰 판정?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>관찰력</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">79</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-fail\"><b>실패</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    시간을 들여 보다 보면, 유달리 사진에 많이 찍힌 열렬한 신도들 몇몇의 얼굴이 낯익다는 생각이 듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    기억나는 것은 이쪽을 바라보던 일부의 선망 어린 시선들, 당신의 손을 잡고 구출되던 벙커 속의 시민들이라는 사실입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고, 그들은 AOC나 정부 조직이 아닌데도 탐사자가 크리쳐라는 사실을 알고 있는 유일한 일반인들입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그도 그럴게, 모두의 앞에서 KPC와 치고받고 싸웠으니까요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇다면 이 벙커에 종교 시설이 세워진 이유도 이제는 이해할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러나 절대로 죽지 않는 자신들의 구원자에 멋대로 어떤 기대와 어떤 열망을 품었는지는, 당신은 모를 일입니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 같이 보다가, 이내 눈치챘는지 얼굴이 조금 멀겋게 질립니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...그, 그 때 비밀 유지에 신경을 못, 못 썼나, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...사후처리팀이 알아서 했을 거라고, 그렇게 넘겼나 봐요... (제 탓, 이네요. 하고 그대로 얼어붙습니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜 그렇게 바들바들 떨고 있어? (사실상 그 자리에 단단히 굳어져 있는 것이었지만... 사실과 다른 말 하면서 네 뺨 가볍게 건드렸다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (뺨 콕 건드려지면...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 듀아아아... 얼음... 그그그치만요 (choice 듀아아아... 얼음... 그그그치만요) ＞ 그그그치만요\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그, 그야, (...이런, 이런 사태를 초래한 원인을 제공했단 거잖아요? 하는 말까지는 차마 입 밖으로 내지 못 했습니다. 뺨이 눌리고 있는 것도 눈치 못 채고...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그야? (가만히 눈 들여다보다가 뺨 콕콕, 누르고 있던 손 떼어낸다.) 이미 벌어진 일인 거 어쩌겠어, 그리고... 그런 광경은 일반인들 기준에서 이런~ 기대를 하기에도 충분하지. (혼란한 세상이니 당장 잡히는 거라면 뭐든 의지하고 싶었겠거니...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아무도 네 탓 안 해.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어쩐지 울 것만 같은 눈입니다. 파랗기만 한, 자칫 보면 바다의 색과도 같은...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ㅡ(하지만, 하며 입이 벙긋거리다가 다물립니다. 손가락이 꼼질거리다가... 시선마저 잠시 땅으로 떨어집니다. 하지만, 여기서 쭉 이렇게 쳐져 있기에는 조사에 방해가 되겠지요.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...제, 제대로 제 책임은 인지했어요. (어떻게든 이 사태를 해결할 의무가 더 생긴 거니까요, 네, 입술 앙다뭅니다. 당신 옷소매 꼭... 잡습니다.) \n  "},
