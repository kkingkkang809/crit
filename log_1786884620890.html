y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    \"그 열쇠는 특이점의 영웅입니다.\" \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    조사가 종료되면 밖에서부터 사이렌 소리가 들립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그와 함께, 리리 라클렛의 목소리도 들려옵니다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    아. 아. 잘 들립니까? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    안전지대의 시민 여러분들께 공지 사항이 있겠습니다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    긴급 소집입니다. 시민 여러분들께서는 지금 즉시! A시의 광장으로 모여주셔야겠습니다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    불응하는 자는, 뭐... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    그래. 사살하는 것으로 할까요? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    하하! 뭐, 다시 공지 할 필요는 없죠? 빨리빨리 모여 주세요. 다 뒈지기 싫으면. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    목소리는 뚝 끊어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    길거리에는 당황한 표정으로 우왕좌왕하는 사람들의 모습이 보입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    저 멀리서부터 안드로이드 군단이 파도처럼 밀려옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    표정 없는 얼굴의 안드로이드들이 어물쩍거리는 시민들을 하나씩 끌고 데려갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    더 이상 망설일 수 없습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    리리 라클렛과 저 대군을 제압해야 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다행인 점은, 탐사자가 중앙 관리 체제를 제압하는 방법을 알고 있다는 것일까요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자, 떠올려 봅시다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    한 번 악신을 죽여 본 자의 기억을 되짚자면, 그러니까... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    먼저는 쉴드를 파괴해야 했죠? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만, 시간이 촉박합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    함께 쉴드를 파괴하려다가는 늦습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 KPC에게 이 상황을 해결할 방법을 알려줄 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    AOC 사옥과 X 제약회사로 나누어 향하자... 뭐 그런 말이요. 선택지 정도는 KPC에게 주어도 좋겠습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...음, 샬롯? 중앙체제를 멈추기 위한 방법이 하나 있는데... 할래? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어느새 얼굴이 심각해져서는... 어쩌면 좋지? 따위의 고민을 하느라 한참 정신이 없었습니다. 그러다 당신 말을 듣고 나면 깜짝 놀라고.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저, 저, 저걸 멈출 방법이 있다구요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그런 걸 어떻게 아는 거야?! 라는 생각도 조금 섞인 어리둥절한 얼굴로 당신 봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    다 아는 방법이 있지. 콘라드처럼 '아마'라는 말은 안 붙일 거니까 걱정 말고~ \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    AOC 사옥, X 제약회사 각각의 옥상에서 보면 중앙 체제를 보호하고 있는 쉴드가 보일 거야. ...한 사람이 양쪽 오가면서 부술 수는 없으니, 나눠서 다녀오자.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...흠, 맹 해서 혼자 보내도 되나? (걱정...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (눈 동글동글하게 뜨고 가만 쳐다보며 설명 듣다, 약간 늦게 발끈합니다.) ...제, 제가 어린앤줄 아세요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흥, 총기 조립법도 몰라서 가르쳐줘야 했던 쪽이 누군데. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그럼, 음... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (거리를 가늠해 보더니,) 제가 AOC 옥상 쪽으로 갈게요. 그 근처 지리를 그나마 잘 아니까... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그거 가르쳐 주고 어디의 누가 굉장히 뿌듯한 표정으로 있었던 것 같은데... 기분 탓인가? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    좋아, 그럼 나는 제약 회사 쪽으로 가는 걸로 하고... (무기도 있고, 가는 길도 충분히 알겠다, 곧바로 출발하면 되는 일이기는 하지만...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    가서 다치고 오지 말고, 멀쩡하게 보는 거다? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그, 그, 그런 플래그 같은 말 하지 말아요!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    또 그 때처럼 당신 혼자 죽어서 오면 어떡해요?! (하고 괜히 한 대 툭... 칩니다. 어쩐지 억울해 보이는 표정입니다만...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...당신도, 다치지 말고 와요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    꼭이에요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...플래그 같았나? (모르쇠~하며 시선 다른 곳에 주고는 딴청 피운다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    약속은 하고 갈게. 자, 자. (동의 구하지도 않고 네 손 덥썩 잡아다가 새끼 손가락 고리 걸고, 엄지 꾸욱 도장 찍고 손바닥 한 번 스치는 일련의 과정 거친다.) 약속~ 도장~ 복사~  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 이거알아 우?! (choice 이거알아 우?!) ＞ 우?!\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어벙하게 손바닥 가지고 하는 대로 조금 어정쩡하게 이것저것 손동작 하고 나면 눈 동그랗게 뜨고 당신 보는 것입니다. 그러다가 조금 늦게 풉, 웃음 터지고.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...흠, 흠, 뭐어. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    약속까지 하고, 도장도 찍고, 복사도 한 거에요! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러면 여기서 이별입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 각자 향할 곳으로 걸음을 옮깁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 이별하고 나면, 거리 곳곳에서 총 소리가 들립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드와 통신이 연결됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지금 안드로이드 대군이 시민들을 끌고 가며, 거부하거나 저항하면 사살하고 있다고 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    서둘러서 X 제약회사로 가야 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 달리고 달린 끝에 제약 회사에 도착합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    쉴드를 파괴하기 위해 황급히 옥상으로 올라가던 그 때, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    쾅!!! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 리리 라클렛에게 기습 당합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    굉음과 함께 벽이 부서지고, 당신을 옥죈 두 팔이 끝없이 아래로 끌고 내려갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 건물 바닥을 뚫고 연구소까지 떨어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 층은 탐사자가 깨어난 곳입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    차가운 바닥을 걸어오는 구두 소리가 앞 뒤에서 들립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    간신히 몸을 추스를 탐사자의 앞에는 리리 라클렛이 있습니다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    아, 설마 죽은 건 아니지? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    그러면 좀 섭섭해... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    내가 기껏 허락해 준 건데. 금방 죽어버리면 섭섭하지. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아...~ 머리야...  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    반쯤 죽은 것 같은데, 좀 봐주면 안 되나? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    그러면 더더욱 안 된다니까? 뭐야, 왜 이렇게... 진심이 아닌 것처럼 굴지? 짜증 나게! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    때마침 인기척을 느껴 뒤를 돌아보면 사이비 종교의 교주가 있습니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    아아, 저를 기억하십니까? \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    정말로... 다시 만나고 싶었어요! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    바로, 당신에게 사진을 찍어도 되냐고 물어본 사람입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    너... 너 누군데? (잘 기억이 나지 않는다는 듯, 눈 게슴츠레 뜨고 한참을 바라본다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    내가 다시 만나고 싶었던 얼굴도 아니고... ... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    교주는 그 말에도 아랑곳 않은 채 황홀한 표정으로 연구소에 있는 크리쳐들의 실험관을 매만집니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    정말 다행히, 모든 크리쳐가 증발되어 사라질 때 이들은 사라지지 않았어요. 보호된 거죠. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    아, 그렇지... 뭔가 궁금하신 거라도 있습니까? 성심 성의껏 대답하겠습니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    저는, 당신을 정말 오랫동안 기다렸어요...! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래, 일단... 내 기억과 맞지 않는 부분들이 조금 있는데... 설명을 해줄 수 있나? (보호? 보호 되었다면 대체 누구의 의해서? 같은 생각이 들었으나 잠시 미루어둔다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    내 기억에는 리리 라클렛의 자리에 샬롯 바이런이 있었단 말이지... \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    아아, 맞아요! \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    기억에 공백이 있어 혼란스러우시죠, 이해합니다! \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    그 질문에 대한 해답은 의외로 간단합니다... \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    당신께서는 줄곧 '돌아왔다'고 생각하셨겠지요? \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    아뇨, 아닙니다. 이건 타임 리프 따위가 아니에요! \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    이곳은 어떠한 선행 조건으로 인해 '당신이 죽은, 영웅이 없는 세계'. 즉 평행 세계입니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    우리들의 차원에서는 당신이 불의의 사고로 수명을 다해 죽어버렸기 때문에, 우리는 다른 차원에서 다시 당신을 데려와야 했습니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    당신은 특이점의 영웅, 이 세상에서 가장 강력한 크리쳐이자 인간이기 때문입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    평행 세계라는 사실을 알게 되면, 탐사자는 메타적으로 정보를 습득합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    제복이 당신이 알던 디자인이 아니었던 이유, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    무기의 사용 방식이 낯설었던 이유, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이제는 이해할 수 있을 것입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이곳은 당신이 알던 세계가 아닌, 다른 세계의 다른 AOC입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이성 판정 1d3/1d5 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>이성</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">64</span>/<span class=\"inlinerollresult\">32</span>/<span class=\"inlinerollresult\">12</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">56</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-normal\"><b>보통 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    1d3 (1D3) ＞ 2\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 이성 : 64 → 62 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    잠깐, 그럼 '내' 샬롯이 아니야?  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이곳의 '세피르'는 죽은 게 맞고? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    교주는 말을 계속 이어갑니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    아, 그래요. 당연하지 않습니까! \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    원래 당신이 있던 세계는 멸망했습니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    크리쳐가 지구에 나타난 모든 세계의 지구는 멸망했습니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    정확히는, 당신이 살아있는 모든 우주가 멸망했습니다! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇다면, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    원래 차원에 혼자 남겨진 KPC는? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ㅡ뭘 새삼스럽게 이제 안 척, 충격받은 척이야? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    죽었겠지. '네' 파트너니, '이 곳'이니 뭐니. 전ㅡ부. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이성 판정 1d8/1d10 \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>이성</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">62</span>/<span class=\"inlinerollresult\">31</span>/<span class=\"inlinerollresult\">12</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span cla :"\n    유리 안에 박제된 당신은 영원히 죽지 못한 채 멍하니 우주 아래를 굽어보고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    귀부터 들어온 신들의 목소리가 뇌를 지나 흘러들어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “어때, 영원한 건 좋지?” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    음성은 애달픈 신도들의 구걸로 바뀝니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    우리를 구했잖아 그러니 우리의 요청을 들어줘 당신을 위해서라면 목숨을 바칠 수 있어 그걸로 당신이 완벽해진다면 세계의 질서를 위해 홀로 살아남아 마지막 남은 인간으로서의 의무를 다해 그리고 영원히 영원히 영원히 영원히 영원히 혼자 고통 받는 거야  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뒤에서부터 나타난 수많은 손들이 당신의 팔을, 몸을, 다리를 잡아당깁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하늘거리는 소매가 드러나면서 보이는 이리저리 비틀린 관절들이 기괴합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    붉게 거품이 올라오거나 썩은 흔적이 역력한 팔들이 대부분입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    크리쳐를 동경한 나머지 스스로 팔에 크리쳐 세포를 억지로 주입한 후유증입니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    ㅡ여기까지, 이미 되돌릴 수 없을 만큼 왔어요... \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    당신을 소환하느라 일으킨 화재 때문에 몇 명이 죽었는데, 그걸 의미 없게 만들 생각인가요? \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    물론, 그러셔도 상관 없습니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    이미 늦었어요. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    아무것도 바뀌는 건 없습니다. \n  "},{"y":"say","sp":"교주","ts":null,"tab":"main","html":"\n    정해진 각본대로 여긴 멸망하고, 당신은 가장 먼저 도달하는 신의 선택을 받는 겁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [SYSTEM : 인간 혐오] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    광기 : 인간 혐오 상태에 빠집니다. \n  "},{"y":"say","sp":"광기 : 인간 혐오","ts":null,"tab":"info","htm "say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [RETRY : PRESS ANY KEY] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [COIN : 0/5] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    물론 재개하고 싶어도 할 수 있는 건 없습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이런 모습으로는 기어가는 게 고작일 뿐입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지불할만한 재화도 없습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 아무것도 없는 곳에서, 곁을 지켜주는 사람도 없이 그저 호흡합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 십 년이 흐릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아니, 백 년이었을지도 모릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    혹은 천 년, 만 년, 일억 년, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어쩌면 몇 초였을지도 모르는 순간이 지납니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    발걸음 소리가 들려옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    처음 보는 얼굴의 인영이 가까이 다가와 당신의 곁에 앉습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그는 혐오스러워하는 기색도 없이, 차분한 표정으로 당신에게 물을 주고 담요를 덮어줍니다. \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    누가 그러더라? 내가 세계를 구했다고. \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    난 그냥 당연한 일을 한 것 뿐인데... \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    아니다. 그냥, 내게 입력된 정보가 나를 그렇게 이끌었던 것도 같아. (헤 웃는다.) \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    그래도, 누군가를 위해 행동하는 순간엔 여태까지의 안드로이드 생 중에 제일 살아있는 것 같다고 느꼈던 것도 같아. \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    나, 어쩌면 영웅이 되고 싶었을지도 모르겠네... (헤헤, 또 웃는 소리가 났다.) \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    저기, 있잖아. \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    영웅의 삶은 많이 힘들어? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    NPC는 딱히 대답을 요구하지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 사람은 그렇게 열흘 동안 당신의 곁을 지킵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어쩌면 10분이었을지도 모릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    시간이 흐르자, NPC는 자리에서 일어납니다. \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    이만 가 봐야 할 것 같아! 나, 내일도 일하러 가야 하거든. \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    그래도 함께 있었던 동안 즐거웠으니까... \n  "},{"y":"say","sp":"멜루진","ts":null,"tab":"main","html":"\n    이거. 줄게. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    NPC가 천장에 뚫린 틈새에 은색 동전을 밀어넣습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    띠링, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    경쾌한 소리와 함께 화면에 적힌 글자가 바뀝니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [COIN : 1/5] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 도로 눈을 감습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아무것도 하고 싶지 않은 나날들이 다시 이어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 그 사이에 많은 사람들이 당신을 다녀갑니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    이런, 주무시고 계셨군요... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    안 좋은 타이밍에 찾아뵈었네요. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    그래도 다시 뵈어서 정말 기쁩니다, \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    정말 멋진 활약상이었어요. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    특히, 샤를 님에게 맞서 싸워 활약할 때에는 아무리 저라도 손에 땀을 쥐고 보지 않을 수가 없었습니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    보잘것 없지만 상영료입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    달그락, 동전이 떨어지는 소리. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [COIN : 2/5] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    쉬잇... 방해하지 말자. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    리리, 이 쪽으로 와. \n  "},{"y":"say","sp":"리리","ts":null,"tab":"main","html":"\n    이잉. 간만에 얼굴 보고 대화하나 싶었는데. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    그래도 너는 많이 얘기한 축에 속하지 않아? 난 그때 헬기에서 만나뵌 게 마지막이었는데. \n  "},{"y":"say","sp":"리리","ts":null,"tab":"main","html":"\n    허, 참 내. \n  "},{"y":"say","sp":"리리","ts":null,"tab":"main","html":"\n    그거랑 이거랑 같아요? 따지자면 저도 제정신으로는 그 때가 마지막이었거든요? \n  "},{"y":"say","sp":"리리","ts":null,"tab":"main","html":"\n    그리고 그거는, 애초에 언니가... ... ... \n  "},{"y":"say","sp":"리리","ts":null,"tab":"main","html":"\n    흥. \n  "},{"y":"say","sp":"리리","ts":null,"tab":"main","html":"\n    캔디 언니는 늘 이런 식이지. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    화내지 마... 응? (짧게 웃고) \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    자. 여기에 넣자. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n     \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [COIN : 3/5] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [COIN : 4/5] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    얇은 담요 위로 두툼한 이불이, 또 베개가 생기고, 작은 그릇에 물과 빵, 통조림이 쌓입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그로부터 하염없이 긴 시간이 또 흐르고……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 문득 잠에서 깨어납니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신의 곁에는 아주 당연하다는 듯이 KPC가 앉아 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신 몫의 통조림을 까서 먹고 있네요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (냠...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어라. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 일어났어요? (그러곤 흘러내리는 진물 닦아줍니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    언제부터 여기 있었냐는 표정이다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (짧게 웃곤) 저는 늘 곁에 있었는데. 당신 생각엔, 아니었을 수도 있겠지만요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 당신은 어떤 '저'까지 진짜라고 생각하세요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문득, 당신의 목소리가 트입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이전보다 비교적 자유롭게 대화할 수 있습니다. \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    (콜록, 하고 기침이 먼저 터져나온다. 이어진 물음에는 잠시 눈을 감았다.) \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n     (어떤 '샬롯'까지가 진짜인가? 승급전을 함께 한 너, 최강이라는 타이틀을 달고 어깨를 나란히 한 너, 중앙체제를 받아들이고 독재자가 되어버렸던 너, 그리고...)  \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    질문이 이상하네... ...다른 사람이 와서 너를 흉내내는 게 아닌 이상, '샬롯'은 '샬롯'이잖아.  \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    어디에서, 어떻게 만났든... '샬롯 바이런'이라면 진짜지. \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    아, 그 중에 다른 이름도 있긴 했지만. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (눈 한 번 깜빡입니다. 새삼스럽게도, 당신의 말에 조금쯤은 안심이나, 뭐... 그런 감정을 느낀 것 같습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    흠, 흠. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다른 이름을 한, 백 년 사이에 변해버린 저도. 당신에게는 '저'인가요? \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    그래, 너였고... 너일 거야. \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    이름은 바꾸었어도 나는 기억하고 있을 거잖아. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...네, 그렇죠. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (처음 보는 것 같이 웃는 얼굴을 하고...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    언제든 당신은 기억하고 있었는걸요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러니까, 이건... 그리워 마지않던 제 소중한 파트너인 당신에게 드리는 거에요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짤그랑, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    금속음 소리와 함께 모든 동전들이 모입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [COIN : 5/5] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그리고, 당신에게 손을 뻗습니다. 잡으라는 듯, 또는, 당신을 잡을 것처럼.) \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    데리고 가 주는 거야? (뻗어온 손을 붙잡으려 몸을 움직이려다가도 잠시 멈칫한다. 지금 내 몰골이...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    안 갈 거에요? (갸웃, 고개가 한 번 기울어집니다. 그러고는 제가 먼저 당신의 손을 살핏 잡습니다.) \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    ...아니, 가야지. 안 가면 어딘가의 네가 또 외로워 할 거잖아? 파트너도 없이. (약하게 붙잡아 오는 손길이 느껴지고 나서야 결심이 선 듯, 힘 주어 잡는다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC의 손끝이 닿는 순간, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    흉측하던 신체의 말단부터 세포의 갈래가 나뉘며 교차되고, 또 얽히며 인간의 신체로 변합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    내장을 뒤덮고 수복하는 피부, 또렷한 눈동자, 원래대로 돌아온 모발. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    겹쳐 잡은 손끝이 천장을 향합니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ㅡ바보. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다른 '나'를 보러 간다니. 그게 눈 앞에 저를 두고 할 말이에요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (짧게 웃고) 눌러요, 세피르. \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    어쩔 수 없잖아. 너도, 다른 너도... 내 파트너인, 소중한 샬롯인데.  \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    지금 당장은 헤어지겠지만, 다시 만나.  (누르기 위해 손을 뻗기 전, 겹쳐 쥔 손을 천천히 끌어올린다. 손등에 입술이 가볍게 눌린다.) 샬롯 바이런. \n  "},{"y":"say","sp":"괴물","ts":null,"tab":"main","html":"\n    (대답이 돌아오기 전에 아무 일도 없었다는 듯, 손 내려주고는 다른 손을 뻗는다. 입가에 여느때와 같은 웃음이 걸린다.) 보고 싶어 할 거지? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [PRESS ANY KEY.] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    닿은 자리부터 탐사자는 빨려들듯이 천장 안으로, 아니, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    밖으로 향합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC는 함께 가지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    대신, 어떤 목소리가 들린 것도 같았습니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    바보 같으니. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저는 늘 당신을 보고 싶어 했거든요... 흥. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신이 늘 나를 구해 줬던 것처럼요. (이번엔 제가 갚아 드린 거에요, 하는 웅얼임이...) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    Loading... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [RESTART] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    단순하고, 명료하지만, 너무나도 잊기 쉬운 사실. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신을 망치는 건 당신을 알지 못하는 수많은 사람들이지만, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신을 구하는 건 소수의 깊은 인연입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    세계를 구하고 싶다고 생각한 작은 계기가 떠오릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아, 그래……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    나는 그냥 당신이 이곳에 함께 살아있었으면 했구나. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    광기 해제, 상실한 이성과 체력을 전부 회복합니다. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 체력 : 0 → 16 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 이성 : 0 → 70 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    수백 명의 안드로이드가 거리를 활보하고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    머리가 깨질 것처럼 아파옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    누군가가, 아니, 무언가가 당신에게 말을 걸고 있습니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    목소리의 출처는 탐사자가 쓰러져있던 연구소 뒷편, 실험관들이 나란히 선 자리입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가까이 걸어간 탐사자는 데로록 굴러가던 눈동자와 눈이 마주칩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신의 정보를 공개합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [SYSTEM : 알파형 크리쳐] \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 세피르 해킷, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    현존하는 최강의 크리쳐. 그리고 알파. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 자신의 진정한 능력을 깨닫습니다. 알파는 모든 크리쳐들의 우두머리. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 여태까지 외면하던 진짜 자신을 마주하고 눈을 떴습니다. 그 어떤 크리쳐든 당신의 명령에 부응할 것입니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 눈앞에는 모든 실험관의 입구를 여닫는 개폐 버튼이 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자가 이를 누르면 모든 실험관들이 열리며 몇십 체의 크리쳐들이 탈출합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [누르시겠습니까?] \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    자... 굳이 혈혈단신으로 싸울 필요 없지. (어깨 한 번 으쓱이고는 망설임 없이 개폐 버튼을 누른다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    실험관에 가둬진 몸체가 풀려납니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그들은 일제히 당신의 앞에 몸을 숙이고 복종하는 자세를 취합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    우리들의 왕이시여, 무엇이든 좋으니 명령해주세요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    모든 크리쳐들은 그 존재를 긍정받습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    지금부터는 함께 싸울 시간입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ... 허공을 빙글빙글 돌며 반짝이는 중앙 관리 체제가 보입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    상자가 절반으로 나뉘어 갈리며 푸른 빛을 내뿜자, 천지가 진동하는 소리와 함께 행성이 더 빠르게 다가오기 시작합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    종말, 멸망, 세계의 끝이 다가온다는 절망, 패닉, 압도적인 공포, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가늠할 수 없는 긴장감이 안전지대에 내려앉습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    때마침 KPC에게서 무전이 옵니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (기계음 조금 섞인 목소리) 여, 여, 여기 안드로이드가 지키고 있다고는 왜 말 안 해줬어요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이 쪽 실드는 파괴 완료에요... (듀...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음... 깜짝 선물 같은 느낌으로? 그래도 잘 해냈잖아, 믿었다는 거지~  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    진짜...!!!!! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 미워요! (분명 상상되는 얼굴, 눈 꼭 감고 바락 소리지르고 있습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신 쪽은 어떻게 됐는데요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래그래, 미워하는 것도 할 수 있을 때 많이 해둬~ (무전기 너머에서 들려오는 목소리에 킥킥대고 웃는다...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    내 쪽도 금방 끝낼 거야. 얼마 안 걸려. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그게 무슨 말인ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탕!!!  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짧게 연락을 주고 받던 중, 휴대용 기기가 탄환에 맞아 박살납니다. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    (땅바닥에 총 내던진다.) \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ㅡ저기, 아까부터 가만히 서서 뭐 하나 봤는데 말이야. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    눈 앞에 이쪽 세상 최강자를 둬 놓고 방심은 좀, 아니지 않아? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    총을 던져둔 리리 라클렛이 이쪽 "ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    막을 방법, 있어요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    흠... ...  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    있었는데, 지금은 없을 지도. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    이게 무슨 대답이야?! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    지금은 없다는 거면, 방법이 뭔데요?! 아, 정말이지. 아무 것도 안 할 수는 없ㅡ! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 그 때, 오데트가 콘라드에게 내려달라는 제스쳐를 취한 뒤 천천히 내려옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그는 그것조차 숨이 찬 듯 한참을 헐떡거립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    바닥이 난 생명력과 변해버린 외형은 분명 탐사자를 원래 있던 차원에서 이쪽 세상으로 끌고 오느라 오데트의 능력을 추출, 변형 및 확대하면서 일어난 비극이었죠... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    결국, 이렇게 됐구나... 우리도 조사 보고랑 드론들 덕에 얼추 알아. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    크리쳐가 존재하는 세계라면 어디서도 멸망의 법칙은 깨지지 않았고, 당신은 여기 사람이 아니라는 것까지, 전부 들었어. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    어쩌면 해결 방안이 있을지도 모르겠어... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    멸망의 법칙은 깨지지 않았다는 말, ‘크리쳐가 지구에 존재하지 않는 세계'는 다르다는 거잖아. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그곳에는 모든 답이 있겠지. 그리고……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    무언가 설명하려는 듯 입을 열던 오데트는, 문득 다시 입을 닫고 침묵을 지킵니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...흠, 첫번째는 나를 비롯한 다른 크리쳐들을 이곳에서 쫓아낸다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    두번째는 '크리쳐가 지구에 존재하지 않는 세계'를 찾아낸다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    만약의, 이야기이긴 하지만... 내가 이곳에 불려온 것만 해도~ 그 정도 확률은 아주 없지 않겠지. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    아, 정말이지. 당신 정말로 내가 알던 사람 아닌 거 맞아? 하는 행동이 똑같아. 어떻게 말해야 할지 고민할 때, 바로 핵심부터 말해 버리는 거. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    ...하지만 이곳 사람도 아닌 당신이 여길 구하려고 필사적으로 노력할 필요는 없어. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    누군가를 구하고, 돕고, 살리는 것은 의무가 아니고, 그 누구도 강요할 수 없지. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    세계 멸망과 수많은 사람의 목숨이 걸려 있다고 하더라도, \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    가장 중요한 건……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신 그 자체. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트는 당신에게 묻습니다.  \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    당신을 불러온 건 나의 능력이니, 돌려보내는 것도 내가 해야 마땅해. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    원하는 곳으로 당신을 보내 줄게. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그러니 당신이 진심으로 원하는 선택을 해봐. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    오데트, 더 이상 능력을 쓰면……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 말을 들은 콘라드가 사색이 되어 말리지만, \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    이건 내 권리야. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    나는 내 마지막을 정할 권리가 있어. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트는 강경합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트의 능력도 한계에 다다르고, 향할 수 있는 선택지는 한 곳 뿐. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    선택의 시간입니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    당신이 원래 있었던 세계로 돌아가는 문을 열어 줄 수도 있어. 두고 온 사람이 있을 수도 있고, 그저 돌아가고 싶을 수도 있지. 이유는 중요하지 않아. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    하지만, 이 모든 멸망을 막고자 할 의지가 아직 당신에게 있다면. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    더 머나먼 곳으로 떠나는 문을 열어 줄게. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 순간에도 행성은 다가오고, 도움을 구하는 목소리가 당신의 발목을 잡습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만 결국 어디에서, 누굴 위해, 어떤 결말을 맞이할지는 온전히 당신의 몫입니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신의 고향, 당신이 있던 세계는, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 세계보다 시간이 아득하게 많이 흐른 곳, 멸망했다는 증언까지 들었습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    무슨 일이 있었고, 어떻게 그곳에서 끌려오게 되었는지, 정확한 정황은 기억나지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    한 가지 확실한 것은…… 그곳에 아직 당신을 기다리는 사람이 있을지도 모릅니다. 그것뿐. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    더욱 더 머나먼 곳으로 향한다면, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 어쩌면 돌이킬 수 없는 여행을 떠나게 될 수도 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    크리쳐라는 매개를 접한 모든 문명이 스러지고 멸망하는 이유를 찾아내고, 그 모든 차원을 구해낼 수 있는 사람이 당신 외에 또 있을까요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    운명은 끊임없이 박동합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    돌아가봤자 멸망하는 세계라면, KPC를 구해야 합니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    묻겠습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    원래 있던 세계로 돌아가겠습니까? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아니면 더 머나먼 곳으로 떠나겠습니까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그곳에 있을 사람이나, 이곳에 있을 사람이나. 내가 어떤 선택을 하든지 간에 울거나 화낼 텐데.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (아주 짧은 시간도 소중히 해야 할 시점이지만, 이건 나 하나의 목숨만을 가지고 저울질 하는 문제가 아니기에 침묵이 길어졌다. 점차 행성에 드리우는 그림자는 가까워지고, 어둠에 삼켜지는 세상에서 사람들은 저마다 머릿속에 그리는 영웅을 부르겠지...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (그렇다면 역시, 나는 이번에도.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...원래있던 곳으로의 귀환이 아니라, 희박한 가능성을 열어줘. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    희박한 가능성을 찾아, 실마리를 더듬어... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그렇게 결정했다면, 새로운 좌표를 찾아, 셀 수 없이 많은 경우의 수를 뚫고 나아가야 해. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    나는 한없이 약해져 있으니까……. 나 혼자서는 할 수 없어. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    창백한 안색으로 잠자코 있던 콘라드가 자신의 손을 내밉니다.  \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    나를 써. 오데트, 그게 네가 고른 정답이라면 전적으로 너를 믿을게. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트가 적막을 지키다 대꾸합니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    둘로도 부족할 거야. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그때, 구석에 숨어있던 어떤 사람이 손을 듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “저기, 여태까지 지켜봤는데요, 저라도 괜찮으면 써주지 않으실래요?” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아주 평범한, 처음 보는 얼굴입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “당신이 싸우는 거 계속 숨어서 지켜봤어요.\" \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    \"구해주셔서 감사해요.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 사람의 말을 끝으로, 우물쭈물대던 사람들이 하나 둘씩 대피소에서 빠져나옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “지켜야 할 가족이 있으니까, 내 목숨 하나로 끝난다면…….” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “정말로 구해주시는 거죠? 정말이죠……?” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “어차피 멸망 때문에 죽을 거라면 걸어보는 게 나을 것 같아요.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    주변으로 수십 명의 사람들이 모여듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트는 주변을 둘러보곤 고개를 작게 젓습니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    아직 부족해. 이 사람은 안전 지대의 테러로 소환됐으니까, 얼마나 많은 사람들이 필요한지는 알고 있겠지? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그때, 안드로이드들이 걸어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    진압용 인력인가 싶어 경계해 총을 들어도 그들은 빈손입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그들은 전부 생전의 기억이 있는 고인의 안드로이드들입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “이야기는 다 들었습니다. 부디 저희의 전력도 써주세요.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “어차피 라클렛 씨의 명령에 의해 원치 않게 많은 사람들을 해친 몸입니다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    반대편에서는 종교에 속했던 사람들 일부가 아주 조금씩 나옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “저희는 그저 당신을 존경한다는 이유만으로 종교에 들어갔으나, 뜻이 맞지 않아 테러에 참여하지 않았습니다.\" \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    \"미력하게나마 저희 단체가 속죄하게 해주세요.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    좋게 말하자면 헌신적인 희생양, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    나쁘게 말하자면 자살 희망자들입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만, 지금의 그들은 당신을 믿고 뒤를 잇습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    후세가 존재한다면, 그들 역시 영웅으로 기억될 것입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트가 문을 천천히 엽니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하나 둘씩 바닥으로 쓰러져, 곧 A시의 거리는 평온한 표정으로 눈을 감은 시체들로 가득 찹니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    허공에 반짝이는 선이 긴 직사각형을 이루고, 짙은 나무색의 문짝이 달립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    손잡이는 정교하고 아름답게 조각되어 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문이 완성되었을 때, 거리에 남은 사람은 오데트와 당신 둘 뿐이었습니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    크리쳐라는 매개가 곧 멸망으로 이어지는 이유를 찾으러 가는 거야. 당신이라면 할 수 있어. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    끝까지 배웅은 못 해주겠네... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    (짧게 웃고) 작별 인사라도 할까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그럼, 할 수 있지. 모두의 기대와 희생을 등에 업었는데... 헛되이 만들면 그게 영웅인가.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    완전한 작별 인사보다는 다음의 만남을 기약할까, 어때? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    -하... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    이거 참. 당신도 정말 여러 의미로 대단한 사람이라니까. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그러면 이렇게 말할까? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    (생긋 웃은 채로 쓰러진다.) 다음에, 또 봐... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래, 다음에 또 보자... 오데트. (손이라도 한 번 맞잡고 마치려던 인사는 허공에 닿았다. 쓴웃음과 함께 쓰러진 오데트를, 다른 이들을 바라본다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    입가에서 피가 흐릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    오데트는 당신을 향해 한 번 웃고는, 잔잔히 눈을 감습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이제 당신은 홀로 남았습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문을 열까요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    영웅이 할 일을 하러 가야지. (감상에 젖어있을 시간도 없을 터였다. 기껏 다잡은 마음이 약해지기 전에 저질러야 한다. 짧게 숨 한 번 들이키고는 문고리로 손을 뻗는다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문고리를 잡아당기는 순간, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 깨닫습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 문, 힘이 부족합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아무리 잡아당겨도 열리지 않는데다, 곧 사라질 것입니다. 정신력 판정입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>정신</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">1</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-crit\"><b>대성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    성공, 실패와 상관 없이 당신은 한 가지 사실을 깨닫습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    알고 있죠? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이곳에서 가장 강력한, 무생물의 에너지원을. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    허공에서 빛나며 행성을 끌어당기는 중앙관리체제. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    비록 저걸 이용한 사람은 반드시 파멸을 맞이했지만, 이 상황에 이것보다 더 적합한 것은 없을 것입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문을 완성할 수 있는 사람이 이제 없는 지금, 당신에게 선택권은 없습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자, 중앙 관리 체제를 받아들이고 문을 열겠습니까? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아니면 마지막 남은 존엄성을 선택하겠습니까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (어떤 마음으로 목숨을 기꺼이 내놓은 이들이 있는데, 물거품으로 만들 수는 없다. 아주 찰나의 순간, 망설임이 비치기는 했으나...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (중앙  관리 체제를 받아들이는 게 지금 순간에는 가장 효율적이다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그것을 받아들이기로 결정했다면, 계약의 시간입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    마침 주인을 잃은 중앙 관리 체제는 새로이 섬길 주인을 찾고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    운 좋게도, 당신은 그의 새로운 주인이 될 자격이 있는 존재입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯, 또는 샤를의 모습, 그리고 리리의 모습이 천천히 기억을 스쳐 지나갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 한쪽 눈을 바치고 중앙 관리 체제의 소프트웨어를 그 자리에 이식해야 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    마력을 10 소비하면 계약이 성사됩니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (다른 사람들이 목숨값에 비하면 그 정도야...)  \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 마력 : 14 → 4 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    볼썽사납게 뜯겨져 손바닥 위를 구르던 눈알이 푸른 빛과 함께 허공으로 떠오릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 빛은 중앙 관리 체제와 이어지고, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n main","html":"\n    또한, 광기 : 악인이 발동되어 이곳의 샬롯에게 자초지종을 설명할 이유를 잃습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...이게 최선이었어, 샬롯. (제정신을 유지라도 하고 있었더라면 달래는 것부터 시작했겠으나... 안타깝게도 다정한 위로나 장난스레 넘기려는 말은 나오지 못했다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그게 무슨, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    무슨 말이, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...피하지 말아요, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    대답하세요, 세피르! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 목소리를 마지막으로, 당신은 문 너머로 걸어 들어갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 아득한 순례의 처음과 끝을 당신에게 바칩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이것은 틀림없는 괴물예찬론. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    에필로그로 이어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 차원의 틈바구니에서 당신에게 속삭이는 목소리를 듣습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “어떤 기분이신가요?\" \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    \"이제 정말 당신은 한 차원의 위의 존재가 되었습니다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “필요 없는 것은 제가 가져가도록 하겠습니다.”  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 이곳에서 로스트됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [탐사자]의 캐릭터 시트를 소각합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가장 강력한 크리쳐, 그리고 인간인 당신은 아자토스의 능력을 고스란히 받아냅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 어떤 중앙관리체제의 주인들 중에서도 가장 완벽하게 융합을 해낸 끝에, 새로운 신화생물이 탄생했습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그것은 바로 당신입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아자토스로 완전히 변하고 생각까지 물드는데 시간이 얼마 남지 않았습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    서둘러야 합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신에겐 사명이 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잠깐의 여유는 괜찮겠죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ허공에 있는 수백 개의 문들 중에서 익숙한 모양의 문이 보입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람의 집, 크리스마스 리스가 달린 현관문입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ... (주춤 했으나, 익숙한 문을 향해 손을 뻗었다. 잠시간의 여유가, 유예가 주어진다면야...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ이 공간에 침입하는 것은 손쉽습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문이 열립니다, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    따스한 온기가 당신을 맞이합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    입고 있던 옷은 어느덧 크리스마스 니트로 바뀌어 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    거실에서는 TV 소리가 들려옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탁자 위에는 따뜻한 컵이 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 그래야 한다고 정해진 것처럼 컵을 들고 문 밖으로 나옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아, 클리셰 영화입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    악역에게 주인공이 죽어 버렸네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯은 소파에서 자고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    홀린 듯이 자다 깬 그가 이쪽을 쳐다봅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    놀란듯, 겁먹은 듯한 표정이 잠시 주변을 둘러보다 창문 밖을 봅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    창문 밖에는 당신의 것과 같은 색의 눈이 빛나고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    수십, 수백 개의 세계선, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 어쩌면 우리는 같은 운명을 주고 받으며 빙글빙글 돌고 있었을지도 몰라... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러니 이건 당신이 두고 온 사람에게 보내는 선물입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    3부의 그 부분입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 샬롯이 이 문 밖을 나가면 어김없이 괴로워진다는 사실을 알고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그날의 당신도 그랬을까요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어딜 보고 있어? (창문을 향하고 있는 시선을 제게로 끌어온다. 샬롯의 양뺨을 부드럽게 감싸쥐고 이쪽과 마주하도록.) 창밖에 아무것도 없는데... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (히끅, 짧은 딸꾹질 이후 맺혀 있던 식은땀 닦아낼 생각도 못 하고 당신 눈을 가만히 들여다봅니다...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    바람이, 세서... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이번 겨울은 유난히 추우니까. ...크리스마스에 어디 나가지 못하는 건 아쉽지만, 오늘은 집에서 보내고... 눈이라도 그치면 그때 나가자. (톡, 네 코끝 가볍게 건드리고는 이마를 덮고 있는 머리카락도 한 번 쓸어준다. 다 달라붙었잖아.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (약하게 눈 한 번 감았다 뜹니다. 당신을 바라보는 얼굴에서, 약간은 원망인지... 또는 안도인지 모를 감정이 스쳐지나갑니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    눈이 계속 내릴까요? (그런데, 제가 기억하던 건, 그러니까...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신도... 분명, 추워하고 있었던 것 같은데. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어쩌면 계속 내리겠지? (어깨 으쓱인다. 그치지 않아도 상관 없지 않느냐는 듯, 시큰둥한 반응이다. 이어지는 의문에도 명확한 대답이 아닌 '그랬던가', 라는 중얼거림을 대답으로 했다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    밖에 안 나가면 안 추워, 시시한 크리스마스 특선 영화나 틀어놓고... 음, 케이크나 만들까? (뺨 감싸고 있던 손도 어느새 놓아주었으니, 태연하게 옆자리 차지하고 앉아버린다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    덜컹, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    덜컹. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여전히 창문 바깥에서는 눈보라가 불어닥칩니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ㅡ잠깐만, 창문을 닫고 와야 할 것 같아요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (저희가, 그러기로 했었어요? 시시한 B급 클리셰 영화, 케이크, 따뜻한 온기. 어쩐지 맞지 않는 옷을 입은 것 같은 기분을 느끼며...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    내가 닫고 올게. (꾹, 괜히 네 어깨를 지지대 삼아 누르며 일어났다. 위화감을 느끼는 얼굴을 보고도 시선을 돌려 외면한다.) 약속 했던 거 그새 다 까먹었어? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    서운한데~ \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면, 또 어느 날엔가 그랬던 것처럼 말갛게 뜬 눈으로 맹하니 당신을 바라보게 되는 것입니다. 이상하다, 내가 정말 기억을 못 하는 건가...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    미, 미안해요... 요즘 좀 피곤했나? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그래도 당신이랑 보내는 크리스마스는 처음인 것 같은데. (짧게 볼을 긁적이곤 일어나 당신에게 다가갑니다.) 뭐부터 하면 돼요? (네? 세피르. 가만 올려다봅니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음~ (창가로 다가가 제 눈을 닮은 것들을 잠시 응시하다, 굳게 닫아버린다. 잠금쇠하며 커튼까지 치고는 돌아선다.) 케이크 시트 먼저 구워야겠지? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (이상하게도 자꾸 그 바깥으로 시선이 향하는 건 어째서일까요...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    커, 커튼까지 칠 날씨는 아니지 않아요...? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그으, 이 안, 조금 어두우니까. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (당신을 안듯, 조금 붙어서는 손 간신히 뻗어 커튼 끝자락을 스칩니다. 몇 번쯤 헛손질하다가, 커튼을 단단히 집고 나면 당신을 올려다봅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러곤, 커튼을 조심스럽게 걷어내고...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (결국은 커튼을 걷어내는 모습에 표정을 살짝 찌푸렸다. 한숨과 함께 고개를 숙인다.) 굳이 밖을 보고 싶어하는 이유가 뭐야?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (당신의 어깨 너머로, 푸른 빛을 띄는 빨간 눈동자를 마주하기도 잠시. 마주하는 당신의 얼굴에 놀라 조금 뒷걸음질칩니다. 그러니까, 언젠가-혹은 최근-보았던 당신의 모습과도 닮아 있었어서.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ...왜, 왜 그렇게 무섭, 무섭게 보는 거에요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신이, 머, 먼저, 자꾸 저한테는 안 보여주려고... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...별 거 없으니까, 굳이 보지 않아도 되는 것들이니까. (겁이라도 먹은 건가, 손을 들어 얼굴을 쓸어내린다. 저도 모르게 인상이라도 쓴 모양이었다. 손이 지나가고 나서는 다시 네가 기억하는 표정일 거다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    재미있는 거 있었으면 와서 빨리 보라고 했겠지, 안 그래? (흘깃, 창 너머 곁눈질 하고는 어깨 으쓱였다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 당신같지 않아요. (한 걸음 더 뒤로 물러나서는 조금쯤 경계하는 것마냥 당신을 바라보았습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신은, 그러니까... 굳이 저에게 이렇게까지 겁을 주지 않아요, 고작 이런 일으로는요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    오히려 당신은 이런 때면 제게 숨기려고 하지 않아요. 더더욱 제가 보고 알 수 있게 해 준단 말이에요. (말하다 무엇인가 울컥, 억울한 감정이 북받치는지. 수그린 고개, 말 끝에 묻어나오는 습기.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...그래, 내가 실수했어. (겁을 주려던 것은 아니었다. ...아닌가? 어쩌면 겁을 주어서라도 이곳에서 나가지 못 하도록 하고 싶었던 건지도 모르겠다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어렵게 따낸 휴일이잖아. 그동안... 너나 나나 힘들었으니까 예민해졌었나봐.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그러니까... ...피하지는 마. (내심, 네가 벌린 거리에 서운함이라도 느낀 것처럼 시선이 발끝으로 떨어진다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... (왜지, 이 정도 거리감이 무섭게 익숙한 이유가 없을 텐데. 어쩐지 슬퍼져서, 그래서 그만 다가가지도 못 하고 그 자리에 서서 작게 소리내 울고 말았습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...다, 당신 탓이에요, 당신이, 당신이 보자고 한 영화 때문이에요. (울컥, 터진 눈물에 주먹쥔 손으로 거칠게 눈가를 닦아냅니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    거기서, 주인공이 멍청하게 죽어 버려서... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그래서... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... (안아달라고 하고 싶은데, 입술이 떨어지지 않아 조용히 눈물만 목 안으로 눌러담습니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...그래, 그래, 내가 영화를 잘못 골랐네. 주인공이 그렇게 죽어버리는 영화는... 어울리지 않는데. (무엇에 어울리지 않는지는 일부러 단어를 끼워넣지 않았다. 나에게, 너에게, 우리에게, 혹은 두 사람이 존재했던 세계에. 허무한 죽음으로 퇴장해버리는 영웅은 어울리지 않는 것이다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜 울고 그래, 응? 다른 영화 골라서 다시 보자. (네가 벌렸던 거리는 다시 좁혔다. 바로 앞에 서서 손을 든다. 닦아주어도 되나, 닿아도 되나. 잠깐의 망설임에 허공에 든 채로 멈추었다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 누구에요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (눈물로 가득했던 눈이, 고개가, 어느새 들려 당신을 바라봅니다. 원망 가득한 눈빛이...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 이러지 않잖아요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    늘, 당신은 내가 이러고 있으면 먼저 울지 말라고 눈물을 닦아 줬잖아요, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    고작 이렇게 서 있는 게 아니라! (어떠한 직감에, 그저 당신을 바라보며...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    누구냐니... 질문이 이상해. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    보고 있는 그대로야, 샬롯. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나는 세피르고, 네 파트너잖아... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    만약, 네가 기억하는 세피르가 아니라면 떠날 거야? (최대한 본래의 자신을 연기하려고 애를 썼는데, 무리였나...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    몇, 몇 번이든, 저는, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (떨리는 목소리가 당신을 향합니다. 눈에서 흘러내리는 눈물을 닦을 생각도 않고, 그저 그렇게. 시선을 마주하며.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다, 다시 한 번 더, '저'를 기다리고 있을, 세피르를 만나러 가야만 해요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...세, 세피르도, ...추워 보였단 말이에요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...나 또한 '너'를 기다린 사람인데? (다시 한 번 표정이 옅게 구겨진다. 이번에는 불쾌함보다는 상처라도 입은 것처럼. 아, 이쯤 되면 이런 말에 상처는 안 받아야 하는 것 아닌가...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나는, 내 눈 앞의 너도, 또다른 샬롯도, 샤를이라 불리던 너도... 전부 너였는데. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    갈 거야? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그 말에는, ... 아. 기껏 단단히 먹은 마음이 바스러지려다가.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    하지만, 세피르... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신도 제 파트너지만, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    '제'가 여기에 있으면 영원히 혼자 있게 될 세피르가 있잖아요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    제가 가지 않으면, 안 되는 당신이 있어요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    언젠가 했던 것처럼 자리합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다만 이번에는 서로의 위치가 반대가 되었을 뿐... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    한 걸음 더 멀어지는 너, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어두워진 방에 홀로 남겨질 나. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그래, 그렇겠지.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    내가 그러했듯, 네가 이런 선택을 하리라는 건 알고 있었지만 역시... 징그럽게 보여도 붙잡고 싶네... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...지치면, 견디지 못할 것 같으면 다시 와줘. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나는 항상 너를 기다려, 샬롯.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (어째서인지, 이렇게 해야 할 것 같다는 생각이 들었습니다. 몸을 돌려 걸어나가기 전...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신을, 언젠가 다시 봤으면 좋겠지만. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그렇지만, 정말 오랜 시간이 걸릴 것 같으니까... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    너무 오래 기다리지 말아요. (작은 당부. 슬프게 오래 걸어나가게 될 눈밭이 비추는 것도 같았습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    다녀오겠습니다, 라고 말할 수 없을 것 같지만... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런"         <div class="srow"><span>색 1</span><span class="cwrap"><input type="text" class="hexin" id="h-rt1" value="#6b5a8e" spellcheck="false"><input type="color" id="c-rt1" value="#6b5a8e"></span></div>
        <div class="srow" id="rt2row"><span>색 2</span><span class="cwrap"><input type="text" class="hexin" id="h-rt2" value="#8e5a7d" spellcheck="false"><input type="color" id="c-rt2" value="#8e5a7d"></span></div>
      </div>
    </div>
    <button id="pwbtn" class="iconbtn" title="게시 비밀번호 등록"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6"/><path d="M15.5 7.5l3 3"/></svg></button>
  </div>
  <main id="log"></main>
<script>
/* crit-ccf-proto-builder: 가져온 CCF 로그를 프로토타입 뷰어 구조로 주입 */
(function () {
  var qid = (window.__CRIT_ID || new URLSearchParams(location.search).get('id'));
  var data = window.CRIT_LOG_DATA || null;
  if (!data) { try { data = JSON.parse(localStorage.getItem('crit-log-data:' + qid)); } catch (e) {} }
  window.CRIT_IMPORT_DATA = data;
  var PALETTE = ['#B26A9E','#5B8DB8','#5BA8A0','#7BA05B','#C98A5B','#8A7BC9','#c15b74','#5bb0c9'];
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  if (!data || !Array.isArray(data.blocks)) {
    document.getElementById('log').innerHTML =
      '<div style="text-align:center;color:var(--dim);padding:60px 0">로그 데이터를 찾을 수 없어요. 로그 보관함에서 다시 가져와 주세요.</div>';
    window.CRIT_CHARMETA = {};
    return;
  }
  /* 캐릭터 메타 */
  var meta = {};
  if (data.charMeta && typeof data.charMeta === 'object') {
    Object.keys(data.charMeta).forEach(function (k) {
      var m0 = data.charMeta[k] || {};
      /* mine/npc를 안 옮겨 담아서, serialize()가 분명히 저장했는데도 다시 열 때마다
         "내 캐릭터"/NPC 체크가 항상 풀린 것처럼 보였다 */
      meta[k] = { display: m0.display || k, color: m0.color || null, avatar: m0.avatar || null, plain: !!m0.plain, mine: !!m0.mine, npc: !!m0.npc, hideAvatar: !!m0.hideAvatar };
    });
  }
  var order = [];
  data.blocks.forEach(function (b) {
    if (!b.sp) return;
    if (!meta[b.sp]) meta[b.sp] = { display: b.sp, color: b.color || null, avatar: b.av || null };
    if (order.indexOf(b.sp) === -1) order.push(b.sp);
    if (!meta[b.sp].avatar && b.av) meta[b.sp].avatar = b.av;
    if (!meta[b.sp].color && b.color) meta[b.sp].color = b.color;
  });
  Object.keys(meta).forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); });
  var pi = 0;
  order.forEach(function (k) { if (!meta[k].color) meta[k].color = PALETTE[pi++ % PALETTE.length]; });
  window.CRIT_CHARMETA = meta;
  /* info 탭에서만 등장한 이름은 핸드아웃 명의일 뿐 캐릭터가 아님 → 리스트/선택 목록에서 제외 */
  var nonInfo = {};
  data.blocks.forEach(function (b) { if (b.sp && (b.tab || 'main') !== 'info') nonInfo[b.sp] = 1; });
  var infoOnly = {};
  order.forEach(function (k) { if (!nonInfo[k]) infoOnly[k] = 1; });
  window.CRIT_INFO_ONLY = infoOnly;

  /* 세션 히어로 - 게시본은 window.CRIT_LOG_SESS로 구워져 들어온다(publisher.html이 게시
     시점에 crit-log-sess:<id>를 읽어서 넣어줌). 방문자 브라우저는 앱의 localStorage에
     접근할 수 없어서(다른 오리진) 그 값이 없으면 세션 정보가 영원히 빈 채로 보였다
     (실제로 겪은 버그) - 있으면 그걸 쓰고, 없으면(앱 안에서 직접 보는 경우) 기존대로
     localStorage에서 읽는다 */
  var sess = {};
  if (window.CRIT_LOG_SESS) sess = window.CRIT_LOG_SESS;
  else { try { sess = JSON.parse(localStorage.getItem('crit-log-sess:' + (qid || 'tpl'))) || {}; } catch (e) {} }
  var sTitle = sess.title || data.title || '로그';
  var sPlayers = sess.players || data.players || [];
  document.body.dataset.session = JSON.stringify({
    title: sTitle, writer: sess.writer || '', gm: sess.gm || '', players: sPlayers,
    party: sess.party || data.party || '', overview: sess.overview || ''
  });
  var tEl = document.getElementById('s-title');
  if (tEl && tEl.childNodes.length) tEl.childNodes[0].textContent = sTitle + ' ';
  var wEl = document.getElementById('s-writer');
  if (wEl) wEl.textContent = sess.writer || '';
  var plEl = document.getElementById('s-players');
  if (plEl) plEl.innerHTML = sPlayers.map(function (p) { return '<span class="pbadge">' + esc(p) + '</span>'; }).join('');
  var ovEl = document.getElementById('s-overview');
  if (ovEl) ovEl.textContent = sess.overview || '';
  document.title = 'Crit — ' + sTitle;

  /* 캐시된(하드코딩) 페이지면 DOM 재조립 생략 */
  var BAKED = !!(window.CRIT_BAKED && document.querySelector('#log .msg'));
  /* 로그 DOM: 프로토타입 마크업 (info 탭 → 핸드아웃 카드, 같은 화자 연속 → cont, main 외 탭 → subtab) */
  var htmlOut = [];
  var prevKey = null;
  var tabCnt = {}, charCnt = {};
  data.blocks.forEach(function (b, i) {
    var tab = b.tab || 'main';
    tabCnt[tab] = (tabCnt[tab] || 0) + 1;
    if (b.sp) charCnt[b.sp] = (charCnt[b.sp] || 0) + 1;
    if (tab === 'info') {
      prevKey = null;
      var hn = b.sp || '✦ 정보';
      var hc = (meta[b.sp] && meta[b.sp].color) || '#03a9f4';
      if(!BAKED)htmlOut.push('<div class="msg handout" data-tab="info" data-type="handout" data-char="' + esc(b.sp || '') + '" id="imp-' + i + '">' +
        '<div class="hcard"><div class="hname" style="color:' + esc(hc) + '">' + esc(hn) + '</div>' +
        '<div class="mcontent">' + (b.html || '') + '</div></div></div>');
      return;
    }
    if (b.y === 'desc' || !b.sp) {
      prevKey = null;
      if(!BAKED)htmlOut.push('<div class="msg desc" data-tab="' + esc(tab) + '" data-type="desc" data-char="" id="imp-' + i + '">' +
        '<div class="mbody"><div class="mcontent">' + (b.html || '') + '</div></div></div>');
      return;
    }
    var m = meta[b.sp] || { color: '#9a95a0', avatar: null };
    /* 연속 발언 판정은 화자만 비교한다 - 탭까지 같이 비교하면(예전 방식) 탭 라벨 표기가
       메시지마다 미묘하게 달라지는 코코포리아 로그에서 같은 화자인데도 안 이어지는 경우가 많았다.
       다른 뷰어(viewer.html/log_viewer.html/freelog.html)도 전부 화자만으로 판정한다 */
    var cont = b.sp === prevKey;
    prevKey = b.sp;
    /* 지문출력 선택은 빌드 시점에 바로 반영 - 나중에 바뀌며 깜빡이지 않게 */
    var asDesc = Array.isArray(data.descChars) && data.descChars.indexOf(b.sp) !== -1;
    var cls = 'msg general' + (cont ? ' cont' : '') + (tab !== 'main' ? ' subtab' : '') + (asDesc ? ' as-desc' : '');
    /* "이 블록만" 아바타 수정은 예전엔 화면(DOM)에만 반영되고 serialize()가 저장을
       안 해서, 새로고침하면 조용히 사라졌다(실제로 겪은 버그) - b.avOv로 블록별로
       저장한다: 문자열이면 그 이미지로 덮어쓰고, 프로퍼티는 있는데 값이 없으면(null)
       "이 블록만 없애기"로 색 원만 강제, 프로퍼티 자체가 없으면 평소처럼 캐릭터 기본값 */
    var hasOv = Object.prototype.hasOwnProperty.call(b, 'avOv');
    var av = hasOv
      ? (b.avOv
          ? '<img src="' + esc(b.avOv) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
          : '<b style="background:' + esc(m.color) + '"></b>')
      : (m.hideAvatar ? '' : (m.avatar
          ? '<img src="' + esc(m.avatar) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
          : '<b style="background:' + esc(m.color) + '"></b>'));
    /* avOv가 있는 블록은 렌더 시점엔 이미지를 맞게 보여주면서도 data-avatar-override를
       안 붙여서, 새로고침 직후 아무 DOM 변화(MutationObserver)에도 serialize()가 이
       블록을 "오버라이드 없음"으로 다시 저장해버려 조용히 유실됐다(실제 겪은 버그:
       "저장은 됐는데 다시 들어가면 리스트 자체가 초기화된다") */
    var ovAttr = hasOv ? ' data-avatar-override="1"' : '';
    if(!BAKED)htmlOut.push('<div class="' + cls + '" data-tab="' + esc(tab) + '" data-type="general" data-char="' + esc(b.sp) + '"' + ovAttr + ' id="imp-' + i + '">' +
      '<div class="avatar">' + av + '</div>' +
      '<div class="mbody"><div class="mhead"><span class="by" style="color:' + esc(m.color) + '">' + esc(b.sp) + '</span>' +
      (tab !== 'main' ? '<span class="ctab">' + esc(tab) + '</span>' : '') +
      (b.ts ? '<span class="tstamp">' + esc(b.ts) + '</span>' : '') + '</div>' +
      '<div class="mcontent">' + (b.html || '') + '</div></div></div>');
  });
  /* 블록 단위 점진 렌더링: 첫 400블록만 즉시 그려 바로 조작 가능, 나머지는 비동기로 이어붙임 */
  (function () {
    var lgEl = document.getElementById('log');
    var CHUNK = 400;
    if (htmlOut.length <= CHUNK) { lgEl.innerHTML = htmlOut.join('\n'); return; }
    window.CRIT_BUILDING = true;
    lgEl.innerHTML = htmlOut.slice(0, CHUNK).join('\n');
    var __pos = CHUNK;
    (function step() {
      if (__pos >= htmlOut.length) {
        window.CRIT_BUILDING = false;
        document.dispatchEvent(new Event('crit-log-built'));
        return;
      }
      var tp = document.createElement('template');
      tp.innerHTML = htmlOut.slice(__pos, __pos + CHUNK).join('\n');
      lgEl.appendChild(tp.content);
      __pos += CHUNK;
      setTimeout(step, 0);
    })();
  })();

  /* 통계 */
  var st = document.querySelector('.stats');
  var tabs = Object.keys(tabCnt);
  /* 지문출력/사담으로 지정된 캐릭터는 개별 칩 대신 "지문"/"사담" 통합 칩 하나로 합쳐서 보여준다 -
     체크박스가 항상 살아있는 통합 칩 하나로만 존재해야 다른 캐릭터를 솔로/토글할 때 이 캐릭터
     로그가 전체에서 같이 사라지는 버그(개별 칩이 아예 안 보이던 예전 방식의 잔재)가 안 생긴다 */
  var descSet = {}, chatSet = {};
  (Array.isArray(data.descChars) ? data.descChars : []).forEach(function (k) { descSet[k] = 1; });
  (Array.isArray(data.chatChars) ? data.chatChars : []).forEach(function (k) { if (!descSet[k]) chatSet[k] = 1; });
  var listOrder = order.filter(function (k) { return !infoOnly[k] && !descSet[k] && !chatSet[k]; });
  window.__critOrder = order;
  window.__critCharCnt = charCnt;
  if (st) st.innerHTML = '<span>전체 <b>' + data.blocks.length + '</b>블록</span>' +
    '<span>탭 <b>' + tabs.length + '</b>개</span><span>캐릭터 <b>' + listOrder.length + '</b>명</span>';

  /* 저장된 탭/캐릭터 꺼짐 상태를 렌더 시점부터 반영 - 체크박스가 항상 켜진 채로 그려졌다가
     나중에 복원 스크립트가 꺼주는 방식이면 그 사이 깜빡임이 생긴다 */
  var savedTabOff = [], savedCharOff = [];
  try { var _tso = JSON.parse(localStorage.getItem('crit-tab-state:' + qid)); if (_tso && Array.isArray(_tso.off)) savedTabOff = _tso.off; } catch (eTso) {}
  try { var _cso = JSON.parse(localStorage.getItem('crit-char-state:' + qid)); if (_cso && Array.isArray(_cso.off)) savedCharOff = _cso.off; } catch (eCso) {}

  /* 탭바 (other/사담/잡담 계열은 기본 해제 - 기획서 5.5, 저장된 값이 있으면 그걸 우선) */
  var tb = document.querySelector('.tabbar');
  if (tb) {
    tb.innerHTML = tabs.map(function (t) {
      var on = savedTabOff.length ? savedTabOff.indexOf(t) === -1 : !/^(other|사담|잡담)$/i.test(t);
      return '<label class="tab-chip"><input type="checkbox"' + (on ? ' checked' : '') + ' data-tab="' + esc(t) + '">' +
        '<span class="tab-name">' + esc(t) + '</span><span class="chip-count">' + tabCnt[t] + '</span>' +
        '<span class="tab-x" title="이 탭 데이터 완전 삭제">×</span></label>';
    }).join('\n');
  }

  /* 캐릭터바 */
  var PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  function mergedChip(dc, label, keys) {
    if (!keys.length) return '';
    var cnt = keys.reduce(function (s, k) { return s + (charCnt[k] || 0); }, 0);
    var on = savedCharOff.indexOf(dc) === -1;
    return '<label class="char-chip merged" data-chip="' + dc + '">' +
      '<input type="checkbox"' + (on ? ' checked' : '') + ' data-char="' + dc + '">' +
      '<span class="chip-name">' + label + '</span>' +
      '<span class="chip-count">' + cnt + '</span></label>';
  }
  var cb = document.getElementById('charbar');
  if (cb) {
    cb.innerHTML = mergedChip('__desc__', '지문', Object.keys(descSet)) + mergedChip('__chat__', '사담', Object.keys(chatSet)) +
      listOrder.map(function (k) {
      var m2 = meta[k];
      var avh = m2.avatar
        ? '<img src="' + esc(m2.avatar) + '" onerror="this.replaceWith(avFallback(&quot;' + esc(m2.color) + '&quot;))">'
        : '<b style="background:' + esc(m2.color) + '"></b>';
      var charOn = savedCharOff.indexOf(k) === -1;
      return '<label class="char-chip" data-chip="' + esc(k) + '" style="--cc:' + esc(m2.color) + '">' +
        '<input type="checkbox"' + (charOn ? ' checked' : '') + ' data-char="' + esc(k) + '">' +
        '<span class="chip-avatar">' + avh + '</span>' +
        '<span class="chip-name" style="color:' + esc(m2.color) + '">' + esc(m2.display || k) + '</span>' +
        '<span class="chip-count">' + (charCnt[k] || 0) + '</span>' +
        '<span class="chip-edit" title="캐릭터 편집" data-edit="' + esc(k) + '">' + PEN + '</span></label>';
    }).join('\n');
  }
})();
</script>
</div>
<input type="file" id="filepick" accept="image/*" style="display:none">
<script>
const charMeta = window.CRIT_CHARMETA || {};
const READER = false;

/* ── 세션 정보 ── */
let sessionInfo = JSON.parse(document.body.dataset.session || '{}');
function renderSession() {
  const t = document.getElementById('s-title');
  if (t) t.childNodes[0].textContent = (sessionInfo.title || '세션 로그') + ' ';
  const w = document.getElementById('s-writer');
  if (w) w.textContent = sessionInfo.writer ? ('w. ' + sessionInfo.writer) : '';
  const pl = document.getElementById('s-players');
  if (pl) {
    const badges = [];
    if (sessionInfo.gm) {
      const g = document.createElement('span'); g.className = 'pbadge pbadge-gm'; g.textContent = 'GM ' + sessionInfo.gm;
      badges.push(g.outerHTML);
    }
    if ((sessionInfo.players || []).length) {
      const s = document.createElement('span'); s.className = 'pbadge'; s.textContent = 'PL ' + sessionInfo.players.join(',');
      badges.push(s.outerHTML);
    }
    pl.innerHTML = badges.join('');
  }
  const ovv = document.getElementById('s-overview');
  if (ovv) ovv.textContent = sessionInfo.overview || '';
  document.title = (sessionInfo.title || '세션 로그');
}
const sessbtn = document.getElementById('sessbtn');
if (sessbtn) sessbtn.addEventListener('click', () => {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal wide"><h3>세션 정보</h3>
    <div class="mrow"><span style="flex:none;width:88px">제목 <b style="color:var(--accent)">*</b></span><input type="text" id="si-title" value="${(sessionInfo.title||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">시나리오 라이터</span><input type="text" id="si-writer" value="${(sessionInfo.writer||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">GM</span><input type="text" id="si-gm" placeholder="진행자 이름" value="${(sessionInfo.gm||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">PL</span><input type="text" id="si-players" placeholder="쉼표로 구분" value="${((sessionInfo.players||[]).join(', ')).replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">파티명</span><input type="text" id="si-party" placeholder="여럿일 때 표기 (선택)" value="${(sessionInfo.party||'').replace(/"/g,'&quot;')}"></div>
    <div style="font-size:13px;margin:2px 0 6px">시나리오 개요</div>
    <textarea id="si-overview" style="min-height:110px" spellcheck="false">${sessionInfo.overview||''}</textarea>
    <div class="hint">입력한 정보는 게시본 상단에 표시됩니다. 비워두면 해당 항목은 표시되지 않아요.</div>
    <div class="mbtns"><button id="sc">취소</button><button class="primary" id="so">적용</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#sc').addEventListener('click', () => ov.remove());
  ov.querySelector('#so').addEventListener('click', () => {
    sessionInfo = {
      title: ov.querySelector('#si-title').value.trim(),
      writer: ov.querySelector('#si-writer').value.trim(),
      gm: ov.querySelector('#si-gm').value.trim(),
      players: ov.querySelector('#si-players').value.split(',').map(s => s.trim()).filter(Boolean),
      party: ov.querySelector('#si-party').value.trim(),
      overview: ov.querySelector('#si-overview').value.trim(),
    };
    document.body.dataset.session = JSON.stringify(sessionInfo);
    renderSession();
    /* 자관 미연동 로그의 사이드바 뱃지(플레이어/파티명)가 이걸 읽는데, 가져온 로그는 이 저장
       자체가 아예 빠져있어서 세션 정보를 아무리 채워도 사이드바엔 절대 안 떴다 */
    try {
      var qidSess = window.__CRIT_ID || new URLSearchParams(location.search).get('id');
      if (qidSess) localStorage.setItem('crit-sess:ccf_viewer.html?id=' + qidSess, JSON.stringify({ players: sessionInfo.players, party: sessionInfo.party }));
    } catch (eSess) {}
    /* crit-log-sess:<id>(다시 열 때 읽는 진짜 저장소)는 이제껏 #s-players DOM이 실제로
       바뀔 때만 걸리는 MutationObserver에만 의존했다 - 개요/제목/라이터만 고치고 플레이어

const tabBoxes = document.querySelectorAll('.tab-chip input');
const charbar = document.getElementById('charbar');
/* 캐릭터바는 지문/사담 지정이 바뀔 때 통째로 다시 그려지므로(renderCharBar), 칩 input을
   한 번만 querySelectorAll로 캐싱해두면 재생성된 새 input을 못 찾는다 - 매번 새로 조회한다 */
function charBoxes() { return document.querySelectorAll('.char-chip input[data-char]'); }
const q = document.getElementById('q');
function apply() {
  const tabs = tabBoxes.length ? new Set([...tabBoxes].filter(c=>c.checked).map(c=>c.dataset.tab)) : null;
  const boxes = charBoxes();
  const chars = boxes.length ? new Set([...boxes].filter(c=>c.checked).map(c=>c.dataset.char)) : null;
  const term = q.value.trim().toLowerCase();
  /* 지문/사담으로 지정된 캐릭터는 개별 체크박스가 없으므로, 그 캐릭터 메시지는 통합 칩
     (__desc__/__chat__)의 체크 상태로 판정한다 */
  const dSet = window.__critDescChars, cSet = window.__critChatChars;
  document.querySelectorAll('#log .msg').forEach(m => {
    /* 게시본(필터 UI 없음)에서는 본편(main/info)만 표시 */
    let ok = !m.dataset.tab || (tabs ? tabs.has(m.dataset.tab)
      : (m.dataset.tab === 'main' || m.dataset.tab === 'info'));
    if (ok && m.dataset.char && chars && m.dataset.type !== 'handout') {
      const mc = m.dataset.char;
      const effChar = (dSet && dSet.has(mc)) ? '__desc__' : ((cSet && cSet.has(mc)) ? '__chat__' : mc);
      ok = chars.has(effChar);
    }
    if (ok && term) ok = m.textContent.toLowerCase().includes(term);
    m.classList.toggle('hide', !ok);
  });
}

/* 업로드한 이미지를 base64로 localStorage에 그대로 박아두면 용량 제한에 걸리므로,
   디스크에 파일로 저장하고 crit-image://<id> 참조만 돌려받는다 (Electron API 없는
   브라우저 미리보기에서는 그냥 base64를 그대로 씀) */
async function toImageRef(dataUrl) {
  if (window.api && window.api.images && window.api.images.save) {
    try {
      const res = await window.api.images.save(dataUrl);
      if (res && res.url) return res.url;

  }
  return dataUrl;
}

function sealAvatar(container, color) {
