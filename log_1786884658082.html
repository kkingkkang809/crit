<!DOCTYPE html>
<html lang="ko" style="--accent:#B26A9E"><head><!-- crit-preview-early: 리더 모드를 첫 페인트 전에 적용해 수정 UI가 깜빡이지 않게 --><script>try{if((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview")))document.documentElement.classList.add("crit-preview")}catch(e){}</script><style>html.crit-preview .stats,html.crit-preview .bartitle,html.crit-preview .tabbar,html.crit-preview .charbar,html.crit-preview #pwbtn,html.crit-preview .chip-edit,html.crit-preview .allbtn,html.crit-preview #sessbtn,html.crit-preview #editbtn,html.crit-preview #savebtn,html.crit-preview #descbtn,html.crit-preview #chatbtn,html.crit-preview #msgrbtn{display:none!important}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[0917] 괴물묵시록</title>
<style>
  :root {
    --accent:#B26A9E;
    --rt1:#6b5a8e; --rt2:#8e5a7d;
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  /* 테마 연동 커스텀 스크롤바 */
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent) 62%, var(--line)); }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  header.hero { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:14px; }
  /* 블로그에 붙여넣으면 블로그 테마 자체의 h1/본문 CSS가 우리 값보다 우선순위가 높아서
     타이틀·개요 글씨가 훨씬 커 보였다(실제 피드백) - !important로 블로그 CSS에 안 밀리게 고정 */
  .hero h1 { margin:0 0 4px; font-size:17px !important; letter-spacing:-.5px; }
  .hero .sub { color:var(--dim); font-size:13px !important; }
  /* 세션 정보 */
  .t-writer { display:inline-flex; align-items:center; vertical-align:middle; color:var(--dim);
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:600; margin-left:6px; }
  .s-players { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pbadge { background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:600; }
  .pbadge-gm { background:color-mix(in srgb, var(--accent) 26%, var(--panel2));
    border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .s-overview { color:var(--desc); font-size:12.5px !important; line-height:1.7; margin:0 0 4px;
    border-left:3px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    padding-left:12px; white-space:pre-line; }
  #s-writer:empty, #s-subtitle:empty, .s-overview:empty, .s-players:empty { display:none; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--dim); }
  .stats b { color:var(--text); font-weight:600; }
  .bartitle { font-size:11.5px; color:var(--dim); margin:14px 0 8px; font-weight:600;
    display:flex; align-items:center; gap:7px; }
  .allbtn { font-size:10.5px; padding:1px 9px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; font-family:inherit; line-height:1.5; }
  .allbtn:hover { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .charbar, .tabbar { display:flex; gap:8px; flex-wrap:wrap; }
  .tab-chip { display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:3px 10px; cursor:pointer; user-select:none; font-size:12.5px;
    position:relative; padding-right:20px; }
  .tab-chip:has(input:not(:checked)) { opacity:.35; }
  .tab-chip input { display:none; }
  /* crit-tab-x: 탭 칩 우측의 작은 삭제 아이콘 - head 쪽 기본 스타일에 같이 둬야 한다.
     body 안쪽 저 아래에 따로 있으면, 이 문서가 워낙 커서 브라우저가 그 지점까지 파싱하기 전엔
     패딩/숨김이 적용 안 된 상태로 먼저 그려졌다가 뒤늦게 적용되며 탭 정렬이 움찔거렸다. */
  .tab-chip .tab-x { position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; border-radius: 50%; display: none; align-items: center; justify-content: center;
    color: var(--dim); cursor: pointer; }
  .tab-chip:hover .tab-x { display: flex; }
  .tab-chip .tab-x:hover { color: #e08b8b; background: color-mix(in srgb, #e08b8b 18%, transparent); }
  .tab-name { font-weight:600; }
  .charbar.collapsed { max-height:104px; overflow:hidden; }
  .charbar { align-content:flex-start; }
  .expandbtn { display:none; width:100%; margin-top:6px; padding:2px 0; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; color:var(--dim); cursor:pointer;
    align-items:center; justify-content:center; }
  .expandbtn:hover { color:var(--text); border-color:var(--accent); }
  .expandbtn.open svg { transform:rotate(180deg); }
  .char-chip { display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:3px 8px 3px 4px; cursor:pointer; user-select:none; transition:.15s;
    border-color: color-mix(in srgb, var(--cc) 45%, var(--line)); }
  .char-chip:has(input:not(:checked)) { opacity:.35; }
  .char-chip input { display:none; }
  .avatar img, .avatar b { width:30px; height:30px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-avatar { display:flex; align-items:center; }
  .chip-avatar img, .chip-avatar b { width:22px; height:22px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-name { font-size:13px; font-weight:600; line-height:1; }
  .chip-count { font-size:11px; color:var(--dim); line-height:1; }
  /* 지문/사담 통합 칩: 아바타가 없어 기본 padding(왼쪽 4px)이 그대로면 글자가 테두리에 붙어보인다 */
  .char-chip.merged { border-style:dashed; padding:3px 10px; }
  .char-chip.merged .chip-name { color:var(--accent); }
  .chip-edit { display:flex; align-items:center; justify-content:center; color:var(--dim); padding:3px; border-radius:6px; }
  .chip-edit svg { width:14px; height:14px; }
  .chip-edit:hover { color:var(--text); background:var(--line); }
  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .toolbar input[type=search] { flex:1; min-width:120px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .spanel hr { border:none; border-top:1px solid var(--line); margin:10px 0; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }

  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:hover, input[type=radio]:hover {
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  .mrow button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .mrow button:hover { background:color-mix(in srgb, var(--accent) 26%, var(--panel2)); }

  .msg { display:flex; gap:10px; padding:7px 10px; border-radius:10px; }
  .msg + .msg { margin-top:2px; }
  .msg .avatar { flex:0 0 30px; padding-top:2px; }
  .msg .mbody { flex:1; min-width:0; }
  .mhead { display:flex; align-items:baseline; gap:8px; }
  .mhead .by { font-weight:700; font-size:13.5px; }
  .mhead .ctab { font-size:10.5px; color:var(--dim); opacity:.7; }
  .mcontent { font-size:14.5px; overflow-wrap:break-word; }
  .mcontent img { max-width:100%; border-radius:8px; }
  .msg.desc { justify-content:center; text-align:center; color:var(--desc); font-style:italic; padding:10px 34px; }
  .msg.desc .mcontent { font-size:14px; }
  .msg.general { background:var(--panel); border:1px solid transparent; }
  .msg.general:hover { border-color:var(--line); }
  /* 메신저 스타일: 대사 블록을 메신저 말풍선처럼 - 상대는 왼쪽, 내 캐릭터는 오른쪽으로
     쏠린 좁은 블록(74%)으로 줄이고, 내 캐릭터는 이름·시각까지 오른쪽 정렬 (판정 표 블록 제외) */
  body.msgr .msg.general:not(.roll) { max-width:74%; margin-right:auto; }
  body.msgr .msg.general.mine:not(.roll) { flex-direction:row-reverse; margin-right:0; margin-left:auto; }
  body.msgr .msg.general.mine:not(.roll) .mbody { text-align:right; }
  body.msgr .msg.general.mine:not(.roll) .mhead { justify-content:flex-end; }
  /* 연속 대사: 이름 한 번만, 블록 연결 */
  .msg.general.cont { margin-top:0; border-top-left-radius:0; border-top-right-radius:0; padding-top:0; }
  .msg.general:has(+ .msg.general.cont) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .msg.general.cont .mhead { display:none; }
  .msg.general.cont .avatar img, .msg.general.cont .avatar b { display:none; }
  .msg.general.roll { background:color-mix(in srgb, var(--accent) 9%, var(--panel));
    border-left:3px solid color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .msg.general.roll .mcontent { font-family:Consolas,"D2Coding",monospace; font-size:13px; }
  /* CC 판정 → Roll20 coc-1 스타일 표 */
  .msg.general.roll.cc .mcontent { font-family:inherit; font-size:14.5px; }
  .inlinerollresult { background:color-mix(in srgb, var(--accent) 24%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); border-radius:4px;
    padding:0 5px; font-weight:700; font-size:13px; }
  /* 아바타 열(30px+간격 10px)만큼 중심 보정 → 페이지 가운데와 열 일치 */
  .msg.general .ccroll { transform:translateX(-20px); }
  .ccroll { border-collapse:collapse; margin:6px auto; min-width:230px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .ccroll caption { background:linear-gradient(135deg, var(--rt1), var(--rt2)); color:#fff;
    font-weight:700; font-size:13px; padding:5px 10px; caption-side:top; border-radius:8px 8px 0 0; }
  .ccroll td { padding:4px 10px; font-size:13px; border-top:1px solid var(--line); }
  .sheet-template_label { color:var(--dim); }
  .ccroll .resrow { background:#bebebe; }
  .ccroll .resrow .sheet-template_label { color:#4a4a4a; }
  .ccroll .rr { font-size:13px; }
  .ccroll .rr-extreme, .ccroll .rr-crit { background:#cfe3cd; color:#3f6b42; }
  .ccroll .rr-hard { background:#2e7d32; color:#fff; }
  .ccroll .rr-normal { background:#1b5e20; color:#fff; }
  .ccroll .rr-fail { background:#a84848; color:#fff; }
  .ccroll .rr-fumble { background:#6e2323; color:#fff; }
  .ccroll .rr-etc { background:#8a8a8a; color:#fff; }

  /* 지문출력 캐릭터: 해당 캐릭터의 발화를 Roll20 서술처럼 가운데 지문으로 표시 */
  .msg.general.as-desc:not(.roll) { background:transparent; border-color:transparent;
    justify-content:center; text-align:center; font-style:italic; padding:10px 34px; }
  .msg.general.as-desc:not(.roll) .avatar, .msg.general.as-desc:not(.roll) .mhead { display:none; }
  .msg.general.as-desc:not(.roll) .mcontent { color:var(--desc); font-size:14px; }
  /* info 탭: 핸드아웃 카드 */
  .msg.handout { justify-content:center; padding:14px 34px; }
  .hcard { background:var(--panel); border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:14px; padding:18px 24px; max-width:560px; width:100%; text-align:center;
    box-shadow:0 4px 18px color-mix(in srgb, var(--accent) 12%, transparent); }
  .hcard .hname { font-size:16px; font-weight:700; margin-bottom:10px; padding-bottom:10px;
    border-bottom:1px solid var(--line); }
  .hcard .mcontent { font-size:14px; line-height:1.75; }

  /* main/info 외 탭(사담·귓속말 등)은 흐리게 — 메인 진행과 구분 */
  .msg.subtab { opacity:.55; }
  .msg.subtab:hover { opacity:1; }
  .dclist { max-height:300px; overflow:auto; display:flex; flex-direction:column; gap:7px; margin:4px 0 2px; }
  .dclist label { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; }
  .dclist .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  footer { margin-top:28px; color:var(--dim); font-size:12px; text-align:center; }
  .editing .mcontent, .mcontent[contenteditable="true"] { outline:1px dashed #C98A5B55; border-radius:6px; }
  .editing #log .msg .avatar { cursor:pointer; }
  .editing #log .msg .avatar:hover img, .editing #log .msg .avatar:hover b { outline:2px solid var(--accent); }
  .hide { display:none !important; }
  .ctxmenu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; min-width:170px; box-shadow:0 10px 30px #000a; }
  .ctxmenu button { display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:13px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; }
  .ctxmenu button:hover { background:color-mix(in srgb, var(--accent) 22%, var(--panel2)); }
  .ctxmenu button.danger { color:#e08a8a; }
  .ctxmenu .sep { border-top:1px solid var(--line); margin:4px 6px; }
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:300px; max-height:82vh; overflow-y:auto; }
  .modal.wide { width:min(92vw, 560px); }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal textarea { width:100%; min-height:190px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; line-height:1.5;
    font-family:Consolas,"D2Coding",monospace; resize:vertical; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:30px 12px;
    text-align:center; color:var(--dim); font-size:13px; cursor:pointer; transition:.15s; }
  .dropzone.over { border-color:var(--accent); color:var(--text);
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow.opts { justify-content:flex-start; gap:22px; }
  .mrow label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .iconbtn.on { color:var(--accent); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .pwwrap { position:relative; }
  .pwwrap input { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:7px 36px 7px 10px; font-size:13px; font-family:inherit; }
  .eyebtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--dim); cursor:pointer; padding:4px; display:flex; }
  .eyebtn:hover { color:var(--text); }
  .mrow input[type=text] { flex:1; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; }
  .mrow input[type=color] { width:36px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }

  .mbtns button.danger { background:#a84848; border-color:#a84848; color:#fff; }

<body class="light" data-session='{}'><script>window.CRIT_LOG_DATA = {"title":"[0917] 괴물묵시록","source":"ccf","blocks":[{"y":"say","sp":"-","ts":null,"tab":"info","html":"\n    BGM : https://jukebox.today/kkang0809 \n  "},{"y":"say","sp":"-","ts":null,"tab":"info","html":"\n    :: 운의 소비 룰을 차용합니다.<br>:: 강행, 행깎 선언 등은 메인 채널에서 진행해주세요! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ╭╼|═══════════════|╾╮<br><br>2025/09/17<br><br>괴물묵시록<br><br>CoC 7th 팬시나리오<br><br>W. 청서<br><br>KPC 샬롯 바이런 PC 세피르 해킷<br><br>╰╼|═══════════════|╾╯ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    W͔̹̘̘̯̲͕͇̾̏̉̈̚͟͠͝h̶͈̘̪̜̤̺̬̖͔́͒̀̐͌͝͠y̧̛͔̥̻̺̳͍͊̃͋̋̓̀͠ s̴̳̮̭̣̞̳͆̓̃̐͆̆̋̍̀̕͟͟ḩ̧̛͓̠̝̳͉͇͓͈͌͛̎͂͋͘͠ọ̷͇̦̭͖̙͋̎̄̿̒͂͆͛͋͢ͅṵ̸̱͙̣̼͊̌̅̚͢͟͞l̙͉̖͔͈̣͗͗̂͒̂̅̃͘͡d̼͙̼͙͓͒̐͑̋͆̑̋́͐͜͝ ā̵̗̣̥̲̣͈̱͕͓̂̈́̓̌͡ ḩ̨̨͕͇̫̥̭̆̔̈́̅̂͒̊͆́̕ư͔̰̤̭͎̆̇̊̉̑͢͠m̸̨̨̡̗̖͉̙̞̦̂̏͋̊͡ȁ͔̺̳̘̓̊̓͋̌̿͗͜͞n͔͖͎͕̭̖̞̞̱͚̾̋̽͗̎͐͋͊ s̷̛̞̝͓̼̮̭̞͔͔̺̅̀͂̒̽͊͋͡ǎ̷̫̮̮͖͙̦̺͕͒̈͗͆̽̒́̉͞v̷̩͔̣̥̟̟̝̩̭̪͌͂͌̉͒̂̏͘ẹ̷̛̟̗̪́́̓́͂̍̾͟͝ ȃ̶̬̹͉͈͛̽͋̚͢ h̴̫̞̰͔͇͆̋̊̐͗ü̶̡̟͙̠͍̮͉̰͛̈́͊̔ṁ̸̪̯̤̲̪̂̿̔̅͜͡͝a̶͓̯̱̮̓̇̃̌͒́̔ͅṋ̶͚̦͓͔̒͑̃̽́͌͛́̑?̶̨̥̹͉̭̥̇͌̊͐́̈̇͋̏͟͡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 여전히 무의식의 세계에 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고, 무의식 속의 당신을 누군가가 자신의 성으로 초대합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    정확히는 그런 기분을 느낍니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    걷고자 하면 그 바닥 아래로 길이 깔리고, 희미한 트럼펫 소리와 함께 안내됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    주변 풍경은 탐사자의 상상 속 이미지대로 구현됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신이 생각할 수 있는 가장 화려한, 혹은 흉악한 장식의 성이 당신을 반깁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    붉은 카펫이 기꺼이 몸을 눕히며 탐사자를 반깁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어쩌면 누군가의 가죽일지도 모릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    주변에는 검게 일렁이는 군중이 술렁입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 형태는 정확히 알 수 없지만, 탐사자를 깔보는 듯한 소리를 중얼거리고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    별다른 판정 없이 그들의 언어를 이해할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    반쪽짜리가 올만한 곳이 아니야, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    되다만 것이 어딜 감히! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ...그러거나 말거나, 눈앞에는 거대한 문이 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (저쪽에서는 인간도 아닌 것, 이쪽에서는 되다만 것. 그럼 나는 대체 어느 쪽에 속해야 제대로 된 거지? 웅웅, 불쾌하게 울리는 수근거림을 뒤로 하고 문에 손을 가져다 댄다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    가볍게 미는 것만으로 당신은 어두컴컴한 안으로 들어갈 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고, 안에는……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    연회장처럼 꾸며진 내부, 둥근 원탁과 7개의 권좌, 여섯 개체의 외계 신이 둥글게 둘러싸고 앉아 당신을 지켜보고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    저마다 화신체의 몸을 빌려, 얼굴 위로는 긴 베일을 드리운 채로요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여섯 신은 탐사자에게 잠시 시선을 뒀다가 저마다 하던 행동을 마저 취합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    식사를 하거나, 책을 읽거나, 휴대폰(으로 추정되는 것)을 보던 이들 중, 가운데 권좌에 앉은 외계 신이 탐사자에게 앉을 것을 권합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자는 나머지 한 권좌가 자신을 위한 자리라는 사실을 깨닫습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (권한다면 거절 할 이유가 없다. 말 없이 제 자리를 찾아간다. 어쩌면 이곳에 반드시 오리라고 생각했던 건가?)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    “어서 오세요. 이곳은 새로 태어난 신의 심사와 관리를 주관하는 위원회입니다.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"제 이름은 ⩎⩑⩔⩑⩎로, 인간들이 요그 소토스라고 부르는 외계신족의 일원입니다.” \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    “당신 같은 케이스는 처음이지만 완전히 드문 일은 아니죠.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"절차에 따라 명부에 등록 후 신격화를 진행하겠습니다.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"완전동기화까지 앞으로... 대략 12시간 남았네요.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"화신의 몸은 다른 시간과 차원의 지구로 차원 이동 중이던데, 남은 시간동안 어떤 계획이라도 있습니까?” \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    있었지, 있었는데... (이제 와서 크게 의미가 있는 일인가? 때로는 괴물이라 불리며 공포의 대상으로만 대하던 이들을 위해 또다시 목숨을 버릴 수 있는가? 그리 생각하다보면...) 의미가 있을까 싶네. \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"아하... 이미 당신도 착실히 저희와 같이 완전해지고 있는 중이로군요.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"확실히, 완전 동기화가 진행되고 나면 그런 것 정도는 신경쓰지 않을 겁니다.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"그 때면 그런 '하찮은 것' 따위 눈에 들어오지도 않을 테니까요.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"하지만 이 곳에 모인 우리들은 보다 더 좋은 볼거리를 기다리고 있습니다.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"그러니... 당신의 흥미를 끌 법한 것들을 보여 드리죠. 인연이 있던 자들의 몸뚱이나마 다른 세상에서 만나보시는 건 어떠신가요?\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"이제는 만날 수 없는 사람들도 말입니다.\" \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...방금 '하찮은 것'이라고 했으면서 굳이 만남을 권하는 이유가 있나? 그저 흥미를 끌 법한 일이기 때문에? \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"한 가지 묻죠. 당신은 세계의 멸망을 해결하기 위해 크리쳐가 없는 세계로 가는 것이 맞습니까?\" \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...그래, 맞아. (이전에는 그저 소중한 이들이 더이상 고통 받지 않았으면 해서, 지금 함께 자리하고 있는 이들의 눈에는 하찮기만 한 이들의 목숨이 제게 기대를 걸었기에... 그런 목적을 가졌으나...) 원하는 결과는 같지, 여전히... \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"어느 세계에서든, 기준이 되는 사람들은 존재합니다. 그래요. 당신이 원래 온 세계의 단어를 빌리자면 특이점 정도가 되겠군요.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"대부분의 사람들은 특별한 계기가 없다면 그대로 주어진 삶을 살아가지만...\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"그들은 다릅니다. 변수를 일으키고, 늘 다른 모습으로 세계를 이끌죠.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"제가 만남을 주선할 특이점은 총 여섯 명.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"다른 세계가 멸망하는 역사를 막고 싶다면, 그들을 죽이면 됩니다. 간단하지요?\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"지금의 당신은 반쪽짜리라고 해도 신, 그 세계선의 역사를 다른 세계선들에 뒤집어씌우는 것 정도는 가능할 것입니다.” \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    어렵지는 않은 조건이지. (굳이 이런 조건을 내거는 이유가 있을 텐데, 곧바로 승낙하지 않고 심드렁한 얼굴로 테이블 위를 툭, 툭, 두드린다.) 그들은 죽이지 못하면 다른 세계가 멸망하는 역사가 그대로 이어지는 것 이외에... 다른 변화는 없는 건가? \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"오. 다른 변화를 걱정하나요? 글쎄요.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"이건... 아. 그래요. 알겠다고요. 다른 신족들의 반대로 알려줄 수는 없겠군요. 하지만 스스로 알아내보는 것 또한 재미의 일부니까요...\" \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (단합이 되기는 하나보지... 떨떠름한 표정하고는 다른 이들을 흘긴다.) 그래, 그래... 나도 알겠어. 어차피 간단한 조건이니까 동의하는 걸로. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    만족스럽게 그가 손가락을-그러니까, 두족류의 촉수를-흔들면 곧 원탁 위에서 입체 영상이 시작됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    영상은 지역 곳곳에 있는 지명과 인물을 띄웁니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [코튼 캔디와 리리 라클렛] [콘라드와 오데트] [세피르 해킷과 샬롯 바이런] \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (전부 익숙한 이름들이네...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (코튼과 리리 쪽을 먼저 본다. 이쪽에서도 여전히 돈독한 파트너 사이라도 되나.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 종합 병원에서 일하고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    리리 라클렛은 물리치료사, 코튼 캔디는 의사로 보입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    바쁘게 일하며 움직이는 모습이 영상에 찍혀있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (안 어울려.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (대충 흘기고... 다음, 콘라드와 오데트 쪽으로 시선 옮긴다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 대학원생입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    해양 생물 연구를 위해 바다 인근 연구소에서 일하고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    좋은 교수를 만나 의기투합해 열정적으로 연구에 임하고 있네요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    만나기는 설산에서 만났으면서. (정반대인 장소에 있는 것을 들여다본다... 이쪽도 안 어울린다는 감상 덧붙인다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (마지막으로 남은 건...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (잠깐 망설이기는 했으나, 남은 이들을 바라본다. 세피르 해킷과 샬롯 바이런에게 평범한 일상이 제대로 주어졌는지.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 학교에서 선생님으로 일하고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신의 모습은 각도에 가려져 잘 보이지 않지만, 샬롯과 함께 점심을 먹고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯의 표정은 당신이 늘 봐 오던 모습입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    안전지대가 없는 세계이므로 뿔뿔이 흩어지는 건 당연하지만, 인연이라는 게 정말 있는 모양일까요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 세계선에서는 파트너끼리 각자 같은 직업으로, 하지만 서로 다른 지역에서 행동 중입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자세한 모습을 확인하기 전에 입체 영상은 종료됩니다. \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    “이 정보는 도움이 될 테니 드리겠습니다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그는 평범한 살해가 아닌, 탐사자와 같은 ‘신’의 힘을 사용해 특이점 그 자체를 제거하는 게 포인트라고 강조합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 특이점이 제거되면 세계선의 연쇄 작용이 발생되어 무너지는 다른 차원의 역사 역시 새로 쓰이고, 그동안의 재난과 특이점은 모두 ‘없던 일’과 ‘없었던 사람들’이 될 것이라고요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    단순한 살해로는 안 된다니, 조건이 붙긴 하네. (짧게 침음한다. 방식은 달라도 결국은 그들을 특이점에서 지워내는 일이고, 연쇄 작용으로... 그래, 원하는 것을 이룰 수 있다.)  \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    “뭐. 물론, 전부를 제거할 필요는 없을지도 모르죠.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"일부를 제거하고 경과를 지켜봐도 상관 없다는 뜻입니다.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"당신이 원하는 일을 다 하기에... 시간이 당신의 편을 들어 줄 지는 모르는 일이지만요.\" \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그가 탁자 아래로 내리고 있던 팔을 테이블 위로 올립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    혼탁한 색의 위족이 구불거리더니, 테이블 위를 기어다니고 있던 검은 좁쌀 같은 생명체를 살짝 누릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그것만으로 존재는 사라집니다. \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    “12시간 내로 잘 마무리하고 돌아오시길 기대하고 있겠습니다.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"인간 차원에서 신이 발생하는 건 정말 유례 없는 일이거든요. 지켜보지 않을 수야 없죠.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그제야 탐사자는 이 연회장의 내부를 제대로 볼 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    검은 좁쌀 같은 것들은 전부 흉측한 모습으로 벌거 벗은 채 기어다니는, 피부가 벗겨진 제물들입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그들은 종종 살아있으며, 종종 미쳐 있고, 종종 소리를 지릅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    하지만, 파리의 비명은 인간에게 닿지 않는 법. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    신에게 그 목소리는 닿지 않습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그리고 당신 역시 인지하지 못하고 있었습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신은 인간성을 잃어가고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    앞으로 12시간 후면, 모든 걸 잃고 그들과 같은 존재가 될 것입니다. \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"ㅡ아, 마침 신체의 전송이 끝났나 보군요.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"더 나누실 말씀은?\" \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    해야 할 일이 우선 있으니... 끝내고 와서 하는 걸로.  \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"좋습니다.\" \n  "},{"y":"say","sp":"⩎⩑⩔⩑⩎","ts":null,"tab":"main","html":"\n    \"그럼, 건투를 빕니다.” \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 탐사자는 도시 한복판에서 눈을 뜹니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짧은 호흡, 완전히 다른 공기가 당신을 맞이합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이곳은 크리쳐도, 안전 지대도 없는 세계입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    얼핏 보면 거리의 풍경은 안전 지대와 크게 다르지 않아 보이지만, 이런 세계가 어떤 제약도 없이 넓게 펼쳐져 있겠죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어느 정도의 거리는 공간 이동이 가능합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    시작과 동시에 광기가 지급됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    광기 : 악인 의 데이터를 공개합니다. \n  "},{"y":"say","sp":"광기 : 악인","ts":null,"tab":"info","html":"\n    당신의 영혼 절반은 악신에게 침식되었습니다. 그것은 시간이 흐를수록 더욱 더 빠르게 당신을 좀먹습니다. 작게는 좋아하는 것들이 사라지고, 싫어하는 것들이 많아집니다. 크게는 범죄 행위에 관한 쾌락에 눈 뜨고, 윤리관을 상실합니다.<br><br>영원한 것은 존재하지 않습니다. 12시간 내로 사명을 수행하지 못하면, 당신은 악신에게 몸을 완전히 빼앗겨 두 번 다시 행할 기회를 얻지 못할 것입니다.<br><br>광기에 어긋나는 행동과 발언을 할 경우, GM은 판단 하에 페널티를 지급할 수 있습니다. 1회마다 HP1D20이 차감됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    [코튼 캔디와 리리 라클렛] [콘라드와 오데트] [세피르 해킷과 샬롯 바이런], 누구에게든 갈 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (그때 맞서려고 했던 것도 이렇게 아무 생각 없이 강림하려 했을지도 모르겠단 생각이 잠시 스쳤다. 표정이 살짝 찌풀어졌다가 곧 풀어진다. 12시간, 반나절이나 되는 시간이니 여유는 있지만... 빠르게 해결 할 수록 좋겠지.) (첫 번째로 만날 건 코튼과 리리다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ병원 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 일하는 곳은 도심에 위치한 종합 병원입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    6층 이상의 상위 층은 전부 병실입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    들어서면 카운터에서 번호표를 뽑은 후 대기하라는 자동 멘트가 들려옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    카운터에서 두 사람의 이름을 대며 찾지 않아도, 당신은 안대 아래 가려진 중앙 관리 체제 시스템을 사용해 병원 내부의 모든 CCTV를 파악할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 3층 휴게실에 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    의사, 그리고 물리 치료사라고 했지... (3층으로 느긋하게 향한다. 이곳에서는 군인도 아니니 경계하지는 않겠지, 아마.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    휴게실 내부로 들어서면, 코튼 캔디는 탐사자의 하얀 코트를 의사 가운으로, 안대는 다래끼로 착각했는지, 동료 의사로 오해해 인사합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    리리 라클렛은 피곤한 듯 잠시 테이블에 엎드려 졸고 있습니다. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    아. 잠깐 쉬러 오셨나요? \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    세상에. 다크서클 좀 봐... 요즘 환자가 늘어서 힘드시죠? 이해해요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    잠깐 쉬세요. 지금은 그래도 환자분들이 그렇게 많이 몰리는 시간대는 아니잖아요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그의 분위기는 사뭇 다릅니다. 당신이 알던 사람보다 훨씬 더 싹싹하네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    간단한 잡담을 나눌 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...그럼 호의에 감사히요. (딱히 거절 않고 조금 떨어진 곳에 자리를 잡는다. 이게 마지막이 될 수도 있는데, 군인이 아닌 의사인 쪽이 이름에 어울린다는 생각을 잠시 했다. 저기서 졸고 있는 쪽은 잘 모르겠다만.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n     \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    하하, 못 보던 얼굴인데... \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    이번에 새로 오셨어요? 저희 병원이 의사 수가 좀 적어서 초반에는 다들 힘들어 하시더라고요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    네, 다른 병원에서 근무하다가 이쪽으로 옮겼습니다. 기존에 일하던 곳은 일손이 부족한 것도 아니었고, 분위기가 안 맞아서. (으쓱...) 저쪽에 계신 분은 완전히 곯아 떨어진 모양인데, 근래에 일이 많긴 했나봐요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    네에. 뭐... 아무래도 저희 병원은 그렇게 썩 복지가 좋진 않잖아요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    페이도 짜, 병원에 사람도 덜해, 환자는 많아... 보통은 금방 그만두시죠. 저도 이 친구 아니었으면 그만뒀을지도 몰라요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    선생님도 잠깐 눈 좀 붙이실래요? 저는, 음... 저도 좀 잘까 싶긴 했는데. 요즘 악몽을 자꾸 꿔서 잠이 안 오더라고요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...몸이 피곤하니 악몽까지 이어지나보죠. (별 흥미는 없지만... 지금은 반감이나 경계심을 품게 하지 않는 쪽이 이로우니...) 어떤 꿈인지 물어도 괜찮을까요?  \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    음, 으음... \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    좀, 어, 영화를 너무 많이 봤나 싶겠지만 이상하다고 말씀하시면 안 돼요.  \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    저는 늘 아주 추운 곳에 있는 꿈을 꿔요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    큰 총을 들고, 눈 내리는 곳에서 싸우는 꿈이에요. 그것도 늘 이 친구랑 (리리 머리 툭 쓰다듬고) 파트너로요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    항상 끝에선 괴물한테 죽어버려서 뒤끝이 찝찝하지만……. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    (짧게 손사래친다.) 뭐, 그럴 일은 없겠지만요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    저는 그냥 재활의학과 의사고, 이번 겨울은 아직 오지도 않았는걸요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    으음. ... ... 그래도 가끔은 좀, 그 꿈이 기다려지기도 해요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    영화 주인공 같은 삶을 제가 또 언제 살아 보겠어요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 세계가 다른 세계의 그에겐 간절히 바라던 일상이었다는 사실도 모른 채, 잡담은 이어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    느슨한 빈틈이 속속들이 공개됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    언제든, 손을 뻗는 것만으로도 이어지지 못할 목숨들이 당신의 앞에 존재합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그 꿈이 기다려진다, 라... 그게 일상인 꿈 속의 선생님은 오히려... 이곳에서 이렇게, 시시콜콜한 잡담을 나누는 평범한 일상을 꿈 꿀 지도 모르는 일이죠. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜, 영화에서도 그렇잖아요? 사실 히어로가 바랐던 건, 빌런이 바랐던 건... 평범하고 사소한 행복이었다, 그런 거.  \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    아, 그럴까요... 으음. 하긴. 그렇게 매번 꿈꿀 때마다 괴물에게 죽는 끝이라니. 진짜라면 아무리 저라도 당장 일을 그만두고 싶을 것 같긴 하네요. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    죽어가면서 사람을 살리는 일을 해야만 한다면, 그건 좀 슬플 것 같기도 하고요... \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    이크. 저는 곧 수술이 있어서. 슬슬 가 봐야 하는데... 선생님께서는 좀 더 쉬실래요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...음, 네, 휴식 시간이 주어졌으니 조금 더 쉬다가 때 맞춰서 갈게요. 지금 아니면 또 언제 쉴 수 있을지 모르니까.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    자리를 정리한 코튼 캔디는 휴게실 문을 잡고 잠시 뒤를 돌아봅니다. \n  "},{"y":"say","sp":"코튼 캔디","ts":null,"tab":"main","html":"\n    아, 조금 이따 1시에는 복귀해야 한다고 알려 주세요! 알람 맞추고 잔다곤 했는데. 한 번에 못 일어날 거에요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그럴게요, 걱정 마시고... 음, 이번 수술도 무사히 마치시길 바랄게요.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    짧막한 인사 이후 코튼 캔디는 휴게실을 벗어납니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (째깍, 째깍, 부지런히 움직이는 시곗바늘의 소리만이 휴게실에 울렸다. 여전히 세상 모르고 단잠에 빠져 있는 리리를 가만히 바라본다. 한 때는 의지 할 수 있는 동료였다가, 코튼을 잃고 나서는 저와 같은 선택을 앞서 했던 존재이면서... 지금은...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (전혀 안 어울리는 일을 하고 있다 생각했는데, 마냥 그렇지는 않은 것 같다. 말대로 설정 해둔 알람이 시끄럽게 울리는데도 일어나지 못하는 모습을 보다 결국은 일어나 등을 툭, 툭, 가볍게 두드린다.) 일어나. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    choice 들었다 쿨띠 (choice 들었다 쿨띠) ＞ 들었다\n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ㅡ큷. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    헉 씨. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    누구세용?! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...캔디 선생님께서 혹시 모르니 깨워달라고 부탁하셔서요.  \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    헐. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    허어어얼. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    캔디 언니가염? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    (쓰흡. 침 슥슥 닦고는 휴대폰 액정 본다. 그러니까, 시간이...) 흐미. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    실화인가. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    왜 더 빨리 안 깨워 주셔쓰용?!?!! (가지가지다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (물리 치료사 맞아?) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    알람 울린 시간 맞춰서 깨워드린 건데요?  \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    네헤? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    음. 리리가 바보였군. 어느 놈이 휴식이 1시까지인데 1시까지 잔다고 하지... \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    (슥슥 침 닦고는 제대로 된 사람처럼 얼굴 정리했다. 고작 20초만에!) \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    착한 검은머리 아저씨, 땡큐! \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    ...아니다. 신규 쌤이세여? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (어이가 없다. 뭐라고 대꾸 해야 할지 감도 안 잡혀, 머리를 짚었다.) 네, 신규로 들어왔어요... 최근에...  \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    허어어어얼. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    근데 안대는 왜 꼈어여? 다래끼? \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    아님 뭐 꿰매셨어염? 헐 지금 이 얘기할 때가 아님!!! \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    리리 후딱 복귀하러 감!!!!!!!! \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    (냉큼 문짝까지 튀어간당. 그러다 우뚝) \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    쌤 왜 복귀 늦었냐고 갈구면 제 이름 대세욤. 리리라고, 재활과 물치실이에염. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    네, 네, 기억 해두죠. 이미 늦은 것 같은데... 빨리 가보세요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    캔디 선생님한테 나중에 꾸중 듣지 마시고. \n  "},{"y":"say","sp":"리리 라클렛","ts":null,"tab":"main","html":"\n    네헤에에에에에에. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    땡큐!!!!! 라고 고함지르듯 인사하고는 리리가 자리를 벗어납니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아직, 남아있는 특이점은 여섯입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (매번 계획하고, 예상한 것과는 전개가 다르게 흐른다. 작게 앓는 소리를 내고는 지체 없이 다음 특이점들을 만나기 위해 움직인다. 콘라드와 델타가 아닌 그저 콘라드와 오데트는 어떤 모습일지.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ연구소 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 일하는 바닷가는 도심지에서 차로 2시간 정도 떨어진 곳에 위치한 곳입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    경치가 좋고, 햇볕이 따사로워 휴양지로도 좋아 보이네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    예쁘게 깔린 모래사장 위를 뛰어노는 아이들도 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    연구소 내부의 모든 CCTV를 파악할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 2층 복사실에 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (생각보다 이동하는데 시간을 잡아먹는군. 근심, 걱정 하나 없을 따뜻한 곳에 있는 연구소를 잠시 응시한다. 해양생물 연구라도 하나, 그리 중얼거리며 안으로 들어섰다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람 다 조금 구겨진 흰 가운을 입고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드는 탐사자가 기억하던 그대로지만, 오데트는 탐사자의 기억과는 다른 외관입니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    음? 누구세요? 여기 관계자 외 출입 금지인데... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    오늘 교수님 면담 일정 있지 않았던가? (불쑥) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아. 그 분이신가? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    좀 일찍 오셨네요! 지금은 교수님이 안 계시는데, 커피라도 드실래요? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    이 시간엔 아직 학회에 가 계실 거거든요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (조금 다르게 생겼나... 대답 이전에 잠시 입은 다물고 두 사람의 얼굴을 훑었다.) 면담 일정보다 일찍 도착한 모양이네요.  \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    네에. 조금요? 오후 타임이셨으니까... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아냐. 아냐. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    교수님 성격에 분명 대강 뭉뚱그려서 12시부터 4시 사이에 오세요~... 뭐 이러셨을 걸. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    믹스커피 괜찮으세요? (일단 타 줄 모양이다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    네, 믹스커피로도 괜찮아요. ...음, 교수님 밑에서 일하는 거 힘들지는 않아요? 말씀하셨다시피, 뭉뚱그려서 말씀 하시는 일 잦으신데. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    콘라드가 서글서글하게 웃으면서 복사한 종이를 챙깁니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    어휴. 뭐 어때요. 그래도 상관은 없어요. 사람은 좋은 분이시고. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    뭐... 그렇지만 그 흥미 위주의 느긋한 습관은 좀 고치셨으면 좋겠네요... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    어쩌겠냐~ 교수님 취향 바뀌는 거 하루 이틀 보는 것도 아니고. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    이번 학회도 무슨 처음 들어보는 거 아녔어? 뭐였더라. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    신규 발견한 세포를 이용한 자가 복구 치료 관련 건의 발표. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그거 교수님 작품이잖아. 어휴. 우리 분야는 수상 생물인데도... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아직 외계인 연구 안 한 걸 다행으로 생각해. (키득인다.) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    자. 믹스 커피입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    외계인 연구라... ...교수님이면 하실 법도 한데요, 학원생들 몰래 하고 계신 거 아니에요? (잔 받아들고 입에 대지는 않은 채 만지작거린다.) \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    어휴. 저희 몰래 하신 적 있어요. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    뭐더라. 판타지 영화 고증 자문? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    그래봤자 B급 영화일 텐데... \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그런 거라도 들어와서 다행이죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 소소한 잡담을 나누며 웃습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    헤어지기 전의 마지막 모습을 생각하면, 믿겨지지 않을 정도로 평화로운 풍경입니다. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    아, 내 정신 좀 봐. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    면담 건, 이번 프로젝트 관련이었죠? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    오데트. 우리 샘플 남은 거 있어? \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    어. 제일 성공한 건 교수님이 학회장에 들고 가시긴 했지만... 폐기하기 전 것들 아직 남았을 걸. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    실패작만 있다는 뜻이네. (어깨 으쓱이곤) \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그거라도 미리 한 번 보실래요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    실패작들을 개선하고 개선해서 성공작이 나온 거니까요. 그거라도 보면서 시간 떼우는 걸로 하죠. ...음, 학회에서 마음이라도 맞는 분 찾아서 토론이라도 시작하시면 4시까지도 안 돌아오실지 모르니까.  \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    아아. 현실성 있는 이야기라 더 무서워. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러면 두 사람은 선선히 고개를 끄덕이곤 당신을 실험실으로 안내합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 곳에서 마주한 샘플들은, 네. 익숙한 모습입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    금속물질로 변하다 만 액체 덩어리, 웬 진흙같이 질퍽이는 무언가... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    완전한 것은 아니지만, 확실히 이것은 당신이 아는 크리쳐와 닮아 있습니다. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    완성작이 아니라 조금 형태가 그렇긴 하지만요. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    좀 더 보실래요? 뭐라도 더 가이드 해 드리고 싶은데, 슬슬 저희 업무 시간이라. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아, 그럼 혼자 조금 더 보는 걸로 하죠. 귀중한 시간을 뺏을 수는 없으니.  \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    네에에. 아, 나오시고 저희한테 말씀만 한 번 주세요! \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    그래야 저희도 여기 문을 닫거든요. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    너무 오래 기다리시는 것도 뭣하니까... 음. \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    ... 혹시 교수님 번호로만 연락하세요? \n  "},{"y":"say","sp":"콘라드 신","ts":null,"tab":"main","html":"\n    교수님, 성격 특이하셔서 이메일 아니면 알림 안 울리시거든요... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...아, 그래요? 번호만 가지고 있어서 그리로만 연락 했었는데. \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    ...어쩐지... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    교수님 연락, 하루에 한 번 되거나 아예 안 되셨을 텐데... \n  "},{"y":"say","sp":"오데트","ts":null,"tab":"main","html":"\n    (안쓰러워하며 이메일 주소 교수 명함에다 적어준다. 이름을 보면, 책임교수 미고.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람은 명함을 건네주곤 자신의 일터, 그러니까 사무실으로 돌아갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여전히 생존한 특이점은 여섯입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (이번에는 왜 망설였는지 스스로도 답을 찾지 못했다. 명함을 쓸어보고, 연구소에서 나와 짙은 한숨을 내뱉는다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (...자, 이번에는... 나 자신과 샬롯을 보러 갈 차례다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ학교 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 일하는 곳은 A시의 학교, KPC가 졸업한 곳입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어느덧 하교 시간이 지나 학생들이 공을 차며 뛰어놀고 있습니다.  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    교내의 모든 CCTV를 파악할 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그런데 탐사자는 보이지 않고, KPC만 홀로 교무실에 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ... (혼자 있나, 발소리를 죽이고 다가가 교무실 문을 살짝 열었다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    푸른 하늘, 선명한 구름, 적당히 좋은 날씨와 선선한 바람. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    창가 자리에서 KPC는 선생님이 되어 턱을 괸 채 모니터를 지켜봅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이윽고 인기척을 느낀 그가 탐사자가 선 방향으로 천천히 고개를 돌립니다. \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    choice 눈치챈다 못챈다 (choice 눈치챈다 못챈다) ＞ 못챈다\n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    응? 저어, 해킷 씨... 뭐, 뭔가 오늘 아침이랑 분위기가 달라지지 않았어요? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (이상하네. 뭐 때문이지? 다른 사람일 것이라곤 추호도 예상하지 못했습니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...그런가요? 아침이랑 크게 달라진 점 없다고 생각하는데요. (뻔뻔하게 대꾸하고는 어깨를 으쓱인다.) 퇴근 안 하고 혼자 교무실에서 뭐하고 계셨어요? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    가, 갑자기 웬 존댓말이에요? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    저, 저, 저야 이번 기말고사 대비 요점... 정리하고 있었죠. \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    ... 조금만 도와주시면 안 돼요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    혼자 있길래 장난치고 싶어서. (특이점에서도 반말하는 건 같았나, 도움을 청하는 물음에 기꺼이, 라며 안으로 들어선다.) 과목은 다른데, 도와줄만한 게 있으려나 모르겠네. \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (그러면 헤, 짧게 웃곤) 실은, 이번 문제 내면서 고민하던 게 있었는데... 문제 두 개 중에 뭐가 더 쉬울지 골라줄 수 있어요? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (그것도 그렇고, 음, 체육대회 때 애들이 선생님네 반이랑 같이 팀 짜달라고 그러더라고요. 들어줄까 말까 고민이 되어서... 하며 실실 웃습니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    시험 문제 고르는 거야 어렵지 않지. 어디... (자연스레 책상 위에 놓인 것 내려다본다.) 우리 반이랑 같이? 우리 애들도 운동을 그렇게 잘 하지는 않았던 것 같은데.  \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    같이 하면 선생님도 같이 뛰어주시잖아요. (아, 이거랑 이거요. 둘 다 똑같이 고전이긴 한데... 하며 손가락으로 톡 톡 가리켰습니다.) \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (후후 웃는 소리가 났다가) \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    선생님만큼 믿을 사람이 없는 건 저도 맞다고 생각하거든요. (장난스러운 웃음소리였습니다.) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    간만에 익숙한 어투입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 세계에 와서 처음으로 듣는 낯익은, 또는 낯선 목소리일지도 모르겠습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 목소리를 들은 탐사자의 머릿속으로 지난 기억들이 생생하게 밀려들어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자를 향해 발포하던 모습, 탐사자의 폭주를 제압하던 모습, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    옥상에서 마주하고, 함께 맞서 싸울 수 없는 존재와 싸우고, 결국엔 적이 되었다가, 다시 곁으로 돌아왔다가, 또……. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이제 와서는 필요 없어진 기억일까요? 머리가 지끈거립니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    HP -1D10. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    1d10 (1D10) ＞ 9\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 세피르 해킷 ] 체력 : 56 → 47 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뿌옇게 그림자 진 시야 너머로 KPC가 다가옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    괜찮냐고 묻는 목소리가 윙윙거리며 귀를 괴롭힙니다. \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    저기, 해킷 선생님? ...세, 세피르? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    정말, 이렇게 아팠으면 병원에 가란 말이에요...! \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (데려다 줄까요? 하며 당신 안색 살핍니다.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...아니, 괜찮아, 잠깐 머리가 아파서. (손을 가볍게 내젓는다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    병원까지는 갈 필요 없어, 괜찮아. \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    ... ...정말요? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (그러면 당신 얼굴 빤히 들여다봅니다.) \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    정말요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...정말로. (톡, 손 들어올려 네 코끝이나 가볍게 튕겼다.) 할 거 다 했으면 같이 퇴근이나 빨리 할까? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (그럼 손 끝이 닿을 때 눈 꼭, 한 번 감았다가 뜹니다.) 당신은 걱정해 줘도 그래요. 흥, 괜찮은 거면 됐어요... \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    으으음. \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    음... \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (조금 고민해보다가) 네에, 뭐. 그럴까요? 남은 건 내일 해도 괜찮은 업무들이니까... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    괜찮다고 하면 괜찮은 거지, 쓰러진 것도 아니고... 피를 본 것도 아닌데. (으쓱, 하며 대수롭지 않다는 듯한 반응한다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이만 집에 가기로 결심 헀으면 가자. (톡톡, 책상에 아직 놓여있는 물건들 가리키듯 가볍게 두드린다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯은 늘어져 있는 종잇조각이며 노트북 따위를 그제야 허둥지둥 정리합니다... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    말끔히 가방에 넣고 (그러니까, 욱여 넣고...) 나면, 퇴근할 시간입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    choice 자가있다 걸어가라 (choice 자가있다 걸어가라) ＞ 걸어가라\n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    손이라도 잡고 걸을까요? 제법 답지 않게 로맨틱해 보이겠네요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (흠, 하고 짧게 침음하다가 손 내민다. 딱, 손을 맞잡을만한 높이로 들어올리고 가만히 기다린다.) 갈까? \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    choice 잡는당 꺅!!! (choice 잡는당 꺅!!!) ＞ 잡는당\n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    어머. ... ...애, 애들 다 하교했죠...?! \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    (그럼 간만에 그 손 위로 제 손 올리고는 또 히 웃었습니다.) \n  "},{"y":"say","sp":"특이점의 샬롯","ts":null,"tab":"main","html":"\n    네에. 가요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 두 사람이 얼마간 걸어 어느 아파트 단지 앞으로 다다른 무렵입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 쯤에서 샬롯은 잘 가라며 당신에게 손을 흔들어 주겠네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 헤어질 쯤, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어디선가, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    스산한 기운이 뺨을 스치고 지나갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    따뜻한 액체가 흐르는 기분에 손등으로 뺨을 훔치면, 붉은 피가 번집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자의 바로 옆에 있던 기둥에는 익숙한 모양의 단도가 꽂혀있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어떻게 모르겠어요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이건 AOC에서 사용하던 무기입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    반사적으로 무기를 날린 곳을 향해 몸을 돌리면, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ잠시 비일상과 일상의 경계가 모호해집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    새하얀, 너덜너덜한 군복을 입은 샬롯이 서 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯은 한 발자국 다가가며 권총을 장전합니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    정말, 오래 찾았거든요... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다정한 내용이지만 살벌한 목소리, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    틀림없이 당신이 잘 아는 샬롯입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그것도 당신이 ‘버리고 온’ 쪽이네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    설마 여기까지 쫓아올 줄은 몰랐는데, 놀라운 집념입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    길게 말할 필요도 없이 1:1 전투가 시작됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    1라운드, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    KPC의 선공입니다. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... (짧게 숨 몇 번 고르다가) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    할 말, 없어요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (입술을 앙다뭅니다. 그러고, 당신을 바라봅니다. 물빛 눈동자가 그저 원망 담아서.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ... ...보고 싶었어, 라고 하는 게 좋을까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    왜 그렇게 보고 그래, 한참만에 만났는데... 그런 눈으로 보려고 여기까지 찾아온 건 아닐 거잖아, 그렇지?  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    샬롯은 행동 없이 한 턴을 소모합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    PC의 턴입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    내게 할 말이 없느냐고 묻지만 말고... 하고 싶은 말이 있으면 해, 샬롯. (날붙이도, 굳게 쥔 주먹도 제게 날아들지 않는 것을 보고는 천천히 다가선다. 한 발짝 정도의 거리를 벌리고 서서 허리를 살짝 굽혔다.) '보고 싶었어요, 세피르. 왜 저를 두고 갔어요?' 라고, 하고 싶은 거 아니었어?  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    나는 널 해칠 생각이 없어.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    난, 나는, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ('왜 저를 두고 갔어요?' 그 말이 정확히 입 속에 맴돌았습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...당신이 도대체 왜, 왜 이러는지 모르겠어요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    갈 거에요, 이번에도...? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    목적을 이룬다면 가겠지, 그러니까... ...또 다른 네가 죽지 않아도 되는 세계를 위해서. 또 어딘가에 있을지 모르는 샬롯 바이런을 위해서.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 그 때서야 날붙이 하나를 들어올립니다.) ㅡ당신이 도대체 무슨, 무슨 말을 하는지 모르겠다고요... 다른 내가 왜요? 나는, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    나는, ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    제 파트너는 당신인데... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    나는 그 곳에서도 안 죽었어요. (반 걸음 앞으로,) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    왜냐면, 당신이 나만 살려두고 갔으니까! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    이런 식으로 전부 죽어버린 세상에 혼자 남겨지고 싶었던 게 아니란 말이에요, 나는...! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...그럼, 나는 쓰러져 가는 사람들 사이에 서있는 네가 아니라... 함께 쓰러지는 너를 보고 가만히 있었어야 해?  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    너만이라도 살았으면 했어, 그게 그렇게 질타 받을 일이고... ...잘못한 일이야?  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...하지만, 당신이 내게 아무 것도 알려주지 않았잖아요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    있죠, 나는 어차피 예견된 종말 속에서 몇 시간이나 더 삶을 연명하고 싶었던 게 아니에요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저는 당신과 함께 그 상황을 해결하려고 한 동등한 입장이었다고요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그때 마땅히 해결 할 수 있는 방법이 명확히 있었나? 아니었잖아, 너도 알고 있으면서...  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    0에 수렴하는 가능성이더라도 붙잡고, 확인 해보고 싶었어. 누군가의 희생이 있어야만 유지 되는 세상은 없어지지 않더라도, 그 누군가가 네가 되지 않기를, 내가 되지 않기를 바라서. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... 당신... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 손 뻗어서 당신 소맷자락 잡습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    가지 말아요. (그러니까, 어떠한 억울함? 또는 서운함. 그 모두가 합쳐진 마음일수도 있겠습니다. 그저 당신을 잡아둔 채로.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...내가 가지 말라고 붙잡았을 때, 너는 기어코 문을 나섰는데. (옅은 한숨이 새어나온다. 아마 그때 제가 보았던 뒷모습은 이곳의 네가 아니겠지만 너도 '샬롯 바이런'이니까. 몸이 살짝 기울어지고 이마가 가볍게 맞닿는다.) 나는 붙잡혀 줘야해? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (서러움 담긴 눈동자가 피하지 않은 채 당신을 응시합니다. 뭐, 정말 맞닿을 때는 잠시간 눈 한 번 감았다 떴겠지만...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신은 도대체 '내'가 몇 명이나 있어요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    저는, 당신을 버린 적 없는데... (저한테는 당신도 하나 뿐인데... 말 끝에 물기가 조금.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    글쎄... 일단 아는 것으로 세자면 한 손에는 꼽을 수 있겠어. 이곳에 있는, 평범한 일상을 살아가는 바이런 선생님까지.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...몇 명이나 있는지가 궁금했어? (굽혔던 허리를 세워, 약간의 거리를 유지한 채로 마주본다. 아마 지금의 네 입장에서 '버린 것'은 내가 한 행동일 거다. 그곳에 두고 와버렸으니까.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    잠시 상황이 소강됩니다. (진짜로?) \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이상한 일입니다. 어쩐지, 옛날처럼 마주보고 있을 수 있잖아요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    굳이 알려주지 않아도 상관없지만, 이 또한 약간의 변덕이라면 변덕이 되겠습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    여기서부터는 조금이나마 제대로 된 대화를 나눌 수 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    뭐... 원한다면요. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...씨이. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그래서, 이 평화로운 세계에는 대체 왜 온 건데요? 바이런 선생님이나 보려고? (어쩐지 정말, 정말정말 서러워지고 있는 표정...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    음... ... 응, 맞아. 평화로운 세계에 있는 바이런 선생님 보려고 왔어. (굳이 말 할 필요는 없겠지. 보러 온 것도 완전히 틀린 말은 아니고, 알게 된다면 저지 할 것이 뻔하니까.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ......진짜...? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (아 왜 여기서 억울해지지? 울먹... 울먹...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...봐서 뭐 할 건데요! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    제, 제가 더 도움될 거거든요! (웄...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    해킷 선생님인 척, 내가 가지지 못했던 평화로운 일상을 즐겨보기? (마음에도 없는 소리다. 적어도 지금의 세피르 해킷으로는.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (괜히 한 대 퍽.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (치고 쫄아서 쳐다봅니다...) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...왜 심통이 났지? (눈 가느다랗게 뜨고 본다...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    진짜 모르는 거에요?! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    바보 아냐! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면서도 슬금슬금 당신 소매 잡습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...여기서 할 거 다 하고 나면 다른 데 가지 말고 돌아가면 안 돼요? (나 이제 진짜로 당신만 남았단 말이에요... 웄.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...아무 것도 남지 않은 세계로 돌아가도 괜찮겠어? 네 말대로, 너와 나만 남은 곳이잖아. (소매 붙잡고 있는 손은 떼어내지 않고 가만, 내버려 둔다. 그리고 생각한다. 그게 최선인가?)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그럼 여기서 살아요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    여기는 당신 말대로, 이미 '나'는 선생님인데? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    나는 생각보다 내 세상도 좋아한단 말이에요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이곳에서 '네'가 선생님으로 살고 싶다고 한다면 못 할 건 없지. (애초에 이곳의 여섯, 특이점이라 불리는 인물들은 제거하기 위해 온 것이기도 했다. 너를 스러지게 만드는 건 유쾌하지 않은 일이지만, 그럼에도... 그것을 '나'를 유일한 세피르로 생각하는 네가 바란다면야.) 지긋지긋한 화약 냄새를 맡지 않아도 되고, 역겨운 크리쳐 체액을 뒤집어 쓸 일도 없어, 이곳은.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    바이런 선생님이 그러더라, 곧 체육 대회라고. 이곳에서도 샬롯 바이런과 세피르 해킷은 사이가 제법 좋은 모양이야. 다행히. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    무슨, 농담도... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러나, 자신은 그저 제게 주어졌던 세계를 다만 사랑했기 때문에. 자신이 그를 대신하여 자리에 들어갈 것이라고는 상상도 하지 못한 채입니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    나는 사람 돌보는 데에는 소질 없어요. 알잖아요, 당신도. (흥. 어디서든 당신이랑 내가 사이가 안 좋을까요 그럼? 농담처럼 말소리가 따라붙습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...돌아가는 건 싫어요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...적어도 지금은 돌아갈 생각 없어. (주어진 세계를 사랑했던 건 저도 마찬가지였다. 수많은 이들의 기대를 업고, 소중한 존재를 만들고, 때로는 의지하기도 하고... ...그럼에도 인간의 몸으로는, 그저 크리쳐의 몸으로는 이뤄낼 수 없는 것들이 많아서.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    같이 돌아가고 싶으면, 따라다니면서 열심히 설득이라도 해봐. 샬롯, 네가 하는 말이라면 설득 될지도 모르지. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...당신 원래도 이렇게 성격 안 좋았어요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    지금도 설득당해줄 생각 없었으면서... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면서도 소맷자락 쥐었던 손 조금 움직여 팔짱 낍니다. 흠, 흠!) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    원래도 좋은 편은 아니었을 걸. 아마. (이제는 저도 기억이 잘 나지 않는다. 어깨 한 번 으쓱하고는... 연구소에서 받았던 명함 꺼내들어 팔랑...) 지금쯤이면 학회도 끝났겠지... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    만날 사람이 있어, 가자.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그 사이에 또 누굴 만나려고 계획까지 짰어요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...당신, 대체 이 쪽으로 와서 뭘 한 거에요? \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (삐죽... 조금 부루퉁하게 표정 짓습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    어차피 말 안 해주겠지. 흥. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    가요! \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    아직 하지 못해서 말 해 줄 수 있는 것도 없는 거야. (이유는 모르겠으나 전부 살려서 보내주고 말았다. 묘한 불쾌함에 표정을 찌푸렸다가...)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...일단, 가자. 너도 아는 얼굴일까 모르겠네. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두 사람이 걸음을 옮기고 얼마 지나지 않은 때입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    바닥에 발이 닿은 순간, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    마치, 당신이 맞지 않은 옷을 입은 것 같다는 생각에 사로잡힙니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    영혼을 구성하는 무엇인가 점차로 더 물들어갑니다. 아니, 물들어가는 것이 아닐지도 모르겠습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신을 구성하는 성분은 여전히 그대로인가요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    침식 발작이 발생합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    두통, 열, 헛구역질, 환각, 환청 등이 동반됩니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    범위에 대하여는 PL이 직접 해당 내용을 결정합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    이 침식을 KPC에게 숨기는지에 대한 여부 또한 자유롭게 정해주세요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (걸음을 옮기던 그 때, 순간적으로 몸에 열이 오르는 것이 느껴졌다. 갑작스레 오른 열기로 머리가 어지럽다. 어쩌면 주춤거리는 것처럼 보였는지도 모르겠다. 팔짱을 끼워 잡고 있었으니 알아챘을까?)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    응? (당신이 주춤거리면 잠시 당신 올려다봅니다. 그러면서 익숙하게 당신 지탱하려는 듯이 상체에 팔 대었겠습니다.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...히익, \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신, 지금 열 나요! \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (이리 좀 숙여 봐요! 하며 당신에게 손짓합니다. 손등을 이마에 대어 보려는 듯.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    응, 열 난다. (이전 같았더라면 착각이라느니, 아무렇지 않다느니... 변명이라도 해보거나 장난을 쳤을 테지만 순순히 인정한다. 허리까지 숙여주며 이마에 손을 짚을 수 있도록 해준다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (이마에 손등 대어 보면, 이내 깜짝 놀라 제 이마에도 손 대 봅니다. 혹 제가 실수했나 싶어 손바닥으로 바꾸어서 대 보기도 하고...) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ...지금은 쉬어야 하는 거 아니에요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그건 안돼, 시간이 얼마 안 남았을 거라. (숙였던 허리를 느릿하게 펴는 것을 따라 이마에 닿아있던 손이 뺨으로 흘러내렸다. 흘긋, 내려다보았다가 그 손을 붙잡아 한 번 꾸욱... 기대고 놓아주었다.)  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    돌아가고 싶다며. \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    당신은 정말이지. 어려운 말을 해요... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (하지만 지금은 당신의 말대로 따라야 하는 거겠죠. 내려간 손은 다시 당신의 팔짱을 낀 채입니다. 잠시 땅 아래로 시선이 내려갔다가, 다시 당신을 바라봤다가.) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    그러면, 얼른 끝내고 당신이 조금 쉬어도 될 여유 시간을 만드는 것을 목표로 해 보죠...! \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다시 발걸음을 옮기면, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    째깍, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    째깍, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    째깍... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    time limit : 05 : 00 \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ㅡ \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그렇게 도착한 곳은 오늘 학회가 열렸다던 장소입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    아직 채 끝나지 않았을 시간인데... 조금 뒤숭숭한 분위기입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    관찰 판정이 가능합니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"<table class=\"ccroll\"><caption>관찰력</caption><tbody><tr><td class=\"sheet-template_label\">기준치:</td><td class=\"sheet-template_value\"><span class=\"inlinerollresult\">70</span>/<span class=\"inlinerollresult\">35</span>/<span class=\"inlinerollresult\">14</span></td></tr><tr><td class=\"sheet-template_label\">굴림:</td><td class=\"sheet-template_value\" style=\"text-align:center\"><span class=\"inlinerollresult\">25</span></td></tr><tr class=\"resrow\"><td class=\"sheet-template_label\">판정결과:</td><td class=\"rr rr-hard\"><b>어려운 성공</b></td></tr></tbody></table>"},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    흩어지는 사람들 틈에서 익숙한 뒷모습을 발견합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    깔끔하게 빼입은 회색 정장, 중절모 아래로 희끗한 흰 머리, \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    살짝 절뚝거리는 다리, 멋스러운 지팡이…. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    분명히 미고입니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...아, 찾았다. (이번에도 어쩌면 저 자에게서 해답을 찾을 수 있을지 모른다. 아직 크리쳐가 만들어지기 전이라면 저지 할 수 있을지도 모른다.) 샬롯, 이런 학회에는 관심이 있어? (곁에 있는 네 손을 잡아 끌었다.)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (그러면 눈이 깜빡이다가 당신 손 잡고는 따라갑니다.) ...만날 사람이 똑똑한 사람인가봐요... (맹.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    oO(바보.) 바보.  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    choice 캬옹캬옹 맹 울먹 (choice 캬옹캬옹 맹 울먹) ＞ 울먹\n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    바, 바보. (웄.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    똑똑한 사람이기는 하지, 적어도 내가 아는 사람 중에서는 제일. (뺨 한 번 손등으로 톡, 건드리고는 샬롯 어깨를 잡는다. 곧바로 미고에게 앞장세워 다가간다.) 교수님, 여기 이 분이 교수님께 질문 드리고 싶은 것이 있다고 하는데... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    다가가면 그는 찬찬히 고개를 돌려 당신들이 있는 방향을 봅니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    안경이 있는 자리를 매만지던 그가 인사합니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    그런가요? 토론이라면 환영합니다만. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    바다 근처에 있는 교수님 연구소에 갔더니, 제자분들께서 흥미로운 것을 보여주시더군요. 교수님께서 연구 중이신... 생명체 말이에요.  \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    흐음. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    (안경을 고쳐 쓰고, 당신을 유심히 들여다보다가...) \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    확실히 제가 요즈음 연구중인 것은 그게 맞습니다만, 애석하게도 오늘 이 자리에서 발표되진 못 했는데... \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...당연히 그것에 대해서 발표 하셨을 거라 생각했는데, 아직 다른 분들은 관심이 없으신가봅니다. (어깨 으쓱인다. 당신의 눈앞에 이렇게 서 있는 존재가 그것들과 같은 것인데, 알아보지는 못하나? 마찬가지로 그의 눈을 바라보다 고개를 돌렸다.)  \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    (그러면, 참 아쉬움이 묻어나오는 말투로) 누군가 제게 발표는 그만두라고 종용하더군요. 인류사에 길이 남을 것인데, 아쉬운 일입니다... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    다만 이것에 흥미를 가져 주시는 분은 참 간만인지라. 시간이 허락한다면 두 분을 초대해 이야기를 나누고 싶은데요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...흐음, 그럴까요. 샬롯, 너도 괜찮지? (물끄럼... 곁의 샬롯 내려다본다. 아마 두 사람의 시선이 꽂혔을 것...)  \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    (쫄아서 세피르 손이나 잡고 있습니다......) \n  "},{"y":"say","sp":"샬롯 바이런","ts":null,"tab":"main","html":"\n    괜, 괜찮아요... (웄.) \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    괜찮다고 하네요, 가시죠. (왜 이렇게 위축 되어있지? 맞잡고 있던 손 꼼지락거리더니 깍지 끼워서 잡아준다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    미고는 여러분들을 자동차에 태운 뒤 자택 겸 연구소까지 운전하며 장황하게 떠듭니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    믿을지 모르겠지만, 저는 인간을 정말 좋아했습니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    선천적으로 다리가 하나 없이, 그리고 비교적 멍청하게 태어난 탓에 동족들에게 비웃음을 샀지만… SF 영화를 보고 변했거든요. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    몇몇 인간은 제가 본 게 고작 클리셰 SF 영화라고 하더군요. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    하지만 말이죠, 그런 작품에도 감화되는 자가 있다는 걸 아십니까? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    어쩐지 익숙한 대사가 이어집니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    감화될 사람은 감화 되겠죠, 클리셰라는 건 그런 거니까요. 뻔하고, 예상되는 흐름이더라도 인기가 있을 수밖에. ... ...음, 그래서 SF 영화에 나온 존재를 현실에 만들어내고 싶기라도 했던 겁니까?  \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    (그러면 핸들을 잡고 있던 손이 잠시 움찔였다가) \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    혹시 싶어 묻습니다만. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    다른 세계선의 저에 대해서 알고 계신 바가 있으십니까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    예, 있습니다. 꽤나... 도움도 많이 받았고요. 그래서 이번에도 도움을 받을 수 있을까 해서 찾아왔는데.  \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...잘못 짚었나? \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    역시나 그렇습니까. (시선이 잠깐 방황했다 다시 도로를 본다.) \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    처음 만나뵈었을 때부터 조금 이상하기는 했습니다만, 여쭈어 보기를 잘 했군요... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    또다른 저에게서 연락이 왔었습니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    저는 그러니까... 속칭 크리쳐라고 불리는 것의 연구를 진행 중이었습니다. 그리고 차원을 넘나들어 연락을 주고받는 것에 대한 연구도 함께요. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    그런데 언젠가, 그 기기를 통해 또다른 제가 연락하기를 크리쳐 연구를 중지하라고 하지 뭡니까. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    공교롭게도 그 후 크리쳐의 정체를 아시는 듯한 말씀을 하시는 분들이 찾아오셨고요... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    상세한 이야기는 들어가서 할까요? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    그러죠, 아직... 그 정도 시간 여유는 있으니까요. (흔쾌히 승낙한다. 아마 여기서 연구를 중지 시켜야 이곳의 상황은 나빠지지 않을 것이고...)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    ...차는 매끄럽게 나아가 미고의 연구소에 도착합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그런 연구를 해낸 성과와는 어울리지 않게, 연구소는 작은 주택입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문을 열고 들어서면 생활 전반을 해결하는 실내가 보입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    과연, 오타쿠답게 SF 영화 DVD로 벽 한쪽이 빼곡합니다. 요즘 DVD를 보는 사람도 희귀한데 말이죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    미고는 지하실로 내려가는 문 앞에서 손짓합니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그 손짓을 따라 아래로 내려갈 수 있습니다. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    (정말 죄다 SF 영화네... 벽면 흘기다가 뒤따라 아래로 내려간다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    내부에는 여러 개의 실험관들, 빼곡한 책장, A4 용지로 지저분한 책상이 눈에 들어옵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그가 가장 먼저 가까이 간 곳은 실험관들이 늘어선 벽입니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    탐사자가 익히 잘 아는 금속형 크리쳐와 유사한 재질의 금속들이 안에서 유기체처럼 움직이고 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그들은 당신의 존재를 기민하게 눈치채고 가까이 모여듭니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    마치 열대어처럼요. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    그 생명체들. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    그러니까... \"크리쳐\" 라고 부르신 것들에 대해 어디까지 알고 계십니까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...이대로 당신의 연구가 성공한다면 악영향을 끼친다는 것은 알죠. 미고, 당신이 사랑한 인간들은 남지 않을 수준으로. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    저는 이것들을 만들며 이런 상상을 했습니다... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    이것으로 의수나 의족을 만들면 어떨까요? 도구를 개발하고, 문명을 발전시키는 데에 사용한다면요? \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    또다른 자신의 경고로 인해 여태껏 발표하지 않았지만, 어지간히 미련이 남은 모양입니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    미래의 인간들은, 이 힘을 그렇게 사용할 거라고 믿고 있었는데... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    아닌 모양이로군요. \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    선한 의도로만 사용할 리가, 인간들의 긍정적인 면만 보고 계시는군요. (고개를 살살 가로젓는다.) 막강한 힘이 주어지면 그것을 이용해서 권력을 잡고 싶어하는 법이죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    문득, 그는 입을 닫고 당신을 물끄러미 바라봅니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    당신은 제게 도움을 구하러 왔다고 하셨지요... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    분명 말씀하시는 것으로 미루어 보건대, 또 다른 제가 빚은 결과가 당신에게 영향을 끼쳤다는 것은 자명해 보입니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    미력하나마 제가 도울 수 있는 일이 있겠습니까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    크리쳐에 대한 연구를 중단하는 것만으로도 도움이 되기는 하겠습니다. (존재하지 않으면 이계의 존재를 끌어들일 일도 없다. 아마도, 저까지 이곳에서 떠난다면...)  \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    크리쳐 연구의 진행이 어떠한 상황을 불러오게 되었습니까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    이계의 존재를 끌어들여서, 멸망에 이르게 만드는 결과를 초래했죠. 크리쳐들이 기적적으로 우호적이게... 그것을 밀어낸다고 할 지언정... 다시 찾아올 수 있는 수단이야 그들에게는 간단하죠. 우리가 이곳으로 온 것처럼. (...) 도움이 되고 싶었던 당신의 선의와는 정반대의 결과네요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    미고와의 이야기는 한참을 이어집니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    당신의 세계에서 무슨 일이 있었는지, 크리쳐는 어떻게 사용됐는지 따위의 이야기가 지나갑니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    종래에 당신이 어떻게 악신이 되었으며, 신들과의 이야기 같은 것들이 지나고 나면... \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    미고는 이야기가 끝나고도 침묵을 지킵니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    항상 미고는 답이 없는 상황에서도 또다른 답을 찾아내 당신들을 다음으로 이끌곤 했죠. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    그러나, 이번에는 다릅니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    말씀하신 대로라면, ... \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    이런 거대한 사건은 세계의 정해진 규칙과도 다름없습니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    일개 개인의 몸으로 뒤엎을 수 있는 것은 어디까지나 개인의 운명이지, 세계의 규칙을 바꿀 수는 없어요. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    어느 세계선이든 크리쳐가 존재한 곳에는 반드시 멸망이 찾아왔다면... 이 일을 막을 수는 없을 겁니다. \n  "},{"y":"say","sp":"미고","ts":null,"tab":"main","html":"\n    (숨을 내쉬고) ...잠깐, 이리로 와주시겠습니까? \n  "},{"y":"say","sp":"세피르 해킷","ts":null,"tab":"main","html":"\n    ...크리쳐가 존재하지 않기만 하면 되는 일 아닙니까? (무엇을 보여주려는 건가, 의아한 얼굴을 하고는 걸음을 떼었다.)  \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    미고는 무언가 내밉니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    스스로를 억제하고 싶을 때 사용하세요, 라는 말과 함께요. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"\n    헝겊으로 둘둘 말려있어, 삐죽 튀어나온 손잡이에는 약간 일그러진 별이 그려져 있습니다. \n  "},{"y":"say","sp":"-","ts":null,"tab":"main","html":"
