리","ts":null,"tab":"main","html":"\n    (...귀엽겠네. 말해줘야지. 그 뒤를 따라갑니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (버퍼링⋯) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이 쪽도 같이 버퍼링...) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “아, ⋯ ㅇ, 아⋯ 그렇군요.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “아, 아닙니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......이렇게 부르지 말까요? (약간 주눅.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 생각을 하며 버퍼링 걸린 린도를 봅니다. 오... 버퍼링이 걸리네?) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (오⋯ 고장난다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고장난 거 첨봐.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “아, 아니, 아닙니다⋯ 자주 들을 일 없는 호칭이라 그랬습니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “편하게 불러주세요.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네... (그렇지만 좀 덜 부를 것이다. 전부 탄 것 보면 제 집의 층수 누릅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    엘리베이터는 멈추지 않고 올라가고,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    곧 층수에 멈춰서서 집 문 앞으로 향합니다. \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아무리 그래도 열쇠는 없으시죠?” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “네, 그건 없습니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (조금 고민하다가) 늘 화분 아래에 스페어 키를 하나 두긴 하는데요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아직 거기 두는지는... \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “에이, 설마 아직도 그러고 살겠⋯⋯⋯” (문 근처의 화분을 봄.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (쭈그려 앉아서 밑을 본다.) “와⋯⋯ 반장님 보안 괜찮은 거 맞나?” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (하지만 바꾸면 기억 잘 안 난단 말이죠.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (그건 맞지.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    열쇠로 문을 열고 안으로 들어갑니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    얼른 조사하고 나가자.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    현관문 앞에 서서, 집을 쭉 둘러본 소감은 간단합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이 집, 누가 먼저 뒤진 적이 있다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    너무나도 깔끔한 상태입니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    청소를 평소에 깔끔히 해놨다고 해도, 비이상적으로 각이 잡힌 듯한 위화감. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “역시⋯ 이미 다녀간 자들이 있군요. 아무리 실종 상태라 하더라도 신고가 안 들어간 이의 집을 확인하는 건 불법. 분명 특이대책과 쪽에서 한 일로 추측됩니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “저는 거실을 조사할 테니, 세 분은 반장님의 방을 확인해주시겠습니까?\" \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마 린도와 같이 거실을 조사할 수도 있습니다만,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    거실과 방. 둘 중 하나만 조사가 가능합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미세하게 인상을 찌푸립니다.) 저는 거실에서 같이 있을게요.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “알겠습니다. 헤비하라 씨, 미첼 씨를 부탁드립니다.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “넵! 가자, 미첼!” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (헛,) 넵! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    【미첼 호프의 방】 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    다양한 종류의 책이 꽂혀 있는 책장이 한쪽 벽면을 가득 채우고 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    책의 분야는 다양하며, 규칙은 따로 느껴지지 않네요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 조사&gt; 판정 \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n     \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    1DM&lt;=4 &lt;✽ 조사&gt; (1DM&lt;=4) ＞ [4] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1DM&lt;=4 &lt;✽ 조사&gt; (1DM&lt;=4) ＞ [2] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “오, 딱봐도 수상해 보이는 두꺼운 책~” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    반장의 눈높이 정도의 높이에 꽂혀 있는 두꺼운 책을 발견합니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이건 예전에 샀던 거, 이건... 하면서 하나씩 제하다가. 딱 그 책에 시선이 함께 모입니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    손을 뻗어 그 책을 뽑아보면, 이상하리만치 가볍습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이런 책은 취향이 아닌데요... \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “그러니까 수상하지!” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (책을 펼쳐본다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    모든 페이지의 중앙이 사각형으로 뚫려 있는, 책의 모습을 한 수납함입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    안에는 작은 수첩이 한 권 들어있습니다. \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “엥, 반장님 사건 수첩이다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    수첩? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈 한 번 깜빡였다가) 사건 수첩이요? \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “어⋯ 그런 거 있잖아, 수사하면서 알게 된 정보나 메모할만한 거 적어두는 수첩.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “매번 이 수첩을 쓰시니까 알거든.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (조금쯤 신기한 기분입니다. 이런 걸 쓸 만큼의 사람이 될 수 있는 걸까, 나도...) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “뭐가 적혀 있는지 볼까!” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (수첩 꺼내들고는 펼쳐봅니다.) 네엡. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[이와테 전 신주 일가 살인 사건 ①]</div><div>20년 9월 29일, 이와테현 니시이와이군에 거주하던 전 신주였던 남성(당시 82세)이 실종되었다. 5일 뒤인 20년 10월 4일, 같은 현에 거주하던 전 신주였던 남성의 아들이자 부동산 경영자인 남성(당시 54세)도 마찬가지로 실종되었다. 그로부터 1년이 지난 21년 3월 7일, 이와테현과 아키타현의 현 경계에 위치한 산중에서 두 사람의 백골 유해가 발견되었다. 본 사건은 타살로 추정되어 수사가 진행 중이지만 범인을 알 수 없다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[이와테 전 신주 일가 살인 사건 ②]</div><div>21년 12월 4일, 본 사건을 일으킨 용의자 그룹이 도쿄도 오타구에 잠복하고 있는 게 밝혀졌다. 21년 12월 13일, 경찰청 경비부의 소환을 받아 본 사건의 수사 협력을 요청 받았다. 경찰청 경비부 측에서는 사건 해결보다 전 신주 남성이 보관하고 있던 검은 나무 상자의 회수를 우선시 하는 듯 하다. 이후 본 사건은 기밀 사항으로 취급되며, 코드명 ‘Death: Incarnation’ 으로 불리게 됐다.</div>"},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “오⋯⋯ 비밀 임무⋯ 간지 나네⋯⋯” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (뭔가 생각해보려다가 뚝.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...간지 나네요... (따라합니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    【거실】 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    부엌과 인접한 거실은 비정상적으로 정돈 되어 있어, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    실내에서 수상한 점은 발견되지 않습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지각&gt; 혹은 &lt;관찰안&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=7 &lt;관찰안&gt; (2DM&lt;=7) ＞ [3, 6] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    거실에 놓인 찬장의 서랍이 이중 바닥으로 되어 있음을 알아차립니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이상하네... 음? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    판자를 떼어내고 내부를 확인하니 몇 장의 사진과 자료가 묶인 파일을 발견합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    린도 씨, 여기 뭔가가 있는데요. (그리고는 사진과 파일을 꺼내들어 살펴봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[신흥 종교 단체]</div><div>이와테 전 신주 일가 살인 사건의 용의자는 신흥 종교 단체의 일원으로, 상층부의 지시에 따라 범행을 저지른 것으로 추정된다. 신흥 종교 단체는 오타구 인근에서 수차례 모격된 바 있어, 오타구 내에 잠복 거점이 있는 건 틀림 없다. 그러나 이 거점의 정확한 위치, 신흥 종교 단체의 명칭이나 규모 등 알 수 없는 점이 너무 많다. 신흥 종교 단체의 일원은 붉은 옷을 입고, 몸에 눈 문신을 새겼다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    사진은 어떤 사람들의 몸 이곳저곳에 새겨진 눈 모양 문신들입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (오타구 내면... 실종된 위치와 동일하네. 신흥 종교를 조사하고 다녔던 걸까.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “신흥 종교⋯⋯ 처음 들어보는 이름이군요. 기밀 사항이라는 걸 보니까 반장님께서 이걸 조사하고 있으셨던게 맞, ⋯⋯ 가스 냄새?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...가스 냄새요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (맡아봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지각&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=5 &lt;✽ 지각&gt; (1DM&lt;=5) ＞ [10] ＞ -1 ＞ 성공 수 -1, 펌블\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    전 안나는데요...? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...(더 맡아봅니다.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ⋯⋯ 잘 모르겠습니다. 살짝 공기가 나쁘긴 한 것 같긴 한데. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    무슨 냄새인데요...? \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “음⋯ 일단 환기 좀 부탁드려도 되겠습니까? 제가 부엌에 가서 확인해보겠습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (개 열심히 맡아보면서 주변 창문을 열고 다닙니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    거실에 있는 창문을 마저 다 여는 순간, 갑자기 요란한 굉음과 함께 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    술냄새 아니에요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    충격으로 인해 당신의 몸이 휘청거립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    집안에 불이 붙기 시작합니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (충격에 가까스로 주변에 있는 것 아무거나 붙잡습니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그것은, 방에서 조사하고 있던 헤비하라와 미첼도 눈치챕니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    순식간에 벌어진 가스 폭발로 인한 화재는 가구와 바닥을 불태우며 연기가 가득 차기 시작합니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ?! (짧게 콜록입니다.) 타츠미 형, 이게 무슨... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    공명 판정 (강도 5 상승 1) / 공명 감정: 파괴(욕망) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    4DM&lt;=5 &lt;공명 판정&gt; (4DM&lt;=5) ＞ [1, 5, 9, 9] ＞ 3 ＞ 성공 수 3, 트리플\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (방쪽에 있던 미첼 생각에 달려가 문을 잡고 엽니다.) \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 4 → 5 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=3 &lt;공명 판정&gt; (1DM&lt;=3) ＞ [10] ＞ -1 ＞ 성공 수 -1, 펌블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼, [1D3] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1D3 (1D3) ＞ 1\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하울링: 공명 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    공포의 감정은 모두에게로 퍼져 나갑니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그 자리에 있는 모든 공명자의 공명 레벨이 1 상승합니다. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] ∞ 공명 : 1 → 2 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 5 → 6 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (콜록, 콜록... 몇 번이고 숨을 다시 몰아쉬지만 호흡이 쉽사리 확보되지 않아서. 어쩌면, 그래서 불안했을지도 모르겠습니다...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    문득 주위를 둘러보니 가장 부엌에 가까이 있던 키리시마가 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    폭발의 영향을 정통으로 맞고 쓰러져 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    화재 탈출 시작. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div><span style=\"color: var(--text);\">방 → 거실 → 현관 → 바깥 순서로 이동합니다.</span><br></div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div style=\"scrollbar-color: color-mix(in srgb, var(--accent) 30%, var(--line)) transparent; color: color(srgb 0.196549 0.163137 0.201098);\">각 순서를 이동할 때마다 [위험 요소]가 존재하며,</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div style=\"scrollbar-color: color-mix(in srgb, var(--accent) 30%, var(--line)) transparent; color: color(srgb 0.196549 0.163137 0.201098);\">2명 이상이 시도해 한 명이 성공하거나 1명이 시도해 ‘더블’ 이상으로 성공해야 합니다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div style=\"scrollbar-color: color-mix(in srgb, var(--accent) 30%, var(--line)) transparent; color: color(srgb 0.196549 0.163137 0.201098);\">시도하지 않은 사람은 구역을 이동할 수 있습니다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div style=\"scrollbar-color: color-mix(in srgb, var(--accent) 30%, var(--line)) transparent; color: color(srgb 0.196549 0.163137 0.201098);\">라운드가 끝날 때까지 공명자와 NPC는 화염 피해를 입습니다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<span style=\"color: color(srgb 0.196549 0.163137 0.201098);\">4라운드까지는 1의 피해를, 이후부터는 1D3의 피해를 입습니다.</span>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    다들 괜찮아? (침착, 침착해야해. 일단 미첼과 헤비하라가 안전한 것을 확인하고 키리시마를 부축합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...헤비하라, 도와줘! \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 모습에 얼굴에 핏기가 새하얗게 가신 채) 린도 형, 형, 왜, 왜 이래요... \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “젠장⋯ 알았어! 일단 그곳으로 갈게!” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    《 방 》 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    방금 전의 충격으로 가구가 쓰러져 나가는 걸 방해합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼과 헤비하라가 시도할 수 있습니다. 각각 시도하나요, 아니면 한명이 시도하나요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (콜록, 콜록, 옷소매로 입 덮고는) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저도, 저도 도울게요! \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n     \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    2DM&lt;=8 &lt;힘&gt; (2DM&lt;=8) ＞ [10, 8] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    1DM&lt;=6 &lt;✽ 운동&gt; (1DM&lt;=6) ＞ [1] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “읏차⋯!! 좋아, 됐다! 미첼! 지나가!” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    시도하지 않았으므로, 미첼은 거실로 이동할 수 있습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 곧장 그 틈새로 빠져나갑니다.) 타츠미 형! 형도...! \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “금방 갈게!” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 미리 위험요소를 없앨 수 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    단, 혼자 시도하므로 더블 이상으로 띄워야 합니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    불타는 잔해들이 당신의 앞길을 막고 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    현관까지 가는 안정한 경로를 찾아내야 합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n     \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지각&gt; 혹은 &lt;관찰안&gt; 판정  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=7 &lt;관찰안&gt; (2DM&lt;=7) ＞ [3, 5] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    안전한 경로를 찾아내는데 성공합니다! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    2라운드 \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (거실로 넘어와서 키리시마를 들쳐맨다.) \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] HP : 14 → 13 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] HP : 14 → 13 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 헤비하라 타츠미 ] HP : 16 → 15 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 키리시마 린도 ] HP : 11 → 10 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼, 현관으로 이동할 수 있습니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 현관으로 이동할 수 있습니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (키리, 시마... 왜이렇게 무겁냐. 진짜... 운동 좀 적당히... 하라니까. 키리시마가 흘러내리지 않게 타츠미를 거든 다음, 팔로 미첼 머리를 막으며 현관으로 갑니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 함께 이동하겠습니다. 시선이 자꾸 뒤를 힐끔거리며 바라보긴 합니다만...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    3라운드 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] HP : 13 → 12 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] HP : 13 → 12 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 헤비하라 타츠미 ] HP : 15 → 14 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 키리시마 린도 ] HP : 10 → 9 \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (키리시마와 함께 현관으로 이동한다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    화재의 영향으로 잠금장치 내부가 뒤틀려 문이 잠긴 듯합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    튼튼하게 만들어진 문은 힘으로 열기 어려워 보이는데⋯⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 세공&gt; 판정 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1DM&lt;=4 &lt;✽ 세공&gt; (1DM&lt;=4) ＞ [3] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (문고리를 이리저리 돌려댑니다. 좀, 열리라고...!) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=2 &lt;✽ 세공&gt; (1DM&lt;=2) ＞ [1] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠이 더블을 띄웠으므로, 미첼은 바깥으로 이동 가능합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이동 하시겠습니까? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 얼른 빠져나가! \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    금방 따라갈테니까.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼의 등을 떠밉니다.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (등이 떠밀리면 그대로 몸이 앞으로 기웁니다. 열린 틈 사이로 딱 한 발 빠르게 나가게 되는 것이겠습니다...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 문 밖에서는 현관문 활짝 열어젖히며 당신들이 나오기를 기다리는 것입니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    4라운드 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] HP : 12 → 11 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 헤비하라 타츠미 ] HP : 14 → 13 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 키리시마 린도 ] HP : 9 → 8 \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (키리시마와 함께 현관으로 이동.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 바깥으로 이동 가능합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, &lt;직감&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=6 &lt;직감&gt; (1DM&lt;=6) ＞ [5] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠이 잔해가 적은 곳으로 둘을 안내해 다같이 바깥으로 나오는데 성공합니다! \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “이야, 역시 유능하네!”  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “계단으로 빨리 내려가자!” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    탈출 종료. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼을 챙겨서 계단으로 갑니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    무사히 빠져나와서 다행이지.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “그러니까! 왜 갑자기 가스폭발이야?” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    몸에 달라붙은 불길을 떨쳐내고 기적적으로 탈출에 성공해 1층으로 내려옵니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...여기 들어오는 걸 알아챈게 분명해.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    맑은 공기를 들이마시자 겨우 긴장과 근육이 풀리는 느낌이 듭니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 역시 여러분들이 전부 현관 밖으로 나올 때까지 버티고 서 있다가 그제야 따라 탈출하는 중입니다.) 린도 형은 어떡해요... \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아무리 그래도 가스 폭발이라니, 미친놈들⋯” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (1층에 도착하면 그제서야 콜록거리면서 일어난다.) “⋯여, 긴⋯⋯ 바깥⋯입니까?”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (크게 숨을 들이마십니다. 그리고는 린도의 의식을 확인해요.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    괜찮으세요?  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “선배님! 괜찮으십니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (다친데는 없나 살피고요...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...형! (그제야 크게 숨 내쉽니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “네, 네⋯⋯ 가스 냄새가 나서 부엌에 다가가는 순간⋯” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “갑자기 가스레인지에 불이 붙는 걸 확인했습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    갑자기 가스레인지에요...? \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “손도 대지 않은 가스레인지에 불이, 붙는 게⋯⋯ 그건 대체 무슨⋯⋯” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....정말 괴이한 일이네요.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    구급차가 몰려오는 소리가 들립니다. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “반장님께는 죄송스럽지만, 일단 자리를 피하도록 하죠. 저희가 여기 있는 게 들키면 꽤 상황이 불리해질 것 같습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕입니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    린도 씨, 움직이실 수 있겠어요?  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “네, 괜찮습니다⋯ 걱정 끼쳐 드려서 죄송합니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    하지만, 역시 병원으로 가셔서 치료는 받으셔야...! \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “일단 이곳을 벗어난 뒤, 병원으로 이동하겠습니다. 그러니⋯⋯” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마를 부축해 바깥으로 나서 차로 향하는 길. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    겨우 매캐한 화재 연기에서 벗어났더니,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    담배 연기가 다시 당신들의 폐를 채웁니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    검은 재킷을 입은 남성 3명.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그리고 맨 앞에 선 덩치 큰 남자⋯ \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (본능적으로 알아차립니다. 멈춰 서서는,) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “아이고야⋯⋯ 전부 태우셨구만⋯⋯” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “너희, 수사 1과의 형사들이지? 미안하지만, 방해 작작 하고 꺼져줄 생각 없냐?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (사진으로 보았던, 그 남자.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (뒷걸음질 쳐 누구든 등 뒤로 숨어듭니다...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (...자연스럽게 미첼을 자신의 등 뒤로 숨깁니다.) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “너희도 알잖아, 사정도 모르는 외부인이 뻔뻔하게 끼어들어서 사건 망치는 거.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “얼마나 재수 없는 일인지.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “수사를 방해해서 죄송합니다. 하지만, 어째서 어린아이, ‘미첼 호프’를 노리시는지에 대한 이유를 들어야겠습니다. 오오가미 아야토 씨.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “그래! 말로 하면 될 것이니 총부터 냅다 쏘는 녀석들한테 넘길까보냐!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    저희야말로 묻고 싶군요. 저희 반장님의 실종과 관계되신 것 같은데.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그 일로 저희도 굉장히 곤란한 입장인데요.  \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “허참⋯ 그새 내 이름을 알아내셨어?” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “그게 *어린아이*로 보이다니, 그러니까 너희가 외부인이라는 거다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... (입 꾹 다물고서, 손으로는 스탠의 옷만 몇 번이고 힘 주어 잡았습니다.) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “우리는 너희가 감당하지 못하는 특수 사건을 다루고, 저건 우리의 관할이야.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “그런데도 저걸 아직도 인간이라 받아들이겠다고?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    저것이라뇨. 엄연한 사람인데.  \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “하⋯⋯⋯” (허공으로 담배 연기를 한번 내뱉고서는 손짓한다.) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “형사라면 알고 있겠지. 우리, 특히 경찰청 소속은 국가 명령에 의해 움직이고 있다.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “이 일에 대한 발포 허가는 진작에 내려졌지.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “수사 1과 반장, 미첼 호프는 우리가 찾아내어 돌려줄테니 그걸 내놔. 아니면 여기에 묻어버릴 테니까.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .... 사정을 모르고서는 절대 내어드릴 순 없습니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    남성들은 총을 꺼내 당신들을 향해 겨눕니다. \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “하, 참나⋯ 꼭 폭력으로 해야 말을 듣는 녀석들이 있다니까.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    쏘실테면 쏘시죠. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (조용히 다가와 스탠의 손에 차키를 넘긴다.) “신호하면, 뛰십시오.”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (차키를 받아듭니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이따 뵙죠. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (고개를 도리질칩니다. 새파랗게 질린 얼굴을 하고) 쏜, 쏜다고 하잖아요, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    장전 소리, 그리고 총이 발포될 즘에 헤비히라와 키리시마가 동시에 남성들에게 달려듭니다.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “스탠! 미첼을 부탁한다!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그와 함께, 미첼의 손을 붙잡고 자신의 앞으로 세워 차를 향해 뜁니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “미첼 씨, 스탠 씨와 함께 살아남으세요⋯!! 누가 뭐라고 해도, 당신이 죽을 이유는, ⋯ 큭.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    차에 올라타 빠르게 시동을 걸고 출발합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    사이드미러로 보인 것은, 제압 당해 걷어차이는 두 사람⋯  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신들은 이곳을 벗어나 오타구로 향합니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    반장이 사라진 이유가 있는 곳이자, 이 사건의 시작인 오타구로.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    차가 시야에서 사라지는 그 순간까지 오오가미는 담배를 입에 문채 그저 조용히 노려봅니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    형, 형들, 형들은 어떡해요, (잔뜩 불안에 젖은 채로 몇 번이고 뒤를 바라봐 댑니다. 이러고 있으면 안 되는데,) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    21년 12월 28일, 창문 틈으로 스며든 차가운 공기가 뺨을 스칩니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 진정해. 괜찮을거야.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    시야 끝에는 두꺼운 구름에 뒤덮인 회색 하늘이 끝없이⋯⋯ 펼쳐집니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    왜... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    왜 구하신 거에요...  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...그야. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (구하려는데에는 많은 이유가 있었으나, 어린 미첼에게는 할 수 있는 말이 적었다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    형사가 피해자를 돕는 건 당연한 거잖아.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    어린아이가 건장한 성인 남성에게 정당한 사유 없이 살해당할 위기에 처했는데 당연히 구해야지.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그건 어른의 당연한 의무야.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (저 말고, 반장을 돌려 준다잖아요... 그러면 그만이잖아요. 같은 말이 뭉그러진 발음으로 샙니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이 아이, 미첼 호프는 반장을 돌려준다는 말을 걷어차고도 구할 가치가 있었나요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    여전히 당신은 이 아이를 반장과 다른 사람으로 보고 있나요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    무엇이든, 기회를 걷어찼으니 스스로 반장을 찾아야 합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    자, 가장 먼저 어디로 향하나요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[수사 규칙]</div><div>12월 28일 ~ 12월 31일의 4일간, 공명자는 오타구 내 지역을 돌아다니며 수사를 진행합니다.</div><div>하루에 진행할 수 있는 지역은 3곳까지이며, 하루 수사를 마칠 때마다 공명 레벨이 1 상승합니다.</div><div>지역 중에서는 【단서】가 없으면 조사하지 못하는 지역이 존재합니다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[현재 단서]</div><div>오타구 이케가미의 뒷골목으로 반장과 닮은 인물이 들어가는 게 목격 되었다.</div><div>오타구 하기나카의 주차장에서 남성 3명이 등유를 뒤집어 쓰고 분신 자살했다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (수사 1과가 된데에는 각고의 노력이 들었고, 자신의 실력에는 자신있었습니다. ...솔직히 말해 냅다 지르기는 했으나, 뭐, 해내면 그만이죠.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이케가미로 향합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 이케가미 주소 좀 찍어줘. (일부러 딴생각 못하게 시킵니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (뭐, 이때 아님 또 언제 부려먹어 보겠어요.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (불러주는 대로 주소를 입력해 보긴 합니다만, 그 뿐입니다. 입을 꾹 다물곤...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n     오타구 이케가미로 향합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    12월 27일 밤, 이곳에서 두 사람이 만나면서 이야기는 시작 됐습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    저번에는 급해서 제대로 살펴보지 못했죠.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    꽤 넓은 골목길이었으니까, 다시 한번 샅샅이 찾아보는 게 좋겠습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    조사 가능: 골목길 / 탐문 가능한 사람 찾기 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (일부러 가는 길에 별 시답잖은 말을 많이 걸었을지도 모릅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 의미로...) 미첼, 형사에 관심 있어?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (양 손가락만 간간이 움직이거나 했을 뿐입니다. 으레 하는 정도의 예의 갖춘 대답도 두어 번 쯤 나오긴 했습니다만...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...형사가 되는 거, 제 꿈이에요... (어쩐지 기가 죽은 목소리입니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... (기가 많이 죽었는데? 꿈 맞아?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (여분 장갑 꺼내들어서 미첼에게 건네주고 골목길로 갑니다.) 그래? 그러면 이참에 체험해본다고 생각해.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    학교에 그런거 있잖아. 직업체험 뭐, 그런거.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (장갑을 쥐고도 어쩐지 가만 들여다보기만-자주 이러는 것 같은데. 마치 이 곳에 처음 떨어졌을 때 발걸음 떼기를 고민했던 것처럼-하다가 느리게 손에 끼워봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......그게 뭐에요... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    골목 안은 낮이라고는 해도 여전히 어둡고 발밑에는 쓰레기와 폐자재가 가득합니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (맺혀버린 식은땀 눌러 닦아냅니다. 무서운 일 투성이인 것에 기가 죽기는 했어도... 그래요. 같이 가야죠. 따라갑니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    일반 시민이 길목으로 다니는 곳은 절대 아닙니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지각&gt; 혹은 &lt;관찰안&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (자신도 장갑을 끼고는 미첼이 따라오면  어깨를 감싸고 같이 살펴봅니다.) 자, 잘 봐봐.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    뭔가 이상한 거 있으면 알려줘.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=7 &lt;관찰안&gt; (2DM&lt;=7) ＞ [5, 3] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    3DM&lt;=6 &lt;관찰안&gt; (3DM&lt;=6) ＞ [6, 4, 8] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    단서를 찾기 위해 발밑에 흩어져 있는 잔해를 살펴보는데,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    떨어져 있던 신문지의 헤드라인에 시선이 멈춥니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미나미마고메 향토박물관에서 일어난 강도 사건」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    신문지 바로 옆에, 눈 속에 희미하게 파묻힌 검은 수첩을 발견합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[신문 기사]</div><div>21년 12월 16일 0시 40분 경, 도쿄도 오타구 미나미마고메에 위치한 향토박물관에 남성 3명이 침입해 관내에 있던 관장 히다 준야(남성/57세)를 흉기로 위협한 듯 하다. 사건의 상세 내용을 확인하고 싶지만 눈 때문에 젖어 있던 탓에 더러워져 읽을 수 없다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (남성 세명... 그 사람들인가보군.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (손을 뻗어서 수첩 주워듭니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    경찰 수첩입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    펼쳐보면, 미첼 호프라는 이름과 증명 사진이 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마의 정보가 사실이었던 모양이네요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    앗, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    골목길 조사 완료. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (경찰 수첩 펼치고는 우뚝 굳습니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (증명사진을 집어들어 주머니 속에 집어넣습니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (여기가 마지막이었나보군.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (자리에서 일어납니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이 골목길에서 탐문 할 수 있는 사람이 있긴 하려나요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 혹시 수첩도 줄래? (손을 내밀며 주변을 둘러봅니다.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아, 여기요. (순순히 경찰 수첩 내밉니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그런 생각을 하고 있을 때, 낄낄거리는 웃음소리가 들려옵니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    고마워.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그나저나, 크고 나면 그런 인상이 되는...) \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “너어⋯ 형사 맞지?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (받아들고 제 품 안에 잘 집어넣습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (음, 살짝 물러섭니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    40대 후반으로 보이는⋯ 노숙자입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...그렇습니다만. (자연스럽게 미첼을 제 뒤로 살짝 숨기고.) \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “어제도 하루~ 종일 시끄럽더니만⋯” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “뭘, 알고 싶어서 왔어? 응? 내가 도움이 된다면 협력해줄 수 있는데 말이야.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혹시 주변에서 뭔가 목격하신 거 없으십니까?  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “주변, 주변⋯ 이라~ 아하, 있기야 하지.” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “⋯⋯감이 떨어지네에~?”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...감이요? \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    (손을 뻗더니 검지와 엄지를 맞대어 동그라미를 만든다.) “정보를 얻고 싶으면! 성의를 보여야 할 거 아니야, 성의를! 어디보자아⋯⋯ 처음 받는 손님이니까 십만엔부터 시작해볼까~?” (히죽 웃는다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...(십만엔 같은 소리하네.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈썹 한 쪽 씰룩.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ......으음. 제가 좀 가난해서요.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    경찰을 상대로도 뻔뻔하게 구는 걸 보면 한 두번 굴려먹은 솜씨가 아닙니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 교섭&gt; 혹은 &lt;적절한 판정&gt; 혹은 RP \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    한 만엔은 어떠십니까? (지갑에서 남은 현금을 꺼내들어 달랑거립니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    제가 가진게 이게 전부네요.  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “쓰으으읍⋯⋯⋯” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “그래!” (방긋) \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    (다가와서 만엔을 쇽 가져간다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    가져가시기 전에. (손에 힘줍니다.) 정보 먼저.  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “아~ 치사하게 진짜.” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “언제부터 였을까, 이 골목길에 붉은 옷을 입은 놈들이 어슬렁~ 거리더라고?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    붉은 옷이요? \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “거래 장소로 이용하기 시작한 거 같아. 좀⋯ 사이비 같은 놈들 있잖아?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕입니다.) 있죠. 그런 사람들.  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “그걸 알고 있었는지~ 몰랐는지~ 너희 같은 형사가 한 명 왔었지.” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “그리고 왔다가 퍽! 퍽! 퍽! 쳐맞고!” (낄낄 웃는다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (앗, 뭔가 들을 만한 이야기... 어라.) \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “흰색 왜건차에 탄 놈들한테 그대로 납치당했어.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 혹시 그 차가 어느 방면으로 갔는지는 기억하시나요? \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “몰라!” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “하여튼 형사님, 사이비 놈들이랑 엮이면 인생이 고달프거든? 괜히 이상한 거 쫓지말고 포기해~” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (하고, 괜히 스탠의 옷 잡아당기면서 눈치 봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼을 봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (좀 치는데? 하는 눈치.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    왜? \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    (만엔 줘. 내놔. 손 내민다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    에이, 만엔으론 아직 부족하지. (그러면서도 덧붙입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (휴우. 별 문제 없네. 그런 반응 보고 나면 손에서 힘 풀고 짧게 한숨 쉽니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혹시.. (증명사진을 꺼내보입니다. 남은 한손으로.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그 사람 이렇게 생겼어요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    차 번호는 기억해요? \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “어엉⋯⋯ 아니?” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “그래! 이 남자가 맞아.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그제서야 만엔을 순순히 건네줍니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    협조 감사합니다.  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “흐하하⋯! 돈이다, 돈⋯!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    도박하는데 쓰지 마시고요.  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “아이~ 난 도박 안해~” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    나가서 번듯하게 좀 사세요.  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “술 마실 거야~~” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (저기, 스탠 형... 너무 많이 쓰는 거 아니에요? 하고 소근소근) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    술 마시지 마시고요.  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “네이, 네이⋯⋯ 흠?” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    (미첼 앞에서 멈춰서더니 빠아안.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (움찔.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (아? 괜찮아. ...하면서 그 반응에 미첼을 뒤로 숨깁니다.) \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “너, 꼬마. 너는 왜 여기 다시 기어들어 왔냐?” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “완전 공포에 질린 채로 여기 들어와서 다시는 안 들어올 줄 알았는데?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 이 친구도 보셨습니까? \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “그래, 만엔이나 줬으니 말해주는 거다만⋯” \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “6시 좀 넘었을 때, 이녀석이 잔뜩 공포에 질린 채로 이곳에 뛰어 들어오더니만 갑자기 쓰러졌단 말이지.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    제가요... (전혀 영문을 모르는 듯한 표정입니다.) 저는, 제 발로 들어온 기억은 없는, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미첼」<br>당신은 갑자기 과거에서 골목길로 순간이동⋯ 된 게 아니었던가요?<br>정말로 스스로 당신이 이곳에 달려왔단 말입니까? 대체 어디서? \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “음음음~ 아니야, 확실히 내가 봤어.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    누구에게 쫒기는지도 보셨습니까?  \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “이자식만 공포에 질린 채로 들어와서 못 봤지.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(진술이 달라.) 총성은 못들으셨습니까? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아닌데, 분명히 들어온 기억은 없는데... (영 혼란스럽습니다. 분명, 하굣길에서... 갑자기 쓰러진 게 다인데.) \n  "},{"y":"say","sp":"나나네 후쿠아키","ts":null,"tab":"main","html":"\n    “총성? 아아, 들었지~ 하지만 난 그런 일이 있으면 잽싸게 도망친단 말이지.” \n  "},{"y":"s   order.forEach(function (k) { if (!meta[k].color) meta[k].color = PALETTE[pi++ % PALETTE.length]; });
  window.CRIT_CHARMETA = meta;
  /* info 탭에서만 등장한 이름은 핸드아웃 명의일 뿐 캐릭터가 아님 → 리스트/선택 목록에서 제외 */
  var nonInfo = {};
  data.blocks.forEach(function (b) { if (b.sp && (b.tab || 'main') !== 'info') nonInfo[b.sp] = 1; });
  var infoOnly = {};
  order.forEach(function (k) { if (!nonInfo[k]) infoOnly[k] = 1; });
  window.CRIT_INFO_ONLY = infoOnly;

  /* 세션 히어로 - 게시본은 window.CRIT_LOG_SESS로 구워져 들어온다(publisher.html이 게시
     시점에 crit-log-sess:<id>를 읽어서 넣어줌). 방문자 브라우저는 앱의 localStorage에
     접근할 수 없어서(다른 오리진) 그 값이 없으면 세션 정보가 영원히 빈 채로 보였다
     (실제로 겪은 버그) - 있으면 그걸 쓰고, 없으면(앱 안에서 직접 보는 경우) 기존대로
     localStorage에서 읽는다 */
  var sess = {};
  if (window.CRIT_LOG_SESS) sess = window.CRIT_LOG_SESS;
  else { try { sess = JSON.parse(localStorage.getItem('crit-log-sess:' + (qid || 'tpl'))) || {}; } catch (e) {} }
  var sTitle = sess.title || data.title || '로그';
  var sPlayers = sess.players || data.players || [];
  document.body.dataset.session = JSON.stringify({
    title: sTitle, writer: sess.writer || '', gm: sess.gm || '', players: sPlayers,
    party: sess.party || data.party || '', overview: sess.overview || ''
  });
  var tEl = document.getElementById('s-title');
  if (tEl && tEl.childNodes.length) tEl.childNodes[0].textContent = sTitle + ' ';
  var wEl = document.getElementById('s-writer');
  if (wEl) wEl.textContent = sess.writer || '';
  var plEl = document.getElementById('s-players');
  if (plEl) plEl.innerHTML = sPlayers.map(function (p) { return '<span class="pbadge">' + esc(p) + '</span>'; }).join('');
  var ovEl = document.getElementById('s-overview');
  if (ovEl) ovEl.textContent = sess.overview || '';
  document.title = 'Crit — ' + sTitle;

  /* 캐시된(하드코딩) 페이지면 DOM 재조립 생략 */
  var BAKED = !!(window.CRIT_BAKED && document.querySelector('#log .msg'));
  /* 로그 DOM: 프로토타입 마크업 (info 탭 → 핸드아웃 카드, 같은 화자 연속 → cont, main 외 탭 → subtab) */
  var htmlOut = [];
  var prevKey = null;
  var tabCnt = {}, charCnt = {};
  data.blocks.forEach(function (b, i) {
    var tab = b.tab || 'main';
    tabCnt[tab] = (tabCnt[tab] || 0) + 1;
    if (b.sp) charCnt[b.sp] = (charCnt[b.sp] || 0) + 1;
    if (tab === 'info') {
      prevKey = null;
      var hn = b.sp || '✦ 정보';
      var hc = (meta[b.sp] && meta[b.sp].color) || '#03a9f4';
      if(!BAKED)htmlOut.push('<div class="msg handout" data-tab="info" data-type="handout" data-char="' + esc(b.sp || '') + '" id="imp-' + i + '">' +
        '<div class="hcard"><div class="hname" style="color:' + esc(hc) + '">' + esc(hn) + '</div>' +
        '<div class="mcontent">' + (b.html || '') + '</div></div></div>');
      return;
    }
    if (b.y === 'desc' || !b.sp) {
      prevKey = null;
      if(!BAKED)htmlOut.push('<div class="msg desc" data-tab="' + esc(tab) + '" data-type="desc" data-char="" id="imp-' + i + '">' +
        '<div class="mbody"><div class="mcontent">' + (b.html || '') + '</div></div></div>');
      return;
    }
    var m = meta[b.sp] || { color: '#9a95a0', avatar: null };
    /* 연속 발언 판정은 화자만 비교한다 - 탭까지 같이 비교하면(예전 방식) 탭 라벨 표기가
       메시지마다 미묘하게 달라지는 코코포리아 로그에서 같은 화자인데도 안 이어지는 경우가 많았다.
       다른 뷰어(viewer.html/log_viewer.html/freelog.html)도 전부 화자만으로 판정한다 */
    var cont = b.sp === prevKey;
    prevKey = b.sp;
    /* 지문출력 선택은 빌드 시점에 바로 반영 - 나중에 바뀌며 깜빡이지 않게 */
    var asDesc = Array.isArray(data.descChars) && data.descChars.indexOf(b.sp) !== -1;
    var cls = 'msg general' + (cont ? ' cont' : '') + (tab !== 'main' ? ' subtab' : '') + (asDesc ? ' as-desc' : '');
    /* "이 블록만" 아바타 수정은 예전엔 화면(DOM)에만 반영되고 serialize()가 저장을
       안 해서, 새로고침하면 조용히 사라졌다(실제로 겪은 버그) - b.avOv로 블록별로
       저장한다: 문자열이면 그 이미지로 덮어쓰고, 프로퍼티는 있는데 값이 없으면(null)
       "이 블록만 없애기"로 색 원만 강제, 프로퍼티 자체가 없으면 평소처럼 캐릭터 기본값 */
    var hasOv = Object.prototype.hasOwnProperty.call(b, 'avOv');
    var av = hasOv
      ? (b.avOv
          ? '<img src="' + esc(b.avOv) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
          : '<b style="background:' + esc(m.color) + '"></b>')
      : (m.hideAvatar ? '' : (m.avatar
          ? '<img src="' + esc(m.avatar) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
          : '<b style="background:' + esc(m.color) + '"></b>'));
    /* avOv가 있는 블록은 렌더 시점엔 이미지를 맞게 보여주면서도 data-avatar-override를
       안 붙여서, 새로고침 직후 아무 DOM 변화(MutationObserver)에도 serialize()가 이
       블록을 "오버라이드 없음"으로 다시 저장해버려 조용히 유실됐다(실제 겪은 버그:
       "저장은 됐는데 다시 들어가면 리스트 자체가 초기화된다") */
    var ovAttr = hasOv ? ' data-avatar-override="1"' : '';
    if(!BAKED)htmlOut.push('<div class="' + cls + '" data-tab="' + esc(tab) + '" data-type="general" data-char="' + esc(b.sp) + '"' + ovAttr + ' id="imp-' + i + '">' +
      '<div class="avatar">' + av + '</div>' +
      '<div class="mbody"><div class="mhead"><span class="by" style="color:' + esc(m.color) + '">' + esc(b.sp) + '</span>' +
      (tab !== 'main' ? '<span class="ctab">' + esc(tab) + '</span>' : '') +
      (b.ts ? '<span class="tstamp">' + esc(b.ts) + '</span>' : '') + '</div>' +
      '<div class="mcontent">' + (b.html || '') + '</div></div></div>');
  });
  /* 블록 단위 점진 렌더링: 첫 400블록만 즉시 그려 바로 조작 가능, 나머지는 비동기로 이어붙임 */
  (function () {
    var lgEl = document.getElementById('log');
    var CHUNK = 400;
    if (htmlOut.length <= CHUNK) { lgEl.innerHTML = htmlOut.join('\n'); return; }
    window.CRIT_BUILDING = true;
    lgEl.innerHTML = htmlOut.slice(0, CHUNK).join('\n');
    var __pos = CHUNK;
    (function step() {
      if (__pos >= htmlOut.length) {
        window.CRIT_BUILDING = false;
        document.dispatchEvent(new Event('crit-log-built'));
        return;
      }
      var tp = document.createElement('template');
      tp.innerHTML = htmlOut.slice(__pos, __pos + CHUNK).join('\n');
      lgEl.appendChild(tp.content);
      __pos += CHUNK;
      setTimeout(step, 0);
    })();
  })();

  /* 통계 */
  var st = document.querySelector('.stats');
  var tabs = Object.keys(tabCnt);
  /* 지문출력/사담으로 지정된 캐릭터는 개별 칩 대신 "지문"/"사담" 통합 칩 하나로 합쳐서 보여준다 -
     체크박스가 항상 살아있는 통합 칩 하나로만 존재해야 다른 캐릭터를 솔로/토글할 때 이 캐릭터
     로그가 전체에서 같이 사라지는 버그(개별 칩이 아예 안 보이던 예전 방식의 잔재)가 안 생긴다 */
  var descSet = {}, chatSet = {};
  (Array.isArray(data.descChars) ? data.descChars : []).forEach(function (k) { descSet[k] = 1; });
  (Array.isArray(data.chatChars) ? data.chatChars : []).forEach(function (k) { if (!descSet[k]) chatSet[k] = 1; });
  var listOrder = order.filter(function (k) { return !infoOnly[k] && !descSet[k] && !chatSet[k]; });
  window.__critOrder = order;
  window.__critCharCnt = charCnt;
  if (st) st.innerHTML = '<span>전체 <b>' + data.blocks.length + '</b>블록</span>' +
    '<span>탭 <b>' + tabs.length + '</b>개</span><span>캐릭터 <b>' + listOrder.length + '</b>명</span>';

  /* 저장된 탭/캐릭터 꺼짐 상태를 렌더 시점부터 반영 - 체크박스가 항상 켜진 채로 그려졌다가
     나중에 복원 스크립트가 꺼주는 방식이면 그 사이 깜빡임이 생긴다 */
  var savedTabOff = [], savedCharOff = [];
  try { var _tso = JSON.parse(localStorage.getItem('crit-tab-state:' + qid)); if (_tso && Array.isArray(_tso.off)) savedTabOff = _tso.off; } catch (eTso) {}
  try { var _cso = JSON.parse(localStorage.getItem('crit-char-state:' + qid)); if (_cso && Array.isArray(_cso.off)) savedCharOff = _cso.off; } catch (eCso) {}

  /* 탭바 (other/사담/잡담 계열은 기본 해제 - 기획서 5.5, 저장된 값이 있으면 그걸 우선) */
  var tb = document.querySelector('.tabbar');
  if (tb) {
    tb.innerHTML = tabs.map(function (t) {
      var on = savedTabOff.length ? savedTabOff.indexOf(t) === -1 : !/^(other|사담|잡담)$/i.test(t);
      return '<label class="tab-chip"><input type="checkbox"' + (on ? ' checked' : '') + ' data-tab="' + esc(t) + '">' +
        '<span class="tab-name">' + esc(t) + '</span><span class="chip-count">' + tabCnt[t] + '</span>' +
        '<span class="tab-x" title="이 탭 데이터 완전 삭제">×</span></label>';
    }).join('\n');
  }

  /* 캐릭터바 */
  var PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  function mergedChip(dc, label, keys) {
    if (!keys.length) return '';
    var cnt = keys.reduce(function (s, k) { return s + (charCnt[k] || 0); }, 0);
    var on = savedCharOff.indexOf(dc) === -1;
    return '<label class="char-chip merged" data-chip="' + dc + '">' +
      '<input type="checkbox"' + (on ? ' checked' : '') + ' data-char="' + dc + '">' +
      '<span class="chip-name">' + label + '</span>' +
      '<span class="chip-count">' + cnt + '</span></label>';
  }
  var cb = document.getElementById('charbar');
  if (cb) {
    cb.innerHTML = mergedChip('__desc__', '지문', Object.keys(descSet)) + mergedChip('__chat__', '사담', Object.keys(chatSet)) +
      listOrder.map(function (k) {
      var m2 = meta[k];
      var avh = m2.avatar
        ? '<img src="' + esc(m2.avatar) + '" onerror="this.replaceWith(avFallback(&quot;' + esc(m2.color) + '&quot;))">'
        : '<b style="background:' + esc(m2.color) + '"></b>';
      var charOn = savedCharOff.indexOf(k) === -1;
      return '<label class="char-chip" data-chip="' + esc(k) + '" style="--cc:' + esc(m2.color) + '">' +
        '<input type="checkbox"' + (charOn ? ' checked' : '') + ' data-char="' + esc(k) + '">' +
        '<span class="chip-avatar">' + avh + '</span>' +
        '<span class="chip-name" style="color:' + esc(m2.color) + '">' + esc(m2.display || k) + '</span>' +
        '<span class="chip-count">' + (charCnt[k] || 0) + '</span>' +
        '<span class="chip-edit" title="캐릭터 편집" data-edit="' + esc(k) + '">' + PEN + '</span></label>';
    }).join('\n');
  }
})();
</script>

<input type="file" id="filepick" accept="image/*" style="display:none">
<script>
const charMeta = window.CRIT_CHARMETA || {};
const READER = false;

/* ── 세션 정보 ── */
let sessionInfo = JSON.parse(document.body.dataset.session || '{}');
function renderSession() {
  const t = document.getElementById('s-title');
  if (t) t.childNodes[0].textContent = (sessionInfo.title || '세션 로그') + ' ';
  const w = document.getElementById('s-writer');
  if (w) w.textContent = sessionInfo.writer ? ('w. ' + sessionInfo.writer) : '';
  const pl = document.getElementById('s-players');
  if (pl) {
    const badges = [];
    if (sessionInfo.gm) {
      const g = document.createElement('span'); g.className = 'pbadge pbadge-gm'; g.textContent = 'GM ' + sessionInfo.gm;
      badges.push(g.outerHTML);
    }
    if ((sessionInfo.players || []).length) {
      const s = document.createElement('span'); s.className = 'pbadge'; s.textContent = 'PL ' + sessionInfo.players.join(',');
      badges.push(s.outerHTML);
    }
    pl.innerHTML = badges.join('');
  }
  const ovv = document.getElementById('s-overview');
  if (ovv) ovv.textContent = sessionInfo.overview || '';
  document.title = (sessionInfo.title || '세션 로그');
}
const sessbtn = document.getElementById('sessbtn');
if (sessbtn) sessbtn.addEventListener('click', () => {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal wide"><h3>세션 정보</h3>
    <div class="mrow"><span style="flex:none;width:88px">제목 <b style="color:var(--accent)">*</b></span><input type="text" id="si-title" value="${(sessionInfo.title||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">시나리오 라이터</span><input type="text" id="si-writer" value="${(sessionInfo.writer||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">GM</span><input type="text" id="si-gm" placeholder="진행자 이름" value="${(sessionInfo.gm||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">PL</span><input type="text" id="si-players" placeholder="쉼표로 구분" value="${((sessionInfo.players||[]).join(', ')).replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">파티명</span><input type="text" id="si-party" placeholder="여럿일 때 표기 (선택)" value="${(sessionInfo.party||'').replace(/"/g,'&quot;')}"></div>
    <div style="font-size:13px;margin:2px 0 6px">시나리오 개요</div>
    <textarea id="si-overview" style="min-height:110px" spellcheck="false">${sessionInfo.overview||''}</textarea>
    <div class="hint">입력한 정보는 게시본 상단에 표시됩니다. 비워두면 해당 항목은 표시되지 않아요.</div>
    <div class="mbtns"><button id="sc">취소</button><button class="primary" id="so">적용</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#sc').addEventListener('click', () => ov.remove());
  ov.querySelector('#so').addEventListener('click', () => {
    sessionInfo = {
      title: ov.querySelector('#si-title').value.trim(),
      writer: ov.querySelector('#si-writer').value.trim(),
      gm: ov.querySelector('#si-gm').value.trim(),
      players: ov.querySelector('#si-players').value.split(',').map(s => s.trim()).filter(Boolean),
      party: ov.querySelector('#si-party').value.trim(),
      overview: ov.querySelector('#si-overview').value.trim(),
    };
    document.body.dataset.session = JSON.stringify(sessionInfo);
    renderSession();
    /* 자관 미연동 로그의 사이드바 뱃지(플레이어/파티명)가 이걸 읽는데, 가져온 로그는 이 저장
       자체가 아예 빠져있어서 세션 정보를 아무리 채워도 사이드바엔 절대 안 떴다 */
    try {
      var qidSess = window.__CRIT_ID || new URLSearchParams(location.search).get('id');
      if (qidSess) localStorage.setItem('crit-sess:ccf_viewer.html?id=' + qidSess, JSON.stringify({ players: sessionInfo.players, party: sessionInfo.party }));
    } catch (eSess) {}
    /* crit-log-sess:<id>(다시 열 때 읽는 진짜 저장소)는 이제껏 #s-players DOM이 실제로
       바뀔 때만 걸리는 MutationObserver에만 의존했다 - 개요/제목/라이터만 고치고 플레이어
       목록은 그대로 두면(특히 비어 있으면) 감시망이 아예 안 걸려서 저장 자체가 안 됐다
       (실제로 겪은 버그 - "개요 고치고 게시했는데 반영이 안 됨"). 저장 버튼을 누른 시점에
       직접, 확실하게 저장한다 */
    try {
      var qidSess2 = window.__CRIT_ID || new URLSearchParams(location.search).get('id');
      localStorage.setItem('crit-log-sess:' + (qidSess2 || 'tpl'), JSON.stringify(sessionInfo));
    } catch (eSess2) {}
    if (typeof serialize === 'function') serialize();
    ov.remove();
  });
});

const tabBoxes = document.querySelectorAll('.tab-chip input');
const charbar = document.getElementById('charbar');
/* 캐릭터바는 지문/사담 지정이 바뀔 때 통째로 다시 그려지므로(renderCharBar), 칩 input을
   한 번만 querySelectorAll로 캐싱해두면 재생성된 새 input을 못 찾는다 - 매번 새로 조회한다 */
function charBoxes() { return document.querySelectorAll('.char-chip input[data-char]'); }
const q = document.getElementById('q');
function apply() {
  const tabs = tabBoxes.length ? new Set([...tabBoxes].filter(c=>c.checked).map(c=>c.dataset.tab)) : null;
  const boxes = charBoxes();
  const chars = boxes.length ? new Set([...boxes].filter(c=>c.checked).map(c=>c.dataset.char)) : null;
  const term = q.value.trim().toLowerCase();
  /* 지문/사담으로 지정된 캐릭터는 개별 체크박스가 없으므로, 그 캐릭터 메시지는 통합 칩
     (__desc__/__chat__)의 체크 상태로 판정한다 */
  const dSet = window.__critDescChars, cSet = window.__critChatChars;
  document.querySelectorAll('#log .msg').forEach(m => {
    /* 게시본(필터 UI 없음)에서는 본편(main/info)만 표시 */
    let ok = !m.dataset.tab || (tabs ? tabs.has(m.dataset.tab)
      : (m.dataset.tab === 'main' || m.dataset.tab === 'info'));
    if (ok && m.dataset.char && chars && m.dataset.type !== 'handout') {
      const mc = m.dataset.char;
      const effChar = (dSet && dSet.has(mc)) ? '__desc__' : ((cSet && cSet.has(mc)) ? '__chat__' : mc);
      ok = chars.has(effChar);
    }
    if (ok && term) ok = m.textContent.toLowerCase().includes(term);
    m.classList.toggle('hide', !ok);
  });
}
tabBoxes.forEach(c => c.addEventListener('change', apply));
if (charbar) charbar.addEventListener('change', e => { if (e.target.matches && e.target.matches('input[data-char]')) apply(); });
q.addEventListener('input', apply);
apply();  // 초기 상태 반영 (other 탭 기본 해제)

/* 탭 all 뱃지 + 탭 칩 우클릭 솔로 */
const tabAllBtn = document.getElementById('tab-all');
if (tabAllBtn) tabAllBtn.addEventListener('click', () => {
  /* 숨겨진(hide) 칩은 계산에서 제외 - 보이는 것 기준으로 켜짐/꺼짐 판단해야 한 번 더 누르면 확실히 전부 꺼진다 */
  const boxes = [...tabBoxes].filter(c => { const chip = c.closest('.tab-chip'); return chip && !chip.classList.contains('hide'); });

  boxes.forEach(c => { c.checked = !allOn; });

});

spanel.addEventListener('click', e => e.stopPropagation());

const root = document.documentElement.style;
function applyTheme() {
  const mode = document.querySelector('input[name=rtmode]:checked').value;
  const c1 = document.getElementById('c-rt1').value;
  const c2 = mode === 'solid' ? c1 : document.getElementById('c-rt2').value;
  root.setProperty('--accent', document.getElementById('c-accent').value);
  root.setProperty('--rt1', c1);
  root.setProperty('--rt2', c2);
  document.getElementById('rt2row').style.display = mode === 'solid' ? 'none' : 'flex';
}
[['h-accent','c-accent'],['h-rt1','c-rt1'],['h-rt2','c-rt2']].forEach(([h, c]) => {
  const hex = document.getElementById(h), col = document.getElementById(c);
  hex.addEventListener('input', () => {
    let v = hex.value.trim();
    if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { col.value = v.toLowerCase(); applyTheme(); }
  });
  hex.addEventListener('blur', () => { hex.value = col.value; });
  col.addEventListener('input', () => { hex.value = col.value; applyTheme(); });
});
document.querySelectorAll('input[name=rtmode]').forEach(r => r.addEventListener('change', applyTheme));
document.querySelectorAll('input[name=thememode]').forEach(r => r.addEventListener('change', () => {
  document.body.classList.toggle('light', document.querySelector('input[name=thememode]:checked').value === 'light');
}));

/* ── 파일 선택 / 아바타 유틸 ── */
const filepick = document.getElementById('filepick');
let fileCb = null;
filepick.addEventListener('change', () => {
  const f = filepick.files[0]; filepick.value = '';
  if (!f || !fileCb) return;
  const r = new FileReader();
  r.onload = () => fileCb(r.result);
  r.readAsDataURL(f);
});
function pickImage(cb) { fileCb = cb; filepick.click(); }
/* 업로드한 이미지를 base64로 localStorage에 그대로 박아두면 용량 제한에 걸리므로,
   디스크에 파일로 저장하고 crit-image://<id> 참조만 돌려받는다 (Electron API 없는
   브라우저 미리보기에서는 그냥 base64를 그대로 씀) */
async function toImageRef(dataUrl) {
  if (window.api && window.api.images && window.api.images.save) {
    try {
      const res = await window.api.images.save(dataUrl);
      if (res && res.url) return res.url;
    } catch (e) {}
  }
  return dataUrl;
}
function setAvatar(container, src) {
  const av = container.querySelector('.avatar, .chip-avatar');
  if (!av) return;
  av.innerHTML = '';
  const img = document.createElement('img'); img.src = src; av.appendChild(img);
}
function blankAvatar(container) {
  const av = container.querySelector('.avatar, .chip-avatar');
  if (av) av.innerHTML = '';
}
function sealAvatar(container, color) {
  const av = container.querySelector('.avatar, .chip-avatar');
  if (!av) return;
  av.innerHTML = '';
  const b = document.createElement('b'); b.style.background = color; av.appendChild(b);
}
function applyAvatarAll(key, d) {
  const meta = charMeta[key]; if (meta) meta.avatar = d;
  const chip = document.querySelector(`.char-chip[data-chip="${CSS.escape(key)}"]`);
  if (chip) setAvatar(chip, d);
  document.querySelectorAll(`.msg[data-char="${CSS.escape(key)}"]`).forEach(mm => {
    if (!mm.dataset.avatarOverride) setAvatar(mm, d);
  });
}
function removeAvatarAll(key) {
  const meta = charMeta[key]; if (meta) meta.avatar = null;
  const color = meta ? meta.color : '#999';
  const chip = document.querySelector(`.char-chip[data-chip="${CSS.escape(key)}"]`);
  if (chip) sealAvatar(chip, color);
  document.querySelectorAll(`.msg[data-char="${CSS.escape(key)}"]`).forEach(mm => {
    if (!mm.dataset.avatarOverride) sealAvatar(mm, color);
  });
}

/* ── 경고 모달 ── */
function confirmModal(msg, okLabel, onOk) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>경고</h3>
    <div style="font-size:13px; line-height:1.6">${msg}</div>
    <div class="mbtns"><button id="wc">취소</button><button class="danger" id="wo">${okLabel}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#wc').addEventListener('click', () => ov.remove());
  ov.querySelector('#wo').addEventListener('click', () => { ov.remove(); onOk(); });
}

/* 이 캐릭터의 "이 블록만" 아바타 수정에 예전에 썼던 이미지들(중복 제거) - 매번 새로
   업로드하지 않고 골라 쓸 수 있게(실제 요청: "이미 등록한 이미지로 또 하고 싶을 수도
   있잖아") data.blocks에 저장된 avOv를 훑는다 (avOv:null인 "이 블록만 없애기"는 제외) */
function collectRecentAvatars(key) {
  var seen = {}; var out = [];
  (window.CRIT_IMPORT_DATA && window.CRIT_IMPORT_DATA.blocks || []).forEach(function (b) {
    if (b.sp === key && b.avOv && !seen[b.avOv]) { seen[b.avOv] = true; out.push(b.avOv); }
  });
  return out;
}
/* "이 블록만" 오버라이드를 지우고 캐릭터 기본값(공용 아바타/색/숨김)으로 되돌린다 */
function revertBlockAvatar(m) {
  delete m.dataset.avatarOverride;
  var meta = charMeta[m.dataset.char] || {};
  if (meta.hideAvatar) blankAvatar(m);
  else if (meta.avatar) setAvatar(m, meta.avatar);
  else sealAvatar(m, meta.color || '#999');
}
/* esc()는 다른 <script> 블록(IIFE) 안에 갇혀 있어 여기서는 안 보인다 - 이걸 놓쳐서
   재사용 썸네일이 하나라도 있는 상태로 이 모달을 열 때마다 "esc is not defined"가
   터져 모달 자체가 안 열렸다(실제 겪은 버그: "수정을 하고나면 다른 블록들을 수정할
   수가 없어" - 사실은 그 캐릭터의 모든 블록에서 똑같이 막히고 있었다) */
function escAttr(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
/* ── 업로드 모달 (onDelete 전달 시 삭제 버튼 표시, recentImgs 전달 시 재사용 썸네일
   표시, onRevert 전달 시 썸네일 맨 앞에 "원래대로" 버튼 표시) ── */
function openUploadModal(title, cb, onDelete, recentImgs, onRevert) {
  /* crit-crop-wrap: 아바타는 1:1로 잘라서 등록. 자른 결과(base64)를 디스크로 옮긴 뒤
     참조를 실제 콜백에 넘긴다 */
  var _cb = cb;
  var _cbRef = function (d) { toImageRef(d).then(_cb); };
  cb = function (d) { if (window.critCrop) critCrop(d, 1, _cbRef); else _cbRef(d); };
  const ov = document.createElement('div'); ov.className = 'overlay';
  /* 재사용 썸네일은 이미 한 번 크롭·저장까지 끝난 이미지라 다시 크롭 모달을 띄우지
     않고 바로 적용한다 */
  var hasRecent = recentImgs && recentImgs.length;
  var recentHtml = '';
  if (hasRecent || onRevert) {
    recentHtml = '<div class="hint" style="margin:0 0 6px">이 캐릭터에 예전에 쓴 이미지</div>' +
      '<div id="ua-recent" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
      (onRevert ? '<div class="ua-revert" title="이 블록만 지정한 아바타 없애고 원래대로" style="width:42px;height:42px;' +
        'border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;' +
        'border:2px dashed var(--line);color:var(--dim);font-size:10px;line-height:1.2;text-align:center">원래대로</div>' : '') +
      (hasRecent ? recentImgs.map(function (src, i) {
        return '<div class="ua-recent-item" data-i="' + i + '" title="이 이미지 쓰기" style="width:42px;height:42px;' +
          'border-radius:50%;background-size:cover;background-position:center;cursor:pointer;' +
          'border:2px solid var(--line);background-image:url(' + escAttr(src) + ')"></div>';
      }).join('') : '') + '</div>';
  }
  ov.innerHTML = `<div class="modal"><h3>${title}</h3>
    ${recentHtml}
    <div class="dropzone" id="dz">이미지를 여기로 드래그하거나<br>클릭해서 선택하세요</div>
    <div class="mbtns">${onDelete ? '<button class="danger" id="ud">아바타 삭제</button>' : ''}<button id="uc">취소</button></div></div>`;
  document.body.appendChild(ov);
  const dz = ov.querySelector('#dz');
  const done = d => { ov.remove(); cb(d); };
  if (onRevert) {
    ov.querySelector('.ua-revert').addEventListener('click', function (e) {
      e.stopPropagation();
      ov.remove();
      onRevert();
    });
  }
  if (hasRecent) {
    ov.querySelectorAll('.ua-recent-item').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        ov.remove();
        _cbRef(recentImgs[parseInt(el.dataset.i, 10)]);
      });
    });
  }
  dz.addEventListener('click', () => pickImage(done));
  ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0]; if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(f);
  });
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#uc').addEventListener('click', () => ov.remove());
  if (onDelete) ov.querySelector('#ud').addEventListener('click', () => {
    ov.remove();
    confirmModal('아바타를 삭제하고 단색 인장으로 되돌릴까요?', '삭제', onDelete);
  });
}

/* ── 캐릭터 편집 모달 ── */
let charMetaOriginal = null;
function openCharModal(key) {
  /* 가져온 로그는 charMeta가 데이터 파싱 후에야 채워지니, 처음 이 모달을 여는 시점(이미 다 채워진 뒤)에
     한 번만 스냅샷 떠서 "기본 색으로 복원" 기준으로 삼는다 */
  if (!charMetaOriginal) charMetaOriginal = JSON.parse(JSON.stringify(charMeta));
  const meta = charMeta[key];
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>캐릭터 편집</h3>
      <div class="mrow"><span>이름</span><input type="text" id="cm-name" value="${meta.display}"></div>
      <div class="mrow"><span>글씨색</span><input type="text" id="cm-colorhex" class="hexin" value="${meta.color}" spellcheck="false" style="width:80px"><input type="color" id="cm-color" value="${meta.color}">${charMetaOriginal[key] ? '<button type="button" id="cm-colorreset" title="기본 색으로 복원" style="background:none;border:none;color:var(--dim);cursor:pointer;padding:4px">↺</button>' : ''}</div>
      <div class="mrow"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="cm-mine" ${meta.mine ? 'checked' : ''}> 내 캐릭터 <span style="font-size:11px;color:var(--dim)">메신저 스타일에서 오른쪽 정렬</span></label></div>
      <div class="mrow"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="cm-npc" ${meta.npc ? 'checked' : ''}> NPC <span style="font-size:11px;color:var(--dim)">메신저 스타일에서 지문처럼 가운데 정렬</span></label></div>
      <div class="mrow"><span>프로필 사진</span><button id="cm-img">이미지 선택…</button>${meta.avatar ? '<button id="cm-imgdel" class="danger">제거</button>' : ''}</div>
      <div class="mrow"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="cm-noavatar" ${meta.hideAvatar ? 'checked' : ''}> 프로필 완전히 숨기기 <span style="font-size:11px;color:var(--dim)">이미지도 색상 원도 안 보여요 (NPC 등에)</span></label></div>
      <div class="mbtns"><button id="cm-cancel">취소</button><button class="primary" id="cm-ok">적용</button></div>
    </div>`;
  document.body.appendChild(ov);
  const cmColor = ov.querySelector('#cm-color'), cmColorHex = ov.querySelector('#cm-colorhex');
  cmColorHex.addEventListener('input', () => {
    let v = cmColorHex.value.trim();
    if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) cmColor.value = v.toLowerCase();
  });
  cmColorHex.addEventListener('blur', () => { cmColorHex.value = cmColor.value; });
  cmColor.addEventListener('input', () => { cmColorHex.value = cmColor.value; });
  const cmColorReset = ov.querySelector('#cm-colorreset');
  if (cmColorReset) cmColorReset.addEventListener('click', () => {
    const def = charMetaOriginal[key].color;
    cmColor.value = def; cmColorHex.value = def;
  });
  let newAvatar = null, avatarRemoved = false;
  ov.querySelector('#cm-img').addEventListener('click', () => pickImage(async d => {
    newAvatar = await toImageRef(d); avatarRemoved = false; ov.querySelector('#cm-img').textContent = '선택됨 ✓';
  }));
  const cmImgDel = ov.querySelector('#cm-imgdel');
  if (cmImgDel) cmImgDel.addEventListener('click', () => {
    avatarRemoved = true; newAvatar = null;
    ov.querySelector('#cm-img').textContent = '이미지 선택…';
    cmImgDel.remove();
  });
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#cm-cancel').addEventListener('click', () => ov.remove());
  ov.querySelector('#cm-ok').addEventListener('click', () => {
    const newName = ov.querySelector('#cm-name').value || meta.display;
    const targetKey = Object.keys(charMeta).find(k => k !== key && charMeta[k].display === newName);
    if (targetKey && newName !== meta.display) {
      ov.remove();
      confirmModal(`이미 「${newName}」 캐릭터가 있습니다. 두 캐릭터의 로그를 하나로 합칠까요?<br>취소하면 이름은 변경되지 않습니다.`, '합치기',
        () => mergeChars(key, targetKey));
      return;
    }
    meta.display = newName;
    meta.color = ov.querySelector('#cm-color').value;
    meta.mine = ov.querySelector('#cm-mine').checked;
    meta.npc = ov.querySelector('#cm-npc').checked;
    meta.hideAvatar = ov.querySelector('#cm-noavatar').checked;
    refreshMine();
    if (avatarRemoved) delete meta.avatar;
    else if (newAvatar) meta.avatar = newAvatar;
    /* hideAvatar 체크를 껐다 켰다 할 때도 항상 지금 상태 기준으로 다시 결정한다 */
    function paintAvatar(container) {
      if (meta.hideAvatar) blankAvatar(container);
      else if (meta.avatar) setAvatar(container, meta.avatar);
      else sealAvatar(container, meta.color);
    }
    const chip = document.querySelector(`.char-chip[data-chip="${CSS.escape(key)}"]`);
    if (chip) {
      chip.querySelector('.chip-name').textContent = meta.display;
      chip.querySelector('.chip-name').style.color = meta.color;
      chip.style.setProperty('--cc', meta.color);
      paintAvatar(chip);
    }
    document.querySelectorAll(`.msg[data-char="${CSS.escape(key)}"]`).forEach(m => {
      const by = m.querySelector('.mhead .by');
      if (by) { by.textContent = meta.display; by.style.color = meta.color; }
      /* 핸드아웃은 .mhead .by가 아니라 .hcard .hname을 쓰는데, 여긴 그걸 안 건드려서
         핸드아웃 명의는 캐릭터 편집을 해도 색이 그대로였다(실제 겪은 버그: "핸드아웃처리
         하면 캐릭터리스트에서 사라지니까 글씨색같은걸 못바꾸는 문제") - 같은 이름의
         핸드아웃도 전부 같이 바뀌어야 한다는 요청대로, data-char가 같으면 다 반영한다 */
      const hn = m.querySelector('.hcard .hname');
      if (hn) { hn.textContent = meta.display; hn.style.color = meta.color; }
      if (!m.dataset.avatarOverride) paintAvatar(m);
    });
    /* 색/내 캐릭터/NPC 변경은 classList·style 속성 변화라 자동저장(MutationObserver)이 못 잡는다 -
       명시적으로 저장을 불러줘야 한다 */
    if (typeof serialize === 'function') serialize();
    ov.remove();
  });
}
/* 칩이 다시 그려져도 항상 동작하도록 문서 위임 + 캡처 (라벨의 체크박스 토글보다 먼저 가로챔) */
document.addEventListener('click', e => {
  const el = e.target.closest ? e.target.closest('.chip-edit') : null;
  if (!el || !el.dataset.edit) return;
  e.preventDefault(); e.stopPropagation(); openCharModal(el.dataset.edit);
}, true);

/* 동명 캐릭터 로그 합치기 */
function mergeChars(srcKey, dstKey) {
  const dst = charMeta[dstKey];
  document.querySelectorAll(`.msg[data-char="${CSS.escape(srcKey)}"]`).forEach(m => {
    m.dataset.char = dstKey;
    const by = m.querySelector('.mhead .by');
    if (by) { by.textContent = dst.display; by.style.color = dst.color; }
    const hn = m.querySelector('.hname');
    if (hn) { hn.textContent = dst.display; hn.style.color = dst.color; }
    if (m.querySelector('.avatar') && !m.dataset.avatarOverride) {
      dst.avatar ? setAvatar(m, dst.avatar) : sealAvatar(m, dst.color);
    }
  });
  const srcChip = document.querySelector(`.char-chip[data-chip="${CSS.escape(srcKey)}"]`);
  const dstChip = document.querySelector(`.char-chip[data-chip="${CSS.escape(dstKey)}"]`);
  if (dstChip) {
    const cnt = dstChip.querySelector('.chip-count');
    const add = srcChip ? (parseInt(srcChip.querySelector('.chip-count').textContent) || 0) : 0;
    cnt.textContent = (parseInt(cnt.textContent) || 0) + add;
  }
  if (srcChip) srcChip.remove();
  delete charMeta[srcKey];
  descChars.delete(srcKey); chatChars.delete(srcKey);
  document.body.dataset.chatchars = JSON.stringify([...chatChars]);
  applyDescChars();
  apply();
}

/* ── 우클릭 메뉴 ── */
let menu = null;
function closeMenu() { if (menu) { menu.remove(); menu = null; } }
document.addEventListener('click', closeMenu);
function openTagModal(m) {
