<!DOCTYPE html>
<html lang="ko" style="--accent:#B26A9E"><head><!-- crit-preview-early: 리더 모드를 첫 페인트 전에 적용해 수정 UI가 깜빡이지 않게 --><script>try{if((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview")))document.documentElement.classList.add("crit-preview")}catch(e){}</script><style>html.crit-preview .stats,html.crit-preview .bartitle,html.crit-preview .tabbar,html.crit-preview .charbar,html.crit-preview #pwbtn,html.crit-preview .chip-edit,html.crit-preview .allbtn,html.crit-preview #sessbtn,html.crit-preview #editbtn,html.crit-preview #savebtn,html.crit-preview #descbtn,html.crit-preview #chatbtn,html.crit-preview #msgrbtn{display:none!important}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[0802] Death_Incarnation</title>
<style>
  :root {
    --accent:#B26A9E;
    --rt1:#6b5a8e; --rt2:#8e5a7d;
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  /* 테마 연동 커스텀 스크롤바 */
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent) 62%, var(--line)); }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  header.hero { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:14px; }
  /* 블로그에 붙여넣으면 블로그 테마 자체의 h1/본문 CSS가 우리 값보다 우선순위가 높아서
     타이틀·개요 글씨가 훨씬 커 보였다(실제 피드백) - !important로 블로그 CSS에 안 밀리게 고정 */
  .hero h1 { margin:0 0 4px; font-size:17px !important; letter-spacing:-.5px; }
  .hero .sub { color:var(--dim); font-size:13px !important; }
  /* 세션 정보 */
  .t-writer { display:inline-flex; align-items:center; vertical-align:middle; color:var(--dim);
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:600; margin-left:6px; }
  .s-players { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pbadge { background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:600; }
  .pbadge-gm { background:color-mix(in srgb, var(--accent) 26%, var(--panel2));
    border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .s-overview { color:var(--desc); font-size:12.5px !important; line-height:1.7; margin:0 0 4px;
    border-left:3px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    padding-left:12px; white-space:pre-line; }
  #s-writer:empty, #s-subtitle:empty, .s-overview:empty, .s-players:empty { display:none; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--dim); }
  .stats b { color:var(--text); font-weight:600; }
  .bartitle { font-size:11.5px; color:var(--dim); margin:14px 0 8px; font-weight:600;
    display:flex; align-items:center; gap:7px; }
  .allbtn { font-size:10.5px; padding:1px 9px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; font-family:inherit; line-height:1.5; }
  .allbtn:hover { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .charbar, .tabbar { display:flex; gap:8px; flex-wrap:wrap; }
  .tab-chip { display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:3px 10px; cursor:pointer; user-select:none; font-size:12.5px;
    position:relative; padding-right:20px; }
  .tab-chip:has(input:not(:checked)) { opacity:.35; }
  .tab-chip input { display:none; }
  /* crit-tab-x: 탭 칩 우측의 작은 삭제 아이콘 - head 쪽 기본 스타일에 같이 둬야 한다.
     body 안쪽 저 아래에 따로 있으면, 이 문서가 워낙 커서 브라우저가 그 지점까지 파싱하기 전엔
     패딩/숨김이 적용 안 된 상태로 먼저 그려졌다가 뒤늦게 적용되며 탭 정렬이 움찔거렸다. */
  .tab-chip .tab-x { position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; border-radius: 50%; display: none; align-items: center; justify-content: center;
    color: var(--dim); cursor: pointer; }
  .tab-chip:hover .tab-x { display: flex; }
  .tab-chip .tab-x:hover { color: #e08b8b; background: color-mix(in srgb, #e08b8b 18%, transparent); }
  .tab-name { font-weight:600; }
  .charbar.collapsed { max-height:104px; overflow:hidden; }
  .charbar { align-content:flex-start; }
  .expandbtn { display:none; width:100%; margin-top:6px; padding:2px 0; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; color:var(--dim); cursor:pointer;
    align-items:center; justify-content:center; }
  .expandbtn:hover { color:var(--text); border-color:var(--accent); }
  .expandbtn.open svg { transform:rotate(180deg); }
  .char-chip { display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:3px 8px 3px 4px; cursor:pointer; user-select:none; transition:.15s;
    border-color: color-mix(in srgb, var(--cc) 45%, var(--line)); }
  .char-chip:has(input:not(:checked)) { opacity:.35; }
  .char-chip input { display:none; }
  .avatar img, .avatar b { width:30px; height:30px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-avatar { display:flex; align-items:center; }
  .chip-avatar img, .chip-avatar b { width:22px; height:22px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-name { font-size:13px; font-weight:600; line-height:1; }
  .chip-count { font-size:11px; color:var(--dim); line-height:1; }
  /* 지문/사담 통합 칩: 아바타가 없어 기본 padding(왼쪽 4px)이 그대로면 글자가 테두리에 붙어보인다 */
  .char-chip.merged { border-style:dashed; padding:3px 10px; }
  .char-chip.merged .chip-name { color:var(--accent); }
  .chip-edit { display:flex; align-items:center; justify-content:center; color:var(--dim); padding:3px; border-radius:6px; }
  .chip-edit svg { width:14px; height:14px; }
  .chip-edit:hover { color:var(--text); background:var(--line); }
  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .toolbar input[type=search] { flex:1; min-width:120px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .spanel hr { border:none; border-top:1px solid var(--line); margin:10px 0; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }

  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:hover, input[type=radio]:hover {
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  .mrow button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .mrow button:hover { background:color-mix(in srgb, var(--accent) 26%, var(--panel2)); }

  .msg { display:flex; gap:10px; padding:7px 10px; border-radius:10px; }
  .msg + .msg { margin-top:2px; }
  .msg .avatar { flex:0 0 30px; padding-top:2px; }
  .msg .mbody { flex:1; min-width:0; }
  .mhead { display:flex; align-items:baseline; gap:8px; }
  .mhead .by { font-weight:700; font-size:13.5px; }
  .mhead .ctab { font-size:10.5px; color:var(--dim); opacity:.7; }
  .mcontent { font-size:14.5px; overflow-wrap:break-word; }
  .mcontent img { max-width:100%; border-radius:8px; }
  .msg.desc { justify-content:center; text-align:center; color:var(--desc); font-style:italic; padding:10px 34px; }
  .msg.desc .mcontent { font-size:14px; }
  .msg.general { background:var(--panel); border:1px solid transparent; }
  .msg.general:hover { border-color:var(--line); }
  /* 메신저 스타일: 대사 블록을 메신저 말풍선처럼 - 상대는 왼쪽, 내 캐릭터는 오른쪽으로
     쏠린 좁은 블록(74%)으로 줄이고, 내 캐릭터는 이름·시각까지 오른쪽 정렬 (판정 표 블록 제외) */
  body.msgr .msg.general:not(.roll) { max-width:74%; margin-right:auto; }
  body.msgr .msg.general.mine:not(.roll) { flex-direction:row-reverse; margin-right:0; margin-left:auto; }
  body.msgr .msg.general.mine:not(.roll) .mbody { text-align:right; }
  body.msgr .msg.general.mine:not(.roll) .mhead { justify-content:flex-end; }
  /* 연속 대사: 이름 한 번만, 블록 연결 */
  .msg.general.cont { margin-top:0; border-top-left-radius:0; border-top-right-radius:0; padding-top:0; }
  .msg.general:has(+ .msg.general.cont) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .msg.general.cont .mhead { display:none; }
  .msg.general.cont .avatar img, .msg.general.cont .avatar b { display:none; }
  .msg.general.roll { background:color-mix(in srgb, var(--accent) 9%, var(--panel));
    border-left:3px solid color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .msg.general.roll .mcontent { font-family:Consolas,"D2Coding",monospace; font-size:13px; }
  /* CC 판정 → Roll20 coc-1 스타일 표 */
  .msg.general.roll.cc .mcontent { font-family:inherit; font-size:14.5px; }
  .inlinerollresult { background:color-mix(in srgb, var(--accent) 24%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); border-radius:4px;
    padding:0 5px; font-weight:700; font-size:13px; }
  /* 아바타 열(30px+간격 10px)만큼 중심 보정 → 페이지 가운데와 열 일치 */
  .msg.general .ccroll { transform:translateX(-20px); }
  .ccroll { border-collapse:collapse; margin:6px auto; min-width:230px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .ccroll caption { background:linear-gradient(135deg, var(--rt1), var(--rt2)); color:#fff;
    font-weight:700; font-size:13px; padding:5px 10px; caption-side:top; border-radius:8px 8px 0 0; }
  .ccroll td { padding:4px 10px; font-size:13px; border-top:1px solid var(--line); }
  .sheet-template_label { color:var(--dim); }
  .ccroll .resrow { background:#bebebe; }
  .ccroll .resrow .sheet-template_label { color:#4a4a4a; }
  .ccroll .rr { font-size:13px; }
  .ccroll .rr-extreme, .ccroll .rr-crit { background:#cfe3cd; color:#3f6b42; }
  .ccroll .rr-hard { background:#2e7d32; color:#fff; }
  .ccroll .rr-normal { background:#1b5e20; color:#fff; }
  .ccroll .rr-fail { background:#a84848; color:#fff; }
  .ccroll .rr-fumble { background:#6e2323; color:#fff; }
  .ccroll .rr-etc { background:#8a8a8a; color:#fff; }

  /* 지문출력 캐릭터: 해당 캐릭터의 발화를 Roll20 서술처럼 가운데 지문으로 표시 */
  .msg.general.as-desc:not(.roll) { background:transparent; border-color:transparent;
    justify-content:center; text-align:center; font-style:italic; padding:10px 34px; }
  .msg.general.as-desc:not(.roll) .avatar, .msg.general.as-desc:not(.roll) .mhead { display:none; }
  .msg.general.as-desc:not(.roll) .mcontent { color:var(--desc); font-size:14px; }
  /* info 탭: 핸드아웃 카드 */
  .msg.handout { justify-content:center; padding:14px 34px; }
  .hcard { background:var(--panel); border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:14px; padding:18px 24px; max-width:560px; width:100%; text-align:center;
    box-shadow:0 4px 18px color-mix(in srgb, var(--accent) 12%, transparent); }
  .hcard .hname { font-size:16px; font-weight:700; margin-bottom:10px; padding-bottom:10px;
    border-bottom:1px solid var(--line); }
  .hcard .mcontent { font-size:14px; line-height:1.75; }

  /* main/info 외 탭(사담·귓속말 등)은 흐리게 — 메인 진행과 구분 */
  .msg.subtab { opacity:.55; }
  .msg.subtab:hover { opacity:1; }
  .dclist { max-height:300px; overflow:auto; display:flex; flex-direction:column; gap:7px; margin:4px 0 2px; }
  .dclist label { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; }
  .dclist .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  footer { margin-top:28px; color:var(--dim); font-size:12px; text-align:center; }
  .editing .mcontent, .mcontent[contenteditable="true"] { outline:1px dashed #C98A5B55; border-radius:6px; }
  .editing #log .msg .avatar { cursor:pointer; }
  .editing #log .msg .avatar:hover img, .editing #log .msg .avatar:hover b { outline:2px solid var(--accent); }
  .hide { display:none !important; }
  .ctxmenu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; min-width:170px; box-shadow:0 10px 30px #000a; }
  .ctxmenu button { display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:13px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; }
  .ctxmenu button:hover { background:color-mix(in srgb, var(--accent) 22%, var(--panel2)); }
  .ctxmenu button.danger { color:#e08a8a; }
  .ctxmenu .sep { border-top:1px solid var(--line); margin:4px 6px; }
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:300px; max-height:82vh; overflow-y:auto; }
  .modal.wide { width:min(92vw, 560px); }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal textarea { width:100%; min-height:190px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; line-height:1.5;
    font-family:Consolas,"D2Coding",monospace; resize:vertical; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:30px 12px;
    text-align:center; color:var(--dim); font-size:13px; cursor:pointer; transition:.15s; }
  .dropzone.over { border-color:var(--accent); color:var(--text);
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow.opts { justify-content:flex-start; gap:22px; }
  .mrow label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .iconbtn.on { color:var(--accent); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .pwwrap { position:relative; }
  .pwwrap input { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:7px 36px 7px 10px; font-size:13px; font-family:inherit; }
  .eyebtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--dim); cursor:pointer; padding:4px; display:flex; }
  .eyebtn:hover { color:var(--text); }
  .mrow input[type=text] { flex:1; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; }
  .mrow input[type=color] { width:36px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }

길 바깥으로 나가면, 어른 한명 붙잡고 도와달라 이야기를 할 수 있겠죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    수많은 사람들 중 그래도 한명 정도는 당신을 도와주지 않겠습니까. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (먼지며 눈이 쌓여버린 얼굴을 한 손으로 대강 문질러 가면서 몇 걸음 옮깁니다. 비틀, 비틀...) -저기, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저기요, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    복잡한 골목길을 나가려는 때,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신에게로 다가오는 4명의 남자들이 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    검은 재킷을 입은 남자들. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그들은 방탄 조끼를 착용하고, 오니 같은 얼굴로 당신을 바라봅니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (반사적으로 한 걸음 뒤로, 아니,) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    선두에 선 큰 체구의 남성읍 입에 문 담배 연기를 내뱉으며 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신을 바라본 채로 무전기로 연락을 시도합니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (놀란 것이 틀림없는 표정을 하고는) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “여기는 오오가미. 이케가미 포인트 327에서 대상 발견.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “즉시 대상 구속 시도, 이상.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    (손짓하여 지시를 내린다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (누가 보아도 패닉에 빠진 듯한 얼굴, 무서운 단어, 그러니까,) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오오가미라고 말한 남성이 손짓하면,  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (어떻게 해야 하지, 따위의 고민과 함께 뒷걸음질칩니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    남은 세 명의 남성들이 홀스터에서 총을 꺼내 겨눕니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아, 이 사람들⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신을 죽이려고 하고 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어째서? 아무 잘못도 안했는데? 그저, 도움을 청하려고⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    본능이 속삭입니다. 도망쳐야 해. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 저, (말소리 사이에 약간의 울먹임이 섞여 나오다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저는, 저는 아무 짓도 안 했, (직, 눈밭 위로 단화가 미끌리는 소리가 신호탄처럼 선명히 들리고 나면.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (곧장 뒤돌아 도망칩니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    저기, 저 모퉁이만 돌면 권총을 피할 수 있을지도 모릅니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    [3DM&lt;=3] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    3DM&lt;=3 (3DM&lt;=3) ＞ [4, 7, 5] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ─라고, 일반인들은 자주 착각하곤 하죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    영화에서나 보던 것을, 자신이 할 수 있다고 착각하는 건 당연한 군중의 심리입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    탕! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    메마른 총성이 울리고  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신의 등에 무언가 명중하는 느낌과 함께,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 앞으로 고꾸라집니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    등에서 느껴지는, 고통, 통증, 상상도 못했던 것들이─ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽생존&gt; 판정 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ㅡ악!! (아, 아파,) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1DM&lt;=4 &lt;✽ 생존&gt; (1DM&lt;=4) ＞ [9] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] HP : 13 → 3 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    살려, 살려 주세요, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    살려 주세요... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    주위에 쌓인 눈이 당신의 피때문에 붉게 물들기 시작합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    숨을 쉬는 것조차 어려운 당신을 도와줄 생각이 없는 남성들은, \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “여기는 오오가미. 대상이 도주를 시도했기에 발포.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “생존을 확인했기에 구속하고 즉시 본부로 데려간다.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “알겠다, 신속하게 처리하도록 하지. 이상.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    (무전기를 끄고, 나머지 세 사람을 바라본다.) “비상 시에 대비해 대상의 사지를 절단해라.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “절단 후 각 부위와 몸을 들고 철수한다. 신속히 실행하도록.” (말을 하고, 다시 뒤를 돌아 자리를 떠난다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (히끅, 히끅, 울음소리가 눈밭 위로 울려퍼집니다. 손가락 몇 개라도 땅을 긁어대나...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    싫어, 싫어요, 아파요... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    살고 싶나요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    살고 싶다면, **기원** 합시다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    누구에게? 대상은 상관없습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    종교인이 아니라면, 사람은 언제나 수십번씩 자연스럽게 자신의 바람을 속삭이곤 하니까요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (누구라도 좋으니까, 누구라도, 도와줄 수만 있다면,) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    남겨진 세 명의 남성들이 총을 집어넣고 나이프를 꺼낸 채 당신에게 다가옵니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    *죽고 싶지 않아요...* \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그 나이프는 곧, 당신을 향하지─ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    않고. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    붉은 핏물이 당신의 머리 위로 터집니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    툭, 툭⋯ 툭. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    남성 3명의 머리가 바닥을 구릅니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그들은 자신 스스로 목을 베어 자살했습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아, 어, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    으, 으아... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    드러난 짙은 붉은 살점의 단면에서 분수처럼 선혈이 쏟아져 나옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    *살아난 기분이 어떤가요?* \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    공명 판정 (강도 6 상승 1) / 공명 감정: 원한(정념) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    3DM&lt;=6 &lt;공명 판정&gt; (3DM&lt;=6) ＞ [9, 1, 3] ＞ 3 ＞ 성공 수 3, 트리플\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 3 → 4 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    [1D3] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1D3 (1D3) ＞ 2\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하울링: 치유 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    HP +1 \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] HP : 3 → 4 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    상처 상태는 심각하지만, 당신은 겨우 몸을 일으킬 수 있게 됐습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    싫, 싫어, (덜덜 떨리는 손으로 바닥을-주위로 떨어져버린 다른 이들의 머리를 최대한 보지 않으려 애쓰면서-짚고는 몸을 일으킵니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이런, 이런 걸 바란 건 아니야... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오오가미라는 남성이 돌아오기 전에, 이 골목길의 반대 출구로 향해야 합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    상처에서 흘러나온 피가 당신의 발자국을 붉게 물들여 길잡이가 되어주고 있지만 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그것은 현재 중요한 문제는 아닙니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (*그렇지만 죽고 싶지는 않아...*) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (베이지 색의 코트에 온통 핏물이 묻어서는. 이 따위 꼴으로 누군가에게 도움을 청할 수 있을 리 없지만, 하지만...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (도망쳐야만 했습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (흰 눈밭 위로 붉은 선이 반대의 한 점을 향하여 점점이 이어집니다...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    겨우 출구가 눈에 보인다고 생각할 때,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 급하게 골목길로 들어오는 누군가와 부딪혀 넘어집니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    고개를 들어, 보이는 것은⋯⋯ 갈색 머리의, 남자? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    개인 도입 종료. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    【스탠 리 개인 도입】 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    21년 12월 27일 17시 30분. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    반장이 실종된 지 일주일이 지났습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지금까지 실종의 흔적도 전혀 찾지 못했고⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    곧 크리스마스도 끝나고 연말이 다가오는데 말이죠.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 미첼 호프의 빈 책상을 보며 무슨 생각을 하고 있나요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (여태 카드 내역서, 대중교통 이용 내역, 주요 동선 CCTV 까지 행여나 놓친 것이 있을까 수십번을 뒤져보았지만 아무것도 나오지 않아 초조한 마음만 더해갑니다. 마지막으로 그가 자신에게 남겼던 말이 되돌임표처럼 뇌리에서 맴돕니다. 정말 일부러 흔적이라도 남기지 않은걸까.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (분명 그럴리가 없다는 것을 알면서도. 한숨만 길게 터져나옵니다. ) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    사무실 문이 열리면서 키리시마와 헤비하라가 들어옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마의 손에는 수사 자료들이 들려 있네요. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “수고하십니다, 스탠 씨.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “방금 과장님께 연락을 듣고 오는 길입니다. 반장님이 소식이 끊긴 지 오늘로 일주일⋯ 상부에서는 반장님이 어떤 사건에 휘말렸다고 판단하여 정식으로 실종 신고를 접수했다고 합니다.”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (둘이 들어오자 자리에서 잠깐 일어납니다.) 아, 그렇군요.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “⋯네, 그래서 반장이 부재중인 호프반은 일시적으로 해체됩니다. 현재 큰 사건도 맡고 있지 않으니, 업무를 마무리하라는 지시를 받았습니다.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (냉장고를 뒤적뒤적⋯) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (남은 도넛 상자를 꺼내 와압 도넛을 먹는다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (착잡한 마음에 한숨이 나오려다, 타츠미의 모습에 쏙 들어갑니다.) ...대기로군요. ...그보다, 타츠미.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    맛있냐...? \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “응, 엄청 맛있는데. 너도 먹을래? 당분간 사무실 비워야 하면 냉장고 싹 비워야해.” (우물우물) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (착잡한 마음에 비해 태평한 모습을 보자니 어쩐지 심사가 뒤꼬이는 기분입니다.) 하긴, 그것도 그렇겠네.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (그것도 모르고 냠념냠) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그래서 오늘도 퇴근 허가가 떨어졌습니다. 저도 이 자료만 확인하고 퇴근할 예정입니다. ⋯음,” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “사실, ⋯ 제가 따로 반장님에 대해 조사한 게 있습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 말에 반색합니다.) 뭡니까?  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “으에? 그런 게 있으면 말해서 같이 찾으셨어야죠! 선배는 너무 혼자 일해요.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그다지 유의미한 정보는 아닙니다. 그저, 반장님이 마지막으로 목격된 게⋯” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “일주일 전, 오타구 이케가미의 뒷골목이었다고 합니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그리고 이케가미에서 이상한 사건이 하나 발생했죠.” (수사 자료를 가리킨다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[오타구 하기나카 분신 자살 사건 ①]</div><div>21년 12월 26일, 23시 35분 경. 도쿄도 오타구 하기나카에 있는 주차장에서 남성 3명이 불길에 휩싸인 채 발견되었다. 구급대에 의해 피해자들은 병원으로 이송되었으나, 1시간 후인 21년 12월 27일 24시 20분 경 남성 3명의 사망이 확인되었다. 피해 남성 3명의 신원은 불명이다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[오타구 하기나카 분신 자살 사건 ②]</div><div>당시 주차장에는 등유 기름통을 실은 경트럭이 주차되어 있었다. 방범 카메라 영상에는 남성 3명이 경트럭에서 등유 기름통을 꺼내 자신의 머리에 등유를 끼얹고 자신의 몸에 불을 붙이는 모습이 담겨 있었다. 피해자 외에 누군가 1명이 현장에 함께 있었던 것도 방범 카메라 영상에 찍혀 있었다. 경찰은 함께 있었던 인물을 중요 참고인으로 보고 수사 중이다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    오타구 이케가미요?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (인상을 살짝 찌푸리며 수사자료를 살핍니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...린도 씨에게 항상 도움을 많이 받네요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이상한 사건이라고 하면, 이 사건을 혼자 조사하러 나가신 걸까요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아니면... 휘말린건가.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “아닙니다⋯ 그저, 이렇게 하지 않으면⋯ 저도 불안해서 말입니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “반장님은 항상, 혼자 맡으시려는 일이 많으시니까요.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    많이 그러신 편이죠.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “지나친 생각일 수도 있고, 헛다리를 짚었을 수도 있지만⋯ 이케가미의 뒷골목이 어떠한 연관성이 있을 것 같아서 저번에 한번 찾아가봤지만 별다른 증거는 없더군요.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “현장 주소를 전해드릴테니 직접 가보시는 게 어떠시겠습니까.” (주소가 적힌 메모를 건넨다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (메모를 받아듭니다.) 한번더 확인해보겠습니다.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “헤⋯ 같이 가줄 수 있으면 좋겠는데, 오늘 아케미랑 외식하기로 해서.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (그 사이에 냉장고를 싹 비웠다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    괜찮아. 가족이 제일 중요하지.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “엉, 뭔일 있으면 전화하고! 먼저 간다! 수고하십쇼, 선배님!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그래, 조심해서 가. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그리고⋯⋯” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “이건 정말로, 정말로 사적인 의견입니다만⋯” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...(그 말에 다시 시선이 린도로 옮겨갑니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “아무리 법적 성인의 실종이라고 해도, 상부의 움직임이 너무 느립니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “반장님의 실종에 대해 형사부가 공식적으로 움직이지 못하도록 누군가가 사전 작업을 쳐놨을 가능성이 큽니다. 그렇지 않다면, 이정도로 미적거릴 필요는 없죠.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    사실 상 골든 타임도 많이 지난 상황이죠.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    반장님이 조사하러 간 곳에 이상한 사건도 일어나고... 확실히 말씀대로 배후에 무언가가 있을지도 모르겠네요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혹시 최근에 반장님이 따로 조사하신 사건에 대해 알고 있는 게 있나요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... 제가 최근에 반장님이랑 이야기할 일이 별로 없었어서요. (머쓱하게 볼을 긁적였다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “음⋯ 아뇨, 무언가 수사를 임명 받으신 건 알고 있지만 어쩐지⋯⋯ 기밀, 사건으로 취급 되어서 말입니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “제 권한으로는 부족했습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...그러셨군요. 그러면 그 기밀 사건과 무언가 연관되어 있겠네요. 그정도 정보로도 충분합니다. 알려주셔서 감사합니다.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “네, 반장님을 찾는 일에 대해서는 최대한 주의해주시길 바랍니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그럼 이만, 저도 가볼테니 무슨 일이 있다면 연락주십시오.” (꾸벅 고개를 숙인다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (같이 고개를 꾸벅 숙입니다.) 네, 살펴 가세요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    연말 잘 보내시고요.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    자, 그럼⋯ 이왕 받았으니 오늘 골목길로 향해볼까요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (머리를 한번 가볍게 헤집습니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (주소를 확인하고 골목길로 차를 타고 이동합니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    골목길 근처의 공용주차장에 차를 주차하고, 골목길로 이동합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    경시청을 떠날 때부터 내리기 시작한 눈은 지금도 쉴 새 없이 내리고 있었고 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아스팔트에 차곡차곡 쌓인 눈은 사람들의 발로 인해 짓밟혀 질척합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    목적지로 가까워질수록 날씨 탓인지 행인은 점점 줄어들었고 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    눈의 하얀색과 어둠의 검은색이 만들어내는 흐릿한 명암이 뒷골목의 섬뜩함을 한층 더 돋보이게 합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    공명 판정 -근원 일치- (강도 3 상승 1) / 공명 감정: 원한(정념) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n     (1+1)DM&lt;=0 &lt;공명 판정(근원 일치)&gt; \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    3DM&lt;=0 &lt;공명 판정(근원 일치)&gt; (3DM&lt;=0) ＞ [6, 5, 9] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] 강도 : 0 → 3 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n     (1+1)DM&lt;=3 &lt;공명 판정(근원 일치)&gt; \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=3 &lt;공명 판정(근원 일치)&gt; (2DM&lt;=3) ＞ [6, 4] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽지각&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=5 &lt;✽ 지각&gt; (1DM&lt;=5) ＞ [4] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    골목으로 발을 들여놓으려던 순간, 조금 떨어진 곳에서 텅 빈 총성이 울립니다. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] ∞ 공명 : 1 → 2 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    착각이 아니라면, 골목길 안쪽에서 적어도 3발의 총성이 발사 됐습니다. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] ∞ 공명 : 2 → 1 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    무슨 일인지는 모르겠지만, 안을 확인하러 가볼까요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (총성에 놀라 황급하게 주위를 확인하며 빠른 걸음으로 골목길로 들어갑니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 골목길에 들어간지 얼마 안 되어 누군가와 부딪힙니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신과 만나 넘어진 것은 교복을 입은 10대 후반의 남자애. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    몸이 피로 붉게 물들어 있고, 그리고⋯⋯ \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미처 보지 못하고 그대로 부딪히면서 반사적으로 부딪힌 것을 붙듭니다.) 윽. 뭐야?  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼과 정말로 많이 닮아있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    개인 도입 종료. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    누구나 매일 무언가를 기원하며 살아갑니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    좋은 걸 얻고 싶어서, 행복을 얻고 싶어서, 누군가를 미워하고 싶어서. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    기원이라는 건 한순간, 저주로 뒤바뀔 수 있는 것. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어떤 이가 행복을 얻으면 다른 이는 불행에 시달립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    기원은 저주, 그것이 저주의 원리. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    우리는 오늘도 보이지 않는 무언가에 기원을 올립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    에모크로아 TRPG 「Death: Incarnation」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하얀 숨결이 입술 사이로 새어나옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    차가운 공기가 뺨을 스치며, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    눈의 하얀색과 어둠의 검은색이 뒤섞인 공간에서 두 사람은 재회합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하늘에서 쏟아지는 눈가루는 마치 그 만남을 축복하듯 두 사람을 감싸고 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    서로의 시선이 마주합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「스탠」<br>처음에는 착각인가 싶어 눈을 의심했지만, 눈앞에 있는 인물은 분명 미첼 호프입니다.<br>어, 좀 많이 어려지긴 했네요⋯ 좀 많이. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (마주친 시선, 생각치도 못한 얼굴...과, 함께 흐르는 핏물에 숨을 들이킵니다.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「스탠」<br>[HO1을 습격한 인물에 대해]<br>키리시마 린도가 말했던 “형사부가 공식적으로 움직이지 못하도록 뒷거래를 하고 있는 존재” 가 머릿속을 스친다. HO1을 습격한 인물은 경찰 관계자일 가능성이 높다. 하지만 같은 형사인 HO2는 그런 부서의 존재에 대해 아는 바가 없다. 이 건에 관해서는 신뢰할 수 있는 동료 외에는 입 밖에 내지 않는 편이 좋을지도 모른다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (너무나도 닮은 얼굴.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(나이는... 십대정도 되는 것 같은데, 피를 이렇게나 많이... 이내 그런 생각도 잠시, 이렇게 현실에서 사람이 이렇게 어려질리가... 없잖아.) 괜찮아요?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    흐윽, (잡아채인 직후 시선이. 고개가 당신을 향해 올라갑니다. 분명히 겁먹은 것이 틀림없는 얼굴을 하고서...)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    잘못, 잘못했어요, (양 손으로 몸을 보호하듯 한 채 움츠러듭니다. 인지하는 것은 비슷한 복장의 성인 남성이라는 점 뿐...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (주변을 황급히 둘러봅니다. 분명, 아까 울렸던 총성. 누군가에게 쫒기고 있었던 걸까?)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (보아하니 패닉이 온 것 같은데... 어떻게 달래야 하지?) 괜찮아, 안심해. 아저씨, 형사니까... 누가 그런거야? (시야를 맞추려 쭈그려 앉습니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이쪽으로 달려오는 발소리들이 들려옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그것도 한둘이 아닙니다. 꽤 많은 인원수. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ! (시선이 잠시 당신에게로 향했다가, 과할 만치 놀라 튀어오릅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    싫, (싫어, 죽기 싫어,) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 소리에 뒤를 돌아봅니다. 아직 쫒기고 있었구나.) 뛸 수 있겠어?  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    한 번의 발포음. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    훅, 당신들을 지나쳐간 총알은  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼의 뺨에 상처를 만들고 주륵, 또 한 번 피가 흐르게 만듭니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (뺨 위로 실선이 길게 생겨나면...) 아까, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아, 아저씨, (도와주세요, 싫어요, 죽기 싫어요, 말이 두서없이 새어나옵니다. 다급한 발걸음은 뒤를 돌아보지 않은 채 오직 이 자리를 빠져나가려고만...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (스쳐지나간 총알에 미첼을 감쌉니다. ) 미첼, 뛰어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (자기도 모르게 이름을 부릅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ⋯자, 이곳에서 빠르게 빠져나가야 합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼의 손을 붙들고 골목길 바깥쪽으로 뜁니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, &lt;✽지각&gt; 혹은 &lt;직감&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=6 &lt;직감&gt; (1DM&lt;=6) ＞ [2] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    방금 당신이 들어온 출구 쪽에서도 발소리가 들립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    빠르게 다른 출구를 찾아 얽히고 설킨 골목길 안을 헤집고 돌아다니다가 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    성공적으로 다른 출구로 나옵니다! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하지만, 발소리는 끝나지 않습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아, 이거⋯⋯ 유도 당했습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    포위 되는 것은 시간 문제입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...(아, 이런.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    자, 생각해보세요. 이 집단은 결코 아마추어가 아닙니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    훈련을 받고 조직력이 뛰어난 잡단이죠.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    단 두 사람으로는 이 포위망을 뚫는 게 어려울 것이며, 목숨을 내놓아야겠죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하지만 저들이 원하는 건 이 ‘미첼 호프’를 닮은 어린아이입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이 아이를 넘기면, 당신은 살 수 있습니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(미첼을 내려다봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    *그저 닮았을 뿐인 아이잖아요?* \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (새파랗게 질린 채, 당신을 올려다봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 저... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (울먹이는 목소리. 벌겋게 점차로 더 번져가는 핏물. 당신을 잡은 손에 더해지는 미약한 압력.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이를 콰득, 물고는. 절대 다시는 내어주지 않아. 그저 닮았을 뿐일지라도... 다시는 그런 실수 하지 않아.) 괜찮아, 분명 빠져나갈 수 있어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (주변을 둘러봅니다. 어디 빠져나갈만한 구석 없나? 이럴때는 정면 돌파가 답일텐데... 하필, 오늘 그냥 나와서는.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이대로 두고 갈 수 없습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그러니까, “미첼 호프”와 망가져 가던 세계에서 살아남았던 것처럼 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이번에도 이겨낼 수 있을 것이란─ 어떠한 생각이 스칩니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이유 모를 자신감이라고도 부를 수 있는 그것에 의해,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    빠르게 도망칠 길을 찾고 있다보면 눈이 아플 정도의 섬광탄이 터지고 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    곧 수많은 총들이 장전되는 소리와 함께, 당신들에게로 총알비가 쏟아져야 했을, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    터인데. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    철판이 두드려 망가지는 소리가 들립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    끼이익, 브레이크 소리를 내며 당신들의 앞에 멈춰서는 것이 보입니다. \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (조수석의 창문을 내린다) “스탠, 어서 타!!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...타츠미? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (생각치도 못한 얼굴에 눈이 동그랗게 뜨입니다.)  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “빨리! 그 애도 태우고!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (일단, 이건 나중에. 급한대로 얼른 미첼을 먼저 뒷문을 열고 밀어넣습니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 얼른 타! \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (밀쳐지는 와중에도 저 또한 급히 몸 밀어넣습니다. 어찌 된 일인지는 모르겠습니다만, 일단... 이 쪽은 확실히 팔다리를 자른다거나, 뭐 그럴 사람들은 아닌 것 같았으니까요.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼이 잘 올라탄 것을 확인하고 저도 급하게 올라탑니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    올라타 문을 닫으면, 운전석에는 키리시마가 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마는 빠르게 엑셀을 밟아 차를 출발시킵니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    야, 너... 아케미랑 어디 간다 하지 않았냐?! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    사이드 미러, 검은 재킷을 입고 방탄 조끼를 착용한 남자들이 점점 멀어져가는걸⋯ 바라봅니다. \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “그랬지~ 근데 갑자기 친구랑 약속 잡혔다잖아, 그 나이대는 가족보단 친구지.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그것도 그렇긴 하지...  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “그래서 간식 사러 가는 중이었는데, 선배님이 차에 타고 있는 게 보여서.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “골목길 가신다길래~ 왔는데, 이게 뭔 난리냐⋯?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    키리시마 씨까지. ...정말 타이밍 좋았네.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (한편, 한 쪽 좌석에 몸 구기듯 타고서는 잔뜩 긴장한 채-겁 먹었다고 봐도 무방하겠습니다-시선이 불안하게 이리저리 구릅니다...) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “일단, 그 아이의 응급처치를 부탁드리겠습니다.\" (운전석 옆의 서랍을 열고 구급상자를 꺼내 뒤로 건넨다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    덕분에 살았다, 정말... 조사차 잠깐 들렀는데.... 키리시마 씨도 여기에 오실 줄은 몰랐는데요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (구급상자를 받아듭니다.) 아, 그러고보니 갔더니 이 애가 막 쫒기고 있더라고.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “상부가 하필이면 오늘 움직였다는 게 불안해서, 혹시 몰라 한번 더 확인하러 왔습니다.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽응급처치&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그리고 미첼의 상처부위를 살핍니다. 이리봐봐. 하면서 소독제를 들고  뺨과 등 쪽에서 흥건히 묻어나오던 상처에 문지르고. 등쪽 상처를 거즈로 꾹 누릅니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=2 &lt;✽ 응급처치&gt; (1DM&lt;=2) ＞ [4] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] HP : 4 → 6 \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “으아⋯ 더럽게 아프겠는데⋯” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “기절 안하고 씩씩하네!” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (윽... 아픈 듯 소리 새어나오려던 것 꾹 참습,) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ... (입술 꾹 눌러 닫고는 좀 더 의젓하게 버텨보려고 노력은 합니다...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(아랑곳 하지 않고 더욱 꽉 누르고, 붕대로 세게 감습니다.)  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “일단, 무슨 일이 있었는지 설명 부탁드려도 되겠습니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    어떤 삼인방에게 쫒기고 있었어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    사람 쫒는게 여간 보통내기는 아니던데. (그런 말을 하며 미첼을 봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...이름이 뭐야?  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    \"아니 근데, 반장님 엄청 닮지 않았어?“ \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “반장님⋯ 숨겨둔 애라도 있으셨나?!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (인상 찌풀) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (시선 받으면 짧게 딸꾹질합니다. 주눅 든 모양새이긴 합니다만, 눈치 좀 보다가...) ...미첼, 호프라고 합니다... \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (헙. 말실수 했다. 시선 회피.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그, 그러니까, \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “에, 미첼 호프?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    닮긴 무슨... (이라고 하다가 미첼이라는 이름에 더욱 찌푸립니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....미첼? 호프? \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “오⋯ 스탠, 이 일본 도쿄에서 미첼 호프라는 이름을 가진 사람을 2명 이상 만날 수 있다고 생각해?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... (의자 등받이로 바짝 몸 기댄 채) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (ㅎ) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....전혀 아니지.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “끝내준다!! 내가 지금 만화 속 등장인물이라고?!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    내가 알기로는 한명 밖에 없긴해.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    알고보니 여기 코난이었냐...? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (무릎 세운 채로 몸 동그랗게 말아버립니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....너 몇살이야? \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “우와, 와아아⋯! 반장님, 어렸을 땐 엄청 소녀셨잖아!” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “학원제 때 여장 한번 당해봤을 거 같은 느낌~” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    야, 반장님이라고 그만해. 진짜 반장님인지 아닌지 아직 확인도 안됐는데.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (여장이라는 말에 다시금 자세히 들여다봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 기울여가면서요.) 어쩌면... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (고개 푹 파묻어버립니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “만화에서 꼭 그렇게 마지막까지 부정하는 녀석이 고생하더라.” (쯔쯧.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 그러니까, \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 말에 흥. 소리만 냅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    하굣길, 그, 방학이라서. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    집에, 가고 있었는데... (이 쯤에서 짧게 훌쩍이는 소리) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    정신을 차리니까 쓰러져 있었고, 그, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이상한 아저씨들이. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이 쯤해서 좀 더 바짝 몸 옹송그립니다.) ...... \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (조용히 듣고 있다가) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “헤비하라 씨, 스탠 씨⋯ 들어보신 적 있으십니까? 특이대책과⋯ 라는 특수 조직에 대해서.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “엥? 진짜 특이한 이름이 다 있네요.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(고개를 조용히 저으며 미첼을 좀 더 끌어안고 토닥입니다.)  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “경찰청 경비부에 편성된 특수 조직입니다. 인간을 상식을 초월한 기이한 사건을 담당하는 과죠.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그들은 그런 사건을 ‘특이’ 라고 칭하며 대처와 뒷정리를 하곤 합니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “필요하다면 희생도 마다하지 않는 이들이라고 들었습니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “아마도 형사부가 공식적으로 움직일 수 없게 만든 것도 그들이겠죠.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[특이대책과]</div><div>특이대책과(통칭 “특이과”)는 일본 경찰청 경비부에서 편성한 특수 조직이다. 그들은 인간이 아닌 초자연적 존재인 “에모크로아”를 ‘특이’ 라고 부르며 이들이 일으키는 사건을 담당하는 특이 전문 특수작전부대다. 그들은 남모르게 특이 사건의 대처와 처리를 수행하며, 필요하다면 희생도 마다하지 않는다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그럼 반장님도 그 일과 연관되었던 걸까? 반장님이 사라진 자리에서 애가 나타나고, 그리고 특수 대책과가 쫒았다면...  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (히끅, 히끅하는 소리가 잠시 더) ...오오가미라고, 그렇게 말한 아저씨가, 잡아가려고 해서, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    도망치려고 했는데, \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “오오가미, 라⋯ 한번 알아보겠습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    했는데...? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (애가 울면서도 기특하게 그걸 다 봤네... 미첼 호프긴 하구나.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......총에 맞았어요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 저 보내지 마세요. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “⋯괜찮습니다, 안심해주세요.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...아저씨들 무서운 사람들 아냐.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    형사부 수사 1과 사람들이니까. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너, 수사 1과 알아?  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “낯선 곳에 오셔서 당황하셨겠지만, 현재 집으로 돌아가신다고 하더라도 가족분들이 위험해질 수도 있습니다. 그러니⋯ 당분간은 저희와 함께 있어주시길 부탁드립니다.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “반장님 본가가 그대로 있긴 한가?” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (핑핑 시선이 돌아갑니다. 그러니까, 이 사람들은 경찰이고... 뭔가 나를 아는 것처럼 얘기를 하고.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    글쎄... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혹시 집 주소 기억하니...? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ... ...세타가야구 세이죠 3쵸메 쪽이에요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...반장님 주손데? \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “헤에⋯ 근데 뭐, 지금 데리고 가봤자 반장님네 부모님들은 쓰러지실 수도 있으니까 힘들지.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    근데 지금은 혼자 사시... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ..... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (입을 다뭅니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “일단 근처 호텔로 향하겠습니다. 그곳에서 잠시 하루동안 머무시고⋯⋯” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “헤비하라 씨와 스탠 씨가 같이 호위로 있어주셨으면 좋겠습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕입니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “넵!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    근데... 외람되지만. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    우리 팀 해체 됐는데 경비 처리는 어떻게 하냐...? \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “⋯아, 일단 제 사비를 지출할테니 걱정 안하셔도 됩니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그건 나중에 반장님이 돌아오면 따로 이야기를 나누죠.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......저, 저도, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... (지갑 잃어버렸지...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (어쩐지 침울해집니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아! 어차피 반장님 때문에 나간 돈이니까,” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혼자 부담하기엔 곤란하지 않겠어요? 나중에 경비 처리 불가능하면 말씀하세요. 헤비하라랑 저랑 나누죠.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “잔뜩 쓰고 반장님한테 전~부! 청구해버리자.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ㅋ \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    나는 모르는 일이야.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (시선 구르다가...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    헤비하라, 네가 선두로 부탁한다.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아아, 그럼그럼. 나 그런 거 잘하지.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 저, 집에 가면 뭐라도 있을... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    있을 테니까요, (눈치 본다...) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “괜찮습니다, ⋯⋯” (잠시 호칭을 고민하다가) “걱정 하지 않으셔도 됩니다, 미첼 씨.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “어린아이는 어른에게 도움을 받으셔야 합니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....아니면 우리 집 비어있긴 한데. 집을 내놓긴 했는데 아직 안나가서.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “엥? 왜? 이사 가?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 집 관리하기 힘들어서. 기숙사로 들어가려고.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    호텔이 편하면 호텔로 가고.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “에엑⋯ 그 엄청 불편한 기숙사로?!” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “너 어디 아파? 죽을 병 걸렸어?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (인상 찌푸립니다.) 참나. 집에도 못들어가는데 기숙사라곤 들어가겠냐. 사람이랑 부대끼는 게 더 나아서 그래.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “기숙사면 경찰 관계자가 쉽게 들어올 수 있으니, 바깥을 이용하는 게 나을겁니다.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (절레절레) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    근처 비즈니스 호텔의 주차장에 도착합니다. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “잠시, 기다려주시겠습니까? 의사 지인을 불렀으니 가볍게 치료라도 하는 게 좋겠습니다.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “오, 불법 의사⋯⋯?!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “아, 아닙니다⋯!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ........ \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “지금 현재 휴가 중인데, 도쿄에 살고 있어서,” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (조금 진정이 됐나 싶습니다만, 그 말에는 또 놀란 기색을 하고)  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “의사 면허증도 이따 확인시켜드리겠습니다⋯” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕입니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    키리시마 씨 지인이라면야.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그, 그렇게까지는 안 하셔도, \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (등을 한번 꾹 눌러줍니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “어우;”  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아...!! \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아, 그럼 전 지금 흠⋯⋯” (이쪽도 호칭 고민) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (반장님을 이름으로 불러볼 기회가 지금밖에 없다는 걸 깨달음) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “미첼 옷이랑 저녁 좀 사오겠습니다!” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (입 꾹 다뭅니다... ... ... 약간 눈물이 맺힌 것 같긴 한데. 뭐. 괜찮겠,) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    헉, 네, 다, 다녀오세요... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    조심해서 다녀와.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “응~!” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (호칭을 좀 고민하다가) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그럼, 일단... (키리시마 쪽의 옷소매 잡습니다.) 형이랑 기다리고 있으면 되는 거죠? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (아까 눌린 게 제대로 아팠는지 스탠 쪽으로는 굳이...) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (부드럽게 미소 짓는다.) “네, 내일 제가 좀 더 알아보고 이 상황에 대해 설명해드리겠습니다.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    헤비하라가 간 지 얼마 안되어 급하게 커다란 구급 상자를 들고 차에서 내리는 이가 옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    의사 면허증까지 보여주고 적법한 절차라는 걸 설명한 의사 지인은,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마에게 '너 미쳤냐? 총 맞은 애를 왜 병원에 안 데리고 가고 나한테 치료 시킴?‘ 이라는 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    눈빛을 보내긴 했지만⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마가 본래 잘 말하지 않는 성격임을 잘 알고 있기 때문인지,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    적절한 조치를 취해줍니다. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그럼 스탠 씨, 저는 이만 가보겠습니다. 총을 맞은 차를 교환해야 하기도 하고, 정보를 모으러 가봐야 할 테니까요⋯⋯” (카드를 꺼내 건넨다.) “일단 이 카드로 몰아 쓰시고, 필요한 일이 있으면 마음껏 쓰셔도 괜찮습니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그리고⋯⋯ 그, ⋯ 내일, 반장님 집에 독단적인 수사지만, 조사하러 가보려고 하는데⋯ 같이 가보시겠습니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (카드를 받아듭니다.) 아, 모쪼록 신세가 많습니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네, 한번 확인을 해봐야겠네요.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 말엔 어쩐지 시선이 둘을 향합니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저도 갈래요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그러니까, 음, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...말씀하시던 그, 반장님이라는 분이... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...혹시 저라면요. (우물...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼에게 시선을 두고.) ...너인지는 모르겠지만, 으음.  (린도에게 시선이 옮겨갑니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네 집이니까 네가 더 잘 알겠지.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “네, 물론입니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “반장님이 미첼 씨, 본인이신지는 모르겠지만⋯ 그래도 무척 닮으신 건 사실이니까요.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “저 왔습니다!” (두 손 무겁게 들고 옴.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (음식의 양을 보고 잠시 갸웃⋯? 했다가) “그럼 전 가보겠습니다. 호텔 호수를 보내주시면, 내일 아침 데리러 오겠습니다.” (다시 차에 올라탄다.) \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] HP : 6 → 14 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (허락이 떨어지고 나면 그제야 조금 더 마음이 놓인 것 같은 표정을 합니다만, 어라.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...많아. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    타츠미, 발이 빠르네...  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    더 사오지 그랬어? (나눠 들겠다는 듯 손을 내밉니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “에, 얼마 안되는데? 옷도 섞여 있으니까.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “더 사오려고 했는데 슬슬 시간이 시간이라 맛집들이 전부 문 닫은 거 있지.” (정말 슬프다는 듯이 이야기하며 옷 봉투를 건넨다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (봉투를 들고는) 그건 정말 아쉬운데?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    얼른 들어가자. 피곤하겠다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    헤비하라의 쫑알거림을 들으면서 호텔 안으로 들어갑니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    침대 3개의 방으로 결제하고 먼저 몸부터 씻어 핏물을 빼냅니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    피로 젖다 못해 붉은색으로 염색 된 교복은 ⋯ 버려야겠네요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 와중에 상당히 따가워하다 못해 씻는 데 시간이 배로 걸렸을지도...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ... ... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    교복... (조금 울적해집니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “에이, 돌아가면 새로 맞춰!” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “피 묻은 교복 입고 돌아가면 더 큰일일걸?” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (데울 건 데우면서 음식 세팅을 테이블 위에다가 짝 깔아놓는다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (맛있는 음식들은 물론이고, 최근 유행하고 있는 음식들까지.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그래도요. (약간 삐죽대다가) ... ...? \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “맞아, 나는 헤비하라 타츠미. 타츠미 형이라고 불러, 미첼!”  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아, (그러고 보니 아직 이름을 제대로 몰랐네.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네엡. 타츠미 형. (좀 어색하긴 한 듯 시선이 이리저리 구릅니다...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (옆에서 음식 차리는 걸 거듭니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (오⋯⋯ 이거 재밌다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (저도 할게요, 하며 냉큼 거듭니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “다행히 이 근처에서 하는 텐동집이 아직 열었더라고! 그래서 냅다 사왔지. 맛집이니까 입맛에 어울릴 거야!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    타츠미는 도쿄 맛집은 전부 꿰고 있으니까.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “자자, 눅눅해지기 전에 먹어.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “에이, 그정도는 아니지만 어느정도는 알고 있지!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼에게 숟가락도 챙겨주고, 타츠미도 건네주고 자기도 앉아서 먹기 시작합니다.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그렇게까지 맛있다고? 뭐, 미첼 호프. 16세로부터 30이 넘어가는 시간까지도 딱히 음식에 큰 호오가 없는 타입이었으므로...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    잘 먹겠습니다. (꾸벅, 인사하곤) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “어렸을 때부터 맛있는 걸 좀 먹이면 반장님도 여러가지를 다양하게 드시지 않을까.” (빤히 봄) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “그 완탕면 좀 그만 먹고 말이지⋯” (빠안) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그렇지만 그런 말이 무색하게 이 쪽의 미첼 호프도 늘상 짓는 표정-그러니까, 적당히 태연한 무표정-정도를 하고서 우물거리는 것 뿐이었습니다...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (두 입 쯤 먹다 시선 느끼곤) ......? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...아. (그 말에 미첼에게 시선이 옮겨갑니다.)  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “반장님 미각 검사 받게 해야하는 거 아니야?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    반장님 아니래두.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아, 으음. 뭐, 그래. 미첼.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... (꿀꺽,) 맛있어요. 타츠미 형. (눈 데굴...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....귀엽네.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “⋯그래! 다행이다!” (새우 완탕면이랑 동급이라고? 이게? 미묘⋯) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (전혀 다행인 것 같지 않아...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아니, 그 중국집도 그래도 맛집이라니까. 맛있었잖아! \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아니, 그건 맞지만!” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “반장님은 그 집 아니어도 완탕면 먹을 때 표정 똑같잖아!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    반장님은 원래 맨날 표정 똑같애.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “얼굴 근육 문제인가⋯” (심각) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    한 1픽셀 차이로 미묘하게 변한다니까.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아, 난 구분 무리. 난 모모쨩 선배나 네가 아니야.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 때쯤:늘상과 똑같은 표정으로 바삭... 바삭... 텐동 해치우고는 정리하다가. 움찔.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (대충 1픽셀보다는 조금 더 표정이 구깃...)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (으쓱) 봐. 놀리면 더 잘 변해.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “오⋯⋯ 난 지금은 구분할 수 있을 거 같아.” (1픽셀 이상이다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “애긴 애구나~”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (마저 뇸뇸...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......놀리지 마세요. (주섬주섬 쓰레기 버립니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (애지만 나랑 키가 비슷한 16살⋯) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (살짝 슬퍼짐.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (175는 씁쓸한 패배자의 기분으로 디저트를 먹었다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (ㅋ) 그러고보니까 등은 좀 괜찮아?  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (패배하지 않게 된 기분이 들었다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그렇대도 이 쪽이 확실히 좀 더 작다. 168cm-방금 정해진-의 16세. 메데타시. 메데타시.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    음, ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네, 형. (이름을 모른다는 걸 방금 알았습니다...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저기, 혹시 오늘 계셨던 분들은 다들 이름이, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...형이라고 불러도 괜찮으신... \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “아~ 당연히 괜찮지!” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “맞아, 아까 운전하던 형은 키리시마 린도, 라고 하는데 내일 린도 형이라고 불러봐. 반응 어떤지 보게.”  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (재밌겠당.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (제법 궁금한데?) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그런 거 컨텐츠가 될 정도냐고?) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (반장님 표정 변화 만들기랑 동급임.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    꼭 불러봐. 너랑 비슷한 과인데, 표정이 얼마나 변하는지 좀 보자.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “자, 그럼 슬슬 정리하고 누울까! 내일도 키리시마 선배님 보면 분명 아침 일찍부터 움직이려고 하실걸.” (벌서부터 피곤하다는 듯이 하품하며 싹 깔끔하게 정리한다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네엡. (어쩐지 흘겨보듯 하다가 저도 마저 정리합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (주변 정리합니다.) 그래.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그리고 정리가 얼추 끝날 때쯤이면... 스탠 쪽으로 다가와서는) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 혹시... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...형은 뭐라고 부르면 돼요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... 그냥 형이라고 불러.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그러니까, 이름이 뭐냐고요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (어조에 정리하던 손이 멈추고 미첼을 그제서야 봅니다. 어릴때도 성깔이 좀 있네...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    스탠.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    보통은 그냥 형이라고 불러.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (아직도 반장님이랑 싸웠나? 절레절레 하면서 침대로 기어들어간다) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네에. 스탠 형. (보란 듯 부르고는 저도 제 몫의 침대로 가 버립니다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (와, 반장님 성깔 죽이네.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (일찍 자자고 했지만 새나라의 어른이 헤비하라는 일찍 자지 않고 인X타 릴스를 킨다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (입술 한번 찡그리고는 남은 침대에 눕습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (새나라의... 음... 옛나라의 가짜 어린이. 스마트폰 따위 있을 리가요. 바르게 누워서 정자로 이불 덮고는 눈 감습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ... (색, 색 하는 숨소리가 얼마 지나지 않아 일정해집니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    21년 12월 28일 오전 9시. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    방 문을 두드리는 소리가 들립니다. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “좋은 아침입니다. 키리시마 린도입니다.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (릴스보다가 새벽 2시에 잠든 뱀은 기어다닌다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (한편, 많은 일을 겪은 짭 반장님도 제정신을 아직 못 차렸습니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (... 눈을 겨우 뜨고 비척비척 걸어서 방문을 엽니다.)  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “흐아아아암⋯⋯” (씻으러 간다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    음..... (끙, 조금 뒤척이다가) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    좋은 아침입니다.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (눈 깜빡⋯) “좋은 아침입니다. 스탠 씨.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    좀 늦게 일어났네요. 준비가 늦어서 미안해요.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “괜찮습니다. 천천히 준비하시죠.” (가져온 짐에서 서류를 꺼내 테이블 위에 정리한다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (대강 대화를 나눴을 때쯤 해서 겨우 안경 쓰고는 정신 차립니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    어, ...... \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “푹 주무셨습니까, 미첼 씨.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    언제 오셨, (끙, 마른세수 몇 번 쯤 더 하고는) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (대충 머리 쓸어넘기고, 테이블 앞에 앉아서 서류를 살핍니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    좋은 아침입니다... 덕분에 잘 잤어요. (고개 꾸벅 숙여 인사합니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “다행입니다.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (비척비척⋯) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (자리에 앉는다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “특이대책과에 대해서 알 수 있는 정보는 없었습니다만,” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “어제 이야기 했던 오타구 하기나카에서 발생한 분신 사건, 그 최초 목격자의 진술 현장에 경찰청 경비부 소속 남자가 동석해 있었다고 합니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그럼 그새 허겁지겁 세수도 하고 나와선 머리 끈으로 묶으며 가만가만 듣습니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “오오가미 아야토⋯ 미첼 씨, 괴로운 기억을 떠올리게 할 지도 모르지만 이걸 봐주시겠습니까?” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 이름에는 움찔, 몸이 잠시 굳어 버리긴 합니다만...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    키리시마가 내민 서류에는 증명 사진이 인쇄 되어 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어제, 골목길에서 마주쳤던 오오가미라 자칭한 남자의 얼굴입니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......맞아요. 같은 사람. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “확인, 감사합니다. 이 오오가미라는 인물은 알아보니 특이대책과 소속이 맞았습니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “관할 밖의 사건에 얼굴을 비친다는 건 이게 반장님의 사건과 무관하지 않음을 알리는 거겠죠.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “준비 되셨으면 슬슬 반장님의 집으로 이동하시죠.” \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “넵!”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    10분만 주시면 금방 따라나갈게요.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그럼 주차장에서 기다리고 있겠습니다.”  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그럼...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    스탠 형하고 같이 내려갈게요. (이 쪽도 준비 덜 됐네요.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (참나.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고집하고는.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “그럼 먼저 나간다~” (쓰레기들고 나간다. 분리수거 하러 가기~) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    응, 금방 내려갈게.  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    “어야.”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 먼저 들어가서 씻어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    필요한 거 있으면 말하고.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (잠시 당신 빤히 바라봤다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네엡. (군말하지 않고 먼저 옷가지 따위 챙겨서는 자리를 비웁니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 사이에 세수도 하고요. 대충 멀끔하게 합니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그리고 얼마간의 시간이 지나고 나면) 다 씻었어요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (말끔한 차림새를 하고서는 나오덥니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (세면대 가리키고는) 칫솔이랑 치약은 저쪽에 있어. (그리고는 들어가서 빠르게 씻고 나옵니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (칫솔 입에 물고는 다시 머리 단정하게 정리합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그리고는 대충 머리 수건으로 말리고는 짐 챙기고.) 오늘 괜찮겠어? 무리하는 거 아냐?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (신발만 신으면 멀쩡한 학생다운 모습.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    괜찮아요, ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (음, 괜찮지는 않은데...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    무리하는 건 아니에요. (이것은 제법 습관적인 대답이겠습니다.) 가만히 있는 게 더 싫어서. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....보통 애들은 겁에 엄청 질려있는데. 용감하네.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    준비 다 됐으면 나가자.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (먼저 문열고 나가서 문 잡고 기다려줍니다.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (고개 한 번 끄덕이고는 단화 챙겨 신습니다. 열린 문 사이로 나와서는) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (당신이 먼저 걸음 옮길 때까지 잠시 기다리는 듯...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (문 닫고 미첼의 어깨에 가볍게 손 올리고 주차장으로 내려갑니다.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    주차장으로 내려가면, 주차되어 있는 키리시마가 새로 가져온 차를 타고 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    반장의 집으로 이동합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어제까지 내리던 눈은 그치고, 회색 먹구름만이 가득한 하늘을 바라보면서. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ⋯평일 아침, 대부분이 출근해서 조용한 멘션입니다. \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “⋯딱히 이러려고 외워둔 건 아니었는데 말입니다.” \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (1층 로비의 비밀번호를 누른다.)  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “⋯굳이 변명을 한다면, 제가 외운 게 아니라 사토시가 외운겁니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 모습 보다가) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    사토시는 누구에요? (제 집의 번호를 다른 사람이 누르는 걸 보는 건 꽤 신기한 기분...) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “반장님을 무척 좋아하는 제 친구입니다. 같은 동료죠.\" \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    발랄하고 성실한 친구야.  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “그땐 그런 걸 왜 외우냐고 혼내기도 했는데, ⋯뭐, 이런 식으로 도움이 되긴 하는군요.”  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “우쭐거릴 테니 비밀로 해주세요.”  \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    (안으로 들어가 엘리베이터를 타고 올라간다.) \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (우쭐 거릴 사토시 형 생각함.)  \n  "},{"y":"say","sp":"헤비하라 타츠미","ts":null,"tab":"main","html":"\n    (음⋯ 끄덕. 재수없음.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네에. 린도 형. (얌전히 따라가 탑니다.) \n  "},{"y":"say","sp":"키리시마 린도","ts":null,"tab":"main","html":"\n    “네?”  \n  "},{"y":"say","sp":"스탠
