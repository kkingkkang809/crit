:"\n    “흠⋯⋯ 그러고보니, 아니?” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “근데 원래도 좀⋯ 밤에 주로 활동하는 애라서, 자주 보진 못했는데⋯⋯” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “그러네, 이 일주일 사이엔 너무 못 봤지⋯?” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “봤으면 따끔하게 혼을 냈을 텐데!” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    204호실 문, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    열고 들어가볼까요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이번엔 제가 형 쪽을 콕. 찌릅니다. 일단 저희끼리만 들어가보는게 좋을 것 같아요. 소근소근...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그럼 미첼 쪽을 보고 고개를 끄덕입니다. 그리고는 토시에에게 가볍게 목례로.) 자세히 알려주셔서 감사합니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    204호 일은 저희가 처리해볼게요.  \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “으응, 그래.” (궁금한지 빤히 쳐다보기는 하지만) \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    (끼기 힘든 분위기다보니 슬금슬금 다시 집으로 들어간다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (시간 내 주셔서 감사합니다, 하는 말과 함께 예의바르게 고개 숙였습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그럼... 저희도. 들어가볼까요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    가볼까.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (문쪽으로 가서… ….) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 내가 먼저 들어가볼테니까 넌 거기에 있어봐. 들어오라고 하면 그때 들어와. 알겠지? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (형 쪽 한 차례 바라봤다가.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    현관에서 뒤돌아서 서있을게요. (나름의 타협안.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (…같이 빤히 봤다가.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고집 참…) 아니. 잠깐만 거기 있어봐. 뭐 있으면 대충 처리해놓고 부를테니까.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    5분내로 부를게. 어때? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    … 2분.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (삐죽.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네에. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (머리 한번 헤집어주고는 문 열고 사슴발 걸어두고 들어갑니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    204호실의 문을 열자마자 시체 썩은내가 풍깁니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어둠에 휩싸인 방에 빛이 비치는 순간 바로,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    게로 토코로 추정되는 여성이 현관에 쓰러져 있는 걸 발견합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (역시..)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    조사 가능: 시신 / 방 전체 / 훼손된 가구 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (시신을 먼저 살펴봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    붉은 옷을 입은 게로 토코의 몸은 진작에 차갑게 식었습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    손목에는 눈 모양을 한 기묘한 문신이 새겨져 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지식&gt; 혹은 &lt;의술&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=4 &lt;✽ 지식&gt; (1DM&lt;=4) ＞ [1] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    게로 토코의 하얀 피부에는 구타로 인한 멍과 베인 상처가 가득합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    베인 상처는 치명상 까지는 아니고, 오로지 고통을 주기 위함입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    여러 명이 죽을 때까지 폭행을 저지른 듯 합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    시신 조사 완료. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (… 주변 쓱 둘러보다가… 손수건을 꺼내 얼굴에 덮어둡니다. 마땅한 게 없으니 어쩔 수 없지…) 미첼, 와도 돼!   \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (한편 미첼, 현관 밖에서 손 꿈질거리다가) 네에. (하고는 문 열고 들어섭니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    엇, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼 시야 앞을 바로 가려줍니다.) 안쪽으로 들어갈까?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (약간 삐걱거립니다. 그야, 예상은 했지만 실물로 보게 되는 것은 또 다른 일이라... 짧게 침 삼키고는 고개 끄덕입니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (몸으로 대충 가리면서 안쪽으로 들여보냅니다.) 폭행당한 게 맞는 것 같아. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    현관과 이어진 부엌을 지나 들어가면 원룸 형태의 방이 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    방 전체를 둘러보자면, 전부 뒤집어 엎어놓은 듯 엉망입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    바닥에는 신발을 신고 들어왔는지 발자국이 그대로 남아있네요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지각&gt; 혹은 &lt;관찰안&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이거야 원, 현장 훼손을 그대로…)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=5 &lt;✽ 지각&gt; (1DM&lt;=5) ＞ [6] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (너무 어질러져서 아무것도 안보여) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그 때 흰색 왜건을 탄 사람들이 왔다고 했으니까... (방 안까지 들어옵니다. 주변의 것들 유심히 살펴봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    3DM&lt;=6 &lt;관찰안&gt; (3DM&lt;=6) ＞ [5, 5, 8] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    테이블 위에 메모지 한 장이 놓여 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    피로 적은 듯한 붉은 글씨, 「배교자에게 죽음을」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    방 전체 조사 완료. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (메모지 떼어내서는 스탠 옷소매 잡아당깁니다.) 형, 이거요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (메모지를 같이 들여다봅니다.) 눈썰미가 좋네.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    역시 복수 당했나본데.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그렇죠...... (배교자, 배교자, 음...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아마, 이건 5시 이후에 일어난 사건일테고…  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이 이후로 그 세 명이 이케가미로 향한 걸까요? (뭔가, 단서가 될 만한 게 더 있었으면 좋겠는데.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (주변에 널려 있는 가구 더미로 시선이 향하는 것은 당연한 일일 텝니다...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그게 맞는 흐름이겠네.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    책장에서 꺼내진 책 더미 하나가 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    패션 잡지나 미용 잡지, 대학 수업에서 사용할 법한 책들이 방치 되어 있는 가운데 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    참고서에 삐죽 나와있는 종이 한 장을 발견합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[게로 토코의 고백]</div><div>나는 붉은 눈이라는 신흥 종교 단체에 속해있다. 붉은 눈이 내세우는 ‘더 나은 일본을 만든다’는 사상 아래, 비인도적인 행위를 수없이 해왔다. 교주님의 말씀에 따라 전직 신주 살해 계획에 가담한 결과, 교단이 손에 넣은 저주받은 불상은 일본을 더 나은 나라로 이끄는 게 아니었다. 그건 일본을 멸망시키는 죽음, 그 자체다. 12월 20일, 오타구 이케가미의 뒷골목에서 저주받은 불상의 인계가 이루어진다. 아마도 그 후 오타구 로쿠고의 옛 공장터에 세워진 교단 시설에서 저주받은 불상의 힘을 끌어내기 위해 재탄생 의식을 거행할 듯 하다. 그리고 다가오는 12월 31일, 저주는 현세에 되살아나 일본을, 세계를 종말로 이끌 것이다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    고서를 읽은 사람들을 모두 살해하는 것 같네…  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼 옆에 가서 같이 봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (내용 읽으면서 우뚝 굳습니다.) 20일, 뒷골목이면... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    반장이 납치된 날이죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    게로 토코에게 이 사실을 알고 뒷골목에 갔다가 납치당했다⋯⋯ 면, 모든 행적이 이해가 갑니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    뒷골목이 왜? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    뭐라고 적혀 있길래…  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (약간 머뭇거리다가, 종이 내밀어 줍니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (들고 읽어봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......아마, (잠깐 고민하다가) 반장님이라는 분은 이 관련해서 사건을 조사 중이셨나봐요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (오늘 몇일이지? 시계를 확인해봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    29일입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그런 것 같네.… ….특이대책과에 관련해서 같이 공조 수사하고 있었던건가. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이곳에서 살펴 볼 수 있는 건 전부 살펴본 듯 합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아직 시간은 남아있으니까, 좀더 알아보고 대비를 해야할 것 같네.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    203호실 여자가 더 시끄럽게 굴기 전에 다른 곳으로 가볼까요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 이제 하기나카, 카마타. 이상 현상이 발생했거나... 이하의 세 남자와 관련된 일이 발생한 곳.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저어, 분명 카레 가게에서 직원 분이 카마타에서도 사건이 생겼었다고 하셨었죠? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그 쪽이 마음에 걸려서요... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    마침 가는 길목이니 카마타로 먼저 향할까.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (고개 끄덕입니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구 카마타. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구의 중심에 위치한 번화가인 만큼, 연말임에도 사람들이 많습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    12월 27일에 발생한 사고에 대해 알기 위해, 역무원실로 향하면 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    역무원 한 명이 나와 대응합니다. \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “안녕하세요, 카마타역 담당 카모 테츠히로라고 합니다. 27일 발생한 사고에 대해서 알고 싶으시다고요?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네, 협조에 감사드립니다. (가볍게 악수를 건넸다.) \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “솔직히 말해서 그 사건은 더 떠올리고 싶진 않지만⋯ 사건 해결에 필요하시다면 보여드려야겠죠.” (손을 뻗어 잡아 악수를 받은 뒤, 역무원실로 들어간다.) “따라오시죠.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼을 자연히 제 뒤로 하고) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕이고 따라갑니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 그 뒤를 따라 역무원실의 문을 닫고서 들어섭니다.) \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “이야기보다는 직접 감시카메라 영상을 보시는 게 빠르실겁니다. 잠시 기다려주시겠습니까?” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    카모가 자리에 앉아 영상을 찾고 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그의 책상은 깔끔하게 정리되어 있고, 서류함 옆에는 아이가 그린 듯한 그림이 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그림에는 서툰 손글씨로 “아빠, 항상 일하느라 힘들지? 사랑해!” 라고 적혀 있네요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (얌전히 서서 기다리다가) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (귀엽다. 시선이 어쩔 수 없이 그리로 향합니다...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아이가 있으신가봅니다. (힐끔 보고.) \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “아, 하하⋯ 네. 6살이 되는 아들이 있습니다.” \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “어릴 때부터 철도를 정말 좋아해서, 휴일에는 자주 함께 기차를 보러 가곤 하죠.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아하~ 한창 관심 많을 나이죠.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그때는 뭐 하나에 꽂혀서 막 외우고 다니잖아요.  \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “그쵸, 쏟아지는 질문 공세가 버겁기도 합니다.” (아이 이야기에 금방 신나서 이야기를 하다가) “그쪽 분은⋯ 동생이십니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 동생은 아니고요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    여기 제 조카거든요. 자제분 보단 10살 정도는 더 많지만요.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (고제야 고개 숙여 인사합니다.) 저희 삼촌 되세요... \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    \"방학일 텐데, 방학 숙제 겸 삼촌이랑 돌아다니는 건가요? 기특하군요.“ \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “아, 지금 재생할 영상이 아이가 보기엔 좀⋯ 잔인해서 말입니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아… 그런가요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그렇지만 혼자두긴 좀 그래서… \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (잠깐 나가 있어야 하나, 같은 생각 하다가...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼 눈 가려줍니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혹시 소리도 들리나요? \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “아뇨, 소리는 들리지 않습니다.” \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “그럼 재생하겠습니다.”  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... (이렇게까지는 안 해주셔도 되는데. 어쩐지 진짜 어린 애가 된 기분이라 얌전해집니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네, 부탁드립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    컴퓨터 모니터에서 감시 카메라 영상이 재생됩니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    12월 27일 17시 59분. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    승객을 태운 전철이 닫히려던 순간, 타는데 실패한 3명의 승객이 분노에 찬 표정으로 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    전철 문과 창문을 두드립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    주변 사람들은 그 기이한 무리를 피하듯 거리를 두고, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    역무원이 화면 밖에서 달려와 남성들을 말립니다. \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “이 세 사람을 잘 지켜봐주시길 바랍니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 무리인 모양이네.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕입니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그들이 잠시 진정하고 멈춰서자, 역무원들은 당황한 듯 보이다가도 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    뒤로 서서히 빠지기 시작합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그리고 전철이 출발하려고 할 때, 그들이 움직이기 시작합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    무릎을 꿇고, 참수형을 선고받은 죄수가 목을 내미는 것처럼⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    탑승장과 전철이 부딪히는 그 좁은 틈새로 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    머리를 비집어 넣더니,  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(눈살을 찌푸립니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    전철이 속도를 높이자마자 남성들의 두피가 벗겨지고 피와 살점이 쏟아지며 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    머리가 빙글, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    목 윗쪽이 순식간에 잘려 떨어집니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (…눈을 잠깐 감았다가 뜹니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 공명 판정 (강도 3 상승 1) / 공명 감정 우월감(욕망) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=3 &lt;공명 판정&gt; (2DM&lt;=3) ＞ [8, 10] ＞ -1 ＞ 성공 수 -1, 펌블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지각&gt; 혹은 &lt;관찰안&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=7 &lt;관찰안&gt; (2DM&lt;=7) ＞ [7, 7] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    사망한 3명의 피해자는 붉은 옷을 입고 목에 눈 문신이 새겨져 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그리고 영상의 시작 지점으로 다시 돌려보면, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    전철에 거의 마지막으로 아슬하게 탄 사람 중에, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼이 보입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    어? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(그 부분을 다급하게 확대해봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    골목길에서 만났던 더러워진 교복을 입고 있던 미첼의 모습입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[HO1(아이)의 행적 ③]</div><div>12월 27일, 17시 58분 경. 카마타역에서 이케가미 방면으로 향하는 전철에 승차하는 교복을 입은 HO1의 모습이 방범 카메라 영상에 포착됐다. 당황한 모습으로 전철에 승차하자, 다음 순간 문이 닫히기 시작했다. 이를 쫓아온 남성 3명은 분노에 찬 표정으로 전철 문과 창문을 때린 뒤, 그런 짓을 일으키고 사망했다. 역 구내에 설치된 다른 방범 카메라 영상을 찾아보니 HO1은 하기나카 방면에서 온 것으로 추정된다.</div>"},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 때쯤이면 스탠의 손 아래로 착실히 눈도 감고 있었습니다만...) 영상 끝났어요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ……. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    눈 떠도 돼요, 형? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 너… (말을 이으려다가… 주변에 다시 입을 다물고. 확대한 장면을 다시 돌려놓습니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (손도 치워주고요.) \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “그러고보니 형사님이 이렇게 자세히 살펴보시는 걸 보면⋯⋯ 예전에 오셨던 형사분 중에, 감시 카메라를 열심히 돌려보시던 분이 계셨습니다.” \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “이름이⋯ 오오가미 형사님이셨나.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오오가미는 27일날 감시 카메라를 보고, 바로 뒷골목으로 쫓아온 듯 합니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈을 떠도 되나, 같은 고민을 하면서 몇 초간 더 눈 감고 있다가...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그랬군요… \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이곳에 미첼 호프라는 형사는 안왔었나요?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그리고 미첼에게 눈 떠도 된다고 속삭입니다.) \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “네, 오셨던 형사분들의 이름을 모두 알진 못하지만⋯” \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “외국인 형사분은 없으셨습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그렇군요. … … 그러면 그 오오가미라는 형사 말입니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    돌려보면서 하신 말씀 같은 건 없었을까요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... (허락을 받고 나면 눈 몇 번 깜빡입니다. 들린 이름들에 괜히 기운이 죽었는지 스탠 뒤로 숨듯이 자리 옮깁니다.) \n  "},{"y":"say","sp":"카모 테츠히로","ts":null,"tab":"main","html":"\n    “붉은 눈이라던가⋯ 료멘스쿠나, 라고 하셨던 것 같습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (자주 들리네…) 알려주셔서 감사합니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이제 밤이니 슬슬 다시 숙소를 잡는 게 좋겠습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오늘은 다행히 예약 가능 목록에 평범한 비즈니스 호텔이 떠있네요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (기분이 꽤나 말랑해집니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n     \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    바깥에서 이야기를 더 하긴 어려우니, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    잡은 숙소 안으로 들어옵니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (숙소 근처에서 대충 맛있는 것도 사주고요… 한껏 말랑하게 만들어서 들어와서는…) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (아, 그전에. 올라오는 길에 트윈으로 바꾸는 것도 절대 잊지 않았습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그럼 숙소 안 보고 좀 더 물렁해집니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    먼저 씻으실래요? (제법 만족하는 중...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …(데스크 위에 집 올려놓다가.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너 아무데서나 그렇게 말하지 마.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저 뭐 이상한 말 했어요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …아니, 아니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그냥 알아둬…  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    … 그보다, 미첼. 할 얘기가 있는데… \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (뭐가 이상했던 거야? 잠깐 생각해보다가 대답이 반 박 늦습니다.) 아, 네. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (살짝 머뭇 거립니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너, 골목길에서 정신차린 게 맞아? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 말을 들으면 잠깐 동안 눈 깜빡입니다. 당신의 말뜻을 이해하는 데에는 시간이 조금 필요했거든요...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 뭔가 이상했어요...? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (어쩐지 눈치를 보듯 움츠러듭니다. 자신이 눈치채기로는 '아마도 자신의 행적을 발견했든 했을 것이다' 정도의 생각까지 닿습니다.) ......진짜에요... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 형한테 거짓말한 적 없어요... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(그 모습을 가만히 바라보다가) 알아.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …근데, 아까 역에서 보았던 CCTV에는 지하철에 올라탄 네 모습이 있었어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네가 한 말이 진짜라는 건 아는데, 혹시나 해서 뭔가 기억나는 건 더 없는지 물어본거야.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼 앞에 다가가서 미첼을 끌고 침대에 앉혀줍니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너한테 뭐라고 하려고 한 건 아니야….   \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저, 저, 진짜로, 그런 기억 없어요, (고개 도리도리 젓습니다. 변명하는 것처럼 보이면 어떡하지...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... (뭐라 더 웅얼거리던 것이 멈추고 나면 한참 말이 없다가.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...형이 안 무섭게 했으면 좋겠어요... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (고개 숙이고 웅얼거립니다.) 저, 저... 형한테 도움만 받고 있다는 것도 아는데, 그런데... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    형이 저 버리실까 봐 무서워요... (아마도 그 놈의 반장을 돌려주겠다던 말이 불안함으로 남았는지도...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    무슨, ….(그 말에 잠시 어벙한 얼굴을 했던 것도 같습니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …널, 널 내가 왜 버려. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저 버리지 마세요. (짧게 훌쩍입니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (더욱 당황해서 어쩔줄 모르다… …) 아니, 미안해.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …. 그, 어… 아이, (결국… 끌어안아서 토닥여줍니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (엉성하게 옷자락 잡곤 고개만 파묻습니다. 간간이 훌쩍이는 소리가 드물게 나긴 했네요.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......투정부려서 죄송해요. (입 꾹 다물어버립니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …..난 너 안버려.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (잠시간 말이 없다가, 한마디를 겨우 내뱉었다.) 반장님만큼이나… 너도 소중해.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너도 결국 미첼 호프니까.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    무섭게 해서 미안하다. 내가… 너한테 그렇게 보일 줄은 몰랐어. 나도 노력한다고 노력한건데… … … 맨날 어른들만 상대하다보니까 조금… 그랬나봐. 미안해.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......아까만, 그 때만 좀 무서웠었어요. 평소에는 안 그랬어요, (짧게 킁, 하는 소리 냅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그냥, 음, ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...당연히 제가 뒷 순서라고 생각했어요. (처음 본 애잖아요. 같은 말이 한참 변명하듯 튀어나오다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...내일도 일찍 일어나야 되니까. 잘래요. (멋쩍기도 하고, 이상하게 기분이 조금 좋아진 것도 같고...? 이상한 기분에 선택한 방법은 모르는 척 잠으로 회피하는 쪽이었습니다. 어이. 이거 맞냐고.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 말에 토닥이던 것을 멈추고 놓아줍니다.) … 그래, 내일도 바쁠테니까.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (잠깐 머뭇거리다가) …너는 항상 내 앞순서였어. 그러니까 너무 걱정하지마.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네가 만약에… 무슨 일이 생겨도 지켜줄테니까. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    … … 자라. (하고 잠깐 방을 나섭니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    세계 멸망이 언제 일어날 지 알고 있는 기분은 어떤가요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    세계 종말 D-1 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    12월 30일. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 7 → 8 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    처음으로 알게 된 정보의 시작, 하기나카로 이동할까요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (아침에 대충 챙겨주고는… 이동합니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (어쩐지 갈수록 아침 루틴이 깨지는 기분인데. 오늘도 어김없이 늦잠 잤습니다. 조금 부스스...하게 따라 이동합니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미첼 호프」<br>날이 지나갈 수록 당신의 존재가 ‘짙어지는’ 느낌을 받습니다. 이곳에 점점 익숙해져서 일까요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    분신 자살 사건이 발생한 주차장에 도착합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    현장 수사는 이미 끝난 지 오래됐으므로, 조서에 적혀 있던 장소로 가보면 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    콘크리트 바닥에 검게 그을린 자국이 남아있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지각&gt; 혹은 &lt;관찰안&gt; 판정 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    3DM&lt;=6 &lt;관찰안&gt; (3DM&lt;=6) ＞ [8, 7, 2] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=7 &lt;관찰안&gt; (2DM&lt;=7) ＞ [7, 8] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    주차장 가장자리를 바라보면 관리가 소홀했던 탓인지 갈색으로 변색된 잡초가 우거져 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    만약, 분신 자살을 한 사람들의 불길이 이 잡초까지 옮겨왔다면⋯⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이 주변 주택은, 불바다가 됐겠죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    공명 판정 (강도 3 상승 1) / 공명 감정: 공포(정념) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠은 근원 일치로 굴려주세요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (2+1)DM&lt;=3 &lt;공명 판정(근원 일치)&gt; (3DM&lt;=3) ＞ [6, 2, 9] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] ∞ 공명 : 2 → 3 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    8DM&lt;=3 &lt;공명 판정&gt; (8DM&lt;=3) ＞ [1, 5, 9, 9, 6, 10, 9, 2] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 8 → 9 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이 사건에 대해서 아는 주민을 찾아 이야기를 들어보는 게 좋겠습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이곳 주변의 주택만 가볍게 돌아볼까요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (으음, 어쩐지 속이 안 좋은 것 같습니다... 굳이 티내지는 않고요.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    형, 주변에 주택가가 많으니까... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아마 아실 만한 분도 계시지 않을까요, 사건... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕이고 미첼 어깨를 토닥입니다.) 미래의 수사 1과 반장답네. 한번 한바퀴 돌아보자.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    주택을 하나하나 둘러봅니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    소득 없이 이어지다가⋯ 거리의 마지막 주택,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그곳의 인터폰을 누르면 퉁명스러운 목소리가 들립니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    안녕하세요, 경시청에서 나왔습니다.  \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “하? 뭔 또 경찰이야.” \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “난 아는 거 다 말했다니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    하하, 귀찮게 해드려서 정말 죄송해요. 이번 한번만 더 부탁드려도 괜찮을까요…? \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “아씨⋯” (현관문이 아주 살짝 열린다.) “뭐, 빨리 말ㅎ⋯ 뭐야? 애새끼는 왜 데리고 다녀?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 제 조카입니다. 형사 맞고요… (경찰증도 내보입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (듣던 애새끼. 움찔... 하면서 조금 뒤로 물러섭니다.) \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    (눈을 가늘게 뜨고 경찰증을 노려보다가) \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “뭐, 그래서, 뭐 묻고 싶은데.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이번에 현장체험학습으로 같이 다니고 있거든요… (머쓱하게 볼을 긁고 해맑게 웃어보입니다.) \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “현장체험학습~~?? 허 참나⋯ 삼촌이 경찰이라 좋겠다?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (툭툭. 인사드려. 네 덕 좀 보자. ) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (마른침 한 번 삼키고는) 그으, 도와 주셔서 감사합니다... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저어, 최근 근처의 주차장에서 발생했던 분신 사건에 대해서 탐문 차... \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “하⋯ 역시 그거냐.” \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “붉은 옷을 입은 남자 3명이 너같은 꼬맹이 하나를 쫓고 있었어.” \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “그놈을 몰아세웠나 했더니, 갑자기 멍하니 서있다가 등유를 뒤집어쓰고 몸에 붙이더라니까?!” \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “그리고 걔네는 로쿠고 쪽에서 온 거 같았어.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    등유를요.  \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “그래. 진짜 갑자기 기세등등하던 놈들이 자살하니까 내가 얼마나 놀랐겠어?” \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “걔네가 그렇게 뒤지니까 그 쫓기던 애는 비틀거리면서 다른 곳으로 가더라.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[오타구 하기나카 분신 자살 사건 ④]</div><div>사망한 남성 3명은 모두 붉은 옷을 입고 있었다. 누군가를 쫓고 있는 듯 했으나, 남성들은 마치 시간이 멈춘 듯 주차장에서 꼼짝않고 서있다가 일제히 등유를 머리부터 뒤집어쓰고 스스로 몸에 불을 붙인 것으로 보인다. 남성들과 쫓기던 누군가는 로쿠고 방면에서 달려온 것으로 보인다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …정말 이상한 일이네요.   \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    우연이라고 보기엔…. …. 여러모로 충격이 정말 크셨겠습니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    다시 말씀해주셔서 감사해요.  \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    “그래, 나는 이만 정신적으로 쉬어야하니까 그만 가라.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 상황에 대한 장면을 그려 보다가, 흠칫 놀라서는 고개 도리도리 젓습니다. 이어지는 말소리에 급히 허리 숙여 인사하고) 그으, 도와 주셔서 감사합니다... \n  "},{"y":"say","sp":"카와베 미츠히로","ts":null,"tab":"main","html":"\n    (모범생 같은 행동에 짜증나서 미간을 찌푸리더니 쾅, 문을 닫는다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 소리에 또 움찔.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 모습에 미첼을 등을 가볍게 쓸어줍니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이걸로 미첼의 시작지는 로쿠고라는 게 밝혀졌습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아마도, 붉은 눈의 본거지도 그곳에 있겠죠. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …정황은 어찌됐는지는 모르겠지만, 네가 지하철을 타고 도망쳐 다녔다는 건 확실해졌네.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...왜 기억이 안 나는 걸까요? (입 우물거리다가, 고개 내젓습니다. 그래도 당신은 제 편을 들어주기로 했으니까...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …충격이 컸었을지도 모르지. 일단… 로쿠코로 갈까. (이쯤되면 그런 생각을 하고 마는 겁니다. 혹시…) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (괜히 옷소매 끝 잡았다가, 눈치 보면서 살그머니 손 잡습니다.) ...가요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구 로쿠고. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지진의 흔적이 확연히 드러나있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    공원의 나무들은 기울어져 있고 담장이 무너진 주택들이 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이곳에서 어디로 가야 붉은 눈이 있는 곳을 찾을 수 있을지 고민하던 찰나, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아기를 안은 30대 여성이 다가옵니다. \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “얘, 너⋯ 지난번에 봤던 애 맞지?” (미첼을 보고 말을 건다.) \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “저번에는 너무 놀라서 도와주지 못해서 미안해⋯ 크게 다칠까봐 걱정 됐는데, 경찰에 신고하고 나서 그 뒤로 연락이 안 와서⋯ 다행이다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 말에 미첼 쪽으로 시선이 옮겨갑니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (놀란 듯한 얼굴입니다. 그야, 전혀 처음 보는 사람이거든요... 제 기억을 맹신한다면 말입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저어, (음, 어... 말을 꺼내기는 했어도 영 뭐라 해야 할지 모르겠어서 눈만 굴리다가.) \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “기억이 안 난다는 얼굴이네⋯ 그야, 하도 어두운 밤이었으니까 그렇겠다.” \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “26일 밤에 네가 옛 공장터 쪽에서 뛰어오더니 밤에 급하게 집으로 돌아가는 나에게 도움을 요청했었어. 나도 아이가 아프다는 말에 집으로 가던 중이라서, 너를 돕지 못하고 보냈는데⋯” \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “그 뒤로 널 뒤쫓는 사람들이 있어서, 뒤늦게 경찰에 신고했거든.” \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “미안, 갑자기 말을 걸어서. 놀랐지?” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[HO1(아이)의 행적 ①]</div><div>12월 26일, 23시 10분 경. 오타구 로쿠고에서 옛 공장터 쪽에서 달려오는 HO1이 목격 되었다. 남성 3명에게 쫓기고 있던 HO1은 겁에 질린 채로 행인에게 도움을 청하고 있었던 것으로 보인다.</div>"},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아뇨, 아니에요...! (그 말에 되려 놀라서는 고개 젓습니다. 분명 유추한 사실으로는 제 근원지가 로쿠고의 어드메였을 것은 자명한 것. 오히려 이런 상대는 꽤나 기껍습니다. 그야 호의적으로 대해 오는 사람이잖아요.-이상한 검은 양복을 입은 아저씨들도 아니고-) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저어, ......... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    도와 주셔서 감사해요. (하고. 고개 꾸박 숙입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    덕분인지 지금은 이 쪽의 (이쯤에서 스탠 쪽 힐끔) 형사님께서 도와 주시고 계세요. \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “아! 죄송해요, 갑자기 아이에게 말을 걸어서 놀라셨죠.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 아닙니다. (가볍게 고개를 꾸벅 숙입니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    선의로 다가와주신 건데요. 신고해주신 덕분에 아이를 잘 보호할 수 있었어요.  \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “다행이에요.” \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    (아이가 칭얼거리면서 일어나면, 달래주면서 웃는다.) “덕분인지, 우리 아이도 무사해서.” \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “1일이 되면 1살이 된답니다~ 자, 아키미, 오빠들한테 인사할까?” (아이의 손을 잡아 미첼을 향해 흔든다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    다행이에요. 한창 귀여울 나이네요. (저절로 미소가 떠오릅니다.)   \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (귀엽다... 꾹. 말으로 뱉지는 않았습니다. 그러나 확연히 얼굴에 생동감이 도는 것이. 저도 멋쩍게 손 들어 인사합니다.) 안녕, 아키미. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...다행이에요. 안 아프고 건강해서. (앞으로도 아프지 말고 건강해야 해. 엄마 걱정시키지 말고. 하는 종알거림이 잠깐.) \n  "},{"y":"say","sp":"시라카와 마사미","ts":null,"tab":"main","html":"\n    “응, 너도 건강하렴. 그럼 난 이만 가볼게. 좋은 하루 보내렴.” (웃으면서 스탠에게 꾸벅 인사를 건네고 간다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    조심해서 들어가세요. (같이 꾸벅 인사합니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그렇게 멀어지는 뒷모습을 잠깐 바라보다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...생각보다 여기, 덜 무서워진 것 같아요. (중얼거리고는 스탠 옷소매 끝 익숙하게 잡습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    옛 공장터 쪽이라고 했으니까요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼 쪽 잠시 내려다봅니다.) 다행이네…  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (옷소매 잡힌 걸 잠시 신경쓰다 조심스레 물어봅니다.)…손 잡아줄까?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... (괜히 시선이 다른 쪽으로 구르고) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...네. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그러면 옷소매 잡힌 쪽 손을 익숙하게 끌어다 잡아줍니다.) 괜찮을거야. 그렇게 만들어줄게.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    자, 본거지가 어딘지 찾아볼까요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[수색 판정 ①]</div><div>공명자는 각자 1회씩 수색 판정을 수행할 수 있다. 성공하면 붉은 눈 교단의 시설을 찾을 수 있다. 수색 판정의 초기값은 1DM&lt;=1로 하지만, 판정을 수행하기 위해서는 본 사건과 관련된 3가지 수수께끼를 풀어야 하는 추리 페이즈가 주어진다. 진실을 밝혀낸 수수께끼 수에 비례하여 수색 판정의 성공 확률이 상승한다. 수색 판정에 두 사람 모두 실패한 경우, 시간이 경과한다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[수색 판정 ②]</div><div>진실을 밝혀내지 못함: 1DM&lt;=1</div><div>진실을 1개 밝혀냄: 1DM&lt;=3</div><div>진실을 2개 밝혀냄: 1DM&lt;=6</div><div>진실을 3개 밝혀냄: 1DM&lt;=9</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    첫번째 수수께끼 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미첼 호프(아이)가 이동한 경로는?」 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (시작점은 로쿠고. 그리고 곧장 도망쳐서...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (하기나카 - 카마타 역에서 이케가미 방면으로.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    정답. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    두번째 수수께끼 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미첼 호프(어른)가 이동한 경로는?」 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (제일 처음 오타구 내에서 방문하셨던 곳은 미나미마고메의 향토박물관. 그리고 순서대로 하네다, 주오, 이케가미.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    정답. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    세번째 수수께끼 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미첼 호프(어른)가 회수하라는 명령을 받은 것은?」 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (료멘스쿠나.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    정답. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    [1DM&lt;=9] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1DM&lt;=9 수색 판정 (1DM&lt;=9) ＞ [8] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=9 (1DM&lt;=9) ＞ [3] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구 로쿠고의 옛 공장터는 황량하고 쇠락해 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    한때는 수많은 사람들이 오가며 활기가 넘쳤을지도 모르지만, 지금은 그저 폐허. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    심지어 지진까지 일어났으니, 금방이라도 무너져 내릴 것만 같은 폐공장을 하나 발견합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미첼 호프」<br>당신은 이 폐공장을 방문한 적이 있을 뿐만 아니라, 27일 고요함에 휩싸인 어둠 속에서 느껴졌던<br>말할 수 없을 정도의 불안감을 이곳에서 다시 한 번 느낍니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼, 공명 판정 (강도 4 상승 1) / 공명 감정: 원한(정념) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    9DM&lt;=4 &lt;공명 판정&gt; (9DM&lt;=4) ＞ [6, 5, 10, 2, 7, 6, 1, 3, 4] ＞ 4 ＞ 성공 수 4, 미라클\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    극한 공명(하울링) 발생 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    [1D3] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1D3 (1D3) ＞ 3\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신의 존재는 점점 선명해져 가는데,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그게, 정말 ‘당신’인지는 의심스럽습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    세션 종료 시까지 자아와 끈기의 판정값을 -1. \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 9 → 10 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    두근⋯  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼, 당신은 홀리듯이⋯ 당신의 자아와 관계 없이,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    폐공장의 지하로 내려가는 계단으로 걸음을 옮깁니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (심장 고동 소리와 닮은, 단화의 굽이 철 계단을 일정하게 누르는 소리.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (쿵, 쿵, 쿵...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠이 그 뒤를 따르려고 하는 순간에,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    큰 소리와 함께 계단의 천장이 붕괴하며 둘을 갈라놓습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 당신은 미첼의 상태가 이상했음을 인지합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지상을 둘러보고 이 붕괴된 돌덩어리들을 처리할 방법을 찾아와야겠네요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (무너지는 돌 틈새로, 깊은 탄식을 흘립니다. 주변을 둘러봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    창밖으로 펼쳐진 회색 하늘은 두툼한 구름이 뒤덮고 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    눈이 내리기 전에, 뭐든 해결하고 돌아가야 할 텐데. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    작업장 전체를 한눈에 내려다볼 수 있는 위치에 있는 관리실을 발견합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(깊은 한숨을 쉬고 관리실 내로 들어갑니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (침착해. 성급할수록 돌아가야 하는 법이니까.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    안으로 들어가면, 비교적 먼지가 쌓인 실내에서 최근에 들어온 것으로 보이는 두 가지 물건을 찾습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ‘지하 창고’ 라는 태그가 붙은 녹슨 열쇠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그리고, 파일. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    읽어볼까요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[붉은 눈 교단의 기록 ①]</div><div>21년 12월 20일, 저주 받은 불상의 인계 완료. 12월 25일, 본 시설 내에서 예정대로 재탄생 의식을 거행한다. 재탄생 의식에는 붉은 눈 교단을 단독으로 쫓아다니던 미첼 호프를 사용한다. 재탄생 의식은 지하실에서 거행한다. 그때까지 미첼 호프는 지하 창고에 감금한다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[붉은 눈 교단의 기록 ③]</div><div>12월 25일, 재탄생의 의식은 차질 없이 진행되었다. 그러나 저주의 막강한 힘은 지진을 일으켜 본 시설 내의 설비에도 영향을 미쳤다. 사용된 미첼 호프의 육체는 지하 창고 내에 방치해뒀다. 12월 26일, 23시 정각. 우리는 본 시설을 포기하고 교단 본부로 저주 받은 아이를 이송하기로 했다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …(녹슨 열쇠를 챙겨 주머니에 대충 넣어두고, 담배를 하나 꼬나물고 피기 시작합니다. 그리고 파일을 읽어봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    위에서 내려다보니까, 폐자재들이 쌓여 있는 곳을 발견합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (… 가만히 읽어내려가다, 어쩐지 계속해서 의구심으로 남았던 물음표를 마침표로 고쳐씁니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그러니까, 어린 미첼 호프는… 그 오오가미 자식의 말대로.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 생각까지 닿고는 깊이 빨았다가 담배를 대충 바닥에 던져버리고 폐자재가 쌓여있는 곳 쪽으로 향합니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …그럴리가 없잖아.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그곳에서 쇠지렛대를 얻습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이게 있으면 돌덩이를 치우고 들어갈 수는 있겠죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    적막하기 짝이 없는 작업장, 당신의 휴대폰이 울립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    발신인은, 키리시마 린도. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (핸드폰을 대충 어깨에 끼우고 쇠지렛대로 돌덩이를 치우기 시작합니다.) 린도 씨, 무슨 일 있어요?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    풀려나신 겁니까?  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    들려오는 것은 안타깝게도, 키리시마 린도가 아니라. \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “미안하군, 찾던 인물이 아니라서.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “그래도 걱정하지 않아도 된다. 키리시마와 헤비하라 둘은 병원에 던져놨으니.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “이미 그렇게 들쑤시며 돌아다녔으면 알겠지만, 오늘이 료멘스쿠나가 깨어나는 날이다. 게다가, 이미 너네가 ‘꼬마’라고 알고 있는 것은 이미 선을 넘었어.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    … 관대하시네요. (그 목소리에 돌을 빼내려다 쇠지렛대는 지팡이 삼아 걸치고 전화를 제대로 받습니다. 이어지는 키리시마와 헤비하라의 무사하다는 사실에 그나마 안도감이 듭니다. ) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ……(잠깐 입가를 매만졌다가.) 선을 넘었다뇨. …아직은 이성이 있는 아이입니다. 저는 아직 무슨 말씀을 하시는지는 잘 모르겠습니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …원래 있던 곳으로 그냥 돌려보내주면 되는 거잖습니까.  \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “하! 언제까지 모른 척 하고 있을 셈이지? 그건 인간이 아니야, 네녀석의 반장의 기억과 모습을 탈취한 괴물이라고!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아니에요. 아닙니다. …아니에요. 설사 그렇다고 한들, 그 아이가… 미첼의 얼굴을 하고 있다는 건 변함이 없습니다.  \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “단도직입적으로 말하지. 그걸 죽여. 그러면 그 안에 갇힌 미첼 호프의 영혼이 빠져나와 원래의 몸으로 돌아갈 거다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ……..(남은 한손으로 마른 세수를 합니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (손을 올려 그대로 머리를 쓸어올리고. 소리 없이 큰 한숨을 내쉽니다.) ….제가 알아서 하겠습니다.  \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “그자식이 꼬마의 몸으로 살고 싶다고 기원한 것들이 전부 저주가 되었어.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “누군가가 행복을 바라면, 누군가는 불행해지지.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “너희가 무엇을 저질렀는지, 똑똑히 들어라.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오오가미가 휴대폰을 스피커로 바꾸더니,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    실시간 뉴스인 것만 같은 아나운서의 목소리를 들려줍니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「속보를 전해드립니다. 현재 오타구 각지에서 동시에 사건이 발생 중입니다.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「오타구 인근에 거주하시는 분들께서는 불필요한 외출을 자제해주시길 바랍니다. 피해 상황을 반복해서 전해 드립니다.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미나미마고메의 향토 박물관이 화재로 전소했습니다. 휴관중이어서 방문객은 없었으나, 관장으로 추정되는 남성 1명의 시신이 발견되었습니다. 오모리 상점가에 위치한 카레 전문점에서 폭발 사고가 발생했습니다. 다시 상점가는 연말 행사로 붐비고 있었으며, 다수의 사상자가 발생했습니다.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「카마타역에서 탈선 사고가 발생했습니다. 고속 전철이 역을 통과하던 중 탈선하여 탑승장에 충돌해 다수의 사상자가 발생했습니다. 하네다 신사에 대형 트럭이 돌진하는 사고가 발생했습니다. 이 사고로 신사의 신주인 미노 히로토 씨가 사망했습니다. 로쿠고의 주택가에서 화재가 발생했습니다. 현재도 소방대의 필사적인 진화 활동이 계속되고 있습니다. 이 화재로 시라카와 마사미 씨와 딸 아케미 씨가 사망했습니다.」 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….그만, 그만하세요. 알았으니까… (잇새에서 신음과 함께 쥐어짜낸 목소리가 흘러나옵니다.) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “그래, 네가 아직도 ‘경찰’이라면, 국가를 위하는 자라면, 어떤 결정을 내려야 할 지 알고 있을거라 믿는다.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    뚝. 전화가 끊깁니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[사건의 진실]</div><div>특이대에 소속된 오오가미 아야토는 료멘스쿠나인 미첼 호프(아이)를 쫓고 있었다. 미첼 호프의 피와 영혼, 그리고 료멘스쿠나의 신체와 고대인의 뼈를 바탕으로 만들어진 미첼 호프(아이)는 존재하는 것만으로도 저주를 퍼트리는 저주 받은 아이였다. 머지 않아 미첼 호프(아이) 속에 잠들어있는 료멘스쿠나가 각성하고, 세상은 멸망을 맞이하게 될거다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(전화를 그대로 땅바닥에 내팽겨칩니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (…그대로 주저 앉아 마른세수만 연신. ….그게 반장이든, 뭐든.) …행복이란 게 뭐라고 **… \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 당신은 지키고자 했던 이를 죽일 수 있나요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    영혼을 달라고, 그의 몸을 없애달라고 기원할 수 있나요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    결국, 당신이 바라는 사람을 되찾기 위해서는─ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ⋯ \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(다시금 담배를 찾아 물고, 떨려오는 손으로 라이터도 잘 켜지지 않아 몇번 켜려고 시도하다 둘다 그냥 바닥으로 내팽겨 칩니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼, 당신은 어두운 지하에서 눈을 뜹니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    옛 공장터에 도착한 건 기억하는데, 어느새 여기까지 왔죠? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠은⋯? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    손에는 어느새 쥐고 있었던 고장난 듯 깜빡이는 손전등뿐입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    조사 가능: 지하 창고 / 지하 작업장 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (깜빡, 깜빡...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (불빛을 따라 눈을 두어 번 깜빡입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (바닥을 딛는 소리를 내어 가며 일정한 걸음걸이로 창고 내부를 둘러봅니다...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지하 창고 문은 열리지 않지만, 문 옆에 설치된 작은 창문으로 안을 들여다볼 수는 있을 것 같습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    손전등을 비춰보며 안을 바라보면, ⋯⋯ ‘당신을 닮은 어른’이 바닥에 쓰러져 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    본능적으로 깨닫습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아, 저게⋯ 스탠이, 키리시마가, 헤비하라가 찾던 반장이라고. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하지만 숨을 쉬고 있지 않습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    죽었나? 하지만 외상은 없습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지하 창고 조사 완료. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... (그 모습을 가만히 응시합니다. 숨 한 번 쉬지 않고 미동하지 않는 모습. 그러니까, 저 쪽이 이 곳의 *진짜*...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (순간 고개를 휙 떼어냅니다. 더 이상 눈에 담기 싫은 듯, 도망치듯이 작업장으로.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    넓은 작업장입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하지만 누군가 모든 장비들을 외곽으로 밀어넣고, 중앙을 비워뒀습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ⋯아, 이곳의 분위기를 어쩐지 알 것 같습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ‘이곳’에 오기 전, 그날 밤의 길거리에서 느꼈던─ 묘한 불안감. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    방 중앙의 바닥에는 지름 2M에 달하는 범위로 알 수 없는 글자가 섞인 기이한 문양이 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    짙은 붉은색 페인트로 그려져 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그 중앙에는 뚜껑이 열린 상태인 검은 나무 상자가 놓여 있고 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    나무 상자에는 뚜껑이 열리지 않도록 바깥 쪽에 부적이 여러겹 붙어 있었던 것 같지만 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    전부 뜯겨져 나가있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    안쪽에는, 아무것도 없습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하지만, 이곳에 있던 물건을 당신은 ‘알고’ 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그날, 가로등에서 들렸던 웃음소리─ 저주불, 료멘스쿠나가. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    공명 판정 (강도 7 상승 1) / 공명 감정: 분노(정념) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    10DM&lt;=7 &lt;공명 판정&gt; (10DM&lt;=7) ＞ [2, 1, 7, 10, 4, 8, 8, 3, 3, 7] ＞ 7 ＞ 성공 수 7, 미라클\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    극한 공명(하울링) 발생 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    [1D3] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1D3 (1D3) ＞ 2\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] HP : 12 → 13 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    몸이 치유 됩니다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    툭, 하는 소리와 함께 구석에 치워져있던 장비 사이에 있던 시체가 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    바닥으로 쓰러집니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    붉은 옷을 입고 손목에 눈 문신이 새겨진 걸로 보아 붉은 눈 교단원⋯ 같습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    시체 옆에는 피로 젖은 서류 두 장과 휴대용 라디오가 하나 있습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (서류를 집어듭니다. 아까의 그 사람과 꼭 닮은 무표정으로 읽어내립니다...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[붉은 눈 교단원 기록 ②]</div><div>21년 12월 25일, 저주 받은 불상의 힘을 더욱 끌어내기 위해 재탄생 의식을 거행한다. 미첼 호프에게서 뽑아낸 피와 영혼, 그리고 고대인의 뼈를 료멘스쿠나의 신체로 주입한다. 그러나 막강한 저주의 힘이 폭주했다. 16살 미첼 호프의 육체와 정신이 남아있는 불완전한 저주 받은 아이가 태어났다. 저주 받은 아이는 제대로 된 의식을 되찾은 것 같진 않지만, 확실하게 자신이 16살 무렵의 미첼 호프라고 믿고 있는 듯 하다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[붉은 눈 교단원 기록 ④]</div><div>21년 12월 26일, 저주 받은 아이가 교단원들을 저주로 살해하고 도주했다. 그 후, 포획을 시도한 교단원들도 하기나카와 카마타에서 살해당했다. 나도 붓을 내려놓고, 이제부터 저주 받은 아이의 추적을 시작한다. 료멘스쿠나의 신체와 저주 받은 아이의 육체, 이 둘을 잇는 &lt;∞공명&gt; 레벨을 0으로 만들면, 저주 받은 아이의 육체와 정신은 소멸한다. 료멘스쿠나의 신체만 있다면 또 몇 번이고 다시 시작할 수 있다. 료멘스쿠나는 이동한 지역에 재앙을 불러오는 경이로운 저주불. 일본을, 세계를 종말로 이끌기 위해 반드시 그 저주불을.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    라디오에서 지지직, 노이즈가 흘러나오더니 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어떤 뉴스와 연결 된 듯, 아나운서의 목소리가 들립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「속보를 전해드립니다. 현재 오타구 각지에서 동시에 사건이 발생 중입니다.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「오타구 인근에 거주하시는 분들께서는 불필요한 외출을 자제해주시길 바랍니다. 피해 상황을 반복해서 전해 드립니다.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「미나미마고메의 향토 박물관이 화재로 전소했습니다. 휴관중이어서 방문객은 없었으나, 관장으로 추정되는 남성 1명의 시신이 발견되었습니다. 오모리 상점가에 위치한 카레 전문점에서 폭발 사고가 발생했습니다. 다시 상점가는 연말 행사로 붐비고 있었으며, 다수의 사상자가 발생했습니다.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「카마타역에서 탈선 사고가 발생했습니다. 고속 전철이 역을 통과하던 중 탈선하여 탑승장에 충돌해 다수의 사상자가 발생했습니다. 하네다 신사에 대형 트럭이 돌진하는 사고가 발생했습니다. 이 사고로 신사의 신주인 미노 히로토 씨가 사망했습니다. 로쿠고의 주택가에서 화재가 발생했습니다. 현재도 소방대의 필사적인 진화 활동이 계속되고 있습니다. 이 화재로 시라카와 마사미 씨와 딸 아케미 씨가 사망했습니다.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    타임 워프? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미래로 이동? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아, 얼마나 희망적인 결론들이었던가요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 스탠이 찾고 있던 미첼 호프의 외모와 기억을 찢어 안의 저주를 가려버린 껍데기의 존재. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신의 기원은 저주가 되며, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    저주는 누군가의 기원을 짓밟습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    손에 들고 있던 오마모리가 재가 되어 사라지는 걸 느낍니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......아, 없어졌다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면, 누군가의 행위를 그대로 옮겨쓴 듯이. 곤란하다는 듯이 손으로 입가를 쓸어내립니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지상과 지하를 막아뒀던 돌덩이가 무너져내리는 소리가 들립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 이 모든 사실을 알고도,   \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그에게로 향할 수 있습니까? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (손가락 아래로는 잠시 미소를 지었다가. 아무렇지 않은 듯한 무표정으로 되돌아옵니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (인제사 들어보니 과연 이것은 심장 뛰는 소리입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그야, 발걸음 하나 움직이지 않았는데도 쿵, 쿵, 뛰는 것은 제 심장이 아니고 무엇일 수 있겠습니까...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......지금 '진짜'로 살아있는 건 내 쪽이지? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ‘진짜’로 살아있는 건 료멘스쿠나인 당신입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그리고 당신은 스탠을, 이 세계를 당신의 손으로 직접 죽일 운명이죠. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그렇다면:자신은 감히 본성대로 행복을 기원한다. 살고 싶은 것은 나의 기원, 태고의 목적.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    살고자 하는 이가 있다면 죽이려는 자가 있는 것이 세계의 이치,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그것이 인과. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    분명 당신을 없애기 위해서, 스탠도 기이한 힘을 깨달았을 테죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이 세상이란 그럴테니까. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (인과의 무게는 내게 있지 않다. 그저 나는 불리워진 대로 났을 뿐이기 때문이다. 그러니 여전한 겉껍질을 뒤집어쓴 채로 이 세계의 마지막 생명을 나누어 가지러 가자...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (약속했으니까. 제 편이 되어 주기로.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그건 *인간*인 미첼 호프에게 했던 약속이지만요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 당신은 돌덩이를 모두 치워내고 지하 계단에 발을 내딛습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    입에서는 하얀 숨결이 새어나오고, 창문으로 스며드는 차가운 공기가 뺨을 스칩니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    회색 하늘에서, 하얀색 눈이 내리기 시작합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    눈의 하얀색과 어둠의 검은색이 뒤섞인 공간. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그곳에서 당신들은 다시 재회합니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (마주하는 얼굴은, 그 때와 같은 것. 겨우 드러나는 안도감. 약간의 불안함...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (짧게 한숨 내쉬고는) 형... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    안, 안 다치셨죠... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 모습을 잠시간 바라보다가, 입술을 꾸욱 눌렀다가 바싹 마른 입가를 적셨다가… 입을 다물고는… )   \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (…천천히 다가가서 끌어안았다.) 괜찮아?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (얌전히 잦아드는 반응. 품 속에 안긴 채로 가볍게 고개 끄덕입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    죄송해요, 멋대로 굴었어요... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …어쩔 수 없었던 거잖아. 괜찮아. (그렇게 말하며 미첼의 머리를 연신 쓰다듬었다. 지금 내가 안고 있는 것이 미첼의 탈을 쓴 괴물이라 할지라도, 나는 너와 닮은 사람을 수없이 봐왔어.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 있잖아. …반장님을 찾았니? (최대한 다정한 목소리를 내려 애썼다. 목 안에서 차오르는 무언가를 삼키면서.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 당시의 너도 이런 기분이었을까?) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... (시선이 잠시 위로 구른다. 무엇인가 가늠하듯이 찰나의 시간을 흘려보낸다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러나 이어지는 것은 순순한 말소리입니다.) 지하 창고 안에서요... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    숨을 쉬지 않고 있으셨어요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그리고 이어지는 말.) 형. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    돌려받고 싶으세요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …(고개를 순순히 끄덕입니다.) 미안해.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저는요, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...소중하다고 해 주셨잖아요... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    소중하지. 많이 소중하지….  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그런데 말이야… 내가 전해야할 말이 있거든.  …약속 못지켜서 미안해.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …미첼, 집에 가야지. 이제.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (명명은 어떠한 기원과도 같다. 그러니 당신은 이 곳에서도 나에게 그 역할을 부여한 것. 걸맞은 행위를 하길 *기원*한 것과도 같다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (나 혼자의 기원은 저주가 되나, 당신이 함께 소원함으로서 비로소 기원이 된다...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......형이 찾던 그 사람을 똑같이 흉내냈으니까요. 저는. 그러니까 아마도 이렇게 대답해야겠죠... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    돌아가야 한다는 걸 알아요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이 곳의 사람이 불러냈으니, 귀향하는 것도 이 곳의 사람이 해야죠. (쿵, 쿵, 여전히 박동하는 심장 소리를 한참 전하다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (당신을 밀어냅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (순순히 밀려납니다. 밀려나는 와중, 작게 고맙다는 말을 속삭였던 것도 같습니다.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (바스러져 재가 되어버린 오마모리의 가루를 허공에 흩어 버립니다.) 자... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    *기원*하세요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저의 기원이 당신들에게 저주가 되었듯, 당신의 기원도 저에게는 저주가 될 테니까. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ─하지만, 이제 껍데기인 당신의 의지는 이어질 수 없습니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …가는 길에 손 잡아주지 못해서 미안해. 매번.   \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    격렬한 현기증, 위액이 역류하는 듯한 구토감, 귀가 찢어질 듯한 이명, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    저주불을 만드는데 희생당한 아이들의 목소리가 겹치면서 누군가의 목소리를 만들어냅니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하 지 못 한 다 아 무 것 도 결 정 하 지 못 한 다 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    멸 망 하 라 일 본 멸 망 하 라 세 계 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼의 오른손이 자신의 의지와는 반대로 천천히 움직이며,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    눈앞에 서있는 스탠을 가리키면 미첼의 입이 열리면서 나오는 단어란, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「죽어.」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, &lt;✽ 운동&gt; 혹은 &lt;곡예&gt; 혹은 &lt;위기 감지&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    3DM&lt;=8 &lt;위기 감지&gt; (3DM&lt;=8) ＞ [1, 10, 7] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 날카로운 소리를 내며 떨어지는 천장의 철골을 피하는데 성공합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    껍데기를 완전히 지배한 것, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    일본을 저주하는 것, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    눈 앞에 있는 모든 것을 저주하는 것, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    료멘스쿠나가 당신의 앞에 섭니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 이제부터 ‘그’를 집으로 돌려보내기 위해, ‘반장’의 영혼을 되찾기 위해 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    기원해야 합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    전투 시작. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    《 1라운드 》 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그저 료멘스쿠나에게 빼앗겼을 뿐인, 만들어진 인격일 뿐인, 껍데기인 ‘미첼’인 당신. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 스탠과 같은 기원을 품고 있습니까? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그에게, ‘미첼’을 돌려줄 건가요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (대답은 아우성으로 먹혀들어간다. 무수한 원과 한은 자리한다. 우리는 갈 곳에서 버려졌으므로 돌아간다는 행위에서 박탈당했노라고.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러므로, 껍데기의 뜻은 묻힌다. 이것이 저 남자에게 보다 나은 결론일 테다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    저주받은 육체의 몸 안에 당신을 미첼이라 명명하는 영혼이 숨어 있음을 알고 있지만 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 그것을 무시합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    ‘진짜’가 되지 못하는데, 어째서 ‘진짜’를 도와야 하는가. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    존재를 부정당한 당신은 아무런 대답을 내지 못합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    료멘스쿠나, [1D3] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1D3 (1D3) ＞ 2\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;저주: 재앙&gt; 판정 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1DM&lt;=6 &lt;저주: 재앙&gt; [성공 수]D6 대미지 (1DM&lt;=6) ＞ [7] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 당신은 눈 앞에서 꺼져가는 껍데기의 의지를 확인합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그럼에도 당신은 저 안의 영혼을 읽어냅니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신이 찾고 싶은 것 찾아냅니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아직 말하지 못 한 말이 있잖아요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그에게 삶을 되돌려줍시다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, &lt;기원&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=4 &lt;기원&gt; (2DM&lt;=4) ＞ [5, 1] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    기원이라는 건 참, 허상에 가까운 말이 아닌가 싶습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    운명을 바꾸는 건 결국 신이 아니라, 인간인데 말이죠. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (내가 어떻게 돌려받은 것인데, 이렇게 잃을 수는 없지.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그럼에도 당신은 기원하는 말을 엮어나가기 시작합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    저주 받은 운명 속에서 그를 구하기 위하여. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, [2D4] \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2d4 (2D4) ＞ 6[2,4] ＞ 6\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 공명 판정 (강도 5 상승 1D2) / 공명 감정: 정의(이상) \n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 10 → 4 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    3DM&lt;=3 &lt;공명 판정&gt; (3DM&lt;=3) ＞ [8, 2, 3] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, [1D2] \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1d2 (1D2) ＞ 2\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 스탠 리 ] ∞ 공명 : 3 → 5 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    기원은, 결국 저주와도 같은 것. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신이 기원하면, 그만큼 당신도 괴물이 되어 가는 겁니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    《 2라운드 》 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    료멘스쿠나, [1D3] \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1D3 (1D3) ＞ 3\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;저주: 질병&gt; 판정 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    2DM&lt;=5 &lt;저주: 질병&gt; [성공 수]D3 대미지 (2DM&lt;=5) ＞ [3, 1] ＞ 3 ＞ 성공 수 3, 트리플\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 당신의 몸 안에서 위액이 역류하는 듯한 불쾌감이 덮쳐옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    사지가 저리고, 시야가 흐려지며 숨 쉬는 게 힘들어지는 상황 속에서, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, &lt;✽ 생존&gt; 혹은 &lt;내구&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (널 돌려받을수 있다면 다시 괴물이 되더라도 상관없어. 내 삶은 네게서 받았으니까.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=4 &lt;✽ 생존&gt; (1DM&lt;=4) ＞ [2] ＞ 1 ＞ 성공 수 1, 성공\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    기어코 당신은 그 저주에서 벗어납니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「거부하지 마」 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「아아...」 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「죽어,」 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「당신도 그 누구라도,」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    쉽게 무너질 수는 없죠. 이 세계는, ‘미첼 호프’가 지켜낸 세계니까. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신을 과거로 돌려 보내며, 속죄의 여로에 남아버린 자가 만든 세계니까. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그러니 아직은 죽을 순 없어. (간절히 빌고 또 빌었다. 단지 지금 뿐만이 아니라, 다시 돌아온 날부터 지금까지.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「사실 이런 세상같은 건 당신도 미워하는 게 좋을 텐데...」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그가 바랐던 것처럼,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, &lt;기원&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네가 있는 세상을 내가 싫어할 리가 없잖아.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그러니까, 그만 돌아와.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2DM&lt;=4 &lt;기원&gt; (2DM&lt;=4) ＞ [5, 1] ＞ 2 ＞ 성공 수 2, 더블\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, [2D4] \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    2d4 (2D4) ＞ 5[3,2] ＞ 5\n  "},{"y":"say","sp":"system","ts":null,"tab":"main","html":"\n    [ 미첼 호프 ] ∞ 공명 : 4 → 0 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「싫어」 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「돌아가고 싶지 않아」 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    과거의 망령은, 사라질 차례입니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    「살고 싶어...」 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    결국, 저주는⋯⋯ 운명을 바꾸지는 못하기에. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    료멘스쿠나가 잠식하고 있던 몸이 실이 끊어진 인형처럼 힘없이 쓰러집니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (시선이 당신을 순간 향한 것도 같습니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …미안해.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이제 그곳에 남은 건,  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (다가가 쓰러지는 몸을 끌어안습니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그저, 껍데기였던 것. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n     \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이제 당신은 부서지고 그 안의 영혼은 ‘진짜’ 에게로 향할 겁니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    집으로 돌아가기 전에, 작별 인사라도 할까요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (어쩐지, 아무 소리도 들리지 않는 것 같은데...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (잿더미, 또는 먼지와도 같은 모습.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (계절에 어울리지 않는 먼지와 바람 냄새... 그러한 것들을 진 채로.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    나중에, 어른이 되고 나면... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그 때는 형이 많이 보고싶을 것 같아요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (짧은 미소를 띄웠습니다.) 그러니까, 형의 '저'에게 그 몫까지 부탁드릴게요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...졸려요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ……… \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    나도 네가 많이 보고 싶을 거야. (앞머리를 정리하듯 가볍게 쓸어넘겨 주었다. 그리고 미첼의 한 손을 꼭 잡아주었다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    많이 그리울거야. ...네가 여기 있었다는 건 내가 기억할테니까. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….잘자, 미첼.  (이마에 살며시 자신의 이마를 대었다.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (어딘가에서 웃는 소리가 들린 것도 같습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이내, 이 곳에는 아무도 없었던 것처럼...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼의 영혼을 품었던 아이는 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    따스한 햇살에 비친 눈처럼 흔적도 없이 녹아 사라집니다. \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    (그 모든 것이 끝난 적막이 맴도는 곳에 다가와, 담배 연기를 내뱉으며) “겉모습과 기억이라는 건 참으로 치사하지. 그것만 있으면 인간은 금방 속아 넘어가거든.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “그리고 정을 주지.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (안고 있던 그 자세 그대로 가만히 그의 말을 듣습니다.) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    (특수 용기에 녹아내린 자리에 있는 저주불, 료멘스쿠나를 챙겨 안에 넣는다.) \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “뭐, 너도 속은 거니까 딱히 죽은 사람들에 대한 죄책감은 가지지 않아도 된다.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    “내년에는 평범함 속에서 살아라. 괜히 그림자 속으로 오지 말고.” \n  "},{"y":"say","sp":"오오가미 아야토","ts":null,"tab":"main","html":"\n    (그대로 뒤를 돌아 떠나간다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….. (그 떠나간 자리를 돌아봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그리고는 다시 미첼이 떠나간 자리를 살짝 손으로 문질렀다가… 자리에서 일어납니다.)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지하 창고 문을 열고 들어가볼까요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    곤히 자고 있는 사람을 깨울 시간입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (천천히 지하 창고로 향합니다. 발걸음은 처음에는 조금 바빴으나, 그 무게가 더해집니다. ) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    열쇠로 잠긴 문을 열고 안으로 들어가면,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    너덜너덜한 옷을 입고, 상처투성이인 미첼 호프, 당신의 반장이 보입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    … (천천히 다가가 미첼을 가만히 흔듭니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (….마지막이 꼴도 보기 싫다던 말이었는데.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …저 왔어요.  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ...... (가만히 벽에 기대어 앉은 채로 미동하지 않았던 육체. 한참 기능이 정지되어 있었던 눈꺼풀을 겨우 들어올립니다.)  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ...뭐야, (몇 번의 쿨럭이는 소리가 이어집니다.) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    네가 어떻게... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    … \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …저 보기 싫으실 거 아는데, 그래도… 파트너잖아요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …괜찮으세요? (그의 상태에 어쩐지 침울해진 목소리입니다.)  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (표정은... 그래요. 누가 봐도 화난 것 같은 표정입니다. 조금 참는 것 같다 싶다가도) ...지금 그걸 말하는 게 아니잖냐. \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (짧게 한숨) 위험하게. 뭐 하는 짓이야... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 한숨에 가슴이 내려앉는 기분이 듦과 동시에 울컥.) ….너야말로 위험하게 무슨 짓인데?  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (눈썹 한 쪽 움칠.)  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    이제 아주 막 나가기로 했나 보지? \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (아, 젠장... 분명 이런 상황에서는 고맙다는 말이 나와야 마땅하다는 걸 아는 주제에, 입술은 또 더럽게 무겁습니다.) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ......윽. \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (그 사이 어딘가의 상처가 터지기라도 했는지 인상 찡그립니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(뭐라고 지지 않고 응수하려다가 찡그리는 인상에 움찔.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    많이 다쳤어? (그리고는 상처들을 확인합니다.)  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ...잠깐, 건드리지 말라고... (눈 감은 채 인상 찌푸립니다. 이 몇 번을 사려물고는 신음소리 삼킵니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ……….(속상한 마음에 표정이 조금 가라앉습니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …그 날, 죄송했어요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    진심이 아니었어. (묶인 팔을 풀어줍니다.)  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (몇 번 숨 고르고 나면 눈 치켜뜹니다. 영 불량해 보이는 상태로 당신 바라보면서...) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    됐다. 이제 와서. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    … … 그런데, 이건 진심이었어요. (묶인 밧줄을 모두 풀어주고, 미첼의 눈을 들여다보았다. 그리고는 그날과는 다르게… 천천히 숨결이 닿을 정도로 거리를 좁혀왔다. 허락을 구하는 듯이, 닿기 직전에 멈춰서는.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …좋아해요. \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (묶여 있었던 손목이니 하는 것들을 돌려 가며 풀어주기도 잠시-사실은 하지도 못한 것 같긴 합니다만-점차로 다가오는 시선. 가까워지는 거리. ......) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (당신이 멈추기 직전 쯤-거의 동시쯤 될 것이다-반사적으로 눈 감습니다. 약간 인상을 쓴 것처럼 되어 버리긴 했습니다만...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (감은 눈에 잠깐 눈이 살짝 크게 뜨였다가, 신도 재지 못할 마음의 깊이에 어쩔 줄 몰라 살짝 그 입술에 포갰다가 떨어집니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ⋯(그리고 이어 본 눈 감은 모습에 다시금 그 감촉을 찾으려다, 과욕이 모든 것을 망쳐버릴까 싶어 거리를 다시 벌립니다.) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (예상한 것처럼 따뜻한 촉감이 잠시 닿았다 떨어지면-물론 이 때도 고개가 뒤로 한 차례 놀라 당겨지려고 했습니다-조금 느리게 눈이 뜨입니다...) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ......없었던 일인 척 굴라더니. \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (입가에 터져버린 상처 닦아냅니다. 이제는 피딱지가 앉은 지 오래이나 사이로 핏물이 번지기 시작하는 중이었겠네요.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …역시 안될 거 같아서.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (더이상 이렇게 잃고 싶지는 않았다는 말을 삼킵니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    있던 일로 해요, 우리.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    …집에 가요.  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (어느 정도 적막이 찾아든 공간. 지하의 눅눅한 냄새. 곤란하다는 듯이 제 입가를 짧게 두드립니다-아마도 당신은 모를 '다녀 온' 영혼의 영향일지도-만은...) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    그래,... ...우선은, 복귀하자. (어느 말에 긍정했는지는 모른 척 삼켜 버립니다. 잠시 비틀거립니다마는 이내 걸음 옮길 만큼은 균형을 잡고) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그러면 그 옆에서 비틀거리는 몸을 붙잡아줍니다.) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    아, 고맙다. 파트너. \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (이렇게 아무렇지 않게 부르는 게 얼마 만이더라?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    별걸. 조심해요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그러면서 가는 길에 넌지시 물어봅니다.) …내일 시간 되세요?  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    내일? 왜. \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    아마... \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    보고서 작성. (이 자식은 기밀 임무 중이었으므로) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    카페에서 해요.  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    복직 신청... 잠깐. 오늘 몇 일이냐. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    30일이요.  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    뭐 했다고 그만큼 시간이 지나? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ……(그 말에는 채 대답하지 못합니다.) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (짧게 이마 문지르다가 잘못 건드리고는 작게 아파합니다...) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    출근해야지. 카페는 무슨... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ….(그 모습에 살짝 손이 올라갔다가 내려갑니다.) 외근한다고 쳐요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    도와줄게.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ..그전에, 병원부터 가고요.  \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    밖으로 나오면 이미 쌓이기 시작한 눈과 함께 어두운 밤하늘이 보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    차가운 바람이 당신의 상처를 훑고 지나가면 이제야 좀 살았다는 감상이 드나요? \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    (짧게 콜록입니다. 아니, 좀 오래...) \n  "},{"y":"say","sp":"미첼　호프","ts":null,"tab":"main","html":"\n    ... (어린 시절에는 곧장 춥다고 중얼거리기라도  했겠지만. 뭐.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    다시 새롭게 삶을 되찾은 걸 축하해요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이제 좀 있으면 날이 바뀌고 당신의 생일이 될 테고, \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그러면 제 코트를 벗어서 미첼의 어깨에 덮어줍니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    또 한 번의 날이 바뀌면 새해가 밝아옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    작년에도, 올해도, 내년에도 여전히 함께 할 사람이 당신의 곁에 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신은 몰라도, 당신의 운명을 바꾸고자 기원했던 사람이 말이죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    누구나 매일 무언가를 기원하며 살아갑니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그것은 누군가를 살리는 구원의 말이기도 하고, 누군가를 죽이는 저주의 말이기도 하죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하지만 기원을 구성하는 말 같은 건 결국, 허상일지도 모릅니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    운명을 바꾸는 건 신이 아니라 결국 인간의 의지니까. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    우리는 오늘도 보이지 않는 무언가에 기원을 올립니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    자신과 누군가의 운명을 바꾸기 위해. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    END A. Death: Incarnation \n  "}],"charMeta":{"진행":{"display":"진행","color":"#888888","avatar":null,"plain":false,"mine":false,"npc":false,"hideAvatar":false},"깅강":{"display":"깅강","color":"#ff9800","avatar":null,"plain":false,"mine":false,"npc":false,"hideAvatar":false},"범진":{"display":"범진","color":"#9e9e9e","avatar":null,"plain":fa
