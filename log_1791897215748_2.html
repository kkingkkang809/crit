<!DOCTYPE html>
<html lang="ko" style="--accent:#B26A9E"><head><!-- crit-preview-early: 리더 모드를 첫 페인트 전에 적용해 수정 UI가 깜빡이지 않게 --><script>try{if((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview")))document.documentElement.classList.add("crit-preview")}catch(e){}</script><style>html.crit-preview .stats,html.crit-preview .bartitle,html.crit-preview .tabbar,html.crit-preview .charbar,html.crit-preview #pwbtn,html.crit-preview .chip-edit,html.crit-preview .allbtn,html.crit-preview #sessbtn,html.crit-preview #editbtn,html.crit-preview #savebtn,html.crit-preview #descbtn,html.crit-preview #chatbtn,html.crit-preview #msgrbtn{display:none!important}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[0802] Death_Incarnation</title>
<style>
  :root {
    --accent:#B26A9E;
    --rt1:#6b5a8e; --rt2:#8e5a7d;
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  /* 테마 연동 커스텀 스크롤바 */
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent) 62%, var(--line)); }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }
  header.hero { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px 22px; margin-bottom:14px; }
  /* 블로그에 붙여넣으면 블로그 테마 자체의 h1/본문 CSS가 우리 값보다 우선순위가 높아서
     타이틀·개요 글씨가 훨씬 커 보였다(실제 피드백) - !important로 블로그 CSS에 안 밀리게 고정 */
  .hero h1 { margin:0 0 4px; font-size:17px !important; letter-spacing:-.5px; }
  .hero .sub { color:var(--dim); font-size:13px !important; }
  /* 세션 정보 */
  .t-writer { display:inline-flex; align-items:center; vertical-align:middle; color:var(--dim);
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:600; margin-left:6px; }
  .s-players { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pbadge { background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:600; }
  .pbadge-gm { background:color-mix(in srgb, var(--accent) 26%, var(--panel2));
    border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .s-overview { color:var(--desc); font-size:12.5px !important; line-height:1.7; margin:0 0 4px;
    border-left:3px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    padding-left:12px; white-space:pre-line; }
  #s-writer:empty, #s-subtitle:empty, .s-overview:empty, .s-players:empty { display:none; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--dim); }
  .stats b { color:var(--text); font-weight:600; }
  .bartitle { font-size:11.5px; color:var(--dim); margin:14px 0 8px; font-weight:600;
    display:flex; align-items:center; gap:7px; }
  .allbtn { font-size:10.5px; padding:1px 9px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; font-family:inherit; line-height:1.5; }
  .allbtn:hover { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .charbar, .tabbar { display:flex; gap:8px; flex-wrap:wrap; }
  .tab-chip { display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:8px; padding:3px 10px; cursor:pointer; user-select:none; font-size:12.5px;
    position:relative; padding-right:20px; }
  .tab-chip:has(input:not(:checked)) { opacity:.35; }
  .tab-chip input { display:none; }
  /* crit-tab-x: 탭 칩 우측의 작은 삭제 아이콘 - head 쪽 기본 스타일에 같이 둬야 한다.
     body 안쪽 저 아래에 따로 있으면, 이 문서가 워낙 커서 브라우저가 그 지점까지 파싱하기 전엔
     패딩/숨김이 적용 안 된 상태로 먼저 그려졌다가 뒤늦게 적용되며 탭 정렬이 움찔거렸다. */
  .tab-chip .tab-x { position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; border-radius: 50%; display: none; align-items: center; justify-content: center;
    color: var(--dim); cursor: pointer; }
  .tab-chip:hover .tab-x { display: flex; }
  .tab-chip .tab-x:hover { color: #e08b8b; background: color-mix(in srgb, #e08b8b 18%, transparent); }
  .tab-name { font-weight:600; }
  .charbar.collapsed { max-height:104px; overflow:hidden; }
  .charbar { align-content:flex-start; }
  .expandbtn { display:none; width:100%; margin-top:6px; padding:2px 0; background:var(--panel2);
    border:1px solid var(--line); border-radius:8px; color:var(--dim); cursor:pointer;
    align-items:center; justify-content:center; }
  .expandbtn:hover { color:var(--text); border-color:var(--accent); }
  .expandbtn.open svg { transform:rotate(180deg); }
  .char-chip { display:flex; align-items:center; gap:7px; background:var(--panel2); border:1px solid var(--line);
    border-radius:999px; padding:3px 8px 3px 4px; cursor:pointer; user-select:none; transition:.15s;
    border-color: color-mix(in srgb, var(--cc) 45%, var(--line)); }
  .char-chip:has(input:not(:checked)) { opacity:.35; }
  .char-chip input { display:none; }
  .avatar img, .avatar b { width:30px; height:30px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-avatar { display:flex; align-items:center; }
  .chip-avatar img, .chip-avatar b { width:22px; height:22px; border-radius:50%; object-fit:cover; display:flex; }
  .chip-name { font-size:13px; font-weight:600; line-height:1; }
  .chip-count { font-size:11px; color:var(--dim); line-height:1; }
  /* 지문/사담 통합 칩: 아바타가 없어 기본 padding(왼쪽 4px)이 그대로면 글자가 테두리에 붙어보인다 */
  .char-chip.merged { border-style:dashed; padding:3px 10px; }
  .char-chip.merged .chip-name { color:var(--accent); }
  .chip-edit { display:flex; align-items:center; justify-content:center; color:var(--dim); padding:3px; border-radius:6px; }
  .chip-edit svg { width:14px; height:14px; }
  .chip-edit:hover { color:var(--text); background:var(--line); }
  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .toolbar input[type=search] { flex:1; min-width:120px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .spanel hr { border:none; border-top:1px solid var(--line); margin:10px 0; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }

  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:hover, input[type=radio]:hover {
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  .mrow button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .mrow button:hover { background:color-mix(in srgb, var(--accent) 26%, var(--panel2)); }

  .msg { display:flex; gap:10px; padding:7px 10px; border-radius:10px; }
  .msg + .msg { margin-top:2px; }
  .msg .avatar { flex:0 0 30px; padding-top:2px; }
  .msg .mbody { flex:1; min-width:0; }
  .mhead { display:flex; align-items:baseline; gap:8px; }
  .mhead .by { font-weight:700; font-size:13.5px; }
  .mhead .ctab { font-size:10.5px; color:var(--dim); opacity:.7; }
  .mcontent { font-size:14.5px; overflow-wrap:break-word; }
  .mcontent img { max-width:100%; border-radius:8px; }
  .msg.desc { justify-content:center; text-align:center; color:var(--desc); font-style:italic; padding:10px 34px; }
  .msg.desc .mcontent { font-size:14px; }
  .msg.general { background:var(--panel); border:1px solid transparent; }
  .msg.general:hover { border-color:var(--line); }
  /* 메신저 스타일: 대사 블록을 메신저 말풍선처럼 - 상대는 왼쪽, 내 캐릭터는 오른쪽으로
     쏠린 좁은 블록(74%)으로 줄이고, 내 캐릭터는 이름·시각까지 오른쪽 정렬 (판정 표 블록 제외) */
  body.msgr .msg.general:not(.roll) { max-width:74%; margin-right:auto; }
  body.msgr .msg.general.mine:not(.roll) { flex-direction:row-reverse; margin-right:0; margin-left:auto; }
  body.msgr .msg.general.mine:not(.roll) .mbody { text-align:right; }
  body.msgr .msg.general.mine:not(.roll) .mhead { justify-content:flex-end; }
  /* 연속 대사: 이름 한 번만, 블록 연결 */
  .msg.general.cont { margin-top:0; border-top-left-radius:0; border-top-right-radius:0; padding-top:0; }
  .msg.general:has(+ .msg.general.cont) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .msg.general.cont .mhead { display:none; }
  .msg.general.cont .avatar img, .msg.general.cont .avatar b { display:none; }
  .msg.general.roll { background:color-mix(in srgb, var(--accent) 9%, var(--panel));
    border-left:3px solid color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .msg.general.roll .mcontent { font-family:Consolas,"D2Coding",monospace; font-size:13px; }
  /* CC 판정 → Roll20 coc-1 스타일 표 */
  .msg.general.roll.cc .mcontent { font-family:inherit; font-size:14.5px; }
  .inlinerollresult { background:color-mix(in srgb, var(--accent) 24%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); border-radius:4px;
    padding:0 5px; font-weight:700; font-size:13px; }
  /* 아바타 열(30px+간격 10px)만큼 중심 보정 → 페이지 가운데와 열 일치 */
  .msg.general .ccroll { transform:translateX(-20px); }
  .ccroll { border-collapse:collapse; margin:6px auto; min-width:230px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .ccroll caption { background:linear-gradient(135deg, var(--rt1), var(--rt2)); color:#fff;
    font-weight:700; font-size:13px; padding:5px 10px; caption-side:top; border-radius:8px 8px 0 0; }
  .ccroll td { padding:4px 10px; font-size:13px; border-top:1px solid var(--line); }
  .sheet-template_label { color:var(--dim); }
  .ccroll .resrow { background:#bebebe; }
  .ccroll .resrow .sheet-template_label { color:#4a4a4a; }
  .ccroll .rr { font-size:13px; }
  .ccroll .rr-extreme, .ccroll .rr-crit { background:#cfe3cd; color:#3f6b42; }
  .ccroll .rr-hard { background:#2e7d32; color:#fff; }
  .ccroll .rr-normal { background:#1b5e20; color:#fff; }
  .ccroll .rr-fail { background:#a84848; color:#fff; }
  .ccroll .rr-fumble { background:#6e2323; color:#fff; }
  .ccroll .rr-etc { background:#8a8a8a; color:#fff; }

  /* 지문출력 캐릭터: 해당 캐릭터의 발화를 Roll20 서술처럼 가운데 지문으로 표시 */
  .msg.general.as-desc:not(.roll) { background:transparent; border-color:transparent;
    justify-content:center; text-align:center; font-style:italic; padding:10px 34px; }
  .msg.general.as-desc:not(.roll) .avatar, .msg.general.as-desc:not(.roll) .mhead { display:none; }
  .msg.general.as-desc:not(.roll) .mcontent { color:var(--desc); font-size:14px; }
  /* info 탭: 핸드아웃 카드 */
  .msg.handout { justify-content:center; padding:14px 34px; }
  .hcard { background:var(--panel); border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:14px; padding:18px 24px; max-width:560px; width:100%; text-align:center;
    box-shadow:0 4px 18px color-mix(in srgb, var(--accent) 12%, transparent); }
  .hcard .hname { font-size:16px; font-weight:700; margin-bottom:10px; padding-bottom:10px;
    border-bottom:1px solid var(--line); }
  .hcard .mcontent { font-size:14px; line-height:1.75; }

  /* main/info 외 탭(사담·귓속말 등)은 흐리게 — 메인 진행과 구분 */
  .msg.subtab { opacity:.55; }
  .msg.subtab:hover { opacity:1; }
  .dclist { max-height:300px; overflow:auto; display:flex; flex-direction:column; gap:7px; margin:4px 0 2px; }
  .dclist label { display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer; }
  .dclist .dot { width:11px; height:11px; border-radius:50%; flex:none; }
  footer { margin-top:28px; color:var(--dim); font-size:12px; text-align:center; }
  .editing .mcontent, .mcontent[contenteditable="true"] { outline:1px dashed #C98A5B55; border-radius:6px; }
  .editing #log .msg .avatar { cursor:pointer; }
  .editing #log .msg .avatar:hover img, .editing #log .msg .avatar:hover b { outline:2px solid var(--accent); }
  .hide { display:none !important; }
  .ctxmenu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; min-width:170px; box-shadow:0 10px 30px #000a; }
  .ctxmenu button { display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:13px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; }
  .ctxmenu button:hover { background:color-mix(in srgb, var(--accent) 22%, var(--panel2)); }
  .ctxmenu button.danger { color:#e08a8a; }
  .ctxmenu .sep { border-top:1px solid var(--line); margin:4px 6px; }
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:300px; max-height:82vh; overflow-y:auto; }
  .modal.wide { width:min(92vw, 560px); }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .modal textarea { width:100%; min-height:190px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; line-height:1.5;
    font-family:Consolas,"D2Coding",monospace; resize:vertical; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:30px 12px;
    text-align:center; color:var(--dim); font-size:13px; cursor:pointer; transition:.15s; }
  .dropzone.over { border-color:var(--accent); color:var(--text);
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow.opts { justify-content:flex-start; gap:22px; }
  .mrow label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .iconbtn.on { color:var(--accent); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .pwwrap { position:relative; }
  .pwwrap input { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:7px 36px 7px 10px; font-size:13px; font-family:inherit; }
  .eyebtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--dim); cursor:pointer; padding:4px; display:flex; }
  .eyebtn:hover { color:var(--text); }
  .mrow input[type=text] { flex:1; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; }
  .mrow input[type=color] { width:36px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }

<body class="light" data-session='{}'><script>window.CRIT_LOG_DATA = {"title":"[0802] Death_Incarnation","source":"ccf","blocks":[{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (입 꾹 다물고 바닥만 바라보다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    진짜로, 정말로 저는 그런 기억 없어요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕입니다.) 네가 그렇다면 그런거겠지. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    안 믿으시는 거죠... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    안믿는다기보단,  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네가 본 것도 기억한것도 너한테는 진실이겠지.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    하지만 실제는 다를 수도 있는 거야. (언젠가는 네가 나한테 해줬을지도 모르는 말. 그리고 나에게도 해당하는 말.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너는 그 상황에서 정신 없었을테니까. 네가 놓친게 있을 수도 있어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    일단 기억만으로는 단정 짓는 건 위험한 일이야.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그런 의미로 난 네가 한 말 믿어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼의 어깨를 다독입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... (짧게 코 끝 훌쩍입니다. 어쩐지 억울한 기색이었던 것 같습니다만, 이내 평소와 비슷한 정도로 풀어지고) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이해했어요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    마음대로 말해서 죄송합니다. (하고는 고개 한 번 꾸벅,) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...(조금 표정이 안쓰럽게 변해서.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    죄송할 것까지야. 지금의 넌 아직 어리잖아.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이케가미 조사 완료. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼을 데리고 차로 돌아갑니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아까 너 제법 잘하더라.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    진짜요? (꿈질...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    응.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아까, 조사한 거 봤지. 다음은 어디로 가면 좋을 거 같아? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너라면 어디로 갔을 것 같아?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (짧게 입꼬리가 실룩였던 것도 같습니다. 그리고, 조금 더 생각해 볼 것은...)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    미나미마고메의 세 명, 신문 기사에서는 위협을 위주로 다루고 있었죠... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그리고 하기나카에서는 세 사람이 죽었구요. (저라면 살아 있었던 쪽을 먼저 확인하러 갈 것 같아요. 하곤 시선 마주합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그래. 그럼 미나미마고메로 가자. (그러면 마주 미소 지어줍니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (짧게 웃는 얼굴이 스쳤다가...)  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구 미나미마고메의 한적한 주택가,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그곳에 자리 잡은 향토 박물관으로 이동합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    연말이라 문을 닫은 걸까요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    주차장에 주차를 하고 내리면 청소를 하고 있는 50대 후반의 남자가 보입니다. \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “죄송합니다. 본관은 현재 휴관 중이며, 다음 개관일은 1월 4일입니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “모처럼 발걸음 해주셨는데 아쉽게 되었습니다⋯” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (형사증을 내밉니다.) 경시청 형사부 수사 1과 스탠 리 입니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    몇가지 여쭤볼 게 있어서 그런데, 잠시 시간 괜찮으십니까?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러면 옆에서 허리 꾸벅 숙여 예의바르게 인사하고요...) \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “흐음⋯ 네, 알겠습니다. 추우니 안으로 들어가셔서 이야기 나누시죠.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    시간 내주셔서 감사합니다. (가볍게 꾸벅.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    본관 옆에 지어진 별관의 응접실로 들어갑니다. \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    (차를 우려내 스탠의 앞에 내려놓고, 오렌지 주스를 따른 컵을 미첼의 앞에 내어준다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 감사합니다. (차를 들어 한모금 마십니다.) \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    (여러가지 과자들이 든 바구니를 테이블에 내려놓는다) “얼마 전, 결혼기념일에 아내와 여행을 다녀왔는데 거기서 좋은 찻잎을 발견했습니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “입맛에 맞으셨으면 좋겠군요.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    감사합니다... (표정이 조금 밝아집니다. 오렌지 주스가 담긴 컵 손에 쥔 채로)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그런 귀한 찻잎을 내어주시다니. 어쩐지 향이 좋더라고요. \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “허허, 다행입니다⋯ 그래서 무엇을 물어보러 오셨습니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 저번에... (자연스럽게 물어보려다가, 미첼을 소개해줍니다.) 이쪽은 제 조카입니다. 직업 체험 중이어서요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 여쭤봐.  \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “오호⋯⋯ 현재 방학일텐데, 직업 체험이라니 대단하십니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    (좀 더 인자한 웃음을 지으며 미첼을 마주봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이렇게요? 눈을 한 번 깜빡입니다. 어쩐지 당했다, 싶은... 그런 눈빛으로 꽤나 억울하게 당신 봅니다.)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (으쓱.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    앗, 저어...  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (기죽어있는 것보다야, 부족한 건 내가 채우는 방식으로 하면 그만이지. 보니까 역시 미첼은 미첼이기도 하고.)  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그으, 신문 기사를 보다가 16일에 있었던 일에 대하여 접하게 되었습니다... (하며 조금은 긴장해서 말 잇습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    살인이나 기타 재발 가능성이 있는 중범죄가 아닌 것들 가운데서, 할 수 있는 한 실마리를 찾아보도록 숙제를 받아서요. 너무 무례했다면 죄송합니다. (이런 변명을 꼭 붙여대는 것이 부끄러운지 귀 끝이 홧홧해집니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    혹시, 당일의 상황에 대해서 여쭈어 봐도 괜찮을까요? \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “네, 그럼요. 이야기 해드리겠습니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “16일 자정이 조금 지난 시간이었죠. 그날은 늦게까지 연구를 하고 있어서 박물관에 남아 있었습니다. 갑자기 들이닥친 남성 3명이 저를 흉기로 위협하더니, 연구하고 있던 고대인의 뼈를 훔쳐갔습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 미첼을 보며 생각합니다. ...다른 무언가가 맞나. 하는 행동, 말투... 어리지만 모두 비슷한데.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    고대인의 뼈라면... \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “올해 가을 무렵에 출토되어 얻게 된 귀중한 뼈죠. 그 뼈는 말이죠, 야마토 조정에 의해 멸망당한 ⋯ 그를 따르지 않은 백성들의 것이죠.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “이른바, 조정에 반역한 역적⋯ 일족의 운명을 바꾸고자 **행복을 기원하며 싸운 자**들의 이야기가 담겨 있는 역사적 가치가 많은 유물입니다. ⋯ 그런걸 빼앗기게 될 줄이야, 아무리 후회한다고 해도 원통함이 사라지지 않습니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “⋯아, 이야기가 조금 새어버렸군요. 음⋯ 의식이 몽롱했던 탓에 제대로 기억하진 못하지만 범인들의 손목이나 목 주변에 **눈 문신**이 있었고 그 세 명 모두 붉은 옷을 입고 있었습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (또... 붉은 옷.) \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “흰색 왜건 차를 타고 남쪽 방향으로 도주했고, 나중에 경찰에게서 받은 연락으로는 흰색 왜건 차가 오타구 로쿠고에서 목격 되었다고 하더군요.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ! (아까의 곳에서도 분명, 흰색의 왜건이라고...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    손목과 목 부근에 눈 모양의 문신하고, 붉은 옷... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그리고 고대인의 뼈. (아, 음...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (스탠 부르려다가 잠시 멈칫.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ... ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    삼촌, (수첩이랑 필기구, 가지고 있는 것 있으세요... 하고 중얼중얼.)  \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “허허⋯⋯ 어쩐지 생기신 것도, 행동도, 며칠 전에 왔다가신 형사님이 떠오르십니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...아, (아까 찾았던 수첩 이랑 자신이 들고다니던 만년필 건네줍니다.) \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “미첼 호프라는 형사님이 찾아오셨었는데, 행동이 묘하게 비슷하십니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그럼 수첩 한 면 펼쳐서 사각이는 소리와 함께 정리하다가, 움찔.) \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “아는 분이신가요?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아. 사실 제 형이십니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그 사람 아들이에요.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......네,에... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...좀 복잡한 가정사라. 어련히 이해 부탁드립니다.  \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “하하⋯ 괜찮습니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “그렇다면 집에 돌아가 아버지를 만나뵈면 물어봐주시겠습니까? 저번에 오셨을 때 추천드렸던 오모리 카레 가게 맛이 어떠셨는지 말이죠. 그리고 다음번에 개관하면 같이 와주시면 좋겠습니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (잠시 뺨을 긁적입니다.) ...네에. 그으, 아마 좋아하셨을 거에요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    다음에 뵙기 전에 저도 함께 다녀와 보겠습니다. (어찌 보면 서먹한 가정의 부자 관계라고 누구나 납득할 만한 식의 대화.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그으, 실례지만... (침 한 번 삼키고) 저희 아버지는, 여기에 무슨 일로 방문하셨는지 여쭈어도 될까요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    사실 저는 여기 오셨었다는 것도 모르고 있었거든요... \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “음⋯ 오셔서 똑같은 걸 물어보셨습니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “정확히는 그 3명, 붉은 옷을 입은 이들의 행방을 궁금해 하셨죠.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (... 곰곰히 생각합니다. 붉은 옷, 흰색 차, 사이비. 사이비에 관련된 것을 비밀리에 조사하고 있었고, 그 사건은 특수과와 관련된 것이었나보군.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (과연, 그랬나...) \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “그럼, 저는 이만 아내와 약속한 시간이 되어서 가보겠습니다.” \n  "},{"y":"say","sp":"히다 준야","ts":null,"tab":"main","html":"\n    “부디 직업 체험을 하시는 동안 즐거운 추억을 쌓으셨으면 좋겠습니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (아마도 맞는 방향을 잡아서 쫓아가고 있는 것 같다는 확신. 자리에서 일어나서는-남아 있던 오렌지 주스 쭈욱 마셔버리고-예의바르게 허리를 숙입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    덕분에 잘 들었습니다, 귀한 시간 내 주셔서 감사합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[향토박물관 강도 사건 ①]</div><div>21년 12월 16일, 0시 40분경. 도쿄도 오타구 미나미마고메에 위치한 향토박물관에 남성 3명이 침입해, 관내에 있던 관장 히다 준야(남성/54세)를 흉기로 위협했다. 남성들은 관내에 보관되어 있던 고대인의 뼈를 빼앗아 도주했다. 현재도 경찰의 수사가 진행 중이다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[향토박물관 강도 사건 ②]</div><div>향토박물관에 침입한 남성 3명의 손목이나 목 주변에 눈 문신이 새겨져 있었다. 그들은 흰색 왜건차를 타고 남쪽으로 도주했다. 사건 발생 며칠 후, 오타구 로쿠고 방면에서 목격 정보가 있었으나 그 이후로 경찰 측에서는 소식이 없다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[HO1(성인)의 행적 ①]</div><div>12월 20일, 11시 30분 경. HO1은 오타구 미나미마고메의 향토박물관을 방문했다. HO2와 마찬가지로 강도 사건에 대해 관장에게 진술을 들은 뒤 관장이 추천한 오모리의 카레 가게로 향했다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미나미마고메 조사 완료. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (마주 인사하고 일어납니다.) 협조 감사합니다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (박물관을 나온지 얼마지나지 않아 문득 든 생각에 물어봅니다.) 안추워?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그럼 그 뒤를 따라가다가...) 엇, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    choice 추웠다 버틸만했다 (choice 추웠다 버틸만했다) ＞ 버틸만했다\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (코 끝만 짧게 실룩이곤) 모르겠어요. 그렇게 엄청 춥다거나 하지는 않은 것 같은데... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그래? 추위 별로 잘 안타는 체질인가보네. 별건 아니고, 잠깐 카페 들리자.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (커피 드시고 싶으신 걸까? 잠시 고개 기울였다가...) 네에. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (주변 카페 들러서 메뉴판도 살피고요... 바닐라 라떼 시킵니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    뭐 마시고 싶은 거 없어? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    choice 적당히눈에띄는거아무거나 드립커피 저도같은거요 코?코?아 (choice 적당히눈에띄는거아무거나 드립커피 저도같은거요 코?코?아) ＞ 저도같은거요\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (메뉴판 보다가... 끙.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    형 마시는 거랑 같은 거 마실래요. (하곤 조금 어색하게 시선 다른 곳 향합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (16살인데 벌써부터 카페인 마신다고? ... 역시 공부 좀 하는 애는 다른가.) 그래. 그런데 달텐데 괜찮아? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    choice 이때도착실하게단거싫어했다 에이어린인데 (choice 이때도착실하게단거싫어했다 에이어린인데) ＞ 에이어린인데\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    괜찮아요. (싫어하진 않는 듯...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (키오스크로 바닐라 라떼 2개 주문합니다.) 그래.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (얌전... 나는 모르는 것들이다. 그 모습 보다가 끝난 것 같으면 당신 소맷자락 잡고 서 있습니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    워낙 연말이고 박물관이 쉬니까, 이 근처 카페는 사람이 적어서 그런지 \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    금방 바닐라라떼 2잔이 나옵니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (바닐라 라떼 2잔을 들어 하나는 미첼 건네줍니다.) 빨대 필요해?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 말을 하며 다음장소는 오모리로 향할까. 같은 얘기도 하고요.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    슬슬 저녁이니 밥을 먹으러 가기엔 딱 좋겠네요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (주시면 감사합니다아. 하곤 받아듭니다. 음, 당분. 적당한 카페인. 아마 익숙할-그러니까, 잠복이나 그러한 것들을 할 때 따뜻한 드립 커피 사다 주면 마시던 표정-얼굴으로 커피 마시다가) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (스틱 빨대도 하나 건네주고요...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    -음, 그러니까... '반장'은 이 다음에 오모리로 갔다고 하셨죠? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러니까 카레를 먹으러.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    전 좋아요. (앗, 감사합니다. 빨대 받아들고) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그랬지. 이참에 같이 저녁도 해결하면 딱이겠네. (핸드폰으로 시간 확인하고는 도로 집어넣습니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    카레 좋아하니? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 말을 하며 차로 향합니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그럼 그 뒤에서 당신 뒤따라 차로 향합니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    흔들리는 차 안에서 조심히 커피를 마시며, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구 오모리로 향합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    연말 행사로 북적이는 상점가네요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    짤랑짤랑, 경품 추첨 하는 소리도 들려옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    추천 받은 카레 가게는⋯ 아! 바로 입구 앞에 있네요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    많은 사람이 냄새에 홀려 들어가고 있습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (역시 오래 된 추천 밥집이라는 건가.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이거 예약해야 했던 거 아닌가... 생각보다 유명한 가게를 다니네. 헤비하라한테 추천 받으셨나?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (줄을 기다려야 하나... 하고 입구로 가서 주변을 둘러봅니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    다행히 카운터 석에 2자리가 남아있습니다! \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    엇, 자리 있는 것 같아요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (다행이다. 그러면서 당신 돌아봅니다. 들어가도 되냐는 듯한 의사 표현.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (작게 끄덕이며 얼른 들어갑니다.) 얼른 들어가자. 자리 놓치겠다.  \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “어서오세요~! 아, 마지막 자리의 주인공이 되셨네요!” \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    (메뉴판을 주면서 물과 따뜻한 물수건을 건넨다.)  \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “주문은 어떤 걸로 하시겠어요? 연말 이벤트 한정 스폐셜 카레를 추천드립니다!” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    연말 이벤트라고, 여러가지 토핑을 조금씩 넣은 꽤 양이 많은 카레를 저렴하게 팔고 있는 모양입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    오, (메뉴판을 들여다보고는.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그럼 전 스페셜 카레로요. 미첼 너는?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    비싼거 시켜도 돼.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (상당히 고민에 빠진 얼굴입니다...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...음... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    choice 스페셜 기본 (choice 스페셜 기본) ＞ 기본\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그냥 기본 카레로요. (어쩐지 긴장했습니다.) \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “네~ 토핑은 어떤걸로 넣어드릴까요?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    다 넣어. 다. (옆에서 부추깁니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (여기서부터 여기까지. 메뉴판 대고 위에서부터 아래로 쭉 그으며 장난스레 말합니다.) \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “하하. 형이 다정하시네! 그럼~ 꼬마 신사분을 위한 작은 스폐셜 카레로 제가 알아서 준비해볼까요?” (찡긋) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (토핑. 약간 고장납니다. 어. 어...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...그렇게 주세요... (결국은 이렇게 되나!) \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “좋아요~ 주문 받았습니다!” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    따뜻한 온기와 사람들의 대화 소리를 듣고 있으니 마음이 편안해집니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    곧 빠르게 스폐셜 카레 2개가 서빙됩니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    가라아게, 돈가스, 새우, 구운 야채 등등⋯⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    정말 푸짐한 토핑들입니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (많아.) \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “맛있게 드세요!” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    감사합니다. (고개 한 번 꾸벅, 숙였다가-제발 그 사이에 수저니 물컵이니 뭐니 하는 건 제가 놓았다고 합시다 이거는 양보할 수가 없습니다-) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (빤... 형 봅니다. 먼저 드시라는 듯이) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    잘먹겠습니다. (말과 함께, 천천히 수저를 놓으려다가, 잠깐 손을 멈칫, 눈을 깜빡입니다. 빠르네...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    먼, (... ... ... 그냥 일단 빠르게 한입 먹습니다.) 난 신경쓰지 말고 얼른 먹어.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    식겠다.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 말을 하며 음, 맛있네. 이런 생각하며 표정이 자연스레 풀어지고요... 후추도 좀 더 뿌립니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 모습 보고서야 한 숟가락 떠서 입에 넣습니다. 음, 맛있다...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    후추 넣어 드시는 거 좋아하세요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (늘 기본으로만 먹어 온 미첼 호프, 처음 보는 방법입니다. 그냥 지가 주변에 관심이 없던 거겠지만.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    응. 난 자극적인 거 좋아해서. 왜, 관심 있어?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (버퍼링...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (고민 중...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (아마... 저번에 반장님도 뿌려볼랬다가 인상 좀 찌푸렸던 거 같은데...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    매운 거 좋아하면 넣어봐. 꽤 괜찮다니까? (장난기 발동해서 후추통 건네줍니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그럼 통 받아들고도 잠시 고민하다가 당신 따라하듯 조금 톡 톡 뿌립니다. 다가올 미래는 알지 못 한 채로...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 사이 고운 고춧가루도 들어서 톡톡 뿌리고요... 후추 넣은 미첼 힐끔 봅니다. 이미 웃음을 참으려는 기색입니다. 아무렇지 않은 척...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (저것도? 또 고민하다가 따라합니다. 잘 먹는 사람 따라하고 싶은 마음...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너 너무 많이 뿌리는 거 아냐?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    choice 매워 필사적인참음 고개돌리고콜록 참을만한데? (choice 매워 필사적인참음 고개돌리고콜록 참을만한데?) ＞ 필사적인참음\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (멀쩡한 척 하고는 있습니다만 확실히 맵긴 매웠던 듯. 말수 적어집니다...) \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    (저런⋯ 지나가다가 사과 주스를 테이블에 올린다.) “서비스예요~” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    괜찮은 거 맞지? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (뿌려놓은 쪽 말없이 걷어내 먹어치우고는 서비스로 주신 주스 들이킵니다...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......괜찮, (콜록) 괜찮아요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...그래. 영 안되겠으면 말해. 새로 시켜줄테니까... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (어쩐지 조금 걱정...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (도리도리도리도리) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    저번에도 고통 참더니, 잘 참는 편인가보구나? (등 문질문질.) 기특하네.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    너 16살이라 그랬지?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (어라... 칭찬인가? 뭔가 이상하게 코딩이 되고 말았습니다. 앞으로는 좀 더 안 들키게 티 안 내야지. 같은 식으로...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네에. 16살이에요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그럼 이제 고2 올라가나?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (카레 념념...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네에... (념념) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    쓰쿠바대학 부속 코마바 고등학교 다니고 있습니다... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (냠...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    CHOICE[입시에 대해 안다, 모른다] (choice[입시에 대해 안다,모른다]) ＞ 입시에 대해 안다\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    거길 다닌다고? 공부 잘하는 편인가보네. 일부러 그쪽으로 지망한거야? 경찰 되려고? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그으, 그냥... 운이 좋았어서요. (나왔다, 공부 잘 하던 놈들의 그냥 열심히 하니까 됐어요 식 발언.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(나왔다, 공부 잘하는 놈들의 그런 특유의 발언.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (냠... 마저 카레 입에 넣습니다. 얼추 다 먹어가는 듯.) 도쿄대 법학부 진학 희망중입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그렇구나... 동아리 같은 건 안해?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (어느새 바닥을 긁고 있습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (다 먹었다. 만족스럽게 식기류 내려둡니다.) 문예부원이에요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    교지 발행 담당입니다... \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “물 리필 해드릴게요~ 교지 발행이라니, 재밌는 거 하네요!” \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “두 분은 상점가 이벤트를 보러 오셨나요?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고개를 끄덕이다가 그 말에 시선이 뺏깁니다.) 무슨 이벤트 하는데요?  \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “음, 뭐 이것저것 할인행사도 하고~ 흔한 상점가 이벤트죠. 무대 공연도 있긴 해요.” \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “저희 카레 가게는 주로 단골 분이 오셔서, 새로 오신 분이 오시면 이렇게 말을 걸고 싶어지더라고요.” \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “그래도 다행이에요. 최근 오타구에 사건사고가 너무 많아서 많이들 안 오실 거라고 생각했거든요.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    어쩐지 친절하시더라고요. (아까 서비스도 감사했어요. 덧붙입니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (감사합니다, 하곤 물 조금 더 마십니다. 그러다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저기, 혹시 그러면 새로 오시는 분들은 드무신 편일까요? (우물쭈물...) 그으, 사실은... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    향토박물관의 관장님께서 추천히 주신 가게라 와 봤는데, 사실은 얼마 전에 저희 (잠시 멈춤.) 아버... \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “어머, 관장님께서.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...아빠도 들르셨다고 하길래요. (혹시 기억하시나 싶어서... 하고... 어쩐지 말이 기어들어갑니다.) \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “음⋯⋯ 아! 아빠라고 하니까, 그러네요. 엄청 닮으셨네!” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (물마시다가 간신히 넘깁니다.) \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “식사 중에 계속 수첩을 보면서 생각에 잠겨 계시길래 눈에 띄었어요. 음⋯ 그때⋯” \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “하네다 신사로 가시는 길을 물어보셔서 알려드렸던 거 같아요.” \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “그 신사가 영험하기로 소문이 좋거든요.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    어떻게 영험한데요? \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “왜, 그런 거 있잖아요~ 오마모리나 소원 끈 팔찌가 잘 이뤄진다던가!” \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “그리고 신주님 가문이 대대로 신주를 맡아온 가문이라 유명하다고 해요. 저는 그쪽은 잘 모르지만.”  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아아~ 그래서 소원을 잘 들어주는 모양이군요? 한번 가봐야겠네요.   \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “맞다, 이 근처에 놀러오신거라면 로쿠고는 피하세요. 최근에 지진이 좀 크게 일어나서, 아직 복구가 덜 됐다고 하더라고요.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[오타쿠에서 발생한 지진]</div><div>12월 25일 밤, 오타구를 진원으로 하는 진도 5의 지진이 발생했다. 오타구 로쿠고는 특히 피해가 컸으며, 진원이 로쿠고가 아닐까 하는 근거 없는 소문이 돌고 있다. 지진 발생 원인도 불분명한 듯 하다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[HO1(성인)의 행적 ②]</div><div>12월 20일, 15시 20분 경. HO1은 오타구 하네다의 신사를 방문했다. 붉은 눈이라는 사람들에 대해 조사하고 있었던 듯 하며, 관계자로 보이는 게로 토코의 집으로 향했다.</div>"},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 말 얌전히 듣습니다. 신주? 분명 이전에 봤던 것 같은데. 그러니까, 일가 살인 사건...?) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    앗, 그런가요... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 지진이 있었어요? 알려주셔서 감사합니다.  \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “네, 카마타 역에서도 인명 사고가 있었다고 하고⋯ 참 이래저래 일이 많네요.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    정말 그렇네요... 사장님도 몸조심 하세요.  \n  "},{"y":"say","sp":"타카야마 아키라","ts":null,"tab":"main","html":"\n    “감사합니다! 다음번에는 아빠랑 같이 들러주세요!” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (덜그럭.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...네, 네엡. (뚝딱거립니다. 멋쩍은 듯 뺨 한 번 긁적였습니다만...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    맛있었어요. 잘 먹었습니다... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    카레를 배부르게 먹고 바깥으로 나옵니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    이제 슬슬 잘 곳을 찾아봐야하는데⋯ 차 안에서 자면 입 돌아갈 테니까요! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    근데, 문제가 있습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지금은 연말! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    도쿄! \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    과연 숙소가 있을까요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ( ㅇㅁㅇ ; ) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    예약 어플을 뒤적뒤적⋯⋯ 뒤적⋯ 하면, 앗⋯ 어떻게 된 게⋯⋯ \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(일단 앱을 켜서 숙소를 알아봅니다.) 어디 이동하기도 그렇고...  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    비어 있는 게, 전부 ‘러브 호텔’ 뿐입니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ............................. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .....................(아 진짜로?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (정말?) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    진짜로. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    정말. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (대체 왜) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (아... 미첼 한번 봤다가.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    라이터가 적었어. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (코를 긁적입니다. 한번 더 뒤져봅니다. 떨이로 나온 거 없나?) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (나카오 야스히로 자기는 지금 도쿄 안 산다고 이러기냐-라는 메타적 외침 한 번) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (당일 취소 정말 없어?) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    정말정말 없습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......저는 차에서 자도 돼요... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    16살 어린애를 정말 차에서 재울 거야 ㅠ? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....되겠냐. (순간 자연스럽게 머리에 힘 풀려서 반장한테 말하듯이 말해버립니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈 동그랗게 뜨고 쳐다봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......그러면 어떡해요? (입 삐죽.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .....(미첼과 시선을 마주칩니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    음... 어쩔수 없긴 한데.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... ... 정 싫으면 다른 방법이 있긴해. 아직 우리 집 안팔렸으니까. (어차피 자기 인성이야 깎이면 그만이지만요. 길거리에서 애를 재울 순 없는 노릇 아닙니까.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지금 쫓기고 있는 중인데? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    좀만 참아. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... (상황은 알지만 어쩐지 미묘한 기분은 어쩔 수 없네요...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    네에... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    러브 호텔에 16살 손 잡고 들어가는 어른⋯ 수군수군 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... 형 믿지? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    와 진짜 못 믿을 대사다 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (입술 꽉 깨뭅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이 못 믿음직한 기분...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......그래도 방이 있는 게 어디에요. (배부른 소리 그만하기로 합니다. 형도 나름... 아니 꽤 많이... 이런 상황 원하지 않았을 테고...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그럼 러브 호텔 하나를 예약해서, 그쪽으로 향합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    복도에는 맥주 캔을 파는 자판기가 보이고,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    무인 키오스크에서 열쇠를 받아 방으로 향합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    방 안에 자판기가 있긴⋯! 한데 그래도 알록달록해서 미첼은 알아보기 힘들어보입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그리고 퀸 사이즈 침대 하나랑⋯ \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (스읍... 미첼이 못보게 제몸으로 스윽 가리며 지나칩니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    와! 통유리로 안이 훤히 보이는 욕실! \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    와... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    와... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (죽은눈) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (대체 왜...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (입가를 매만집니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이런...?) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그리고 호텔 가운이 든 곳에는⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    호텔 가운 1개랑 분홍색의 깜찍말랑 토끼 잠옷이 들어있습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (아니, 역시 그냥 입었던 옷 입고 잘 것이다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    대체 왜냐고 물으신다면 그것은 제가 보고싶었기 때문입니다. 저항하지 말도록. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    아 왜 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그래 저항하지 마라) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    씻고나면 찝찝하잖아 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (한번만 입어주랑 응?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이잉) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (침착하게... 토끼 잠옷 지나서 목욕가운 쥡니다. ㅋㅋ) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠은 뭐 입으라고 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (토끼잠옷) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    난 둘 중 아무나 입어도 괜찮아 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    니가 왜 그걸 입어.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    왜요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아니 그 누가봐도 그건 성인 사이즈잖아. 넌 토끼잠옷이 딱 맞을 거 같은데? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (토끼 잠옷을 들어 미첼에게 대봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    딱이네. 이거.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈 가늘게 뜨고 노려봅니다...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    토끼 잠옷도 어른용이긴 한데 보통 XX들이 입으니까 괜찮을듯 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (어쭈?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    왜 잘어울릴 것 같은데.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    귀엽고. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저 저런 거 안 좋아해요. (시선도 안 줍니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ... ... 아, 한번만 살려주라.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    choice 하지만내어찌예비된토끼잠옷의숙명을벗어나리오 ㄴㄴ일단내가집음 (choice 하지만내어찌예비된토끼잠옷의숙명을벗어나리오 ㄴㄴ일단내가집음) ＞ 하지만내어 :"main","html":"\n    와 어쩌지 진짜 이상한 말 같ㄷ 아 안하기로 햇어 착한 지엠 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (자리에서 일어나서 다가갑니다.) 아, 진짜 딱 한번만. 응?   \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (ㅋㅋ) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...더 안 놀리실 거면요... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (ㅋㅋ) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    진짜 안놀릴게. 나 지금까지 너 놀린 적 없어. 다 진심이었다니까? (그런 말을 하며 자리에서 일어나서 미첼한테 다가가서 얼굴 조물딱) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    야... 너 볼이 정말 말랑하네... 야 아직도 이런... (와 어려서 그런가 밀가루 반죽같네 진짜) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    읍. (가만히 있긴 하는데...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈썹이 점점 더 찌풀...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(그러다 제 볼도 꼬집어보면서 볼의 말랑함 강도를 따지며 감상에 빠져 찌푸려진 것도 눈치 못채고) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이런 기회 정말 흔치 않다 스탠아 살다보니 이런 날도 오는구나 그래 살길 정말 잘한거 같다 이러라고 날 다시 돌려보냈나보다 네가) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그렇지만 이제 좀 후회할 시간이 다가올지도 모른다...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    흠흠흠...  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...그만. (보자 하면, 당신에게는 익숙할... 그러니까 혼내기 전 미첼 호프의 얼굴 표정으로 당신 올려다보고 있었습니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그래봤자 아기 토끼다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (우씨...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (잠깐 내려봤다가...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (손을 내립니다. 슬슬 더하면 정말 미움받겠는데? ㅋ) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (오늘은 여기서 물러나볼까.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (아 내가 권위도 없고 직워도 없는 열 여섯살이라는 것이 이렇게나 통탄스러울수가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미안, 네가 너무 귀여워서... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    어쩔 수가 없었다. 네가 이해해.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (하지만 굴하지 않고 한번 더 깐족 거립니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    역시 말 걸지 마세요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (ㅎ) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    에긍 아기 토끼 삐졌대요 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (팩. 손 떼어내 버리곤 누워버립니다. 베개로 얼굴 가리듯 덮어버리고...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    삐졌어? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    에이, 우리 미첼이 이렇게 마음 좁은 사람이었나. 내가 알던 네 아빠는 말이야~ \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... (대답 안 합니다. 꿈질꿈질 자세나 편하게 잡을 뿐.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 말을 하며 다시 마저 정리하고요....) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이런거에 잘 안.... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .....(아 잠깐, 안좋은 기억 다시 생각났어. 입을 다뭅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    잘자. 불 꺼줄까?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (듣고는 있었는지...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...왜 얘기를 하다 마세요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    남의 얘기는 동네방네 떠들고 다니면 안되잖아. (대충 둘러댑니다. 불 끄려 카드 뽑으러 갑니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (제멋대로 얘기해 줄 때는 언제고... 입 우물거리다 참습니다. 이불이나 끌어올려 덮습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    스탠 형. 형도 누우세요. 불 만 좀 더 밍기적거리다가....) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (... ... .... 다시 눈을 뜨고 마른세수를 합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    몇시야..? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    러브 호텔은 시계가 없어 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 떄쯤의 미첼:까치집 지은 머리도 정리하고, 세수도 하고, 이것저것... 준비 대부분 끝낸 차림.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (진짜로?) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    진짜로. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (아진짜?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (....핸드폰을 켭니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    11시. 딱 준비하고 나가면 체크아웃 시간이겠네요! \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아까 형 알람 울리지 않았어요? (핸드폰 화면 들여다봅니다. 오, 11시.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (하품을 하고 급하게 일어납니다.) 아 진짜?  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (핸드폰을 다시 봅니다.) ....그러네. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (뭐지, 왜 늦잠 잤지 나? 이상하네... 생각하면서 일어나서 대충 세수합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (옷도 다시 갈아입고요...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그동안 : 얌저니...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....너 토끼 잠옷. (세수하고 나오다가 미첼과 마주칩니다. 음... 짧은 고민과 함께)  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    CHOICE[말한다, 안한다] (choice[말한다,안한다]) ＞ 말한다\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아침이 되니까 부스스 하니까 더 귀엽네... (라고 뇌내 필터링 꺼진 채로 말하고 슥 지나갑니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ( ㅇ ㅁ ㅇ ) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (버퍼링...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (버퍼링......) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 사이 머리도 한번 헤집어주고요.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    카와이다케쟈다메데스까~ 의 아기 토끼. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이상한 아저씨. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그렇게 감기는 거란다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (감기긴 뭘 감겨!) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈 가늘게 뜨고 노려봅니다. 잠옷, 이제는 안녕... 환복하러 갑씨다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (익숙한 노려봄. 스무스하게 흘립니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이것저것 빠뜨린 거 없나 주섬주섬...) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    주섬주섬⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    다 챙기고 방 바깥으로 나갑시다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (아니, 나 자기 반장이랑 똑같은 사람 같다매? 근데 귀엽단 소리가 나오나? 진짜 이상한 아저씨... 같은 마음 속 욕 한 바가지 하고는 나갈 준비 끝마칩니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    다 했어요. 가요. (뚱...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (뚱한 표정 보고 와, 어릴때부터 이렇게까지 닮을 수가 있나? 신기하네... 귀여워.) 빠진 거 없지? 얼른 나가자.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    점점 추워지고 있는 연말. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오늘은 어디로 갈까요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (차에 올라타서 시동 걸면서...) 자자, 미첼 반장님, 다음 목적지는 신사로 갈까요?  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    choice 받아친다 하지말라구요... (choice 받아친다 하지말라구요...) ＞ 하지말라구요...\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...그렇게 놀리지 말라고 했지 않아요? (흥. 시선 창 밖으로 던집니다. 이제 좀 편해졌는지 가볍게 다리도 꼬는 꼴이 참...) 하네다 쪽이죠. 좋으신 대로요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그 모습 보고 잔소리 참지 않아요. 편해지긴 했나봅니다.) 너 차에서 다리 꼬지마. 너 교통사고...(하.) 나면 큰일 난다.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    다리 짧아서 꼬는 것도 가능한 것봐 귀여워 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    주소도 입력해주시겠어요? 꼬마 반장님. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (차를 출발시킵니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    안전 운전 부탁드립니다아. (투덜거리곤 목적지 입력합니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구 하네다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    큰 길가에 자리 잡은 신사에 도착합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    토리이를 지나, 신사 경내로 발을 들여놓으면 평일이라 그런지 조용하네요. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    사무소로 향하자, 40대 후반의 신주가 나옵니다. \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “무슨 일로 오셨습니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    안녕하세요, 경시청 형사부 수사 1과 스탠 리 형사라고 합니다. 몇가지 여쭤볼 게 있어서 찾아왔어요. 혹시 잠깐 시간 되실까요? (형사증 꺼내 같이 보여주고 악수를 건넵니다.) \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “수사 1과라⋯ 하네다 신사의 신주, 미노 히로토라고 합니다.” (내민 손을 잡고 악수한다.) \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “이미 한 번, 수사 1과에서 나오셨던 걸로 알고 있습니다만.” \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “그때⋯ 호프 씨라는 분이 오셨습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 그렇습니까? 재차 시간을 빼앗아 죄송합니다. 안그래도 그분 관련해서 여쭤보려고요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (짧은 악수와 함께 손을 놓습니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (굳이 나서지 않습니다. 어린 애가 참견하는 꼴이 썩 좋게 보이지 않을 것처럼 비추일 듯 싶었거든요. 조용히 지척에 서 있을 뿐입니다.) \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “흠, 호프 씨에 대해서 뭐가 궁금하십니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혹시 호프 씨께서 이와테 신주 일가 살인 사건 관련해서 여쭤보지 않으셨습니까? \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “흠⋯ 네, 그것도 언급하시긴 하셨지만 그 일보다는 ‘붉은 눈’이라는 분들에 대해서 조사하고 계셨습니다. 20일 오후에 오셔서 말이죠.” \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “붉은 옷을 입고 몸에 눈 문신을 한 사람들이라길래, 짐작가는 이가 있어서 알려드렸습니다.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 말을 듣고 나면 작은 목소리가) 저, 혹시 정확한 시간은 기억하시나요...? 해가 아직 떠 있을 때라던가, 하는 정도도 괜찮으니까요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (남쪽으로 향했다는 게 여기였나.) \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “음⋯⋯ 한, 오후 3시 경이었을 겁니다.” \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “작년 9월에 보조 직원으로 근무했던 무녀 아이가, 딱 그런 특징을 가지고 있었죠.” \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “게로 토코⋯ 매우 밝고 단정한 아이였습니다만, 문제 행동을 저질러서 말이죠.” \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “잘은 모르겠지만 호프 씨의 뒤를 쫓고 계신 모양이군요. 괜찮으시다면 호프 씨도 보고 가신 그 아이가 몰래 훔쳐본 고문서를 보고 가시겠습니까?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    오, 부탁드립니다.  \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “그리고 이 이후에는 그 아이에게 가봐야한다고 하셔서 자택 주소를 알려드렸습니다. 본래 개인 정보긴 한데, 워낙 급해보이셔서 말입니다. 형사님께도 필요하면 드리겠습니다.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (곰곰... 행적을 생각해보다 고문서를 보여준다는  말에 반색합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    혹시 자택 주소도 부탁드릴 수 있을까요? 사건 관련한 것이어서요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이래저래 협조해주셔서 정말 감사드려요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (사람 좋게 웃음을 띄웁니다.) \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “알겠습니다.” (사무실 안으로 안내하며 들어와 고문서 하나를 건넨다.) “아닙니다, 믿으실진 모르겠지만 제가 감이 좋은 편인데, 어쩐지 영 좋지 않은 기운이 돌아다녀서 말이죠.” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그런 스탠 뒤에서 고개만 가볍게 숙일 뿐입니다...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    역시 대단하시네요. 그러고보니 여기가 영험하다는 얘기 많이 들었습니다. (고문서를 들어 살펴봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    이것저것 소원도 꽤 많이 이뤄진다고요.  \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    기운을 상당히 잘 느끼시는 신주님이시라고 들었어요.  \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    (메모지를 하나 뜯어 그곳에 주소를 적고 그것도 마저 건넨다.) “그렇습니까, 가는 길에 오마모리라도 하나 사가시는 건 어떻겠습니까. 소원을 이룰 때,” (미첼을 바라본다.) “도움이 될지도 모르니.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (주소도 받아듭니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (시선에 잠시 움찔, 합니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그것도 좋은 것 같군요. 영험하다 하니, 저도 하나 달고 가야겠습니다. (고문서와 주소 보느라 눈치 못챈 채로) \n  "},{"y":"say","sp":"미노 히로토","ts":null,"tab":"main","html":"\n    “저는 이만 수사에 방해가 안 되게 잠시 나가있겠습니다. 고문서를 다 읽으시면 그 자리에 두고 가시면 됩니다.” (꾸벅 인사하고 나간다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네. 감사합니다. (꾸벅 마주 인사합니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 사람이 자리를 비운 이후에야 짧게 한숨 쉽니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그제서야 미첼을 잠깐 봅니다.) 왜? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    아뇨, 그냥... 저도 같이 볼래요. (옆에 조금 붙어서는) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼도 같이 볼 수 있게 고문서를 밀어주고요.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    고문서는 초서체(흘려 쓴 한자체)로 쓰여 있어 읽기 어렵습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    &lt;✽ 지식&gt; 혹은 &lt;검색&gt; 판정 \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=5 &lt;검색&gt; (1DM&lt;=5) ＞ [6] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1DM&lt;=5 &lt;✽ 지식&gt; (1DM&lt;=5) ＞ [7] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (맹...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    .... \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (아 왤케 글씨가 흐릿해.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (눈 비비고 다시 봅니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    1DM&lt;=4 &lt;✽ 지식&gt; (1DM&lt;=4) ＞ [7] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    지렁이가 기어간다~ \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (잠이 덜깼나...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    미첼, 다시 봐봐. 너 공부 잘한다며?  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼은 검색 없나⋯ 지식으로 재굴림 해보세요 \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...이 쪽은 제 담당이 아니거든요... (끙. 안경 고쳐 쓰고는 조금 더 집중합니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    1DM&lt;=5 &lt;✽ 지식&gt; (1DM&lt;=5) ＞ [9] ＞ 0 ＞ 성공 수 0, 실패\n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (오늘은 날이 아닌갑다... ) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어찌저찌 읽긴 하지만⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    엄청 오래 걸렸습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (안경 벗고는 눈 사이 문지릅니다.) ...이거 말곤 더 모르겠어요! (아마 스탠이랑 같이 끙끙대며 찾았을 것이다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[모노노베 텐구코의 주불 ①]</div><div>모노노베 텐고쿠의 외법을 이용한, 주불의 제작 방법을 여기에 기록한다. 기형아를 모아 고독을 진행한다. 서로의 살과 피, 배설물을 먹으며 끝까지 살아남은 자를 굶겨 죽여 즉신불을 만들어낸다. 즉신불의 배를 갈라 고대인의 뼈 가루를 내장과 섞음으로써 저주받은 불상은 힘을 얻는다. 두 개의 얼굴, 네 개의 팔을 가진 그 존재를 모노노베 텐고쿠는 료멘스쿠나라 명명했다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[모노노베 텐구코의 주불 ②]</div><div>료멘스쿠나의 신체는 일본 전국에서 재해를 일으킨 후, 다이쇼 12년 9월 1일의 관동 대지진을 마지막으로 사가미만 연안에서 회수되었다. 라마의 나무 상자에 담아 이와테현 니시이와이군의 신사에서 보관하기로 했다.</div>"},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[모노노베 텐고쿠의 주불 ③]</div><div>모노노베 텐고쿠의 주불 제작 방법의 일부를 엿본 당신은, 저주나 괴이 현상에 대항하는 방법을 알게 됐다. 특수 기술 &lt;기원&gt;를 습득한다.</div><div>기원이란, 전투 중에만 사용할 수 있다. &lt;기원&gt;의 판정치는 &lt;*자아&gt; 혹은 &lt;근성&gt; 의 수치를 참조한다. 판정에 성공한 경우, 대상의 &lt;∞공명&gt; 레벨을 [성공수]D4만큼 감소시킬 수 있다. 판정에 실패하더라도 1레벨을 감소 시킬 수 있다.</div><div>&lt;기원&gt;를 사용한 경우, HO2는 공명 판정 (강도 5 상승 1D2) / 공명 감정: 정의(이상)</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (같이 끙... 하고 들여다봅니다. 료...멘... 스쿠나?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (이게 뭐야?) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    「스탠 리」<br>이상한 기운이 깃들었습니다. 이 기운을, 쓸 날이 오긴 할까요? 이상합니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(뭐지? 일단 기억해둡니다. SF는 잘 봤지만 옛날 이야기엔 영... 약해서.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오마모리나 사서 다른 곳으로 갈까요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (고문서를 덮고 자리에서 일어납니다.) 다 봤어? 슬슬 갈까? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (한참 그 내용 수첩에 적어두다가... 마지막 획을 긋고 나면) -네, 다 적었어요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (끙, 하는 소리 내곤) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ... ...오마모리, 하나 정도는 사서 가시지 않을래요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그럴까? 재밌어보이니까.  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    괜히 마음에 걸려서...... 싫으시면 안 하셔도 되지만. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (나가면서 대답합니다.) 이것저것 해보면 좋지. 빌고 싶은 소원 있어? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (눈 깜빡, 깜빡...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    빌고 싶은 *소원*이라고 하면... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그러다가도 고개 한 번 파드득 저어 떨쳐냅니다.) 지금 당장은 없는 것 같아요. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...(있네.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그렇구나. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그럼 일단 적어보러 갈까? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오마모리는 단순 소원을 이뤄달라는 것부터,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    교통 안전, 건강 기원 등등⋯ 다양합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    물론, 소원을 직접 적어 걸어두는 소원패도 있습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (그 앞에 서서, 무수한 소원의 기원을 읽어내리다가...) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (그런 미첼을 가만히 뒤에서 지켜봅니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    이거로 할래요, 저는. (가장 처음. '소원을 이루어 주세요.' 라고 적혀 있는 것으로 집어듭니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    보통 두루뭉술하게 걸어두면 예상치 못한 방식으로 이뤄지기도 하던데. 괜찮겠어?(그 뒤에서 소원을 직접 걸어두는 소원패를 집어듭니다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    한 가지를 명확하게 빌게 되면 그 소원이 필요하지 않을 때 찾아오게 될 지도 모르니까요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그러니까, 오늘 형에게는. (아무 오마모리 하나를 툭 건드립니다. '교통 안전을 도와주세요.') 이런 게 필요하다고 생각해서 살 수도 있겠지만... \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    원하지 않는 형태로 찾아올 수도 있죠. 가령 지하철에서 사고가 났는데 혼자만 살아남았다던가, 하는 식으로요. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (*죽고 싶지 않아.* 그 때의 기원을 떠올렸다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ...제 비약일 뿐이지만요. 잊어버리세요, 그냥. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ...생각이 깊네. 거기까진 미처 생각 못해봤어. (잠자코 그 말을 경청하다가 어깨를 두드려줍니다. 혼자만 살아남았다.. 그 말에 꽂혀 머릿속에서 맴돕니다.) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    당신의 머리색과 같은 노란색 천에 주황색 자수로 새겨진 오마모리. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미첼, 당신은 이것에 무슨 소원을 담고 싶나요? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    굳이 지금 정하지 않아도 괜찮겠죠. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    하지만 그럼에도 사람은 숨 쉬듯 자연스럽게 기원하기 마련입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    스탠, 당신이 소원패에 걸어둘 소원은 무엇인가요? \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    ....(잠깐 그동안 바래왔던 것을 고민했다가.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (...그 사람을 다시 볼 수 있게 해달라 적으려다 미첼의 말에 주변 사람이 무탈하게 해주세요. 하고 적습니다. 역시 그때의 일을 이번에도 반복하고 싶지는 않았고... 다시 되돌아 갈 수 없는 것도 알기에. )  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    소원패를 매달아두는 곳에, 당신의 기원을 걸어놓습니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    그것이 어떤 것으로 돌아오든⋯⋯ \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    미래를 알지 못하는 인간은 그저 앞을 나아갈 뿐입니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    자, 다음은 어디로 가볼까요? \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (노란색의 오마모리 하나 주머니에 대강 넣어두고는) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (오마모리를 잘 가슴팍에 넣어둡니다.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    그러면 바로 주오 쪽으로 넘어가볼까.  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오타구 주오. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    한적한 주택가에 위치한 아파트에 도착합니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    오래된 건물이지만 몇차례에 걸친 개축 공사를 했는지, 낡은 느낌은 들지 않습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그러니까, 분명 주소가... \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    계단을 올라 게로 토코가 사는 2층 204호실로 올라갑니다. \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    인터폰을 누르려는 그때,  \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    203호실 문이 세차게 열리면서 40대로 보이는 여성이 나옵니다. \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “아!! 드디어 왔네! 얼마나 더 기다리게 해야 만족하겠어?” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “이쪽은 비싼 집세를 내고 있는 거니까, 주택 관리 좀 똑바로 해달ㄹ⋯ 뭐야, 애?” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (기세에 눌렸습니다.-그야 이 쪽 아직 열여섯 살이고-눈 동그랗게 뜨고 굳어 있다가...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    ......저, 그, \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (이쪽 집에 볼일이 있어서요... 하면서 슬쩍 형 뒤로 숨습니다...) \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “이쪽 집? 볼일? 뭐야, 너네 관리인이 파견한 직원 아니야?” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (솔직하게 말해야 하나?) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    아, 직원은 아닙니다. (미첼의 어깨를 감싸고는) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    경시청에서 나왔거든요. 찾으시는 분이 아니라 어쩌죠…. \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “아, 엇⋯ 경찰이었어? 어머, 호호⋯⋯ 미안해라⋯⋯” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    괜찮습니다. 여러모로 곤란한 상황이셨나봅니다. (사람좋게 미소 지어보이며 경찰 수첩도 내보이고요.) \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “아니이, 요새 204호실에서 냄새가 너무 많이 나서, 관리인한테 조사할 사람을 보내달라고 했는데~ 하도 안 오는 거야, 그래서~”  \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “어머머, 진짜 경찰이네.” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “게로 토코, 그 애가 결국 사고를 쳤어?” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (말 들으면서 간간이 고개 끄덕입니다. 그러다가, 어라.) '결국'이요? \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “맞아~ 그래도 밝은 아이긴 했는데 학교도 잘 안 나가고 종교 단체에 빠져있더라니만, 요즘 젊은 애들이 문제야 문제.” (이런 걸 말하는 걸 좋아하는지, 물어보자마자 우다다 쏟아낸다.)  \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “어머, 그러고보니 일주일 전에도 경찰이 왔다갔지 참?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (젊은 애인 미첼을 잠깐 봤다가.) \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    네, 안그래도 그 일 때문에 찾아왔거든요.  \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “그때 붉은 눈이니, 료멘이 어쩌고 하면서 큰소리가 오갔는데. 뭔가 해결이 안 됐나봐?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (머쓱하게 웃습니다.) 네에…  \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (전혀 그런 식으로 보는지 모르고 엇, 어. 하면서 약간 난감한 듯한 반응만 하고 있습니다.) \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “어쩐지~ 그때 경찰이 돌아간 이후로 나는 외출을 했는데 말이야,” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “104호 양반이 그러더라고! 그 뒤에 흰색 왜건 차를 탄 친구들이 우르르 몰려와서는,” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “층간소음으로 아주 시끄러웠다고.” \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"<div>[HO1(성인)의 행적 ②]</div><div>12월 20일 오후 4시 10분 경, HO1은 오타구 주오에 위치한 게로 토코가 사는 아파트를 방문했다. 게로 토코와 말다툼을 벌였던 것 같지만, 무언가 정보를 입수했는지 오후 5시 전에는 다른 장소로 향했다.</div>"},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    층간소음이요?  \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “그래! 엄청 떠들고 쾅쾅 바닥 두드리고 말이야.” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    몇 호실에서요? 설마… 204호실? \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “응? 그렇지?” \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (쾅쾅 바닥을 두드렸다? 시끄럽고, 난동을 피우는 소리였다면... 으음. 눈살 한 번 찌푸렸다가) \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    어쩐지 불안한 예감이 듭니다. \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    204호실엔 가보셨어요? 냄새가 많이 난다고 하셨잖아요.  \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “아니, 남의 집에 멋대로 들어가는 건 좀 그렇잖아.” \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “그래서 관리인을 기다린 건데⋯ 어머, 얘 좀 봐. 문도 안 잠그고 뭐한다니?” (204호실의 문을 보고 깜짝 놀란다.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    하긴. 어, \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    군죠의 시선을 따라 문을 보면, \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    어? \n  "},{"y":"say","sp":"진행","ts":null,"tab":"main","html":"\n    204호실 문이 미세하게 열려 있습니다. \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    열려 있어서 냄새가 심하게 난 걸 수도 있는 것 같아요... (하면서 우물쭈물. 무언가 나쁜 예감이 들어서...) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    저어, ...아주머니? (나름 고르고 고른 호칭.) \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html":"\n    “응?” \n  "},{"y":"say","sp":"스탠 리","ts":null,"tab":"main","html":"\n    (미첼 옆구리를 꾹 찌릅니다. 그리고는 소근소근. 누나라고 해. 누나.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    (아얏.) \n  "},{"y":"say","sp":"미첼 호프","ts":null,"tab":"main","html":"\n    그 뒤로 옆 집의 분을 보신 적 있으세요? \n  "},{"y":"say","sp":"군죠 토시에","ts":null,"tab":"main","html"
