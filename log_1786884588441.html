<!DOCTYPE html>
<html lang="ko" style="--accent:#B26A9E"><head><!-- crit-preview-early: 리더 모드를 첫 페인트 전에 적용해 수정 UI가 깜빡이지 않게 --><script>try{if((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview")))document.documentElement.classList.add("crit-preview")}catch(e){}</script><style>html.crit-preview .stats,html.crit-preview .bartitle,html.crit-preview .tabbar,html.crit-preview .charbar,html.crit-preview #pwbtn,html.crit-preview .chip-edit,html.crit-preview .allbtn,html.crit-preview #sessbtn,html.crit-preview #editbtn,html.crit-preview #savebtn,html.crit-preview #descbtn,html.crit-preview #chatbtn,html.crit-preview #msgrbtn{display:none!important}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[0806] 괴물예찬론</title>
<style>
  :root {
    --accent:#B26A9E;
    --rt1:#6b5a8e; --rt2:#8e5a7d;
    /* 전체 색감: 포인트 컬러를 중립색에 은은하게 블렌딩해서 파생 */
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  /* 테마 연동 커스텀 스크롤바 */
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover { background:color-mix(in srgb, var(--accent) 62%, var(--line)); }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    line-height:1.65; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 80px; }

  header.hero { background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:20px 22px; margin-bottom:14px; }
  /* 블로그에 붙여넣으면 블로그 테마 자체의 h1/본문 CSS가 우리 값보다 우선순위가 높아서
     타이틀·개요 글씨가 훨씬 커 보였다(실제 피드백) - !important로 블로그 CSS에 안 밀리게 고정 */
  .hero h1 { margin:0 0 4px; font-size:17px !important; letter-spacing:-.5px; }
  .hero .sub { color:var(--dim); font-size:13px !important; }
  /* 세션 정보 */
  .t-writer { display:inline-flex; align-items:center; vertical-align:middle; color:var(--dim);
    background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:2px 10px; font-size:12px; font-weight:600; margin-left:6px; }
  .s-players { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pbadge { background:color-mix(in srgb, var(--accent) 14%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line));
    border-radius:999px; padding:3px 12px; font-size:12.5px; font-weight:600; }
  .pbadge-gm { background:color-mix(in srgb, var(--accent) 26%, var(--panel2));
    border-color:color-mix(in srgb, var(--accent) 60%, var(--line)); }
  .s-overview { color:var(--desc); font-size:12.5px !important; line-height:1.7; margin:0;
    border-left:3px solid color-mix(in srgb, var(--accent) 45%, var(--line));
    padding-left:12px; white-space:pre-line; }
  #s-writer:empty, #s-subtitle:empty, .s-overview:empty { display:none; }
  .s-players:empty { display:none; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-top:12px; font-size:12.5px; color:var(--dim); }
  .stats b { color:var(--text); font-weight:600; }
  .stats .hn { color:var(--dim); font-style:italic; }

  .bartitle { font-size:11.5px; color:var(--dim); margin:14px 0 8px; font-weight:600;
    display:flex; align-items:center; gap:7px; }
  .allbtn { font-size:10.5px; padding:1px 9px; border-radius:999px; background:var(--panel2);
    border:1px solid var(--line); color:var(--dim); cursor:pointer; font-family:inherit; line-height:1.5; }
  .allbtn:hover { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .charbar { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 0; }
  .char-chip { display:flex; align-items:center; gap:7px; background:var(--panel2);
    border:1px solid var(--line); border-radius:999px; padding:3px 8px 3px 4px;
    cursor:pointer; user-select:none; transition:.15s; }
  .char-chip:has(input:not(:checked)) { opacity:.35; }
  .char-chip input { display:none; }
  .avatar img, .avatar b {
    width:30px; height:30px; border-radius:50%; object-fit:cover; display:flex;
    align-items:center; justify-content:center; }
  .chip-avatar { display:flex; align-items:center; }
  .chip-avatar img, .chip-avatar b {
    width:22px; height:22px; border-radius:50%; object-fit:cover; display:flex; }
  .char-chip { border-color: color-mix(in srgb, var(--cc) 45%, var(--line)); }
  .chip-name { font-size:13px; font-weight:600; line-height:1; }
  .chip-count { font-size:11px; color:var(--dim); line-height:1; }
  .chip-edit { display:flex; align-items:center; justify-content:center;
    color:var(--dim); padding:3px; border-radius:6px; }
  .chip-edit svg { width:14px; height:14px; }
  .chip-edit:hover { color:var(--text); background:var(--line); }

  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding:10px 2px; margin-bottom:10px; border-bottom:1px solid var(--line); }
  .toolbar .tfilter { display:flex; gap:4px; }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .toolbar button.on { color:var(--text); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 18%, var(--panel2)); }
  .toolbar input[type=search] { flex:1; min-width:120px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; font-family:inherit; }
  .toolbar input[type=search]::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }

  /* 테마 설정 패널 */
  .settings { position:relative; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:250px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }

  /* 커스텀 체크박스/라디오 (테마 연동 자체 제작) */
  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:hover, input[type=radio]:hover {
    border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }
  /* 열쇠 버튼 / 비밀번호 입력 */
  .iconbtn { display:flex; align-items:center; justify-content:center; padding:5px 9px; }
  .iconbtn.on { color:var(--accent); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 14%, var(--panel2)); }
  .pwwrap { position:relative; }
  .pwwrap input { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); padding:7px 36px 7px 10px; font-size:13px; font-family:inherit; }
  .eyebtn { position:absolute; right:4px; top:50%; transform:translateY(-50%); background:none;
    border:none; color:var(--dim); cursor:pointer; padding:4px; display:flex; }
  .eyebtn:hover { color:var(--text); }
  /* 이미지 선택 등 모달 내 버튼 */
  .mrow button { background:color-mix(in srgb, var(--accent) 16%, var(--panel2)); color:var(--text);
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px;
    padding:6px 12px; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .mrow button:hover { background:color-mix(in srgb, var(--accent) 26%, var(--panel2)); }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .spanel hr { border:none; border-top:1px solid var(--line); margin:10px 0; }

  /* ── 메시지 블록 ── */
  .msg { display:flex; gap:10px; padding:7px 10px; border-radius:10px; }
  .msg + .msg { margin-top:2px; }
  .msg .avatar { flex:0 0 30px; padding-top:2px; }
  .msg .mbody { flex:1; min-width:0; }
  .mhead { display:flex; align-items:baseline; gap:8px; }
  .mhead .by { font-weight:700; font-size:13.5px; }
  .mhead .tstamp { font-size:11px; color:var(--dim); }
  body.no-tstamp .tstamp { display:none; }
  .mcontent { font-size:14.5px; overflow-wrap:break-word; }
  .mcontent img { max-width:100%; border-radius:8px; }

  .msg.desc { justify-content:center; text-align:center; color:var(--desc);
    font-style:italic; padding:10px 34px; }
  .msg.desc .mcontent { font-size:14px; }
  .msg.general { background:var(--panel); border:1px solid transparent; }
  .msg.general:hover { border-color:var(--line); }
  /* 메신저 스타일: 대사 블록을 메신저 말풍선처럼 - 상대는 왼쪽, 내 캐릭터는 오른쪽으로
     쏠린 좁은 블록(74%)으로 줄이고, 내 캐릭터는 이름·시각까지 오른쪽 정렬 (판정 표 블록 제외) */
  body.msgr .msg.general:not(.roll) { max-width:74%; margin-right:auto; }
  body.msgr .msg.general.mine:not(.roll) { flex-direction:row-reverse; margin-right:0; margin-left:auto; }
  body.msgr .msg.general.mine:not(.roll) .mbody { text-align:right; }
  body.msgr .msg.general.mine:not(.roll) .mhead { justify-content:flex-end; }
  /* 연속 대사: 이름 한 번만, 블록 연결 */
  .msg.general.cont { margin-top:0; border-top-left-radius:0; border-top-right-radius:0; padding-top:0; }
  .msg.general:has(+ .msg.general.cont) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .msg.general.cont .mhead { display:none; }
  .msg.general.cont .avatar img, .msg.general.cont .avatar b { display:none; }
  /* 프로필 완전히 숨기기: 빈 아바타 칸이 30px+gap만큼 왼쪽 여백으로 계속 남아 어색했다 -
     아바타 칸 자체를 접어서 텍스트가 지문처럼 여백 없이 시작하게 */
  .msg.general.noav .avatar { display:none; }
  .msg.general.noav.noname .mhead { display:none; }

  /* 커스텀 연출 정규화: 배너(가로 전체) / 칩(인라인) 2형태 통일 */
  .deco-banner { display:block; text-align:center; padding:8px 14px; border-radius:8px;
    margin:8px 0; font-weight:700; font-style:normal; text-decoration:none; letter-spacing:normal; }
  .deco-chip { display:inline-block; text-align:center; padding:5px 16px; border-radius:999px;
    margin:2px 0; font-weight:600; font-style:normal; text-decoration:none; letter-spacing:normal; }

  .inlinerollresult { background:color-mix(in srgb, var(--accent) 24%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 42%, var(--line)); border-radius:4px;
    padding:0 5px; font-weight:700; font-size:13px; cursor:help; }

  /* coc-1 롤템플릿 — 판정 표는 대사 블록 안에서도 가운데 정렬 */
  .mcontent table { border-collapse:collapse; margin:6px auto; min-width:230px;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  /* 아바타 열(30px+간격 10px)만큼 중심 보정 → 페이지 가운데(서술·칩)와 열 일치 */
  .msg.general .mcontent table { transform:translateX(-20px); }
  .mcontent caption { background:linear-gradient(135deg, var(--rt1), var(--rt2)); color:#fff;
    font-weight:700; font-size:13px; padding:5px 10px; caption-side:top;
    border-radius:8px 8px 0 0; }
  .mcontent td { padding:4px 10px; font-size:13px; border-top:1px solid var(--line); }
  .sheet-template_label { color:var(--dim); }
  /* 판정결과 행(밝은 배경): 라벨은 짙은 회색으로 */
  .mcontent tr[style] .sheet-template_label { color:#4a4a4a !important; }
  /* 판정 결과 셀 가독성 보정: 밝은 배경은 채도 낮춘 짙은 글씨, 짙은 배경은 흰 글씨 */
  .mcontent td[style*="lightgreen"] { background:#cfe3cd !important; color:#3f6b42 !important; }
  .mcontent td[style*="background: lime"], .mcontent td[style*="background:lime"] {
    background:#cde3c4 !important; color:#3f6b42 !important; }
  .mcontent td[style*="background: green"], .mcontent td[style*="background:green"],
  .mcontent td[style*="darkgreen"], .mcontent td[style*="background: red"],
  .mcontent td[style*="background:red"], .mcontent td[style*="darkred"],
  .mcontent td[style*="crimson"] { color:#ffffff !important; }

  footer { margin-top:28px; color:var(--dim); font-size:12px; text-align:center; }
  .editing .mcontent, .mcontent[contenteditable="true"] { outline:1px dashed #C98A5B55; border-radius:6px; }
  .hide { display:none !important; }

  /* 우클릭 메뉴 / 모달 */
  .ctxmenu { position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px; min-width:150px; box-shadow:0 10px 30px #000a; }
  .ctxmenu button { display:block; width:100%; text-align:left; background:none; border:none;
    color:var(--text); font-size:13px; padding:7px 12px; border-radius:7px; cursor:pointer; font-family:inherit; }
  .ctxmenu button:hover { background:color-mix(in srgb, var(--accent) 22%, var(--panel2)); }
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex;
    align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:18px; width:290px; max-height:82vh; overflow-y:auto; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .mrow { display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:13px; margin-bottom:10px; }
  .mrow.opts { justify-content:flex-start; gap:22px; }
  .mrow label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  .mrow input[type=text] { flex:1; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:13px; font-family:inherit; }
  .mrow input[type=color] { width:36px; height:26px; border:none; background:none; padding:0; cursor:pointer; }
  .mbtns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
  .mbtns button { background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
  .mbtns button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mbtns button.danger { background:#a84848; border-color:#a84848; color:#fff; }
  .ctxmenu button.danger { color:#e08a8a; }
  .ctxmenu .sep { border-top:1px solid var(--line); margin:4px 6px; }
  .modal.wide { width:min(92vw, 560px); }
  .modal textarea { width:100%; min-height:190px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; line-height:1.5;
    font-family:Consolas,"D2Coding",monospace; resize:vertical; }
  .hint { font-size:11.5px; color:var(--dim); margin:6px 0 0; }
  .dropzone { border:2px dashed var(--line); border-radius:12px; padding:30px 12px;
    text-align:center; color:var(--dim); font-size:13px; cursor:pointer; transition:.15s; }
  .dropzone.over { border-color:var(--accent); color:var(--text);
    background:color-mix(in srgb, var(--accent) 10%, transparent); }
  .editing #log .msg .avatar { cursor:pointer; }
  .editing #log .msg .avatar:hover img, .editing #log .msg .avatar:hover b { outline:2px solid var(--accent); }

(function () {
  var qid = (window.__CRIT_ID || new URLSearchParams(location.search).get('id'));
  var data = window.CRIT_LOG_DATA || null;
  if (!data) { try { data = JSON.parse(localStorage.getItem('crit-log-data:' + qid)); } catch (e) {} }
  window.CRIT_IMPORT_DATA = data;
  var PALETTE = ['#B26A9E','#5B8DB8','#5BA8A0','#7BA05B','#C98A5B','#8A7BC9','#c15b74','#5bb0c9'];
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  if (!data || !Array.isArray(data.blocks)) {
    document.getElementById('log').innerHTML =
      '<div style="text-align:center;color:var(--dim);padding:60px 0">로그 데이터를 찾을 수 없어요. 로그 보관함에서 다시 가져와 주세요.</div>';

         "내 캐릭터"/NPC 체크가 항상 풀린 것처럼 보였다 */
      meta[k] = { display: m0.display || k, color: m0.color || null, avatar: m0.avatar || null, plain: !!m0.plain, mine: !!m0.mine, npc: !!m0.npc, hideAvatar: !!m0.hideAvatar };
    });
  }
  var order = [];
  data.blocks.forEach(function (b) {
    /* 예전엔 !b.sp면 무조건 건너뛰어서, 이름이 비어있는(익명) 화자는 메시지는 잘 나오면서도
       캐릭터바에 아예 안 잡혀 편집(사진 제거 등)할 방법이 없었다(실제로 겪은 버그) - 지문인지

    if (b.y === 'desc') return;
    var k = b.sp || '';
    if (!meta[k]) meta[k] = { display: b.sp, color: b.color || null, avatar: b.av || null };
    if (order.indexOf(k) === -1) order.push(k);
    if (!meta[k].avatar && b.av) meta[k].avatar = b.av;

  Object.keys(meta).forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); });

     경우) 기존대로 localStorage에서 읽는다 */
  var sess = {};
  if (window.CRIT_LOG_SESS) sess = window.CRIT_LOG_SESS;
  else { try { sess = JSON.parse(localStorage.getItem('crit-log-sess:' + (qid || 'tpl'))) || {}; } catch (e) {} }
  var sTitle = sess.title || data.title || '로그';
  var sPlayers = sess.players || data.players || [];
  document.body.dataset.session = JSON.stringify({
    title: sTitle,
    writer: sess.writer || '',
    gm: sess.gm || '',
    players: sPlayers,
    party: sess.party || data.party || '',
    overview: sess.overview || ''
  });
  /* 히어로 데모 텍스트를 즉시 교체 (메인 스크립트의 세션 렌더는 저장 시점에만 돌므로) */
  var tEl = document.getElementById('s-title');
  if (tEl && tEl.childNodes.length) tEl.childNodes[0].textContent = sTitle + ' ';
  var wEl = document.getElementById('s-writer');
  if (wEl) wEl.textContent = sess.writer || '';
  var plEl = document.getElementById('s-players');
  if (plEl) plEl.innerHTML = sPlayers.map(function (p) { return '<span class="pbadge">' + esc(p) + '</span>'; }).join('');
  var ovEl = document.getElementById('s-overview');
  if (ovEl) ovEl.textContent = sess.overview || '';
  document.title = 'Crit — ' + sTitle;

  /* 캐시된(하드코딩) 페이지면 DOM 재조립 생략 - 통계/메타만 갱신 */
  var BAKED = !!(window.CRIT_BAKED && document.querySelector("#log .msg"));
  /* 로그 DOM 생성 (프로토타입과 동일 마크업, 같은 화자 연속 발화는 cont로 묶음) */
  var counts = { total: 0, say: 0, desc: 0 };
  var htmlOut = [];
  var prevKey = null;
  data.blocks.forEach(function (b, i) {
    counts.total++;
    var forced = b.sp && data.chars && data.chars[b.sp] && data.chars[b.sp].desc;
    if (b.y === 'desc' || forced) {
      counts.desc++;
      prevKey = null;
      if(!BAKED)htmlOut.push('<div class="msg desc" data-char="' + esc(b.sp || '') + '" data-type="desc" id="imp-' + i + '">' +
        '<div class="mbody"><div class="mcontent">' + (b.html || '') + '</div></div></div>');
      return;
    }
    counts.say++;
    /* meta는 order 구성 때 b.sp||''로 정규화한 키로 저장돼있다 - 여기서 b.sp를 그대로
       쓰면(undefined일 때) meta['']에 저장된 실제 캐릭터 설정(색·아바타·숨기기 등)을
       못 찾고 항상 기본값으로만 그려진다 */
    var m = meta[b.sp || ''] || { color: '#9a95a0', avatar: null };
    /* "이 블록만" 아바타 수정은 예전엔 화면(DOM)에만 반영되고 serialize()가 저장을
       안 해서, 새로고침하면 조용히 사라졌다(실제로 겪은 버그) - b.avOv로 블록별로
       저장한다: 문자열이면 그 이미지로 덮어쓰고, 프로퍼티는 있는데 값이 없으면(null)
       "이 블록만 없애기"로 색 원만 강제, 프로퍼티 자체가 없으면 평소처럼 캐릭터 기본값 */
    var hasOv = Object.prototype.hasOwnProperty.call(b, 'avOv');
    var noAv, av;
    if (hasOv) {
      noAv = false;
      av = b.avOv
        ? '<img src="' + esc(b.avOv) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
        : '<b style="background:' + esc(m.color) + '"></b>';
    } else {
      /* 이름도 없고 아바타 이미지도 안 정한 캐릭터는(체크박스를 굳이 안 켰어도) 색깔 원만
         덩그러니 뜨는 게 오히려 더 어색해서 기본적으로 접는다 - "완전히 숨기기"는 이름은
         있지만 사진만 없애고 싶을 때(NPC 등) 쓰라고 남겨둔다 */
      noAv = m.hideAvatar || (!b.sp && !m.avatar);
      av = noAv ? '' : (m.avatar
        ? '<img src="' + esc(m.avatar) + '" loading="lazy" onerror="this.replaceWith(avFallback(\'' + esc(m.color) + '\'))">'
        : '<b style="background:' + esc(m.color) + '"></b>');
    }
    var isRoll = b.y === 'roll';
    /* b.sp && 로 막아두면 이름 없는 캐릭터(빈 문자열)는 항상 falsy라 연속 발언으로
       절대 안 묶였다(실제로 겪은 버그) - 같은 값이면(둘 다 빈 문자열이어도) 묶여야 한다 */
    var cont = !isRoll && prevKey === b.sp;
    prevKey = isRoll ? null : b.sp;
    var extra = (isRoll ? ' rt-coc-1' : '') + (cont ? ' cont' : '') +
      (noAv ? ' noav' : '') + (!b.sp ? ' noname' : '');
    var tabAttr = b.tab ? ' data-tab="' + esc(b.tab) + '"' : '';
    /* avOv가 있는 블록은 렌더 시점엔 이미지를 맞게 보여주면서도 data-avatar-override를
       안 붙여서, 새로고침 직후 아무 DOM 변화(MutationObserver)에도 serialize()가 이
       블록을 "오버라이드 없음"으로 다시 저장해버려 조용히 유실됐다(실제 겪은 버그:
       "저장은 됐는데 다시 들어가면 리스트 자체가 초기화된다") */
    var ovAttr = hasOv ? ' data-avatar-override="1"' : '';
    if(!BAKED)htmlOut.push('<div class="msg general' + extra + '" data-char="' + esc(b.sp || '') + '" data-type="general"' + tabAttr + ovAttr + ' id="imp-' + i + '">' +
      '<div class="avatar">' + av + '</div>' +
      '<div class="mbody"><div class="mhead"><span class="by" style="color:' + esc(m.color) + '">' + esc(b.sp || '') + '</span>' +
      (b.ts ? '<span class="tstamp">' + esc(b.ts) + '</span>' : '') + '</div>' +
      '<div class="mcontent">' + (b.html || '') + '</div></div></div>');
  });
  /* 블록 단위 점진 렌더링: 첫 400블록만 즉시 그려 바로 조작 가능, 나머지는 비동기로 이어붙임 */
  (function () {
    var lgEl = document.getElementById('log');
    var CHUNK = 400;
    if (htmlOut.length <= CHUNK) { lgEl.innerHTML = htmlOut.join('\n'); return; }
    window.CRIT_BUILDING = true;
    lgEl.innerHTML = htmlOut.slice(0, CHUNK).join('\n');
    var __pos = CHUNK;
    (function step() {
      if (__pos >= htmlOut.length) {
        window.CRIT_BUILDING = false;
        document.dispatchEvent(new Event('crit-log-built'));
        return;
      }
      var tp = document.createElement('template');
      tp.innerHTML = htmlOut.slice(__pos, __pos + CHUNK).join('\n');
      lgEl.appendChild(tp.content);
      __pos += CHUNK;
      setTimeout(step, 0);
    })();
  })();

  /* 통계 */
  var st = document.querySelector('.stats');
  if (st) st.innerHTML = '<span>전체 <b>' + counts.total + '</b>블록</span>' +
    '<span>대사 <b>' + counts.say + '</b></span><span>서술 <b>' + counts.desc + '</b></span>';

  /* 저장된 캐릭터 꺼짐 상태를 렌더 시점부터 반영 (깜빡임 방지) */
  var savedCharOffLv = [];
  try { var _csoLv = JSON.parse(localStorage.getItem('crit-char-state:' + qid)); if (_csoLv && Array.isArray(_csoLv.off)) savedCharOffLv = _csoLv.off; } catch (eCsoLv) {}

  /* 캐릭터바 칩 (프로토타입과 동일 마크업) */
  var PEN = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var cb = document.querySelector('.charbar');
  if (cb) {
    var cnt = {};
    data.blocks.forEach(function (b) { if (b.y === 'desc') return; var k0 = b.sp || ''; cnt[k0] = (cnt[k0] || 0) + 1; });
    cb.innerHTML = order.map(function (k) {
      var m2 = meta[k];
      var mcolor = m2.color || '#9a95a0';
      var noAv2 = m2.hideAvatar || (!k && !m2.avatar);
      var avh = noAv2 ? '' : (m2.avatar
        ? '<img src="' + esc(m2.avatar) + '" onerror="this.replaceWith(avFallback(&quot;' + esc(mcolor) + '&quot;))">'
        : '<b style="background:' + esc(mcolor) + '"></b>');
      var charOnLv = savedCharOffLv.indexOf(k) === -1;
      return '<label class="char-chip" data-chip="' + esc(k) + '" style="--cc:' + esc(mcolor) + '">' +
        '<input type="checkbox"' + (charOnLv ? ' checked' : '') + ' data-char="' + esc(k) + '">' +
        '<span class="chip-avatar">' + avh + '</span>' +
        '<span class="chip-name" style="color:' + esc(mcolor) + '">' + esc(m2.display || k || '(이름 없음)') + '</span>' +
        '<span class="chip-count">' + (cnt[k] || 0) + '</span>' +
        '<span class="chip-edit" title="캐릭터 편집" data-edit="' + esc(k) + '">' + PEN + '</span></label>';
    }).join('\n');
  }
})();
</script>
</div>
<input type="file" id="filepick" accept="image/*" style="display:none">
<script>
const charMeta = window.CRIT_CHARMETA || {};
const READER = false;

/* 아바타 폴백: 이니셜 없는 단색 인장 */
function avFallback(color) {
  const b = document.createElement('b');
  b.style.background = color; return b;
}

/* ── 세션 정보 ── */
let sessionInfo = JSON.parse(document.body.dataset.session || '{}');
function renderSession() {
  const t = document.getElementById('s-title');
  if (t) t.childNodes[0].textContent = (sessionInfo.title || '세션 로그') + ' ';
  const w = document.getElementById('s-writer');
  if (w) w.textContent = sessionInfo.writer ? ('w. ' + sessionInfo.writer) : '';
  const pl = document.getElementById('s-players');
  if (pl) {
    const badges = [];
    if (sessionInfo.gm) {
      const g = document.createElement('span'); g.className = 'pbadge pbadge-gm'; g.textContent = 'GM ' + sessionInfo.gm;
      badges.push(g.outerHTML);
    }
    if ((sessionInfo.players || []).length) {
      const s = document.createElement('span'); s.className = 'pbadge'; s.textContent = 'PL ' + sessionInfo.players.join(',');
      badges.push(s.outerHTML);
    }
    pl.innerHTML = badges.join('');
  }
  const ov = document.getElementById('s-overview');
  if (ov) ov.textContent = sessionInfo.overview || '';
  document.title = (sessionInfo.title || '세션 로그');
}
const sessbtn = document.getElementById('sessbtn');
if (sessbtn) sessbtn.addEventListener('click', () => {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal wide"><h3>세션 정보</h3>
    <div class="mrow"><span style="flex:none;width:88px">제목 <b style="color:var(--accent)">*</b></span><input type="text" id="si-title" value="${(sessionInfo.title||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">시나리오 라이터</span><input type="text" id="si-writer" value="${(sessionInfo.writer||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">GM</span><input type="text" id="si-gm" placeholder="진행자 이름" value="${(sessionInfo.gm||'').replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">PL</span><input type="text" id="si-players" placeholder="쉼표로 구분" value="${((sessionInfo.players||[]).join(', ')).replace(/"/g,'&quot;')}"></div>
    <div class="mrow"><span style="flex:none;width:88px">파티명</span><input type="text" id="si-party" placeholder="여럿일 때 표기 (선택)" value="${(sessionInfo.party||'').replace(/"/g,'&quot;')}"></div>
    <div style="font-size:13px;margin:2px 0 6px">시나리오 개요</div>
    <textarea id="si-overview" style="min-height:110px" spellcheck="false">${sessionInfo.overview||''}</textarea>
    <div class="hint">입력한 정보는 게시본 상단에 표시됩니다. 비워두면 해당 항목은 표시되지 않아요.</div>
    <div class="mbtns"><button id="sc">취소</button><button class="primary" id="so">적용</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#sc').addEventListener('click', () => ov.remove());
  ov.querySelector('#so').addEventListener('click', () => {
    sessionInfo = {
      title: ov.querySelector('#si-title').value.trim(),
      writer: ov.querySelector('#si-writer').value.trim(),
      gm: ov.querySelector('#si-gm').value.trim(),
      players: ov.querySelector('#si-players').value.split(',').map(s => s.trim()).filter(Boolean),
      party: ov.querySelector('#si-party').value.trim(),
      overview: ov.querySelector('#si-overview').value.trim(),
    };
    document.body.dataset.session = JSON.stringify(sessionInfo);
    renderSession();
    /* 자관 미연동 로그의 사이드바 뱃지(플레이어/파티명)가 이걸 읽는데, 가져온 로그는 이 저장
       자체가 아예 빠져있어서 세션 정보를 아무리 채워도 사이드바엔 절대 안 떴다 */
    try {
      var qidSess = window.__CRIT_ID || new URLSearchParams(location.search).get('id');
      if (qidSess) localStorage.setItem('crit-sess:log_viewer.html?id=' + qidSess, JSON.stringify({ players: sessionInfo.players, party: sessionInfo.party }));
    } catch (eSess) {}
    /* crit-log-sess:<id>(다시 열 때 읽는 진짜 저장소)는 이제껏 #s-players DOM이 실제로
       바뀔 때만 걸리는 MutationObserver에만 의존했다 - 개요/제목/라이터만 고치고 플레이어
       목록은 그대로 두면(특히 비어 있으면) 감시망이 아예 안 걸려서 저장 자체가 안 됐다
       (실제로 겪은 버그 - "개요 고치고 게시했는데 반영이 안 됨"). 저장 버튼을 누른 시점에
       직접, 확실하게 저장한다 */
    try {
      var qidSess2 = window.__CRIT_ID || new URLSearchParams(location.search).get('id');
      localStorage.setItem('crit-log-sess:' + (qidSess2 || 'tpl'), JSON.stringify(sessionInfo));
    } catch (eSess2) {}
    if (typeof serialize === 'function') serialize();
    ov.remove();
  });
});

/* ── 필터/검색 ── */
const typeBtns = document.querySelectorAll('.tfilter button');
const charBoxes = document.querySelectorAll('.char-chip input');
const q = document.getElementById('q');
function apply() {
  const types = new Set([...typeBtns].filter(b=>b.classList.contains('on')).map(b=>b.dataset.t));
  const chars = charBoxes.length ? new Set([...charBoxes].filter(c=>c.checked).map(c=>c.dataset.char)) : null;
  const term = q.value.trim().toLowerCase();
  document.querySelectorAll('#log .msg').forEach(m => {
    let ok = types.has(m.dataset.type);
    if (ok && chars && m.dataset.type === 'general' && m.dataset.char) ok = chars.has(m.dataset.char);
    if (ok && term) ok = m.textContent.toLowerCase().includes(term);
    m.classList.toggle('hide', !ok);
  });
}
typeBtns.forEach(b => b.addEventListener('click', () => { b.classList.toggle('on'); apply(); }));
charBoxes.forEach(c => c.addEventListener('change', apply));
q.addEventListener('input', apply);

/* all 뱃지: 캐릭터 전체 선택/해제 토글 */
const charAllBtn = document.getElementById('char-all');
if (charAllBtn) charAllBtn.addEventListener('click', () => {
  const boxes = [...charBoxes];
  const allOn = boxes.every(c => c.checked);
  boxes.forEach(c => { c.checked = !allOn; });
  apply();
});
/* 캐릭터 칩 우클릭: 해당 캐릭터 로그만 보기(솔로) */
document.querySelectorAll('.char-chip[data-chip]').forEach(chip => {
  chip.addEventListener('contextmenu', e => {
    e.preventDefault(); e.stopPropagation();
    charBoxes.forEach(c => { c.checked = (c.dataset.char === chip.dataset.chip); });
    apply();
  });
});

/* ── 편집 모드 ── */
const editbtn = document.getElementById('editbtn');
if (editbtn) editbtn.addEventListener('click', () => {
  const on = editbtn.classList.toggle('on');
  document.body.classList.toggle('editing', on);
  document.querySelectorAll('.mcontent').forEach(el => el.contentEditable = on);
});

/* ── 테마 설정 ── */
const setbtn = document.getElementById('setbtn'), spanel = document.getElementById('spanel');
setbtn.addEventListener('click', e => { e.stopPropagation(); spanel.classList.toggle('open'); });
spanel.addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => spanel.classList.remove('open'));
const root = document.documentElement.style;
function applyTheme() {
  const mode = document.querySelector('input[name=rtmode]:checked').value;
  const c1 = document.getElementById('c-rt1').value;
  const c2 = mode === 'solid' ? c1 : document.getElementById('c-rt2').value;
  root.setProperty('--accent', document.getElementById('c-accent').value);
  root.setProperty('--rt1', c1);
  root.setProperty('--rt2', c2);
  document.getElementById('rt2row').style.display = mode === 'solid' ? 'none' : 'flex';
}
/* 컬러피커 ↔ HEX 직접 입력 양방향 동기화 */
[['h-accent','c-accent'],['h-rt1','c-rt1'],['h-rt2','c-rt2']].forEach(([h, c]) => {
  const hex = document.getElementById(h), col = document.getElementById(c);
  hex.addEventListener('input', () => {
    let v = hex.value.trim();
    if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) { col.value = v.toLowerCase(); applyTheme(); }
  });
  hex.addEventListener('blur', () => { hex.value = col.value; });
  col.addEventListener('input', () => { hex.value = col.value; });
});
['c-accent','c-rt1','c-rt2'].forEach(id => document.getElementById(id).addEventListener('input', applyTheme));
document.querySelectorAll('input[name=rtmode]').forEach(r => r.addEventListener('change', applyTheme));
document.querySelectorAll('input[name=thememode]').forEach(r => r.addEventListener('change', () => {
  document.body.classList.toggle('light', document.querySelector('input[name=thememode]:checked').value === 'light');
}));
document.getElementById('opt-tstamp').addEventListener('change', e => {
  document.body.classList.toggle('no-tstamp', !e.target.checked);
});

/* ── 파일 선택 헬퍼 ── */
const filepick = document.getElementById('filepick');
let fileCb = null;
filepick.addEventListener('change', () => {
  const f = filepick.files[0]; filepick.value = '';
  if (!f || !fileCb) return;
  const r = new FileReader();
  r.onload = () => fileCb(r.result);
  r.readAsDataURL(f);
});
function pickImage(cb) { fileCb = cb; filepick.click(); }
/* 업로드한 이미지를 base64로 localStorage에 그대로 박아두면 용량 제한에 걸리므로,
   디스크에 파일로 저장하고 crit-image://<id> 참조만 돌려받는다 (Electron API 없는
   브라우저 미리보기에서는 그냥 base64를 그대로 씀) */
async function toImageRef(dataUrl) {
  if (window.api && window.api.images && window.api.images.save) {
    try {
      const res = await window.api.images.save(dataUrl);
      if (res && res.url) return res.url;
    } catch (e) {}
  }
  return dataUrl;
}

function setAvatar(container, src) {
  const av = container.querySelector('.avatar, .chip-avatar');
  if (!av) return;
  av.innerHTML = '';
  const img = document.createElement('img'); img.src = src; av.appendChild(img);
}

/* ── 경고(확인) 모달: 삭제류 동작 공통 ── */
function confirmModal(msg, okLabel, onOk) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal"><h3>경고</h3>
    <div style="font-size:13px; line-height:1.6">${msg}</div>
    <div class="mbtns"><button id="wc">취소</button><button class="danger" id="wo">${okLabel}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#wc').addEventListener('click', () => ov.remove());
  ov.querySelector('#wo').addEventListener('click', () => { ov.remove(); onOk(); });
}

/* 이 캐릭터의 "이 블록만" 아바타 수정에 예전에 썼던 이미지들(중복 제거) - 매번 새로
   업로드하지 않고 골라 쓸 수 있게(실제 요청: "이미 등록한 이미지로 또 하고 싶을 수도
   있잖아") data.blocks에 저장된 avOv를 훑는다 (avOv:null인 "이 블록만 없애기"는 제외) */
function collectRecentAvatars(key) {
  var seen = {}; var out = [];
  (window.CRIT_IMPORT_DATA && window.CRIT_IMPORT_DATA.blocks || []).forEach(function (b) {
    if (b.sp === key && b.avOv && !seen[b.avOv]) { seen[b.avOv] = true; out.push(b.avOv); }
  });
  return out;
}
/* "이 블록만" 오버라이드를 지우고 캐릭터 기본값(공용 아바타/색/숨김)으로 되돌린다 */
function revertBlockAvatar(m) {
  delete m.dataset.avatarOverride;
  var meta = charMeta[m.dataset.char] || {};
  if (meta.hideAvatar) blankAvatar(m);
  else if (meta.avatar) setAvatar(m, meta.avatar);
  else sealAvatar(m, meta.color || '#999');
}
/* esc()는 다른 <script> 블록(IIFE) 안에 갇혀 있어 여기서는 안 보인다 - 이걸 놓쳐서
   재사용 썸네일이 하나라도 있는 상태로 이 모달을 열 때마다 "esc is not defined"가
   터져 모달 자체가 안 열렸다(실제 겪은 버그: "수정을 하고나면 다른 블록들을 수정할
   수가 없어" - 사실은 그 캐릭터의 모든 블록에서 똑같이 막히고 있었다) */
function escAttr(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
/* ── 드래그앤드롭 업로드 모달 (onDelete 전달 시 삭제 버튼 표시, recentImgs 전달 시 재사용
   썸네일 표시, onRevert 전달 시 썸네일 맨 앞에 "원래대로" 버튼 표시) ── */
function openUploadModal(title, cb, onDelete, recentImgs, onRevert) {
  /* crit-crop-wrap: 아바타는 1:1로 잘라서 등록. 자른 결과(base64)를 디스크로 옮긴 뒤
     참조를 실제 콜백에 넘긴다 */
  var _cb = cb;
  var _cbRef = function (d) { toImageRef(d).then(_cb); };
  cb = function (d) { if (window.critCrop) critCrop(d, 1, _cbRef); else _cbRef(d); };
  const ov = document.createElement('div'); ov.className = 'overlay';
  /* 재사용 썸네일은 이미 한 번 크롭·저장까지 끝난 이미지라 다시 크롭 모달을 띄우지
     않고 바로 적용한다 */
  var hasRecent = recentImgs && recentImgs.length;
  var recentHtml = '';
  if (hasRecent || onRevert) {
    recentHtml = '<div class="hint" style="margin:0 0 6px">이 캐릭터에 예전에 쓴 이미지</div>' +
      '<div id="ua-recent" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
      (onRevert ? '<div class="ua-revert" title="이 블록만 지정한 아바타 없애고 원래대로" style="width:42px;height:42px;' +
        'border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;' +
        'border:2px dashed var(--line);color:var(--dim);font-size:10px;line-height:1.2;text-align:center">원래대로</div>' : '') +
      (hasRecent ? recentImgs.map(function (src, i) {
        return '<div class="ua-recent-item" data-i="' + i + '" title="이 이미지 쓰기" style="width:42px;height:42px;' +
          'border-radius:50%;background-size:cover;background-position:center;cursor:pointer;' +
          'border:2px solid var(--line);background-image:url(' + escAttr(src) + ')"></div>';
      }).join('') : '') + '</div>';
  }
  ov.innerHTML = `<div class="modal"><h3>${title}</h3>
    ${recentHtml}
    <div class="dropzone" id="dz">이미지를 여기로 드래그하거나<br>클릭해서 선택하세요</div>
    <div class="mbtns">${onDelete ? '<button class="danger" id="ud">아바타 삭제</button>' : ''}<button id="uc">취소</button></div></div>`;
  document.body.appendChild(ov);
  const dz = ov.querySelector('#dz');
  const done = d => { ov.remove(); cb(d); };
  if (onRevert) {
    ov.querySelector('.ua-revert').addEventListener('click', function (e) {
      e.stopPropagation();
      ov.remove();
      onRevert();
    });
  }
  if (hasRecent) {
    ov.querySelectorAll('.ua-recent-item').forEach(function (el) {
      el.addEventListener('click', function (e) {
        e.stopPropagation();
        ov.remove();
        _cbRef(recentImgs[parseInt(el.dataset.i, 10)]);
      });
    });
  }
  dz.addEventListener('click', () => pickImage(done));
  ['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => {
    const f = e.dataTransfer.files[0]; if (!f || !f.type.startsWith('image/')) return;
    const r = new FileReader(); r.onload = () => done(r.result); r.readAsDataURL(f);
  });
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#uc').addEventListener('click', () => ov.remove());
  if (onDelete) ov.querySelector('#ud').addEventListener('click', () => {
    ov.remove();
    confirmModal('아바타를 삭제하고 단색 인장으로 되돌릴까요?', '삭제', onDelete);
  });
}

/* 인장(단색) 아바타로 되돌리기 */
function sealAvatar(container, color) {
  const av = container.querySelector('.avatar, .chip-avatar');
  if (!av) return;
  av.innerHTML = '';
  const b = document.createElement('b'); b.style.background = color; av.appendChild(b);
}

/* 완전히 숨기기: 이미지도 단색 인장도 없이 그냥 빈 자리로 (NPC 등 색조차 필요 없을 때) */
function blankAvatar(container) {
  const av = container.querySelector('.avatar, .chip-avatar');
  if (av) av.innerHTML = '';
}

function removeAvatarAll(key) {
  const meta = charMeta[key]; if (meta) meta.avatar = null;
  const color = meta ? meta.color : '#999';
  const chip = document.querySelector(`.char-chip[data-chip="${CSS.escape(key)}"]`);
  if (chip) sealAvatar(chip, color);
  document.querySelectorAll(`.msg[data-char="${CSS.escape(key)}"]`).forEach(mm => {
    if (!mm.dataset.avatarOverride) sealAvatar(mm, color);
  });
}

/* 전체 아바타 일괄 적용 (해당 이름을 가진 롤플의 모든 블록 + 칩) */
function applyAvatarAll(key, d) {
  const meta = charMeta[key]; if (meta) meta.avatar = d;
  const chip = document.querySelector(`.char-chip[data-chip="${CSS.escape(key)}"]`);
  if (chip) setAvatar(chip, d);
  document.querySelectorAll(`.msg[data-char="${CSS.escape(key)}"]`).forEach(mm => {
    if (!mm.dataset.avatarOverride) setAvatar(mm, d);
  });
}

/* ── 태그 수정 (고급) ── */
function openTagModal(m) {
  const c = m.querySelector('.mcontent');

    <textarea id="tg" spellcheck="false"></textarea>
    <div class="hint">이 블록의 HTML 태그를 직접 수정합니다. 닫히지 않은 태그 등 잘못된 HTML은 표시가 깨질 수 있어요.</div>
    <div class="mbtns"><button id="tc">취소</button><button class="primary" id="to">적용</button></div></div>`;

/* ── 캐릭터 편집 모달 ── */
let charMetaOriginal = null;
function openCharModal(key) {
  /* 가져온 로그는 charMeta가 데이터 파싱 후에야 채워지니, 처음 이 모달을 여는 시점(이미 다 채워진 뒤)에
     한 번만 스냅샷 떠서 "기본 색으로 복원" 기준으로 삼는다 */
  if (!charMetaOriginal) charMetaOriginal = JSON.parse(JSON.stringify(charMeta));
  const meta = charMeta[key];
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>캐릭터 편집</h3>
      <div class="mrow"><span>이름</span><input type="text" id="cm-name" value="${meta.display}"></div>
      <div class="mrow"><span>이름 글씨색</span><input type="text" id="cm-colorhex" class="hexin" value="${meta.color}" spellcheck="false" style="width:80px"><input type="color" id="cm-color" value="${meta.color}">${charMetaOriginal[key] ? '<button type="button" id="cm-colorreset" title="기본 색으로 복원" style="background:none;border:none;color:var(--dim);cursor:pointer;padding:4px">↺</button>' : ''}</div>
      <div class="mrow"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="cm-mine" ${meta.mine ? 'checked' : ''}> 내 캐릭터 <span style="font-size:11px;color:var(--dim)">메신저 스타일에서 오른쪽 정렬</span></label></div>
      <div class="mrow"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="cm-npc" ${meta.npc ? 'checked' : ''}> NPC <span style="font-size:11px;color:var(--dim)">메신저 스타일에서 지문처럼 가운데 정렬</span></label></div>
      <div class="mrow"><span>프로필 사진</span><button id="cm-img">이미지 선택…</button>${meta.avatar ? '<button id="cm-imgdel" class="danger">제거</button>' : ''}</div>
      <div class="mrow"><label style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="cm-noavatar" ${meta.hideAvatar ? 'checked' : ''}> 프로필 완전히 숨기기 <span style="font-size:11px;color:var(--dim)">이미지도 색상 원도 안 보여요 (NPC 등에)</span></label></div>
      <div class="mbtns"><button id="cm-cancel">취소</button><button class="primary" id="cm-ok">적용</button></div>
    </div>`;
  document.body.appendChild(ov);
  const cmColor = ov.querySelector('#cm-color'), cmColorHex = ov.querySelector('#cm-colorhex');
  cmColorHex.addEventListener('input', () => {
    let v = cmColorHex.value.trim();
    if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) cmColor.value = v.toLowerCase();
  });
  cmColorHex.addEventListener('blur', () => { cmColorHex.value = cmColor.value; });
  cmColor.addEventListener('input', () => { cmColorHex.value = cmColor.value; });
  const cmColorReset = ov.querySelector('#cm-colorreset');
  if (cmColorReset) cmColorReset.addEventListener('click', () => {
    const def = charMetaOriginal[key].color;
    cmColor.value = def; cmColorHex.value = def;
  });
  let newAvatar = null, avatarRemoved = false;
  ov.querySelector('#cm-img').addEventListener('click', () => pickImage(async d => {
    newAvatar = await toImageRef(d); avatarRemoved = false; ov.querySelector('#cm-img').textContent = '선택됨 ✓';
  }));
  const cmImgDel = ov.querySelector('#cm-imgdel');
  if (cmImgDel) cmImgDel.addEventListener('click', () => {
    avatarRemoved = true; newAvatar = null;
    ov.querySelector('#cm-img').textContent = '이미지 선택…';
    cmImgDel.remove();
  });
  ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
  ov.querySelector('#cm-cancel').addEventListener('click', () => ov.remove());
  ov.querySelector('#cm-ok').addEventListener('click', () => {
    const newName = ov.querySelector('#cm-name').value || meta.display;
    const targetKey = Object.keys(charMeta).find(k => k !== key && charMeta[k].display === newName);
    if (targetKey && newName !== meta.display) {
      ov.remove();
      confirmModal(`이미 「${newName}」 캐릭터가 있습니다. 두 캐릭터의 로그를 하나로 합칠까요?<br>취소하면 이름은 변경되지 않습니다.`, '합치기',
        () => mergeChars(key, targetKey));
      return;
    }
    meta.display = newName;
    meta.color = ov.querySelector('#cm-color').value;
    meta.mine = ov.querySelector('#cm-mine').checked;
    meta.npc = ov.querySelector('#cm-npc').checked;
    meta.hideAvatar = ov.querySelector('#cm-noavatar').checked;
    refreshMine();
    if (avatarRemoved) delete meta.avatar;
    else if (newAvatar) meta.avatar = newAvatar;
    /* hideAvatar 체크를 껐다 켰다 할 때도 항상 지금 상태(meta.avatar/meta.hideAvatar) 기준으로
       다시 결정한다 - newAvatar/avatarRemoved 변화가 없었던(단순히 숨기기만 껐다 켠) 경우에도
       올바르게 복원/재적용되도록 */
    function paintAvatar(container) {
      if (meta.hideAvatar) blankAvatar(container);
      else if (meta.avatar) setAvatar(container, meta.avatar);
      else sealAvatar(container, meta.color);
    }
    // 칩 갱신
    const chip = document.querySelector(`.char-chip[data-chip="${CSS.escape(key)}"]`);
    if (chip) {
      chip.querySelector('.chip-name').textContent = meta.display;
      chip.querySelector('.chip-name').style.color = meta.color;
      chip.style.setProperty('--cc', meta.color);
      paintAvatar(chip);
    }
    // 전체 블록 갱신 (블록별 오버라이드는 유지)
    document.querySelectorAll(`.msg[data-char="${CSS.escape(key)}"]`).forEach(m => {
      const by = m.querySelector('.mhead .by');
      if (by) { by.textContent = meta.display; by.style.color = meta.color; }
      if (!m.dataset.avatarOverride) paintAvatar(m);
    });
    /* 색/내 캐릭터/NPC 변경은 classList·style 속성 변화라 자동저장(MutationObserver)이 못 잡는다 -
       명시적으로 저장을 불러줘야 한다 */
    if (typeof serialize === 'function') serialize();
    ov.remove();
  });
}
document.querySelectorAll('.chip-edit').forEach(el => el.addEventListener('click', e => {
  e.preventDefault(); e.stopPropagation(); openCharModal(el.dataset.edit);
}));

/* 동명 캐릭터 로그 합치기 */
function mergeChars(srcKey, dstKey) {
  const dst = charMeta[dstKey];
  document.querySelectorAll(`.msg[data-char="${CSS.escape(srcKey)}"]`).forEach(m => {
    m.dataset.char = dstKey;
    const by = m.querySelector('.mhead .by');
    if (by) { by.textContent = dst.display; by.style.color = dst.color; }
    if (!m.dataset.avatarOverride) { dst.avatar ? setAvatar(m, dst.avatar) : sealAvatar(m, dst.color); }
  });
  const srcChip = document.querySelector(`.char-chip[data-chip="${CSS.escape(srcKey)}"]`);
  const dstChip = document.querySelector(`.char-chip[data-chip="${CSS.escape(dstKey)}"]`);
  if (dstChip) {
    const cnt = dstChip.querySelector('.chip-count');
    const add = srcChip ? (parseInt(srcChip.querySelector('.chip-count').textContent) || 0) : 0;
    cnt.textContent = (parseInt(cnt.textContent) || 0) + add;
  }
  if (srcChip) srcChip.remove();
  delete charMeta[srcKey];
  apply();
}

/* ── 블록 우클릭 메뉴 ── */
let menu = null;
function closeMenu() { if (menu) { menu.remove(); menu = null; } }
document.addEventListener('click', closeMenu);
document.addEventListener('contextmenu', e => {
  if (READER) return;
  const m = e.target.closest('.msg');
  if (!m) return;
  e.preventDefault(); closeMenu();
  menu = document.createElement('div'); menu.className = 'ctxmenu';
  const items = [];
  if (m.dataset.type === 'general') {
    items.push(['아바타 수정 (이 블록만)', () => openUploadModal('아바타 수정 (이 블록만)',
      d => { setAvatar(m, d); m.dataset.avatarOverride = '1'; },
      () => { sealAvatar(m, (charMeta[m.dataset.char] || {}).color || '#999'); m.dataset.avatarOverride = '1'; },
      collectRecentAvatars(m.dataset.char),
      m.dataset.avatarOverride ? () => revertBlockAvatar(m) : null)]);
  }
  items.push(['내용 수정', () => {
    const c = m.querySelector('.mcontent');
    c.contentEditable = true; c.focus();
    c.addEventListener('blur', () => { if (!document.body.classList.contains('editing')) c.contentEditable = false; }, { once: true });
  }]);
  items.push(['태그 수정 (고급)', () => openTagModal(m)]);
  items.push(null);
  items.push(['위에 블록 추가', () => openAddBlockModal(m, 'before')]);
  items.push(['아래에 블록 추가', () => openAddBlockModal(m, 'after')]);
  items.push(null);
  items.push(['블록 삭제', () => confirmModal('이 블록을 삭제할까요? 저장하기 전이라면 새로고침으로 되돌릴 수 있지만, 저장 후에는 되돌릴 수 없습니다.', '삭제', () => m.remove()), 'danger']);
  for (const it of items) {
    if (!it) { const s = document.createElement('div'); s.className = 'sep'; menu.appendChild(s); continue; }
    const [label, fn, cls] = it;
    const b = document.createElement('button'); b.textContent = label;
    if (cls) b.classList.add(cls);
    b.addEventListener('click', () => { closeMenu(); fn(); });
    menu.appendChild(b);
  }
  menu.style.left = Math.min(e.clientX, innerWidth - 200) + 'px';
  menu.style.top = Math.min(e.clientY, innerHeight - 280) + 'px';
  document.body.appendChild(menu);
});

    menu.appendChild(b);
  }
  menu.style.left = Math.min(e.clientX, innerWidth - 260) + 'px';
  menu.style.top = Math.min(e.clientY, innerHeight - 190) + 'px';

/* ── 블록 추가 모달 ── */
let newBlockSeq = 0;
function openAddBlockModal(m, where) {
  const opts = Object.keys(charMeta).map(k =>
    `<option value="${k}">${charMeta[k].display}</option>`).join('');
  const ov = document.createElement('div'); ov.className = 'overlay';

<!-- Crit: 이 뷰어의 테마(포인트 컬러/모드)를 저장해 다시 열어도 유지합니다 (로그별 테마) -->
<script>
(function () {
  var KEY = 'crit-log-theme:' + ((window.__CRIT_ID || new URLSearchParams(location.search).get('id')) || 'tpl');
  var col = document.getElementById('c-accent'), hex = document.getElementById('h-accent');
  var tstampBox = document.getElementById('opt-tstamp');
  /* 판정 헤더(SAN Roll 등) 색 - c-rt1/c-rt2/rtmode는 여태 저장 대상이 아니었다(실제로
     겪은 버그 - "판정 헤더 색을 바꾼게 저장이 안 돼"). applyTheme()가 화면에만 즉시
     반영하고 끝나서, 다시 열면(그리고 게시본에는 애초에) 항상 기본값으로 돌아왔다 */
  var cRt1 = document.getElementById('c-rt1'), hRt1 = document.getElementById('h-rt1');
  var cRt2 = document.getElementById('c-rt2'), hRt2 = document.getElementById('h-rt2');
  if (!col) return;
  try {
    var t = JSON.parse(localStorage.getItem(KEY));
    if (t) {
      if (t.accent) { col.value = t.accent; if (hex) hex.value = t.accent; col.dispatchEvent(new Event('input', { bubbles: true })); }
      if (t.mode) {
        var r = document.querySelector('input[name=thememode][value=' + t.mode + ']');
        if (r && !r.checked) { r.checked = true; r.dispatchEvent(new Event('change', { bubbles: true })); }
      }
      /* 날짜/시간 표시 체크는 여태 저장이 안 돼서, 꺼놔도 다시 열면 항상 켜진 채로 돌아왔다 */
      if (tstampBox && t.tstamp === false) {
        tstampBox.checked = false;
        document.body.classList.add('no-tstamp');
      }
      if (t.rtMode) {
        var rt = document.querySelector('input[name=rtmode][value=' + t.rtMode + ']');
        if (rt && !rt.checked) rt.checked = true;
      }
      if (t.rt1 && cRt1) { cRt1.value = t.rt1; if (hRt1) hRt1.value = t.rt1; }
      if (t.rt2 && cRt2) { cRt2.value = t.rt2; if (hRt2) hRt2.value = t.rt2; }
      if (typeof applyTheme === 'function') applyTheme();
    }
  } catch (e) {}
  function saveT() {
    var c = document.querySelector('input[name=thememode]:checked');
    var rtc = document.querySelector('input[name=rtmode]:checked');
    try {
      localStorage.setItem(KEY, JSON.stringify({
        accent: col.value, mode: c ? c.value : 'dark', tstamp: tstampBox ? tstampBox.checked : true,
        rtMode: rtc ? rtc.value : 'grad',
        rt1: cRt1 ? cRt1.value : '', rt2: cRt2 ? cRt2.value : ''
      }));
    } catch (e) {}
  }
  col.addEventListener('input', saveT);
  if (hex) hex.addEventListener('input', saveT);
  if (tstampBox) tstampBox.addEventListener('change', saveT);
  document.querySelectorAll('input[name=thememode]').forEach(function (r) { r.addEventListener('change', saveT); });
  if (cRt1) cRt1.addEventListener('input', saveT);
  if (cRt2) cRt2.addEventListener('input', saveT);
  document.querySelectorAll('input[name=rtmode]').forEach(function (r) { r.addEventListener('change', saveT); });
})();
</script>

<!-- crit-subtitle-players: 제목 옆 설명문 자리에 함께한 플레이어 닉네임 표시 (뱃지 줄은 데이터 소스로만 사용) -->
<style>#s-players { display: none !important; }
#s-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
#s-title span:not(.t-writer) { margin-left: auto; }</style>
<script>
(function () {
  var sub = document.querySelector("#s-title span:not(.t-writer)");
  var pl = document.getElementById("s-players");
  if (!sub) return;
  function upd() {
    var names = pl ? Array.prototype.map.call(pl.querySelectorAll(".pbadge"), function (b) { return b.textContent.trim(); }) : [];
    var party = "";
    try { party = (sessionInfo && sessionInfo.party) || ""; } catch (e) {}
    var gm = "";
    try { gm = (sessionInfo && sessionInfo.gm) || ""; } catch (e) {}
    var players = [];
    try { players = (sessionInfo && sessionInfo.players) || []; } catch (e) {}
    /* 파티명만 보여주면 누가 GM/PL인지 안 보였다 - 파티명 뒤에 [GM.이름 PL.이름,이름] 형태로
       역할별 인원을 같이 붙인다 */
    var parts = [];
    if (gm) parts.push("GM." + gm);
    if (players.length) parts.push("PL." + players.join(","));
    var bracket = parts.length ? ("[" + parts.join(" ") + "]") : "";
    var combined = party ? (party + (bracket ? " " + bracket : "")) : bracket;
    sub.textContent = combined || names.join(" · ");
  }
  upd();
  if (pl) new MutationObserver(upd).observe(pl, { childList: true });
})();
</script>

<!-- crit-crop: 공용 이미지 자르기 모달 - 비율 고정, 드래그 이동, 확대 슬라이더 -->
<script>
(function () {
  if (window.critCrop) return;
  window.critCrop = function (dataUrl, ratio, cb) {
    var VW = 300, VH = Math.round(VW / ratio);
    var img = new Image();
    img.onload = function () {
      var iw = img.width, ih = img.height;
      var base = Math.max(VW / iw, VH / ih);
      var zoom = 1, ox = 0, oy = 0;
      var ov = document.createElement("div");
      ov.className = "overlay";
      ov.style.cssText = "position:fixed;inset:0;z-index:100001;background:#0008;display:flex;align-items:center;justify-content:center";
      ov.innerHTML = '<div style="background:var(--panel,#1d1b21);border:1px solid var(--line,#34313a);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px">' +
        '<div style="font-size:14px;font-weight:800;color:var(--text,#f0edf3)">이미지 자르기</div>' +
        '<div id="cc-vp" style="width:' + VW + 'px;height:' + VH + 'px;overflow:hidden;position:relative;border-radius:10px;border:1px solid var(--line,#34313a);cursor:grab;touch-action:none;background:#111"></div>' +
        '<input id="cc-zoom" type="range" min="100" max="300" value="100" style="accent-color:var(--accent,#B26A9E)">' +
        '<div style="display:flex;gap:8px;justify-content:flex-end">' +
        '<button id="cc-c" style="background:var(--panel2,#26242c);color:var(--text,#f0edf3);border:1px solid var(--line,#34313a);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit">취소</button>' +
        '<button id="cc-ok" style="background:var(--accent,#B26A9E);color:#fff;border:1px solid var(--accent,#B26A9E);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;font-family:inherit">확인</button></div></div>';
      var vp = ov.querySelector("#cc-vp");
      var el = document.createElement("img");
      el.src = dataUrl; el.draggable = false;
      el.style.cssText = "position:absolute;pointer-events:none;user-select:none;max-width:none";
      vp.appendChild(el);
      function layout() {
        var s = base * zoom, w = iw * s, h = ih * s;
        var maxX = (w - VW) / 2, maxY = (h - VH) / 2;
        ox = Math.max(-maxX, Math.min(maxX, ox));
        oy = Math.max(-maxY, Math.min(maxY, oy));
        el.style.width = w + "px"; el.style.height = h + "px";
        el.style.left = (VW / 2 - w / 2 + ox) + "px";
        el.style.top = (VH / 2 - h / 2 + oy) + "px";
      }
      layout();
      vp.addEventListener("pointerdown", function (e) {
        e.preventDefault();
        vp.setPointerCapture(e.pointerId);
        var sx = e.clientX, sy = e.clientY, o0x = ox, o0y = oy;
        function mv(ev) { ox = o0x + (ev.clientX - sx); oy = o0y + (ev.clientY - sy); layout(); }
        function up() { vp.removeEventListener("pointermove", mv); vp.removeEventListener("pointerup", up); }
        vp.addEventListener("pointermove", mv);
        vp.addEventListener("pointerup", up);
      });
      ov.querySelector("#cc-zoom").addEventListener("input", function (e) { zoom = e.target.value / 100; layout(); });
      ov.querySelector("#cc-c").addEventListener("click", function () { ov.remove(); });
      ov.addEventListener("click", function (e) { if (e.target === ov) ov.remove(); });
      ov.querySelector("#cc-ok").addEventListener("click", function () {
        var s = base * zoom;
        var cv = document.createElement("canvas");
        cv.width = VW * 2; cv.height = VH * 2;
        var left = VW / 2 - iw * s / 2 + ox, top = VH / 2 - ih * s / 2 + oy;
        cv.getContext("2d").drawImage(img, -left / s, -top / s, VW / s, VH / s, 0, 0, VW * 2, VH * 2);
        var out = cv.toDataURL(/^data:image\/(png|webp|gif)/.test(String(img.src)) ? "image/png" : "image/jpeg", 0.92);
        ov.remove();
        cb(out);
      });
      document.body.appendChild(ov);
    };
    img.src = dataUrl;
  };
})();
</script>

    display: flex; align-items: center; gap: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fwrap .fitem:hover { background: color-mix(in srgb, var(--accent) 20%, var(--panel2)); }
  .fwrap .fitem.on { color: color-mix(in srgb, var(--accent) 65%, var(--text)); font-weight: 700; }
  .fwrap .fdot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
</style>
<script>
(function () {
  function dotColor(val) {
    try {
      var c = (typeof cats !== "undefined") && cats.find ? cats.find(function (x) { return x.key === val; }) : null;
      return c ? c.color : null;
    } catch (e) { return null; }
  }
  function visible(sel) { return sel.style.display !== "none"; }
  function fancify(sel) {
    if (sel.dataset.fancy) return;
    sel.dataset.fancy = "1";
    var wrap = document.createElement("span");
    wrap.className = "fwrap";
    sel.parentNode.insertBefore(wrap, sel);
    wrap.appendChild(sel);
    var wasHidden = !visible(sel);
    sel.style.display = "none";
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "fsel"; /* critkeep 없음: 게시본에서는 버튼 숨김 규칙으로 자동 제거 */
    if (wasHidden) wrap.style.display = "none";
    function label() {
      var o = sel.selectedOptions[0];
      btn.innerHTML = "";
      if (o) {
        var col = dotColor(o.value);
        if (col) { var d = document.createElement("span"); d.className = "fdot"; d.style.background = col; btn.appendChild(d); }
        btn.appendChild(document.createTextNode(o.textContent));
      } else btn.appendChild(document.createTextNode("선택"));
    }
    label();
    wrap.appendChild(btn);
    var menu = null;
    function close() { if (menu) { menu.remove(); menu = null; btn.classList.remove("open"); } }
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (menu) { close(); return; }
      menu = document.createElement("div");
      menu.className = "fmenu";
      Array.prototype.forEach.call(sel.options, function (o) {
        var it = document.createElement("div");
        it.className = "fitem" + (o.selected ? " on" : "");
        var col = dotColor(o.value);
        if (col) { var d = document.createElement("span"); d.className = "fdot"; d.style.background = col; it.appendChild(d); }
        it.appendChild(document.createTextNode(o.textContent));
        it.addEventListener("click", function (e2) {
          e2.stopPropagation();
          sel.value = o.value;
          sel.dispatchEvent(new Event("change", { bubbles: true }));
          sel.dispatchEvent(new Event("input", { bubbles: true }));
          label(); close();
        });
        menu.appendChild(it);
      });
      wrap.appendChild(menu);
      btn.classList.add("open");
    });
    document.addEventListener("click", close);
    /* select의 표시/값이 바뀌면 버튼도 동기화 (예: 온보딩 모니터 선택 표시 전환) */
    var reHiding = false;
    new MutationObserver(function () {
      if (reHiding) { reHiding = false; return; }
      if (visible(sel)) {
        /* 외부 코드가 select를 다시 보이게 함(예: 온보딩) → 래퍼만 보이고 원본은 계속 숨김 */
        wrap.style.display = "";
        reHiding = true;
        sel.style.display = "none";
        label();
      } else {
        wrap.style.display = "none";
      }
    }).observe(sel, { attributes: true, attributeFilter: ["style", "class"] });
    sel.addEventListener("change", label);
    /* 옵션이 뒤늦게 채워지는 경우(모니터 목록 등) 라벨 갱신 */
    new MutationObserver(label).observe(sel, { childList: true });
  }
  function scan(root) {
    if (!root.querySelectorAll) return;
    root.querySelectorAll("select:not([data-fancy])").forEach(fancify);
  }
  scan(document);
  new MutationObserver(function (ms) {
    ms.forEach(function (m) {
      Array.prototype.forEach.call(m.addedNodes, function (n) {
        if (n.nodeType === 1) { if (n.tagName === "SELECT") fancify(n); else scan(n); }
      });
    });
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>

<!-- crit-extlink: 외부 링크는 항상 기본 브라우저로 (프로토콜 없는 주소 보정 포함) -->
<script>
document.addEventListener("click", function (e) {
  var a = e.target.closest ? e.target.closest("a[href]") : null;
  if (!a) return;
  var raw = a.getAttribute("href") || "";
  if (/^(#|javascript:|mailto:)/i.test(raw)) return;
  var isAbs = /^https?:\/\//i.test(raw);
  var domainish = /^[\w-]+(\.[\w-]+)+([\/?#]|$)/.test(raw) && raw.indexOf(".html") === -1;
  if (!isAbs && !domainish) return; /* 내부 페이지 이동은 그대로 */
  e.preventDefault();
  e.stopPropagation();
  var u = isAbs ? raw : "https://" + raw;
  if (window.api && window.api.app && window.api.app.openExternal) window.api.app.openExternal(u);
  else window.open(u, "_blank", "noopener");
}, true);
</script>
<!-- crit-lv-proto-persist: 프로토타입 뷰어에서의 모든 편집을 로그 데이터로 자동 저장 -->
<script>
(function () {
  var qid = (window.__CRIT_ID || new URLSearchParams(location.search).get("id"));
  if (!qid || !window.CRIT_IMPORT_DATA) return;
  if ((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview"))) return;
  var data = window.CRIT_IMPORT_DATA;
  function serialize() {
    if (window.CRIT_BUILDING) return; /* 점진 렌더링 중에는 부분 DOM 저장 금지 */
    try {
      var blocks = [];
      document.querySelectorAll("#log .msg").forEach(function (m) {
        var mc = m.querySelector(".mcontent");
        if (!mc) return;
        var isDesc = m.dataset.type === "desc";
        var isRoll = !!m.querySelector("[class*=rolltemplate], table");
        var ts = m.querySelector(".tstamp");
        var blockObj = {
          y: isDesc ? "desc" : (isRoll ? "roll" : "say"),
          sp: m.dataset.char || null,
          ts: ts ? ts.textContent : null,
          tab: m.dataset.tab || null,
          html: mc.innerHTML
        };
        /* "이 블록만" 아바타 수정을 DOM에만 반영하고 안 구워서 새로고침하면 사라지던
           문제(실제로 겪은 버그) - avOv 프로퍼티가 있어야만(hasOwnProperty) "이 블록은
           오버라이드됨"으로 읽히므로, 오버라이드 아닌 블록엔 아예 이 키를 안 넣는다 */
        if (m.dataset.avatarOverride) {
          var avImg = m.querySelector(".avatar img");
          blockObj.avOv = avImg ? avImg.getAttribute("src") : null;
        }
        blocks.push(blockObj);
      });
      if (blocks.length) data.blocks = blocks;
      data.charMeta = charMeta;
      if (typeof sessionInfo === "object" && sessionInfo) {
        if (sessionInfo.title) data.title = sessionInfo.title;
        if (sessionInfo.players) data.players = sessionInfo.players;
        if (sessionInfo.party) data.party = sessionInfo.party;
      }
      localStorage.setItem("crit-log-data:" + qid, JSON.stringify(data));
      /* 보관함 리스트 제목 동기화 */
      var ul = JSON.parse(localStorage.getItem("crit-user-logs")) || [];
      var en = ul.find(function (x) { return String(x.id) === String(qid); });
      if (en && data.title && en.t !== data.title) {
        en.t = data.title;
        en.mod = new Date().toISOString().slice(0, 10);
        localStorage.setItem("crit-user-logs", JSON.stringify(ul));
        try { if (window.parent !== window) window.parent.postMessage({ crit: "log-title", id: qid, t: data.title }, "*"); } catch (e) {}
      }
    } catch (e) { console.warn("crit-lv-proto-persist 저장 실패", e); }
  }
  var tm = null;
  function later() { clearTimeout(tm); tm = setTimeout(serialize, 500); }
  document.addEventListener("crit-log-built", later);
  new MutationObserver(later).observe(document.getElementById("log"), { childList: true, subtree: true, characterData: true, attributes: true });
  var cb = document.querySelector(".charbar");
  if (cb) new MutationObserver(later).observe(cb, { childList: true, subtree: true, characterData: true, attributes: true });
  var hero = document.querySelector(".hero");
  if (hero) new MutationObserver(later).observe(hero, { childList: true, subtree: true, characterData: true });
  window.addEventListener("beforeunload", serialize);
})();
</script>

<!-- crit-plainchar: 캐릭터 색·아바타 무표시 토글 (캐릭터 칩 우클릭) - 단순 NPC용 -->
<script>
(function () {
  if (typeof charMeta === "undefined") return;
  function esc2(k) { return k.replace(/"/g, '\\"'); }
  function applyPlain() {
    Object.keys(charMeta).forEach(function (k) {
      var plain = !!charMeta[k].plain;
      /* plain이 아닐 때 color를 ""로 지워버리면 캐릭터 고유색이 사라지고 테마 기본색으로
         보였다 - 매번 로그를 열 때마다 이 스크립트가 뒤에서 실행되면서 방금 렌더된
         charMeta 색을 도로 지우고 있었다. plain이 아니면 charMeta의 실제 색으로 되돌린다. */
      var col = charMeta[k].color || '#9a95a0';
      document.querySelectorAll('.char-chip[data-chip="' + esc2(k) + '"]').forEach(function (c) {
        var av = c.querySelector(".chip-avatar");
        if (av) av.style.display = plain ? "none" : "";
        var nm = c.querySelector(".chip-name");
        if (nm) nm.style.color = plain ? "inherit" : col;
      });
      document.querySelectorAll('#log .msg[data-char="' + esc2(k) + '"]').forEach(function (m) {
        var av2 = m.querySelector(".avatar");
        if (av2) av2.style.visibility = plain ? "hidden" : "";
        var by = m.querySelector(".by");
        if (by) by.style.color = plain ? "inherit" : col;
      });
    });
  }
  applyPlain();
  if ((window.__CRIT_PREVIEW || new URLSearchParams(location.search).has("preview"))) return;
  document.addEventListener("contextmenu", function (e) {
    var chip = e.target.closest ? e.target.closest(".char-chip") : null;
    if (!chip) return;
    var k = chip.dataset.chip;
    if (!k || !charMeta[k]) return;
    e.preventDefault();
    document.querySelectorAll(".plainmenu").forEach(function (m) { m.remove(); });
    var m = document.createElement("div");
    m.className = "plainmenu";
    m.style.cssText = "position:fixed;z-index:140;background:var(--panel);border:1px solid var(--line);" +
      "border-radius:10px;padding:4px;min-width:190px;box-shadow:0 10px 30px #0007;" +
      "left:" + Math.min(e.clientX, innerWidth - 210) + "px;top:" + Math.min(e.clientY, innerHeight - 60) + "px";
    var b = document.createElement("button");
    b.style.cssText = "display:block;width:100%;background:none;border:none;color:var(--text);" +
      "font-size:12.5px;padding:7px 12px;border-radius:7px;cursor:pointer;font-family:inherit;text-align:left";
    b.textContent = charMeta[k].plain ? "색·아바타 표시 복원" : "색·아바타 표시 없음 (단순 NPC)";
    b.addEventListener("click", function () {
      m.remove();
      charMeta[k].plain = !charMeta[k].plain;
      applyPlain();
    });
    m.appendChild(b);
    document.body.appendChild(m);
    setTimeout(function () {
      var closeIt = function () { m.remove(); document.removeEventListener("click", closeIt); };
      document.addEventListener("click", closeIt);
    }, 0);
  });
})();
</script>
